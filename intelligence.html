<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUÍA LOTES™ Intelligence — Nos consolidamos</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b1220">
<!--
  ======================================================================
  APP RETIRADA — CONSOLIDACION EN UNA SOLA INTELLIGENCE (v341+)
  Esta Intelligence vieja (v76/v78) se retiro. Todo vive ahora en:
      https://macrolotes.grupoguia.mx/intelligence.html
  Esta pagina SOLO redirige, conservando los parametros del deep-link
  (?fuente=opcionador&c=...  y  #lote=...) para que ningun enlace se rompa.
  ======================================================================
-->
<script>
  (function () {
    // Destino unico: la Intelligence consolidada (v341+) en el dominio productivo.
    var DESTINO = 'https://macrolotes.grupoguia.mx/intelligence.html';
    // Conserva query (?fuente=opcionador&c=...) y hash (#lote=...&sb=...) tal cual,
    // para que los deep-links del opcionador y de la ficha sigan funcionando.
    var url = DESTINO + (location.search || '') + (location.hash || '');
    try {
      // replace() no deja la pagina vieja en el historial (boton "atras" limpio).
      location.replace(url);
    } catch (e) {
      location.href = url;
    }
  })();
</script>
<!-- Respaldo sin JS: redirige al destino base (sin parametros) tras 1s. -->
<meta http-equiv="refresh" content="1;url=https://macrolotes.grupoguia.mx/intelligence.html">
<style>
  :root{ --bg:#0b1220; --card:#121a2b; --gold:#E8B44C; --txt:#e8edf6; --mut:#94a3b8; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #16233d 0%, var(--bg) 60%);
    color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px; min-height:100%;
  }
  .card{
    max-width:460px; width:100%; background:var(--card);
    border:1px solid rgba(232,180,76,.25); border-radius:18px;
    padding:36px 30px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.45);
  }
  .logo{ font-weight:800; letter-spacing:.08em; font-size:13px; color:var(--gold); margin-bottom:6px; }
  .sub{ font-size:11px; letter-spacing:.18em; color:var(--mut); text-transform:uppercase; margin-bottom:22px; }
  .spin{
    width:40px; height:40px; margin:0 auto 20px; border-radius:50%;
    border:3px solid rgba(232,180,76,.2); border-top-color:var(--gold);
    animation:sp 0.9s linear infinite;
  }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  h1{ font-size:20px; margin:0 0 10px; }
  p{ color:var(--mut); font-size:14px; line-height:1.55; margin:0 0 24px; }
  a.btn{
    display:inline-block; background:var(--gold); color:#1a1205; text-decoration:none;
    font-weight:700; font-size:14px; padding:12px 22px; border-radius:999px;
  }
  a.btn:hover{ filter:brightness(1.05); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">GUÍA LOTES™ · INTELLIGENCE</div>
    <div class="sub">Plataforma consolidada</div>
    <div class="spin" aria-hidden="true"></div>
    <h1>Te estamos llevando al sistema nuevo…</h1>
    <p>Guía Intelligence ahora vive en un solo lugar. Si no te redirige en un par de segundos, entra manualmente:</p>
    <a id="ir" class="btn" href="https://macrolotes.grupoguia.mx/intelligence.html">Abrir Guía Intelligence</a>
  </div>
  <script>
    // El boton manual tambien conserva los parametros del enlace original.
    try {
      var a = document.getElementById('ir');
      a.href = 'https://macrolotes.grupoguia.mx/intelligence.html' + (location.search || '') + (location.hash || '');
    } catch (e) {}
  </script>
</body>
</html>
