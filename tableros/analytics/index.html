<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUÍA Analytics · Tableros</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --navy:#0a2540; --navy2:#0e2f52; --gold:#c9a961; --gold2:#e0c585;
    --bg:#07182b; --surface:#0e2540; --surface2:#13314f; --border:#1d3a5c; --border2:#274a70;
    --text:#eaf1f8; --muted:#8fa6c0; --muted2:#aebfd4;
    --green:#34d399; --yellow:#fbbf24; --red:#f87171; --blue:#60a5fa;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  a{color:var(--gold2);}
  .topbar{background:linear-gradient(180deg,var(--navy),var(--navy2));border-bottom:1px solid var(--border2);padding:14px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:sticky;top:0;z-index:50;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .logo{width:34px;height:34px;border-radius:8px;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;}
  .brand .t{font-weight:700;font-size:16px;letter-spacing:.3px;} .brand .s{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;}
  .filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto;}
  select,button.btn{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-size:13px;padding:8px 12px;font-family:inherit;cursor:pointer;}
  select:focus{outline:none;border-color:var(--gold);}
  .btn-gold{background:var(--gold);color:var(--navy);border:none;font-weight:700;}
  .status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
  .tabs{display:flex;gap:4px;padding:0 24px;background:var(--navy2);border-bottom:1px solid var(--border2);overflow-x:auto;position:sticky;top:63px;z-index:40;}
  .tab{padding:12px 18px;font-size:13px;font-weight:600;color:var(--muted2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
  .tab.active{color:var(--gold2);border-bottom-color:var(--gold);}
  .wrap{padding:22px 24px;max-width:1400px;margin:0 auto;}
  .section{display:none;} .section.active{display:block;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px;}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .kpi .k-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;}
  .kpi .k-val{font-size:26px;font-weight:700;color:var(--gold2);font-family:'DM Mono',monospace;margin-top:4px;}
  .kpi .k-sub{font-size:11px;color:var(--muted2);margin-top:3px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;} @media(max-width:900px){.grid2{grid-template-columns:1fr;}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px;}
  .card h3{font-size:13px;font-weight:700;color:var(--text);margin-bottom:14px;letter-spacing:.3px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px;}
  td.num,th.num{text-align:right;font-family:'DM Mono',monospace;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .bar-row .lbl{width:160px;font-size:12px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{flex:1;height:18px;background:var(--surface2);border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:6px;}
  .bar-val{width:110px;text-align:right;font-size:12px;font-family:'DM Mono',monospace;color:var(--text);}
  .chip{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;}
  .chip.green{background:rgba(52,211,153,.15);color:var(--green);} .chip.yellow{background:rgba(251,191,36,.15);color:var(--yellow);} .chip.red{background:rgba(248,113,113,.15);color:var(--red);}
  .pipeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
  .pcol{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;}
  .pcol .p-h{font-size:11px;font-weight:700;color:var(--gold2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px;}
  .pcol .p-n{font-size:24px;font-weight:700;font-family:'DM Mono',monospace;}
  .muted{color:var(--muted);} .loading{padding:40px;text-align:center;color:var(--muted);}
  .err{background:rgba(248,113,113,.1);border:1px solid var(--red);color:#fecaca;border-radius:10px;padding:14px 16px;font-size:13px;margin-bottom:16px;}
  canvas{max-height:300px;}
  code{background:var(--surface2);padding:1px 6px;border-radius:5px;font-family:'DM Mono',monospace;font-size:11px;color:var(--gold2);}
  .diag-cols{font-size:11px;color:var(--muted2);font-family:'DM Mono',monospace;line-height:1.8;}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="logo" id="brand-logo">🧠</div>
    <div><div class="t" id="brand-title">GUÍA Analytics</div><div class="s">Tableros · Grupo Guía Macrolotes</div></div>
  </div>
  <div class="filters">
    <span id="conn"><span class="status-dot" style="background:var(--yellow)"></span><span class="muted" style="font-size:12px">conectando…</span></span>
    <select id="f-desarrollador"><option value="">Desarrollador: todos</option></select>
    <select id="f-desarrollo"><option value="">Desarrollo: todos</option></select>
    <button class="btn" id="btn-test" onclick="toggleTest()">🧪 Ocultar pruebas</button>
    <button class="btn" onclick="doExport()">⬇ CSV</button>
    <button class="btn" onclick="reloadAll()">↻ Actualizar</button>
  </div>
</div>

<div class="tabs" id="tabs">
  <div class="tab active" data-t="ventas">📈 Ventas / Cotizaciones</div>
  <div class="tab" data-t="metas">🎯 Metas vs Real</div>
  <div class="tab" data-t="pipeline">🗂️ Pipeline / CRM</div>
  <div class="tab" data-t="inventario">📦 Inventario</div>
  <div class="tab" data-t="oport">🔎 Oportunidades</div>
  <div class="tab" data-t="diag">⚙️ Diagnóstico</div>
</div>

<div class="wrap">
  <div id="global-err"></div>
  <div class="section active" id="sec-ventas"><div class="loading">Cargando…</div></div>
  <div class="section" id="sec-metas"><div class="loading">Cargando…</div></div>
  <div class="section" id="sec-pipeline"><div class="loading">Cargando…</div></div>
  <div class="section" id="sec-inventario"><div class="loading">Cargando…</div></div>
  <div class="section" id="sec-oport"><div class="loading">Cargando…</div></div>
  <div class="section" id="sec-diag"><div class="loading">Cargando…</div></div>
</div>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://xugrrabebphdelgwqnwc.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_n-EUveYY5vHlCQdDLEOU7w_4ndCZaJ0';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ── Estado ──────────────────────────────────────────────────────────────────
const DB = { desarrollos:[], cotizaciones:[], lotes:[], metas:[], crm_lotes:[], clientes:[], asesores:[] };
let METAS_CFG = null;        // metas reales: app_config/metas_v1 (JSON con plan y real)
let activeTab = 'ventas';
let selDesarrollo = '';      // slug seleccionado
let selDesarrollador = '';
let excludeTest = true;      // ocultar cotizaciones/CRM de prueba
let metaModo = 'uds';        // 'uds' | 'monto' para el comparativo mensual de metas
let EXPORT = null;           // { name, headers, rows } del tab activo para exportar CSV
const charts = {};

// ── Helpers de acceso defensivo (no conocemos el esquema exacto) ─────────────
function pick(obj, keys, def=undefined){
  if(!obj) return def;
  for(const k of keys){ if(obj[k]!==undefined && obj[k]!==null && obj[k]!=='') return obj[k]; }
  return def;
}
function num(v){ if(v==null) return 0; const n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; }
function low(v){ return String(v==null?'':v).toLowerCase().trim(); }
function fmtMoney(n){ if(!n) return '$0'; if(Math.abs(n)>=1e6) return '$'+(n/1e6).toFixed(1)+'M'; if(Math.abs(n)>=1e3) return '$'+Math.round(n/1e3)+'k'; return '$'+Math.round(n).toLocaleString('es-MX'); }
function fmtFull(n){ return '$'+Math.round(n||0).toLocaleString('es-MX'); }
function fmtInt(n){ return Math.round(n||0).toLocaleString('es-MX'); }

// claves candidatas por campo (a prueba de variaciones del esquema)
const K = {
  monto:    ['precio_final','precio_lista','total','monto','importe','monto_total','total_cotizado','precio_total','valor','total_mxn'],
  status:   ['status','estatus','estado','etapa','status_cotizacion'],
  asesor:   ['nombre_asesor','asesor','asesor_asignado','vendedor','asesor_nombre','nombre_vendedor'],
  fecha:    ['created_at','fecha','fecha_creacion','fecha_cotizacion','inserted_at'],
  desarrollo:['_desarrollo','desarrollo','desarrollo_slug','slug_desarrollo','desarrollo_nombre','nombre_desarrollo','proyecto'],
  desarrollador:['_desarrollador','desarrollador','desarrollador_nombre','grupo','dueno','propietario'],
  pipeline: ['pipeline','etapa','etapa_pipeline','fase','status'],
  statusInv:['status_inventario','status','estatus','estado_inventario','disponibilidad'],
  precioTotal:['precio_total','precio','valor_total','monto_total'],
  superficie:['superficie_m2','superficie','sup_m2','m2','metros','area'],
  vencimiento:['fecha_vencimiento','vence','proxima_actividad','fecha_seguimiento','due_date','fecha_proxima'],
};

// ¿esta fila pertenece al desarrollo seleccionado? (match por id, slug o nombre)
function rowMatchesDesarrollo(row, des){
  if(!des) return true;
  const id = pick(row, ['desarrollo_id','_desarrollo_id'], '');
  if(id && String(id)===String(des.id)) return true;
  const v = low(pick(row, K.desarrollo, ''));
  if(!v) return false;
  return v===low(des.slug) || v===low(des.nombre) || v.includes(low(des.slug)) || v.includes(low(des.nombre));
}
function rowMatchesDesarrollador(row, name){
  if(!name) return true;
  return low(pick(row, K.desarrollador, '')) === low(name);
}
function applyFilters(rows){
  const des = selDesarrollo ? DB.desarrollos.find(d=>low(pick(d,['slug'],''))===low(selDesarrollo)) : null;
  return rows.filter(r => rowMatchesDesarrollo(r,des) && rowMatchesDesarrollador(r,selDesarrollador));
}
function isCerrada(row){
  const s = low(pick(row, K.status, ''));
  return /cerrad|ganad|vendid|cierre|won|exitos|aprobad|aceptad|firmad|pagad|formaliz|escritur/.test(s);
}

// ── Carga de datos ────────────────────────────────────────────────────────────
async function fetchTable(name){
  try{
    const { data, error } = await sb.from(name).select('*').limit(5000);
    if(error){ console.warn('['+name+']', error.message); return []; }
    return data||[];
  }catch(e){ console.warn('['+name+']', e.message); return []; }
}
// Metas reales: app_config/clave='metas_v1' → { [nombre]: { desarrollador, plan:{uds[12],monto[12]}, real:{...} } }
async function fetchMetasCfg(){
  try{
    const { data, error } = await sb.from('app_config').select('datos').eq('clave','metas_v1');
    if(error){ console.warn('[metas_v1]', error.message); return null; }
    return (data && data[0]) ? data[0].datos : null;
  }catch(e){ console.warn('[metas_v1]', e.message); return null; }
}
async function reloadAll(){
  setConn('yellow','cargando…');
  const names = Object.keys(DB);
  const [results, metasCfg] = await Promise.all([ Promise.all(names.map(fetchTable)), fetchMetasCfg() ]);
  names.forEach((n,i)=> DB[n]=results[i]);
  METAS_CFG = metasCfg;
  // Enriquecer crm_lotes con datos del lote ligado (crm_lotes solo trae lote_id)
  const loteById = new Map(DB.lotes.map(l=>[String(l.id), l]));
  DB.crm_lotes.forEach(c=>{
    const l = loteById.get(String(pick(c,['lote_id','id_lote','lote'],'')));
    if(l){ c._desarrollo = pick(l,['desarrollo','nombre_terreno','nombre'],''); c._desarrollador = pick(l,['desarrollador'],''); c._desarrollo_id = pick(l,['desarrollo_id'],''); c._lote = l; }
  });
  // Enriquecer cotizaciones con el NOMBRE del desarrollo via desarrollo_id (solo trae el id)
  const desById = new Map(DB.desarrollos.map(d=>[String(d.id), d]));
  DB.cotizaciones.forEach(c=>{
    const d = desById.get(String(pick(c,['desarrollo_id'],'')));
    if(d){ c._desarrollo = pick(d,['nombre'],''); c._desarrollador = pick(d,['desarrollador'],''); }
  });
  const ok = Object.values(DB).some(a=>a.length>0) || (METAS_CFG && Object.keys(METAS_CFG).length>0);
  setConn(ok?'green':'red', ok?('datos OK · '+DB.desarrollos.length+' desarrollos'):'sin datos / revisa conexión');
  populateFilters();
  renderActive();
}
function setConn(color,txt){
  const c = color==='green'?'var(--green)':color==='red'?'var(--red)':'var(--yellow)';
  document.getElementById('conn').innerHTML='<span class="status-dot" style="background:'+c+'"></span><span class="muted" style="font-size:12px">'+txt+'</span>';
}

// ── Filtros globales ──────────────────────────────────────────────────────────
function populateFilters(){
  // desarrollos
  const fd = document.getElementById('f-desarrollo');
  const des = [...DB.desarrollos].sort((a,b)=> low(pick(a,['nombre'],'')).localeCompare(low(pick(b,['nombre'],''))));
  fd.innerHTML = '<option value="">Desarrollo: todos</option>' + des.map(d=>{
    const slug=pick(d,['slug'],''); const nom=pick(d,['nombre'],slug);
    return '<option value="'+String(slug).replace(/"/g,'&quot;')+'">'+nom+'</option>';
  }).join('');
  if(selDesarrollo) fd.value = selDesarrollo;
  // desarrolladores (de desarrollos o de cotizaciones)
  const set = new Set();
  DB.desarrollos.forEach(d=>{ const v=pick(d,K.desarrollador,''); if(v) set.add(v); });
  DB.cotizaciones.forEach(d=>{ const v=pick(d,K.desarrollador,''); if(v) set.add(v); });
  const fdr = document.getElementById('f-desarrollador');
  fdr.innerHTML = '<option value="">Desarrollador: todos</option>' + [...set].sort().map(v=>'<option value="'+String(v).replace(/"/g,'&quot;')+'">'+v+'</option>').join('');
  if(selDesarrollador) fdr.value = selDesarrollador;
  applyBranding();
}
function applyBranding(){
  const des = selDesarrollo ? DB.desarrollos.find(d=>low(pick(d,['slug'],''))===low(selDesarrollo)) : null;
  const title = des ? (pick(des,['nombre'],'GUÍA Analytics')) : 'GUÍA Analytics';
  document.getElementById('brand-title').textContent = title;
  const color = des ? pick(des,['color_principal','color_primario','color','color_primary','brand_color'],'') : '';
  const logo = des ? pick(des,['logo','logo_url','imagen','icono'],'') : '';
  const le = document.getElementById('brand-logo');
  if(logo){ le.innerHTML='<img src="'+logo+'" style="width:100%;height:100%;object-fit:cover;border-radius:8px">'; }
  else { le.innerHTML='🧠'; }
  if(color){ le.style.background=color; }
}

// ── Charts util ─────────────────────────────────────────────────────────────
function drawBar(id, labels, data, color){
  if(charts[id]) charts[id].destroy();
  const ctx=document.getElementById(id); if(!ctx) return;
  charts[id]=new Chart(ctx,{type:'bar',data:{labels,datasets:[{data,backgroundColor:color||'#c9a961',borderRadius:6}]},
    options:{plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#aebfd4',font:{size:10}},grid:{display:false}},y:{ticks:{color:'#8fa6c0'},grid:{color:'#1d3a5c'}}}}});
}
function drawLine(id, labels, data){
  if(charts[id]) charts[id].destroy();
  const ctx=document.getElementById(id); if(!ctx) return;
  charts[id]=new Chart(ctx,{type:'line',data:{labels,datasets:[{data,borderColor:'#c9a961',backgroundColor:'rgba(201,169,97,.15)',fill:true,tension:.3,pointRadius:3,pointBackgroundColor:'#e0c585'}]},
    options:{plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#aebfd4',font:{size:10}},grid:{display:false}},y:{ticks:{color:'#8fa6c0'},grid:{color:'#1d3a5c'}}}}});
}
function barList(rows){ // rows: [{lbl, val}], devuelve HTML de barras
  const max = Math.max(1, ...rows.map(r=>r.val));
  return rows.map(r=>`<div class="bar-row"><div class="lbl" title="${r.lbl}">${r.lbl}</div><div class="bar-track"><div class="bar-fill" style="width:${(r.val/max*100).toFixed(1)}%"></div></div><div class="bar-val">${r.fmt||fmtInt(r.val)}</div></div>`).join('');
}
function groupSum(rows, keyFn, valFn){
  const m=new Map();
  rows.forEach(r=>{ const k=keyFn(r)||'—'; m.set(k,(m.get(k)||0)+valFn(r)); });
  return [...m.entries()].map(([k,v])=>({lbl:k,val:v})).sort((a,b)=>b.val-a.val);
}

// ── Datos de prueba: se ocultan por defecto (toggle en la barra) ──
const RE_TEST = /prueba|test|demo|xxx|ejemplo|borrar/i;
function isTest(row){
  const a = String(pick(row,['nombre_asesor','asesor','asesor_asignado'],''));
  const c = String(pick(row,['nombre_cliente','cliente'],''));
  const n = String(pick(row,['nombre_terreno','nombre'],''));
  return RE_TEST.test(a) || RE_TEST.test(c) || RE_TEST.test(n);
}
function notTest(rows){ return excludeTest ? rows.filter(r=>!isTest(r)) : rows; }
function toggleTest(){
  excludeTest = !excludeTest;
  const b=document.getElementById('btn-test');
  if(b) b.textContent = excludeTest ? '🧪 Ocultar pruebas' : '🧪 Mostrar pruebas';
  renderActive();
}

// ── Seguimientos vencidos (crm_lotes.seguimientos_asesor: JSON/array) ──
function seguimientosVencidos(row){
  let segs = row.seguimientos_asesor;
  if(typeof segs==='string'){ try{ segs=JSON.parse(segs); }catch(e){ return 0; } }
  if(!Array.isArray(segs)) return 0;
  const hoy=new Date();
  return segs.filter(s=>{
    if(!s||typeof s!=='object') return false;
    const done = s.hecho===true||s.completado===true||s.done===true||/hecho|complet|realiz|cerrad/.test(low(s.status||s.estatus||s.estado||''));
    if(done) return false;
    const f=pick(s,['fecha','fecha_proxima','proxima','vence','due','due_date','fecha_seguimiento','fecha_compromiso'],'');
    if(!f) return false;
    const d=new Date(f); return !isNaN(d.getTime()) && d<hoy;
  }).length;
}

// ── Exportar a CSV el tab activo (EXPORT lo setea cada render) ──
function exportCSV(name, headers, rows){
  const esc=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const csv=[headers.map(esc).join(',')].concat(rows.map(r=>r.map(esc).join(','))).join('\r\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=name+'_'+new Date().toISOString().slice(0,10)+'.csv'; document.body.appendChild(a); a.click(); a.remove();
}
function doExport(){
  if(!EXPORT || !EXPORT.rows || !EXPORT.rows.length){ alert('No hay datos para exportar en este tablero.'); return; }
  exportCSV(EXPORT.name, EXPORT.headers, EXPORT.rows);
}

// Fuente de ventas: cotizaciones si tiene datos; si no, lotes vendidos (fallback real)
function salesData(){
  const cot = notTest(applyFilters(DB.cotizaciones));
  if(cot.length){
    return { src:'cotizaciones', all:cot, closed:cot.filter(isCerrada),
      monto:r=>num(pick(r,K.monto,0)), asesor:r=>pick(r,K.asesor,'—'), des:r=>pick(r,K.desarrollo,'—'), fecha:r=>pick(r,K.fecha,'') };
  }
  const vend = applyFilters(DB.lotes).filter(l=>/vendid|cerrad/.test(low(pick(l,K.statusInv,''))));
  return { src:'lotes', all:vend, closed:vend,
    monto:r=>num(pick(r,K.precioTotal,0)), asesor:r=>pick(r,K.asesor,'—'), des:r=>pick(r,K.desarrollo,'—'), fecha:r=>pick(r,['created_at','fecha_ingreso','fecha_entrega'],'') };
}

// ── TAB: VENTAS ───────────────────────────────────────────────────────────────
function renderVentas(){
  if(!DB.cotizaciones.length && !DB.lotes.length){ return sec('ventas', emptyMsg('cotizaciones')); }
  const S = salesData();
  const rows = S.all, cerradas = S.closed;
  const totalCot = rows.reduce((s,r)=>s+S.monto(r),0);
  const totalCerr = cerradas.reduce((s,r)=>s+S.monto(r),0);
  const tasa = (S.src==='cotizaciones' && rows.length) ? (cerradas.length/rows.length*100) : 100;

  const baseRows = S.src==='cotizaciones' ? rows : cerradas; // cotizado (todas) vs ventas cerradas
  const porDes = groupSum(baseRows, r=>S.des(r), r=>S.monto(r)).slice(0,10);
  const porAsesor = groupSum(baseRows, r=>S.asesor(r), r=>S.monto(r)).slice(0,10);
  const mm=new Map();

// Fuente real de metas: app_config/metas_v1 (plan y real ya incluidos por mes).
// Si no hay metas_v1, cae a mostrar el real (cotizaciones cerradas / lotes vendidos) por desarrollo.
function setMetaModo(m){ metaModo = m; renderActive(); }

// Comparativo mensual del año: Plan vs Real (de metas_v1) + Momentum CRM (Apartado/Contrato) + Δ.
// Respeta los filtros (devNames ya viene filtrado por desarrollo/desarrollador).
function _metasMensual(devNames){
  const MES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const planU=Array(12).fill(0),realU=Array(12).fill(0),planM=Array(12).fill(0),realM=Array(12).fill(0);
  devNames.forEach(n=>{ const m=METAS_CFG[n]||{};
    for(let i=0;i<12;i++){
      planU[i]+=(m.plan&&m.plan.uds&&+m.plan.uds[i])||0;
      realU[i]+=(m.real&&m.real.uds&&+m.real.uds[i])||0;
      planM[i]+=(m.plan&&m.plan.monto&&+m.plan.monto[i])||0;
      realM[i]+=(m.real&&m.real.monto&&+m.real.monto[i])||0;
    }
  });
  // Momentum CRM: lotes hoy en Apartado/Contrato del Kanban (se ubica en el mes actual)
  const crm = notTest(applyFilters(DB.crm_lotes)).filter(c=>/apart|contrat/.test(low(pick(c,K.pipeline,''))));
  const momU = crm.length;
  const momM = crm.reduce((s,c)=> s+num(pick(c._lote||{},K.precioTotal,0)), 0);
  const cur = new Date().getMonth();
  const U = metaModo==='uds';
  const plan = U?planU:planM, real = U?realU:realM, momTot = U?momU:momM;
  const cell = v => v ? (U? fmtInt(v) : fmtMoney(v)) : '—';
  const dcell = d => { if(!d) return '<td class="num" style="color:var(--muted)">0</td>'; const c=d>0?'var(--green)':'var(--red)'; return `<td class="num" style="color:${c}">${(d>0?'+':'-')+(U?fmtInt(Math.abs(d)):fmtMoney(Math.abs(d)))}</td>`; };
  const sumA = a=>a.reduce((s,x)=>s+x,0);
  const totPlan=sumA(plan), totReal=sumA(real);
  const th = MES.map((m,i)=>`<th class="num" style="${i===cur?'color:var(--gold2)':''}">${m}${i===cur?'·hoy':''}</th>`).join('');
  const rPlan = plan.map(v=>`<td class="num">${cell(v)}</td>`).join('');
  const rReal = real.map(v=>`<td class="num">${cell(v)}</td>`).join('');
  const rMom  = MES.map((m,i)=>`<td class="num">${(i===cur&&momTot)?cell(momTot):'—'}</td>`).join('');
  const rDelta= plan.map((v,i)=>dcell(real[i]-v)).join('');
  return `<div class="card"><h3>Comparativo mensual ${new Date().getFullYear()} · Plan vs Real
      <span style="float:right;display:inline-flex;gap:6px">
        <button class="btn ${U?'btn-gold':''}" style="padding:4px 12px;font-size:12px" onclick="setMetaModo('uds')">Unidades</button>
        <button class="btn ${!U?'btn-gold':''}" style="padding:4px 12px;font-size:12px" onclick="setMetaModo('monto')">Monto</button>
      </span></h3>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Concepto</th>${th}<th class="num">Total</th></tr></thead>
      <tbody>
        <tr><td>🎯 Plan</td>${rPlan}<td class="num">${cell(totPlan)}</td></tr>
        <tr><td>✅ Real</td>${rReal}<td class="num" style="color:var(--green)">${cell(totReal)}</td></tr>
        <tr><td>🔥 Momentum CRM</td>${rMom}<td class="num" style="color:var(--yellow)">${momTot?cell(momTot):'—'}</td></tr>
        <tr><td>⚡ Δ Real vs Plan</td>${rDelta}${dcell(totReal-totPlan)}</tr>
      </tbody>
    </table></div>
    <div class="muted" style="font-size:11px;margin-top:8px">Plan y Real: metas_v1 (mensual). Momentum CRM: lotes en Apartado/Contrato del pipeline, ubicados en el mes en curso.</div>
  </div>`;
}

// ── TAB: OPORTUNIDADES (inventario rezagado + matching clientes↔inventario) ─────
const KC = {
  presMin:['presupuesto_min','ppto_min'], presMax:['presupuesto_max','ppto_max','presupuesto'],
  ciudad:['ciudad_interes','ciudades_interes','ciudad'], uso:['uso_interes','usos_interes','uso'],
  supMin:['sup_min','superficie_min'], supMax:['sup_max','superficie_max'],
  nombre:['nombre','cliente','nombre_cliente'], asesor:['asesor','nombre_asesor','asesor_asignado'],
};
function arrize(v){ if(Array.isArray(v)) return v.filter(Boolean).map(x=>low(x)); if(v==null||v==='') return []; return String(v).split(/[;,/|]/).map(s=>low(s)).filter(Boolean); }
function loteDisponibles(){ return notTest(applyFilters(DB.lotes)).filter(l=>/dispon/.test(low(pick(l,K.statusInv,'')))); }
function loteAging(l){ const f=pick(l,['fecha_ingreso','created_at','fecha_entrega'],''); if(!f) return null; const d=new Date(f); if(isNaN(d.getTime())) return null; return Math.max(0, Math.floor((Date.now()-d.getTime())/86400000)); }
function metaRealUds(devName){ if(!METAS_CFG) return 0; const dn=low(devName);
  for(const k of Object.keys(METAS_CFG)){ if(low(k)===dn||low(k).includes(dn)||dn.includes(low(k))){ const r=METAS_CFG[k]&&METAS_CFG[k].real; return (r&&Array.isArray(r.uds))?r.uds.reduce((s,x)=>s+(+x||0),0):0; } }
  return 0; }
function matchCrit(cli, lote){
  const precio = num(pick(lote,K.precioTotal,0)) || (num(pick(lote,K.superficie,0))*num(pick(lote,['precio_m2'],0)));
  const pmin=num(pick(cli,KC.presMin,0)), pmax=num(pick(cli,KC.presMax,0));
  const pres = pmax>0 ? (precio<=pmax*1.05 && (pmin>0?precio>=pmin*0.9:true)) : false;
  const ciudades=arrize(pick(cli,KC.ciudad,[])); const lc=low(pick(lote,['ciudad'],''));
  const ciudad = !!lc && ciudades.some(c=> c===lc || c.includes(lc) || lc.includes(c));
  const usos=arrize(pick(cli,KC.uso,[])); const lu=low(pick(lote,['uso','uso_suelo'],''));
  const uso = !!lu && usos.some(u=> u===lu || u.includes(lu) || lu.includes(u));
  const smin=num(pick(cli,KC.supMin,0)), smax=num(pick(cli,KC.supMax,0)); const ls=num(pick(lote,K.superficie,0));
  const sup = smax>0 ? (ls<=smax*1.05 && (smin>0?ls>=smin*0.9:true)) : false;
  const score=(pres?2:0)+(ciudad?1:0)+(uso?1:0)+(sup?1:0);
  return { precio, pres, ciudad, uso, sup, score, ok: pres && (ciudad||uso) };
}
function renderOport(){
  const disp = loteDisponibles();
  const clientes = notTest((DB.clientes||[]).filter(c=>c.activo!==false));
  if(!disp.length && !clientes.length){ return sec('oport', emptyMsg('lotes / clientes')); }
  const valDisp = disp.reduce((s,l)=>s+num(pick(l,K.precioTotal,0)),0);

  // Aging / absorción por desarrollo
  const byDes={};
  disp.forEach(l=>{ const k=pick(l,K.desarrollo,'—'); (byDes[k]=byDes[k]||{n:0,val:0,ages:[]}); byDes[k].n++; byDes[k].val+=num(pick(l,K.precioTotal,0)); const a=loteAging(l); if(a!=null) byDes[k].ages.push(a); });
  const mesesTrans = new Date().getMonth()+1;
  const desRows = Object.entries(byDes).map(([k,v])=>{
    const age = v.ages.length? Math.round(v.ages.reduce((s,x)=>s+x,0)/v.ages.length) : null;
    const vel = metaRealUds(k)/mesesTrans;
    const meses = vel>0 ? v.n/vel : Infinity;
    return { k, n:v.n, val:v.val, age, meses };
  }).sort((a,b)=> (b.meses===Infinity?1e9:b.meses)-(a.meses===Infinity?1e9:a.meses));
  const rezagados = desRows.filter(d=>d.meses>12 || (d.age!=null&&d.age>180));
  const valRezagado = rezagados.reduce((s,d)=>s+d.val,0);

  const lotesAged = disp.map(l=>({ nombre:pick(l,['nombre_terreno','nombre','id'],'—'), des:pick(l,K.desarrollo,'—'), age:loteAging(l) }))
    .filter(x=>x.age!=null).sort((a,b)=>b.age-a.age).slice(0,10);

  // Matching clientes ↔ lotes disponibles
  const matchRows=[];
  clientes.forEach(c=>{
    const hits = disp.map(l=>({l, m:matchCrit(c,l)})).filter(x=>x.m.ok).sort((a,b)=> b.m.score-a.m.score || a.m.precio-b.m.precio);
    if(hits.length) matchRows.push({ cli:pick(c,KC.nombre,'(sin nombre)'), empresa:pick(c,['empresa'],''), asesor:pick(c,KC.asesor,'—'), pmax:num(pick(c,KC.presMax,0)), n:hits.length, best:hits[0] });
  });
  matchRows.sort((a,b)=> b.n-a.n);
  const demanda = disp.map(l=>({ l, c: clientes.filter(c=>matchCrit(c,l).ok).length })).filter(x=>x.c>0).sort((a,b)=>b.c-a.c).slice(0,10);

  EXPORT = { name:'oportunidades', headers:['Cliente','Empresa','Asesor','Presupuesto','Lotes que encajan','Mejor lote','Desarrollo','Precio'],
    rows: matchRows.map(r=>[r.cli, r.empresa, r.asesor, r.pmax, r.n, pick(r.best.l,['nombre_terreno','nombre','id'],''), pick(r.best.l,K.desarrollo,''), r.best.m.precio]) };

  const desBody = desRows.map(d=>{ const lento=d.meses>12||(d.age!=null&&d.age>180); const cls=lento?'red':d.meses>6?'yellow':'green';
    return `<tr><td>${d.k}</td><td class="num">${d.n}</td><td class="num">${d.age!=null?d.age+' d':'—'}</td><td class="num">${d.meses===Infinity?'∞':d.meses.toFixed(1)}</td><td class="num">${fmtMoney(d.val)}</td><td><span class="chip ${cls}">${lento?'rezagado':d.meses>6?'lento':'sano'}</span></td></tr>`;
  }).join('') || '<tr><td colspan="6" class="muted">Sin inventario disponible</td></tr>';

  const matchBody = matchRows.slice(0,30).map(r=>`<tr><td>${r.cli}${r.empresa?'<div class="muted" style="font-size:10px">'+r.empresa+'</div>':''}</td><td>${r.asesor}</td><td class="num">${r.pmax?fmtMoney(r.pmax):'—'}</td><td class="num">${r.n}</td><td>${pick(r.best.l,['nombre_terreno','nombre','id'],'—')} · <span class="muted">${pick(r.best.l,K.desarrollo,'')}</span> · ${fmtMoney(r.best.m.precio)}</td></tr>`).join('')
    || '<tr><td colspan="5" class="muted">Sin matches. Verifica que la tabla clientes tenga presupuesto/ciudad/uso (tab Diagnóstico).</td></tr>';

  sec('oport', `
    <div class="kpis">
      <div class="kpi"><div class="k-lbl">Inventario disponible</div><div class="k-val">${fmtMoney(valDisp)}</div><div class="k-sub">${disp.length} lotes</div></div>
      <div class="kpi"><div class="k-lbl">Valor rezagado</div><div class="k-val" style="color:var(--red)">${fmtMoney(valRezagado)}</div><div class="k-sub">${rezagados.length} desarrollos lentos</div></div>
      <div class="kpi"><div class="k-lbl">Leads con match</div><div class="k-val" style="color:var(--green)">${matchRows.length}</div><div class="k-sub">clientes con lote ideal disponible</div></div>
      <div class="kpi"><div class="k-lbl">Clientes activos</div><div class="k-val">${clientes.length}</div></div>
    </div>
    <div class="card"><h3>📦 Inventario rezagado · absorción por desarrollo</h3>
      <table><thead><tr><th>Desarrollo</th><th class="num">Disponibles</th><th class="num">Antigüedad prom.</th><th class="num">Meses de inventario</th><th class="num">Valor</th><th>Estado</th></tr></thead>
      <tbody>${desBody}</tbody></table>
      <div class="muted" style="font-size:11px;margin-top:8px">Meses de inventario = lotes disponibles ÷ ritmo de venta mensual (real YTD de metas). &gt;12 meses o &gt;180 días = rezagado.</div></div>
    <div class="grid2">
      <div class="card"><h3>🕒 Top lotes más rezagados</h3>${lotesAged.length?barList(lotesAged.map(x=>({lbl:x.nombre+' · '+x.des, val:x.age, fmt:x.age+' días'}))):'<div class="muted">Sin fechas de ingreso en lotes</div>'}</div>
      <div class="card"><h3>🔥 Lotes con más demanda</h3>${demanda.length?barList(demanda.map(x=>({lbl:pick(x.l,['nombre_terreno','nombre','id'],'—')+' · '+pick(x.l,K.desarrollo,''), val:x.c, fmt:x.c+' clientes'}))):'<div class="muted">Sin coincidencias (revisa columnas de clientes en Diagnóstico)</div>'}</div>
    </div>
    <div class="card"><h3>🎯 Qué presentar y a quién · ${matchRows.length} clientes con match</h3>
      <table><thead><tr><th>Cliente</th><th>Asesor</th><th class="num">Presupuesto</th><th class="num">Lotes</th><th>Mejor opción</th></tr></thead>
      <tbody>${matchBody}</tbody></table>
      <div class="muted" style="font-size:11px;margin-top:8px">Match = presupuesto compatible + (ciudad o uso de interés). Ordenado por # de lotes que encajan. Exporta con ⬇ CSV.</div></div>
  `);
}

// ── TAB: DIAGNÓSTICO (esquema real) ─────────────────────────────────────────────
function renderDiag(){
  const blocks = Object.keys(DB).map(n=>{
    const arr=DB[n]; const cols = arr.length ? Object.keys(arr[0]) : [];
    return `<div class="card"><h3>${n} · ${arr.length} filas</h3>
      <div class="diag-cols">${cols.length? cols.map(c=>'<code>'+c+'</code>').join(' ') : '<span class="muted">sin filas o sin acceso</span>'}</div></div>`;
  }).join('');
  const nMetas = METAS_CFG ? Object.keys(METAS_CFG).length : 0;
  const metasBlock = `<div class="card"><h3>app_config / metas_v1 · ${nMetas} desarrollos</h3>
    <div class="diag-cols">${nMetas? Object.keys(METAS_CFG).map(k=>'<code>'+k+'</code>').join(' ') : '<span class="muted">sin metas (cárgalas en el Administrador)</span>'}</div></div>`;
  // Valores reales de 'estatus' en cotizaciones, con conteo y marca de los que cuentan como cerrada
  const estCount={};
  DB.cotizaciones.forEach(r=>{ const e=String(pick(r,K.status,'(vacío)')||'(vacío)'); estCount[e]=(estCount[e]||0)+1; });
  const estEntries = Object.entries(estCount).sort((a,b)=>b[1]-a[1]);
  const estatusBlock = `<div class="card"><h3>cotizaciones · valores de estatus (✅ = cuenta como cerrada)</h3>
    <div class="diag-cols">${estEntries.length? estEntries.map(([e,n])=>'<code>'+e+'</code> '+n+(isCerrada({estatus:e})?' ✅':'')).join(' · ') : '<span class="muted">sin cotizaciones</span>'}</div></div>`;
  sec('diag', `
    <div class="card" style="border-color:var(--gold)"><h3>¿Para qué sirve esto?</h3>
    <div style="font-size:12px;color:var(--muted2);line-height:1.6">Aquí ves las <b>columnas reales</b> de cada tabla y los datos detectados. Si algún tablero sale vacío, compara estos nombres con las claves esperadas. Mapeos verificados: crm_lotes·asesor=<code>asesor_asignado</code>, lotes·valor=<code>precio_total</code>, lotes·estatus=<code>status_inventario</code>, metas=<code>app_config/metas_v1</code>.</div></div>
    ${metasBlock}
    ${estatusBlock}
    ${blocks}`);
}

// ── Render helpers ──────────────────────────────────────────────────────────
function sec(name, html){ document.getElementById('sec-'+name).innerHTML = html; }
function emptyMsg(table){ return `<div class="err">No se obtuvieron filas de <b>${table}</b>. Revisa el tab <b>Diagnóstico</b> para ver si la tabla existe y tiene datos (puede ser permisos RLS o nombre de tabla distinto).</div>`; }
function renderActive(){
  ({ventas:renderVentas, metas:renderMetas, pipeline:renderPipeline, inventario:renderInventario, oport:renderOport, diag:renderDiag}[activeTab]||(()=>{}))();
}

// ── Eventos ─────────────────────────────────────────────────────────────────
document.getElementById('tabs').addEventListener('click', e=>{
  const t=e.target.closest('.tab'); if(!t) return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); activeTab=t.dataset.t;
  document.getElementById('sec-'+activeTab).classList.add('active');
  renderActive();
});
document.getElementById('f-desarrollo').addEventListener('change', e=>{ selDesarrollo=e.target.value; const u=new URL(location); if(selDesarrollo)u.searchParams.set('desarrollo',selDesarrollo); else u.searchParams.delete('desarrollo'); history.replaceState({},'',u); applyBranding(); renderActive(); });
document.getElementById('f-desarrollador').addEventListener('change', e=>{ selDesarrollador=e.target.value; renderActive(); });

// deep-link ?desarrollo=slug
const params = new URLSearchParams(location.search);
if(params.get('desarrollo')) selDesarrollo = params.get('desarrollo');

reloadAll();
</script>
