    const KanbanBoard=()=>{
      // Aplicar filtro de desarrollo sobre los prospectos
      const prospectosFiltrados=allProspectos.filter(x=>{
        return filterDesarrolloCRM==="Todos"||x.lot.desarrollo===filterDesarrolloCRM;
      });
      // Agregar lotes con seguimientoAsesor (sin cliente) como tarjetas especiales
      const lotesConSeguimiento=[];
      srcInvFiltrado.forEach(lot=>{
        if(filterDesarrolloCRM!=="Todos"&&lot.desarrollo!==filterDesarrolloCRM) return;
        const crm=crmData[lot.id];
        if(crm&&crm.seguimientoAsesor){
          lotesConSeguimiento.push({
            lotId:lot.id,
            lot,
            seguimiento:crm.seguimientoAsesor,
            pipeline:crm.seguimientoAsesor.pipeline,
            isSeguimiento:true
          });
        }
      });
      return (
      <div style={{overflowX:"auto",paddingBottom:8}}>
        <div style={{display:"flex",gap:12,minWidth:1100}}>
          {PIPELINE_STAGES.map(stage=>{
            const col=PIPELINE_COLORS[stage];
            const stageProsps=prospectosFiltrados.filter(x=>x.pipeline===stage);
            const stageSeguimientos=lotesConSeguimiento.filter(x=>x.pipeline===stage);
            const totalInColumn=stageProsps.length+stageSeguimientos.length;
            return (
              <div key={stage} style={{flex:"0 0 220px",background:B.white,borderRadius:12,border:"2px solid "+col+"33",overflow:"hidden",display:"flex",flexDirection:"column"}}>
                <div style={{background:col+"18",borderBottom:"2px solid "+col+"33",padding:"10px 12px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
                  <span style={{fontSize:11,fontWeight:800,color:col}}>{stage}</span>
                  <span style={{background:col,color:"#fff",borderRadius:20,padding:"1px 8px",fontSize:10,fontWeight:700,minWidth:22,textAlign:"center"}}>{totalInColumn}</span>
                </div>
                <div style={{padding:8,maxHeight:600,overflowY:"auto",flex:1}}>
                  {totalInColumn===0&&<div style={{fontSize:10,color:B.grey3,textAlign:"center",padding:"18px 0"}}>Sin prospectos</div>}
                  {/* Tarjetas de Seguimiento por asesor (sin cliente) — van primero */}
                  {stageSeguimientos.map((x,i)=>(
                    <div key={"seg_"+x.lotId+"_"+i} onClick={()=>{setSelectedLotCRM(x.lot);setActiveTab("kanban");}}
                      style={{background:"#eff6ff",borderRadius:10,padding:"10px 11px",marginBottom:8,cursor:"pointer",border:"1.5px dashed #3B82F6",transition:"all 0.15s"}}
                      onMouseEnter={e=>{e.currentTarget.style.borderColor="#1e40af";e.currentTarget.style.boxShadow="0 3px 10px rgba(59,130,246,0.25)";}}
                      onMouseLeave={e=>{e.currentTarget.style.borderColor="#3B82F6";e.currentTarget.style.boxShadow="none";}}>
                      <div style={{fontSize:9,fontWeight:800,color:"#2563AC",marginBottom:4,textTransform:"uppercase",letterSpacing:0.8}}>🎯 Sin cliente aún</div>
                      <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:3}}>
                        <Semaforo lotId={x.lotId} size={7}/>
                        <span style={{fontSize:11,fontWeight:800,color:B.navy,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{x.lot.nombre}</span>
                      </div>
                      <div style={{fontSize:9,color:B.grey4,marginBottom:5}}>{x.lot.desarrollo}</div>
                      <div style={{fontSize:10,color:"#2563AC",fontWeight:700,marginTop:6,paddingTop:6,borderTop:"1px solid "+B.grey1,display:"flex",alignItems:"center",gap:4}}>
                        <span>👤</span><span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{x.seguimiento.asesor}</span>
                      </div>
                      {x.seguimiento.notas&&<div style={{fontSize:9,color:B.grey3,marginTop:3,fontStyle:"italic",overflow:"hidden",textOverflow:"ellipsis",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>"{x.seguimiento.notas}"</div>}
                    </div>
                  ))}
                  {stageProsps.map((x,i)=>{
                    const p=x.prospecto;
                    const cli=x.cli;
                    const asesor=(cli&&cli.asesor)||p.asesor||x.crm.asesorResponsable||null;
                    const temp=p.temperatura||(cli&&cli.temperatura)||null;
                    const tCol=temp==="Caliente"?B.red:temp==="Tibio"?B.gold:temp==="Frío"?"#3B82F6":null;
                    return (
                      <div key={x.lotId+"_"+x.prospectoIdx+"_"+i} onClick={()=>{setQuickProspData({lot:x.lot,p:x.prospecto,prospectoIdx:x.prospectoIdx,crm:crmData[x.lotId]||{}});setShowQuickProspModal(true);}}
                        style={{background:B.white,borderRadius:10,padding:"10px 11px",marginBottom:8,cursor:"pointer",border:"1px solid "+B.grey1,transition:"all 0.15s",boxShadow:"0 1px 3px rgba(0,43,73,0.05)"}}
                        onMouseEnter={e=>{e.currentTarget.style.borderColor=col;e.currentTarget.style.boxShadow="0 3px 10px rgba(0,43,73,0.12)";}}
                        onMouseLeave={e=>{e.currentTarget.style.borderColor=B.grey1;e.currentTarget.style.boxShadow="0 1px 3px rgba(0,43,73,0.05)";}}>
                        {/* Nombre del prospecto */}
                        <div style={{fontSize:12,fontWeight:800,color:B.navy,marginBottom:6,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.nombre||"(Sin nombre)"}</div>
                        {/* Lote + Desarrollo */}
                        <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:3}}>
                          <Semaforo lotId={x.lotId} size={7}/>
                          <span style={{fontSize:10,fontWeight:700,color:B.navy,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{x.lot.nombre}</span>
                        </div>
                        <div style={{fontSize:9,color:B.grey4,marginBottom:5}}>{x.lot.desarrollo}</div>
                        {/* Asesor */}
                        {asesor&&<div style={{fontSize:9,color:B.grey4,marginBottom:3,display:"flex",alignItems:"center",gap:4}}>
                          <span style={{opacity:0.6}}>👤</span><span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{asesor}</span>
                        </div>}
                        {/* Temperatura */}
                        {temp&&tCol&&<div style={{fontSize:9,color:tCol,fontWeight:700,marginBottom:4,display:"flex",alignItems:"center",gap:3}}>
                          <span>🌡</span><span>{temp}</span>
                        </div>}
                        {/* Selector de etapa INLINE en la tarjeta del Kanban */}
                        <div onClick={e=>e.stopPropagation()} style={{marginTop:6,marginBottom:4}}>
                          <select value={VALID_STAGES_SET.has(x.pipeline)?x.pipeline:"__legacy__"} onChange={e=>{if(e.target.value!=="__legacy__")updateProspectoPipeline(x.lotId,x.prospectoIdx,e.target.value);}}
                            style={{width:"100%",fontSize:9,fontWeight:700,color:VALID_STAGES_SET.has(x.pipeline)?col:"#dc2626",background:VALID_STAGES_SET.has(x.pipeline)?col+"15":"#fee2e2",border:"1.5px solid "+(VALID_STAGES_SET.has(x.pipeline)?col+"55":"#dc2626"),borderRadius:6,padding:"3px 6px",cursor:"pointer",fontFamily:"'DM Sans',sans-serif",outline:"none"}}>
                            {!VALID_STAGES_SET.has(x.pipeline)&&<option value="__legacy__">⚠ {x.pipeline}</option>}
                            {PIPELINE_STAGES.map(s=><option key={s} value={s}>→ {s}</option>)}
                          </select>
                        </div>
                        {/* Footer: interacciones + días */}
                        <div style={{fontSize:9,color:B.grey3,borderTop:"1px solid "+B.grey1,paddingTop:5,marginTop:2}}>
                          {x.interacciones} interacc.{x.diasSinContacto!==null?" · "+x.diasSinContacto+"d":""}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>
      );
    };

    // ══════════════════════════════════════════════════════════════
    // LISTA + LOT PANEL (derecho)
    // ══════════════════════════════════════════════════════════════
    const ListView=()=>(
      <div>
        {lotsFiltered.length===0&&<div style={{textAlign:"center",padding:40,color:B.grey3,fontSize:13}}>Sin lotes con estos filtros</div>}
        {lotsFiltered.map(l=>{
          const crm=crmData[l.id]||{};
          const lastI=crm.interacciones&&crm.interacciones.length>0?crm.interacciones[crm.interacciones.length-1]:null;
          const days=crm.lastContact?Math.floor((Date.now()-new Date(crm.lastContact).getTime())/864e5):null;
          const sem=getSemaforo(l.id);
          const semCol=semaforoColor[sem];
          const nProsp=(crm.prospectos||[]).length;
          const selected=selectedLotCRM&&selectedLotCRM.id===l.id;
          return (
            <div key={l.id} style={{background:selected?B.navy:B.white,borderRadius:12,padding:"12px 16px",marginBottom:8,boxShadow:"0 2px 8px rgba(0,43,73,0.06)",border:"2px solid "+(selected?B.gold:semCol+"44"),cursor:"pointer",transition:"all 0.15s"}}
              onClick={()=>setSelectedLotCRM(selected?null:l)}
              onMouseEnter={e=>{if(!selected)e.currentTarget.style.borderColor=semCol;}}
              onMouseLeave={e=>{if(!selected)e.currentTarget.style.borderColor=semCol+"44";}}>
              <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
                <div style={{paddingTop:2}}><Semaforo lotId={l.id} size={12}/></div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:2,flexWrap:"wrap"}}>
                    <span style={{fontSize:13,fontWeight:800,color:selected?"#fff":B.navy}}>{l.nombre}</span>
                    <PipelineBadge stage={crm.pipeline||"Disponible"}/>
                  </div>
                  <div style={{fontSize:11,color:selected?B.grey2:B.grey4}}>{l.desarrollo} · {l.ciudad} · {fmtM(l.precio_total||0)}</div>
                  <div style={{display:"flex",gap:12,marginTop:3,flexWrap:"wrap"}}>
                    <span style={{fontSize:10,color:selected?B.grey2:B.grey3}}>🔄 {crm.interacciones?crm.interacciones.length:0} interacc.</span>
                    {nProsp>0&&<span style={{fontSize:10,color:selected?"#93c5fd":"#3B82F6",fontWeight:600}}>👤 {nProsp} prospecto{nProsp!==1?"s":""}</span>}
                    {days!==null&&<span style={{fontSize:10,color:days>30?"#ef4444":selected?B.grey2:B.grey3}}>📅 hace {days}d</span>}
                    {lastI&&<span style={{fontSize:10,color:selected?B.grey2:B.grey4}}>Último: {lastI.canal}</span>}
                  </div>
                </div>
                <button onClick={e=>{e.stopPropagation();setSelectedLotCRM(l);setShowInterModal(true);}} style={{padding:"4px 9px",background:B.gold,color:B.navy,border:"none",borderRadius:6,cursor:"pointer",fontSize:10,fontWeight:700,flexShrink:0}}>+ Acción</button>
              </div>
            </div>
          );
        })}
      </div>
    );

    // ══════════════════════════════════════════════════════════════
    // LOT PANEL (detalle del lote seleccionado - lado derecho en lista)
    // ══════════════════════════════════════════════════════════════
    const LotPanel=()=>{
      if(!selectedLotCRM) return (
        <div style={{background:B.white,borderRadius:14,padding:32,textAlign:"center",color:B.grey3,border:"2px dashed "+B.grey1}}>
          <div style={{fontSize:34,marginBottom:8}}>🏗</div>
          <div style={{fontSize:12,fontWeight:600}}>Selecciona un lote</div>
          <div style={{fontSize:11,marginTop:4}}>para ver su seguimiento</div>
        </div>
      );
      const l=selectedLotCRM;
      const crm=crmData[l.id]||{pipeline:"Disponible",interacciones:[],prospectos:[],devFeedback:[]};
      const sem=getSemaforo(l.id);
      const precioTot=l.precio_total||(l.sup_m2&&l.precio_m2?l.sup_m2*l.precio_m2:0);
      return (
        <div style={{background:B.white,borderRadius:14,overflow:"hidden",boxShadow:"0 4px 20px rgba(0,43,73,0.1)"}}>
          {/* Header */}
          <div style={{background:"linear-gradient(135deg,"+B.navy+","+B.navyL+")",padding:"16px 20px"}}>
            <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:10}}>
              <div>
                <div style={{fontSize:9,fontWeight:700,color:B.gold,letterSpacing:2,textTransform:"uppercase",marginBottom:3}}>{l.desarrollo} · {l.id}</div>
                <div style={{fontSize:17,fontWeight:800,color:"#fff",fontFamily:"'Playfair Display',serif"}}>{l.nombre}</div>
                <div style={{fontSize:11,color:"#93c5fd",marginTop:2}}>{l.ciudad}, {l.estado}</div>
              </div>
              <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:5}}>
                <div style={{display:"flex",alignItems:"center",gap:5}}>
                  <div style={{width:9,height:9,borderRadius:"50%",background:semaforoColor[sem]}}/>
                  <span style={{fontSize:9,color:"#fff",fontWeight:600}}>{semaforoLabel[sem]}</span>
                </div>
                <PipelineBadge stage={crm.pipeline||"Disponible"}/>
              </div>
            </div>
            <div style={{display:"flex",gap:10,marginTop:10}}>
              {[["Sup",l.sup_m2?(l.sup_m2.toLocaleString()+" m²"):"-"],["$/m²",l.precio_m2?"$"+l.precio_m2.toLocaleString():"-"],["Total",precioTot?"$"+(precioTot/1e6).toFixed(1)+"M":"-"]].map(([k,v])=>(
                <div key={k} style={{background:"rgba(255,255,255,0.12)",borderRadius:6,padding:"4px 9px",textAlign:"center"}}>
                  <div style={{fontSize:8,color:"#93c5fd",textTransform:"uppercase"}}>{k}</div>
                  <div style={{fontSize:12,fontWeight:700,color:"#fff"}}>{v}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Etapa del lote (calculada automáticamente por el prospecto más avanzado) */}
          {(() => {
            const loteStage=crm.pipeline||"Disponible";
            const loteCol=PIPELINE_COLORS[loteStage]||B.grey3;
            const nProsp=(crm.prospectos||[]).length;
            return (
              <div style={{padding:"10px 14px",background:B.offW,borderBottom:"1px solid "+B.grey1,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <span style={{fontSize:9,fontWeight:700,color:B.grey4,textTransform:"uppercase",letterSpacing:1}}>Etapa del lote:</span>
                <span style={{padding:"3px 10px",borderRadius:20,background:loteCol+"22",color:loteCol,fontSize:11,fontWeight:800,border:"1.5px solid "+loteCol+"55"}}>{loteStage}</span>
                <span style={{fontSize:9,color:B.grey3,fontStyle:"italic"}}>{nProsp>0?"(calculada automáticamente por el prospecto más avanzado)":"(sin prospectos asignados)"}</span>
              </div>
            );
          })()}

          {/* Contenido scrollable */}
          <div style={{padding:"12px 14px",maxHeight:420,overflowY:"auto"}}>

            {/* Asesor Asignado */}
            <div style={{marginBottom:12,background:B.offW,borderRadius:8,padding:"8px 10px",display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:9,fontWeight:700,color:B.grey3,textTransform:"uppercase",letterSpacing:1,flexShrink:0}}>👤 Asesor:</span>
              <input
                key={l.id+"_asesor"}
                defaultValue={crm.asesorResponsable||l.asesor||""}
                onBlur={e=>updateCRM(l.id,{asesorResponsable:e.target.value.trim()})}
                placeholder="Nombre del asesor responsable..."
                style={{flex:1,border:"none",background:"transparent",fontSize:11,color:B.navy,fontFamily:"'DM Sans',sans-serif",outline:"none",fontWeight:600}}
              />
            </div>

            {/* Notas del lote */}
            <div style={{marginBottom:14}}>
              <div style={{fontSize:10,fontWeight:700,color:B.grey4,marginBottom:5,textTransform:"uppercase",letterSpacing:0.8}}>📝 Notas del lote</div>
              <textarea key={l.id+"_n"} defaultValue={crm.notas||""} onBlur={e=>updateCRM(l.id,{notas:e.target.value})} placeholder="Observaciones, restricciones, puntos clave..." style={{width:"100%",borderRadius:8,border:"1px solid "+B.grey1,padding:"8px 10px",fontSize:11,color:B.navy,fontFamily:"'DM Sans',sans-serif",resize:"none",height:52,outline:"none",boxSizing:"border-box"}}/>
            </div>

            {/* Interacciones */}
            <div style={{marginBottom:14}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7}}>
                <div style={{fontSize:10,fontWeight:700,color:B.grey4,textTransform:"uppercase",letterSpacing:0.8}}>🔄 Seguimiento ({crm.interacciones?crm.interacciones.length:0})</div>
                <button onClick={()=>setShowInterModal(true)} style={{padding:"4px 10px",background:B.gold,color:B.navy,border:"none",borderRadius:7,cursor:"pointer",fontSize:10,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>+ Agregar</button>
              </div>
              {(!crm.interacciones||crm.interacciones.length===0)&&<div style={{fontSize:11,color:B.grey3,padding:"6px 0",fontStyle:"italic"}}>Sin seguimiento registrado</div>}
              {(crm.interacciones||[]).slice().reverse().map((inter,i)=>(
                <div key={i} style={{background:B.offW,borderRadius:8,padding:"8px 10px",marginBottom:5,borderLeft:"3px solid "+B.gold}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:2}}>
                    <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                      <span style={{fontSize:10,fontWeight:700,color:B.navy}}>{inter.canal}</span>
                      <span style={{padding:"1px 6px",borderRadius:10,fontSize:9,fontWeight:700,background:inter.reaccion==="Muy interesado"?"#dcfce7":inter.reaccion==="Interesado"?"#dbeafe":"#fef9c3",color:inter.reaccion==="Muy interesado"?"#16a34a":inter.reaccion==="Interesado"?"#2563eb":"#d97706"}}>{inter.reaccion}</span>
                      {inter.contacto&&<span style={{fontSize:9,color:B.grey3}}>con {inter.contacto}</span>}
                    </div>
                    <span style={{fontSize:9,color:B.grey3}}>{inter.fecha}</span>
                  </div>
                  {inter.nota&&<div style={{fontSize:11,color:B.grey4}}>{inter.nota}</div>}
                </div>
              ))}
            </div>

            {/* Seguimiento por Asesor (sin cliente identificado aún) */}
            {(() => {
              const sa=crm.seguimientoAsesor;
              return (
                <div style={{marginBottom:14,background:sa?"#eff6ff":B.offW,borderRadius:10,padding:"10px 12px",border:"1.5px solid "+(sa?"#3B82F6":B.grey1)}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:sa?8:0,flexWrap:"wrap",gap:6}}>
                    <div style={{fontSize:10,fontWeight:700,color:sa?"#2563AC":B.grey4,textTransform:"uppercase",letterSpacing:0.8}}>
                      {sa?"🎯 Seguimiento por Asesor (sin cliente)":"🎯 Seguimiento sin cliente"}
                    </div>
                    <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                      {sa&&(
                        <button onClick={()=>{setShowConvertModal({lotId:l.id,lot:l,seguimiento:sa});setConvertForm({nombre:"",empresa:"",telefono:"",email:""});}}
                          style={{padding:"4px 10px",background:"#16a34a",color:"#fff",border:"none",borderRadius:6,cursor:"pointer",fontSize:10,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>🎉 Convertir a prospecto</button>
                      )}
                      <button onClick={()=>{setShowSeguimientoModal({lotId:l.id,lot:l});setSeguimientoForm({asesor:(sa&&sa.asesor)||"",notas:(sa&&sa.notas)||""});}}
                        style={{padding:"4px 10px",background:sa?B.white:"#2563AC",color:sa?"#2563AC":"#fff",border:"1.5px solid #2563AC",borderRadius:6,cursor:"pointer",fontSize:10,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>
                        {sa?"✏ Editar":"+ Asignar asesor"}
                      </button>
                    </div>
                  </div>
                  {!sa&&(
                    <div style={{fontSize:10,color:B.grey3,marginTop:4,fontStyle:"italic"}}>Asigna un asesor responsable cuando aún no tienes nombre del cliente. Cuando aparezca, conviértelo a prospecto formal.</div>
                  )}
                  {sa&&(
                    <>
                      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6,flexWrap:"wrap"}}>
                        <div style={{flex:"1 1 140px",minWidth:120}}>
                          <div style={{fontSize:9,color:B.grey3,textTransform:"uppercase",letterSpacing:0.8,fontWeight:700}}>Asesor</div>
                          <div style={{fontSize:13,fontWeight:800,color:B.navy}}>👤 {sa.asesor}</div>
                        </div>
                        <div>

                          <div style={{display:"flex",gap:6,alignItems:"center"}}>
                            <span style={{fontSize:11,fontWeight:700,color:canalColor[inter.canal]||B.navy}}>{inter.canal}</span>
                            <span style={{padding:"1px 7px",borderRadius:10,fontSize:10,fontWeight:700,background:"#dbeafe",color:"#2563eb"}}>{inter.reaccion}</span>
                            {inter.contacto&&<span style={{fontSize:10,color:B.grey3}}>con {inter.contacto}</span>}
                          </div>
                          <span style={{fontSize:10,color:B.grey3}}>{inter.fecha}</span>
                        </div>
                        {inter.nota&&<div style={{fontSize:12,color:B.grey4,fontStyle:"italic",lineHeight:1.5}}>{inter.nota}</div>}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ══════════════════════════════════════════════════════════════
    // VISTA ASESORES — Tab dedicado
    // ══════════════════════════════════════════════════════════════
    const VistaAsesores=()=>{
      const now3=Date.now();
      // Fuente de asesor por lote: crmData.asesorResponsable > l.asesor > cli.asesor
      const getAsesorDeLote=(l)=>{
        const fromCRM=crmData[l.id]&&crmData[l.id].asesorResponsable;
        if(fromCRM&&fromCRM.trim()) return fromCRM.trim();
        if(l.asesor&&l.asesor.trim()) return l.asesor.trim();
        const crm=crmData[l.id]||{};
        const prospectos=crm.prospectos||[];
        for(const p of prospectos){
          const cli=cliSrcCRM.find(c=>c.nombre&&c.nombre.toLowerCase().trim()===p.nombre.toLowerCase().trim());
          if(cli&&cli.asesor) return cli.asesor;
        }
        return null;
      };
      // Construir asesorMap con TODOS los lotes
      const asesorMap={};
      const sinAsesor=[];
      srcInvCRM.forEach(l=>{
        const crm=crmData[l.id]||{};
        const pip=crm.pipeline||"Disponible";
        const dias=crm.lastContact?Math.floor((now3-new Date(crm.lastContact).getTime())/864e5):null;
        const interacciones=(crm.interacciones||[]).length;
        const asesor=getAsesorDeLote(l);
        const entry={lotId:l.id,lot:l,pipeline:pip,diasSinContacto:dias,semaforo:getSemaforo(l.id),interacciones,prospecto:null,cli:null};
        const prospectos=crm.prospectos||[];
        if(prospectos.length>0){
          const p=prospectos[0];
          const cli=cliSrcCRM.find(c=>c.nombre&&c.nombre.toLowerCase().trim()===p.nombre.toLowerCase().trim());
          entry.prospecto=p; entry.cli=cli||null;
        }
        if(asesor){
          if(!asesorMap[asesor]) asesorMap[asesor]=[];
          if(!asesorMap[asesor].find(x=>x.lotId===l.id)) asesorMap[asesor].push(entry);
        } else {
          sinAsesor.push(entry);
        }
      });
      // UNIÓN: catálogo + asesores detectados en lotes (para que se vean todos)
      const nombresCatalogo=new Set(asesoresCatalog.map(a=>a.nombre));
      const asesoresDetectados=Object.keys(asesorMap).filter(n=>!nombresCatalogo.has(n)).sort();
      const movBadgeA=(dias)=>{
        if(dias===null) return {label:"Sin registro",col:"#9ca3af",bg:"#f3f4f6"};
        if(dias>180) return {label:dias+"d ⚠⚠",col:"#fff",bg:"#7f1d1d"};
        if(dias>120) return {label:dias+"d ⚠",col:"#fff",bg:"#ef4444"};
        if(dias>60)  return {label:dias+"d •",col:"#92400e",bg:"#fef3c7"};
        if(dias>30)  return {label:dias+"d",col:"#166534",bg:"#dcfce7"};
        return {label:dias+"d ✓",col:"#15803d",bg:"#f0fdf4"};
      };
      const getInitials=(nombre)=>{
        if(!nombre) return "?";
        const parts=nombre.trim().split(/\s+/);
        return (parts[0][0]+(parts[1]?parts[1][0]:"")).toUpperCase();
      };
      const getAvatarColor=(nombre)=>{
        const colors=["#3B82F6","#8B5CF6","#06B6D4","#10B981","#F59E0B","#EF4444","#EC4899","#6366F1"];
        let hash=0;
        for(let i=0;i<(nombre||"").length;i++) hash=((hash<<5)-hash)+nombre.charCodeAt(i);
        return colors[Math.abs(hash)%colors.length];
      };
      const renderLotesTable=(lotes,asesorNombre)=>(
        <div style={{background:B.white,borderRadius:12,padding:"16px 20px",boxShadow:"0 2px 12px rgba(0,43,73,0.07)",border:"2px solid "+B.gold,marginTop:8}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <div>
              <div style={{fontSize:10,fontWeight:700,color:B.gold,textTransform:"uppercase",letterSpacing:1,marginBottom:2}}>📋 Terrenos Opcionados</div>
              <div style={{fontSize:15,fontWeight:800,color:B.navy}}>👤 {asesorNombre} — {lotes.length} terreno{lotes.length!==1?"s":""}</div>
            </div>
            <button onClick={()=>setSelectedAsesorLotes(null)} style={{background:B.offW,border:"1px solid "+B.grey1,borderRadius:8,padding:"5px 12px",cursor:"pointer",fontSize:11,color:B.grey4,fontFamily:"'DM Sans',sans-serif",fontWeight:600}}>✕ Cerrar</button>
          </div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
              <thead>
                <tr style={{borderBottom:"2px solid "+B.grey1}}>
                  {["Terreno","Desarrollo","Precio","Pipeline","Días sin mov.","Interacc.","Cliente"].map((h,i)=>(
                    <th key={i} style={{textAlign:i<2?"left":"center",padding:"6px 8px",fontSize:9,fontWeight:800,color:B.grey3,textTransform:"uppercase",letterSpacing:0.8,whiteSpace:"nowrap"}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {[...lotes].sort((a,b)=>(b.diasSinContacto||999)-(a.diasSinContacto||999)).map((x,i)=>{
                  const mb=movBadgeA(x.diasSinContacto);
                  return (
                    <tr key={i} onClick={()=>{setSelectedLotCRM(x.lot);setActiveTab("kanban");}} style={{borderBottom:"1px solid "+B.grey1,cursor:"pointer"}}
                      onMouseEnter={e=>e.currentTarget.style.background=B.offW}
                      onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                      <td style={{padding:"7px 8px",fontWeight:700,color:B.navy}}>{x.lot.nombre}</td>
                      <td style={{padding:"7px 8px",color:B.grey4}}>{x.lot.desarrollo}</td>
                      <td style={{padding:"7px 8px",textAlign:"center",fontWeight:700,color:B.navy}}>{fmtM(x.lot.precio_total||0)}</td>
                      <td style={{padding:"7px 8px",textAlign:"center"}}><span style={{padding:"1px 7px",borderRadius:10,fontSize:9,fontWeight:700,background:(PIPELINE_COLORS[x.pipeline]||B.grey3)+"22",color:PIPELINE_COLORS[x.pipeline]||B.grey3}}>{x.pipeline}</span></td>
                      <td style={{padding:"7px 8px",textAlign:"center"}}><span style={{padding:"2px 8px",borderRadius:8,fontSize:10,fontWeight:700,background:mb.bg,color:mb.col}}>{mb.label}</span></td>
                      <td style={{padding:"7px 8px",textAlign:"center",color:x.interacciones>0?B.navy:B.grey3}}>{x.interacciones}</td>
                      <td style={{padding:"7px 8px",textAlign:"center",fontSize:10,color:B.grey4}}>{x.cli?x.cli.nombre:x.prospecto?x.prospecto.nombre:"—"}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
      const renderAsesorCard=(nombre,datosCatalogo,isDetected)=>{
        const lotes=asesorMap[nombre]||[];
        const frios=lotes.filter(x=>x.diasSinContacto===null||x.diasSinContacto>60).length;
        const enPipeline=lotes.filter(x=>x.pipeline!=="Disponible"&&x.pipeline!=="Perdido").length;
        const cierres=lotes.filter(x=>x.pipeline==="Cierre").length;
        const isSelected=selectedAsesorLotes===nombre;
        const avatarBg=getAvatarColor(nombre);
        return (
          <div key={nombre} style={{background:isSelected?B.navy:B.white,borderRadius:12,padding:"14px 16px",border:"2px solid "+(isSelected?B.navy:isDetected?"#f59e0b55":B.grey1),transition:"all 0.15s",boxShadow:isSelected?"0 4px 14px rgba(0,43,73,0.2)":"0 1px 4px rgba(0,43,73,0.06)",display:"flex",flexDirection:"column",gap:8}}>
            {/* Avatar + nombre + acciones */}
            <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
              <div style={{width:40,height:40,borderRadius:10,background:avatarBg,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:800,fontSize:14,flexShrink:0}}>{getInitials(nombre)}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:800,color:isSelected?"#fff":B.navy,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{nombre}</div>
                {datosCatalogo&&datosCatalogo.zona&&<div style={{fontSize:10,color:isSelected?"rgba(255,255,255,0.7)":B.grey3,marginTop:1}}>📍 {datosCatalogo.zona}</div>}
                {isDetected&&!datosCatalogo&&<div style={{fontSize:9,color:"#b45309",marginTop:1,fontStyle:"italic"}}>⚠ No está en catálogo</div>}
              </div>
            </div>
            {/* Contacto (si está en catálogo) */}
            {datosCatalogo&&(datosCatalogo.telefono||datosCatalogo.email)&&(
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {datosCatalogo.telefono&&<a href={"https://wa.me/52"+datosCatalogo.telefono.replace(/\D/g,"")} target="_blank" rel="noopener" onClick={e=>e.stopPropagation()} style={{fontSize:10,fontWeight:600,color:isSelected?"#fff":"#15803d",background:isSelected?"rgba(255,255,255,0.15)":"#dcfce7",padding:"3px 8px",borderRadius:6,textDecoration:"none"}}>📱 WA</a>}
                {datosCatalogo.telefono&&<a href={"tel:"+datosCatalogo.telefono} onClick={e=>e.stopPropagation()} style={{fontSize:10,fontWeight:600,color:isSelected?"#fff":B.navy,background:isSelected?"rgba(255,255,255,0.15)":B.blueL,padding:"3px 8px",borderRadius:6,textDecoration:"none"}}>📞 Call</a>}
                {datosCatalogo.email&&<a href={"mailto:"+datosCatalogo.email} onClick={e=>e.stopPropagation()} style={{fontSize:10,fontWeight:600,color:isSelected?"#fff":B.grey4,background:isSelected?"rgba(255,255,255,0.15)":B.offW,padding:"3px 8px",borderRadius:6,textDecoration:"none"}}>✉ Email</a>}
              </div>
            )}
            {/* Stats */}
            <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
              <span style={{fontSize:10,fontWeight:700,color:isSelected?"#fff":B.grey4,background:isSelected?"rgba(255,255,255,0.1)":B.grey1,borderRadius:6,padding:"2px 7px"}}>{lotes.length} lote{lotes.length!==1?"s":""}</span>
              {enPipeline>0&&<span style={{fontSize:10,fontWeight:700,color:isSelected?B.gold:"#d97706",background:isSelected?"rgba(255,255,255,0.1)":"#fef3c7",borderRadius:6,padding:"2px 7px"}}>{enPipeline} activo{enPipeline!==1?"s":""}</span>}
              {cierres>0&&<span style={{fontSize:10,fontWeight:700,color:isSelected?"#4ade80":"#15803d",background:isSelected?"rgba(255,255,255,0.1)":"#dcfce7",borderRadius:6,padding:"2px 7px"}}>🏆 {cierres}</span>}
              {frios>0&&<span style={{fontSize:10,fontWeight:700,color:"#fff",background:"#ef4444",borderRadius:6,padding:"2px 7px"}}>⚠ {frios} frío{frios!==1?"s":""}</span>}
            </div>
            {/* Acciones */}
            <div style={{display:"flex",gap:6,borderTop:"1px solid "+(isSelected?"rgba(255,255,255,0.15)":B.grey1),paddingTop:8,marginTop:2}}>
              {lotes.length>0&&<button onClick={()=>setSelectedAsesorLotes(isSelected?null:nombre)} style={{flex:1,fontSize:10,fontWeight:700,color:isSelected?B.navy:"#fff",background:isSelected?"#fff":B.navy,border:"none",borderRadius:6,padding:"5px 8px",cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>{isSelected?"▲ Cerrar":"▼ Ver lotes"}</button>}
              {datosCatalogo&&<button onClick={()=>openEditAsesor(datosCatalogo)} style={{fontSize:10,fontWeight:700,color:isSelected?"#fff":B.grey4,background:isSelected?"rgba(255,255,255,0.15)":B.offW,border:"1px solid "+(isSelected?"rgba(255,255,255,0.2)":B.grey1),borderRadius:6,padding:"5px 10px",cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>✏</button>}
              {!datosCatalogo&&isDetected&&<button onClick={()=>{setEditingAsesor(null);setAsesorForm({nombre:nombre,zona:"",telefono:"",email:""});setShowAsesorModal(true);}} style={{fontSize:10,fontWeight:700,color:"#b45309",background:"#fef3c7",border:"1px solid #f59e0b66",borderRadius:6,padding:"5px 10px",cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>+ Catálogo</button>}
              {datosCatalogo&&<button onClick={()=>deleteAsesor(datosCatalogo.id)} style={{fontSize:10,fontWeight:700,color:isSelected?"#fca5a5":"#dc2626",background:isSelected?"rgba(255,255,255,0.1)":"#fee2e2",border:"none",borderRadius:6,padding:"5px 10px",cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>🗑</button>}
            </div>
          </div>
        );
      };
      const totalAsesores=asesoresCatalog.length;
      const totalConLotes=asesoresCatalog.filter(a=>asesorMap[a.nombre]&&asesorMap[a.nombre].length>0).length;
      return (
        <div>
          {/* Header catálogo */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:10}}>
            <div>
              <div style={{fontSize:10,fontWeight:700,color:B.grey3,textTransform:"uppercase",letterSpacing:1.5}}>🧑‍💼 Catálogo de Asesores</div>
              <div style={{fontSize:18,fontWeight:800,color:B.navy,fontFamily:"'Playfair Display',serif",marginTop:2}}>{totalAsesores} asesor{totalAsesores!==1?"es":""} registrado{totalAsesores!==1?"s":""} <span style={{fontSize:11,fontWeight:500,color:B.grey3,fontFamily:"'DM Sans',sans-serif"}}>· {totalConLotes} con lotes asignados</span></div>
            </div>
            <button onClick={openNewAsesor} style={{background:B.navy,color:"#fff",border:"none",borderRadius:8,padding:"9px 16px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",display:"inline-flex",alignItems:"center",gap:6}}
              onMouseEnter={e=>e.currentTarget.style.background=B.navyL} onMouseLeave={e=>e.currentTarget.style.background=B.navy}>
              <span style={{fontSize:16,lineHeight:1}}>+</span> Agregar asesor
            </button>
          </div>
          {/* Catálogo de asesores registrados */}
          {asesoresCatalog.length>0&&(
            <div style={{marginBottom:18}}>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:10}}>
                {[...asesoresCatalog].sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(a=>renderAsesorCard(a.nombre,a,false))}
              </div>
              {selectedAsesorLotes&&asesorMap[selectedAsesorLotes]&&renderLotesTable(asesorMap[selectedAsesorLotes],selectedAsesorLotes)}
            </div>
          )}
          {/* Asesores detectados en lotes pero NO en catálogo */}
          {asesoresDetectados.length>0&&(
            <div style={{marginBottom:18}}>
              <div style={{fontSize:11,fontWeight:700,color:"#b45309",textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>⚠ Asesores detectados en lotes pero sin catálogo ({asesoresDetectados.length})</div>
              <div style={{fontSize:10,color:B.grey3,marginBottom:8}}>Agrégalos al catálogo para completar sus datos de contacto.</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:10}}>
                {asesoresDetectados.map(n=>renderAsesorCard(n,null,true))}
              </div>
            </div>
          )}
          {/* Estado vacío */}
          {asesoresCatalog.length===0&&asesoresDetectados.length===0&&(
            <div style={{textAlign:"center",padding:60,color:B.grey3,background:B.white,borderRadius:12,border:"2px dashed "+B.grey1}}>
              <div style={{fontSize:40,marginBottom:12}}>🧑‍💼</div>
              <div style={{fontSize:14,fontWeight:700,color:B.navy,marginBottom:8}}>Sin asesores en el catálogo</div>
              <div style={{fontSize:12,maxWidth:420,margin:"0 auto 16px",lineHeight:1.6}}>Empieza a construir tu equipo comercial. Agrega nombre, zona, teléfono y email de cada asesor para asignarlos a lotes.</div>
              <button onClick={openNewAsesor} style={{background:B.navy,color:"#fff",border:"none",borderRadius:8,padding:"10px 18px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>+ Agregar primer asesor</button>
            </div>
          )}
          {/* Lotes sin asesor asignado */}
          {sinAsesor.length>0&&(
            <div style={{marginTop:16}}>
              <div style={{fontSize:11,fontWeight:700,color:B.grey3,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>
                ⚠ Sin asesor asignado ({sinAsesor.length} lote{sinAsesor.length!==1?"s":""})
                <span style={{fontSize:10,fontWeight:400,color:B.grey3,marginLeft:8,textTransform:"none"}}>— Abre el lote en Kanban para asignar</span>
              </div>
              <div style={{background:"#fffbeb",border:"1px solid #f59e0b",borderRadius:10,padding:"8px 0",overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                  <thead>
                    <tr style={{borderBottom:"1px solid #f59e0b33"}}>
                      {["Terreno","Desarrollo","Precio","Pipeline","Días sin mov."].map((h,i)=>(
                        <th key={i} style={{textAlign:i<2?"left":"center",padding:"5px 10px",fontSize:9,fontWeight:800,color:"#92400e",textTransform:"uppercase",letterSpacing:0.8}}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {[...sinAsesor].sort((a,b)=>(b.diasSinContacto||999)-(a.diasSinContacto||999)).slice(0,20).map((x,i)=>{
                      const mb=movBadgeA(x.diasSinContacto);
                      return (
                        <tr key={i} onClick={()=>{setSelectedLotCRM(x.lot);setActiveTab("kanban");}} style={{borderBottom:"1px solid #f59e0b22",cursor:"pointer"}}
                          onMouseEnter={e=>e.currentTarget.style.background="#fef3c7"}
                          onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                          <td style={{padding:"6px 10px",fontWeight:600,color:B.navy}}>{x.lot.nombre}</td>
                          <td style={{padding:"6px 10px",color:B.grey4}}>{x.lot.desarrollo}</td>
                          <td style={{padding:"6px 10px",textAlign:"center",color:B.navy}}>{fmtM(x.lot.precio_total||0)}</td>
                          <td style={{padding:"6px 10px",textAlign:"center"}}><span style={{padding:"1px 6px",borderRadius:10,fontSize:9,fontWeight:700,background:(PIPELINE_COLORS[x.pipeline]||B.grey3)+"22",color:PIPELINE_COLORS[x.pipeline]||B.grey3}}>{x.pipeline}</span></td>
                          <td style={{padding:"6px 10px",textAlign:"center"}}><span style={{padding:"2px 7px",borderRadius:7,fontSize:10,fontWeight:700,background:mb.bg,color:mb.col}}>{mb.label}</span></td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                {sinAsesor.length>20&&<div style={{textAlign:"center",padding:"6px",fontSize:10,color:"#92400e"}}>...y {sinAsesor.length-20} lotes más sin asesor</div>}
              </div>
            </div>
          )}
        </div>
      );
    };

    // ══════════════════════════════════════════════════════════════
    // VISTA "MI DÍA" — Actividades por vencimiento
    // ══════════════════════════════════════════════════════════════
    const VistaMiDia=()=>{
      // Recolectar todas las actividades pendientes/completadas
      const allActs=[];
      srcInvCRM.forEach(lot=>{
        const crm=crmData[lot.id]||{};
        // Actividades de prospectos (clientes identificados)
        (crm.prospectos||[]).forEach((p,idx)=>{
          (p.actividades||[]).forEach(act=>{
            const urg=getActivityUrgency(act);
            allActs.push({
              act,
              urgencia:urg,
              lot,
              lotId:lot.id,
              prospecto:p,
              prospectoIdx:idx,
              cli:cliSrcCRM.find(c=>c.nombre&&c.nombre.toLowerCase().trim()===p.nombre.toLowerCase().trim()),
              asesor:(crm.asesorResponsable)||(p.asesor)||null,
              isSeguimiento:false
            });
          });
        });
        // Actividades de seguimiento por asesor (sin cliente)
        if(crm.seguimientoAsesor){
          const sa=crm.seguimientoAsesor;
          (sa.actividades||[]).forEach(act=>{
            const urg=getActivityUrgency(act);
            allActs.push({
              act,
              urgencia:urg,
              lot,
              lotId:lot.id,
              prospecto:{nombre:"(Sin cliente aún)",seguimiento:sa},
              prospectoIdx:-1, // sentinela indicando seguimiento
              cli:null,
              asesor:sa.asesor,
              isSeguimiento:true,
              seguimiento:sa
            });
          });
        }
      });
      // Filtrar por asesor si aplica
      const actsFiltrados=filterAsesor==="Todos"?allActs:allActs.filter(a=>{
        const aName=a.asesor||(a.cli&&a.cli.asesor)||null;
        return aName===filterAsesor;
      });
      // Agrupar
      const vencidas=actsFiltrados.filter(a=>a.urgencia.rank===1).sort((a,b)=>new Date(a.act.fecha)-new Date(b.act.fecha));
      const hoy=actsFiltrados.filter(a=>a.urgencia.rank===2);
      const semana=actsFiltrados.filter(a=>a.urgencia.rank===3).sort((a,b)=>new Date(a.act.fecha)-new Date(b.act.fecha));
      const futuras=actsFiltrados.filter(a=>a.urgencia.rank===4).sort((a,b)=>new Date(a.act.fecha)-new Date(b.act.fecha));
      const completadas=actsFiltrados.filter(a=>a.urgencia.rank===5).sort((a,b)=>new Date(b.act.fechaCompletada||b.act.fecha)-new Date(a.act.fechaCompletada||a.act.fecha)).slice(0,20);

      const asesoresUnicos=[...new Set(allActs.map(a=>a.asesor||(a.cli&&a.cli.asesor)).filter(Boolean))].sort();

      const renderActCard=(a)=>{
        const tipo=ACTIVITY_TYPES.find(t=>t.id===a.act.tipo)||ACTIVITY_TYPES[ACTIVITY_TYPES.length-1];
        return (

                <strong style={{color:B.navy}}>{a.prospecto.nombre}</strong> · {a.lot.nombre} · {a.lot.desarrollo}
              </div>
              {a.asesor&&<div style={{fontSize:10,color:"#2563AC",fontWeight:600}}>👤 {a.asesor}</div>}

              {!a.act.completada&&<button onClick={()=>{setShowActivityModal({mode:"edit",lotId:a.lotId,prospectoIdx:a.prospectoIdx,activity:a.act});setActivityForm({tipo:a.act.tipo,descripcion:a.act.descripcion,fecha:a.act.fecha,hora:a.act.hora||""});}} style={{padding:"6px 10px",background:B.offW,color:B.grey4,border:"1px solid "+B.grey1,borderRadius:7,cursor:"pointer",fontSize:11,fontWeight:600,fontFamily:"'DM Sans',sans-serif"}}>✏ Editar</button>}
              <button onClick={()=>{setSelectedLotCRM(a.lot);setActiveTab("kanban");}} style={{padding:"6px 10px",background:B.offW,color:B.grey4,border:"1px solid "+B.grey1,borderRadius:7,cursor:"pointer",fontSize:11,fontWeight:600,fontFamily:"'DM Sans',sans-serif"}}>Ver lote</button>
              <button onClick={()=>deleteActivity(a.lotId,a.prospectoIdx,a.act.id)} style={{padding:"6px 8px",background:"#fee2e2",color:"#dc2626",border:"none",borderRadius:7,cursor:"pointer",fontSize:10,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>🗑</button>
            </div>
          </div>
        );
      };
      const renderSection=(titulo,emoji,acts,colorSection,subtitulo)=>(
        <div style={{marginBottom:22}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,paddingBottom:6,borderBottom:"2px solid "+colorSection}}>
            <div style={{fontSize:14,fontWeight:800,color:colorSection,fontFamily:"'Playfair Display',serif"}}>{emoji} {titulo}</div>
            <span style={{padding:"2px 10px",borderRadius:12,background:colorSection,color:"#fff",fontSize:11,fontWeight:700}}>{acts.length}</span>
            {subtitulo&&<span style={{fontSize:10,color:B.grey3,fontStyle:"italic"}}>{subtitulo}</span>}
          </div>
          {acts.length===0?(

      );

      return (
        <div>
          {/* Header + Filtro asesor */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:18,flexWrap:"wrap",gap:10}}>
            <div>
              <div style={{fontSize:10,fontWeight:700,color:B.grey3,textTransform:"uppercase",letterSpacing:1.5}}>📅 Agenda Comercial</div>
              <div style={{fontSize:20,fontWeight:800,color:B.navy,fontFamily:"'Playfair Display',serif",marginTop:2}}>Mi día</div>
              <div style={{fontSize:11,color:B.grey4,marginTop:3}}>
                <strong style={{color:"#dc2626"}}>{vencidas.length}</strong> vencidas · <strong style={{color:"#d97706"}}>{hoy.length}</strong> hoy · <strong style={{color:"#1e40af"}}>{semana.length}</strong> esta semana · <strong style={{color:"#4b5563"}}>{futuras.length}</strong> futuras

                <option value="Todos">Todos los asesores</option>

          {/* Advertencia si hay prospectos activos SIN actividad pendiente */}
          {(() => {
            const prospSinAct=allProspectos.filter(x=>STAGES_REQUIRING_ACTIVITY.includes(x.pipeline)&&!(x.prospecto.actividades||[]).some(a=>!a.completada));
            if(prospSinAct.length===0) return null;
            return (
              <div style={{background:"#fef3c7",border:"1.5px solid #f59e0b",borderRadius:10,padding:"10px 14px",marginBottom:16,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                <span style={{fontSize:18}}>⚠</span>
                <div style={{flex:1,minWidth:200}}>
                  <div style={{fontSize:12,fontWeight:800,color:"#92400e"}}>{prospSinAct.length} prospecto{prospSinAct.length!==1?"s":""} activo{prospSinAct.length!==1?"s":""} sin actividad pendiente</div>
                  <div style={{fontSize:10,color:"#78350f",marginTop:2}}>Prospectos en Negociación / Propuesta / Contrato deberían tener siempre una acción programada.</div>
                </div>

                  ))}
                  {prospSinAct.length>3&&<span style={{fontSize:10,color:"#78350f",fontWeight:600,padding:"5px 4px"}}>+{prospSinAct.length-3}</span>}
                </div>
              </div>
            );
          })()}

          {allActs.length===0?(
            <div style={{textAlign:"center",padding:60,color:B.grey3,background:B.white,borderRadius:12,border:"2px dashed "+B.grey1}}>
              <div style={{fontSize:40,marginBottom:12}}>📅</div>
              <div style={{fontSize:14,fontWeight:700,color:B.navy,marginBottom:6}}>Sin actividades registradas</div>
              <div style={{fontSize:12,maxWidth:420,margin:"0 auto",lineHeight:1.6}}>Las actividades se crean automáticamente al cambiar la etapa de un prospecto, o manualmente desde cada prospecto.</div>
            </div>
          ):(
            <>
              {vencidas.length>0&&renderSection("Vencidas","🔴",vencidas,"#dc2626","requieren atención inmediata")}
              {hoy.length>0&&renderSection("Hoy","🟡",hoy,"#d97706","")}
              {semana.length>0&&renderSection("Esta semana","🔵",semana,"#1e40af","")}
              {futuras.length>0&&renderSection("Futuras","⚪",futuras,"#6b7280","más allá de 7 días")}
              {completadas.length>0&&renderSection("Completadas recientes","✅",completadas,"#16a34a","últimas 20")}
            </>
          )}
        </div>
      );
    };

    // ══════════════════════════════════════════════════════════════
    // VISTA "📊 BENCHMARK" — Inteligencia competitiva por radio
    // ══════════════════════════════════════════════════════════════
    const VistaBenchmark = () => {
      // Haversine en JS puro (sin API)
      const haversineKm = (la1,lo1,la2,lo2) => {
        const R=6371, dL=(la2-la1)*Math.PI/180, dN=(lo2-lo1)*Math.PI/180;
        const a=Math.sin(dL/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dN/2)**2;
        return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
      };
      // Centroides por desarrollo (avg lat/lng de lotes con coords)
      // Precio/m² y área por desarrollo desde inventario
      const invDataMap = {};
      inventory.forEach(l=>{
        const d=l.desarrollo||"Sin desarrollo";
        if(!invDataMap[d]) invDataMap[d]={pm2s:[],areas:[]};
        if(l.precio_m2>0) invDataMap[d].pm2s.push(l.precio_m2);
        if(l.sup_m2>0) invDataMap[d].areas.push(l.sup_m2);
      });
      // Coordenadas del ancla: SOLO inventario propio
      // Nunca usar archivo de competencia para posicionar nuestros desarrollos
      // (la competencia son competidores, no nuestros lotes)
      const getCoordDesarrollo = (devName) => {
        if(!devName) return null;
        const lats=[],lngs=[];
        inventory.forEach(l=>{
          if((l.desarrollo||"")=== devName && l.lat && l.lng) { lats.push(l.lat); lngs.push(l.lng); }
        });
        if(lats.length>0) return {
          lat:lats.reduce((a,b)=>a+b,0)/lats.length,
          lng:lngs.reduce((a,b)=>a+b,0)/lngs.length,
          fuente:"inventario"
        };
        return null; // sin coordenadas en inventario → no aparece como ancla
      };
      const todosDesarrollos = [...new Set(inventory.map(l=>l.desarrollo).filter(Boolean))].sort();
      const desarrollosConCoords = todosDesarrollos.map(nombre=>{
        const coords = getCoordDesarrollo(nombre);
        if(!coords) return null;
        const d = invDataMap[nombre]||{pm2s:[],areas:[]};
        return {
          nombre,
          lat: coords.lat,
          lng: coords.lng,
          pm2_ancla: d.pm2s.length>0 ? d.pm2s.reduce((a,b)=>a+b,0)/d.pm2s.length : 0,
          nLotes: (invDataMap[nombre]?.pm2s||[]).length,
          fuente: coords.fuente
        };
      }).filter(Boolean);
      // Selección de ancla — se sincroniza con el filtro de desarrollo activo
      const anclaKeyFromFilter = filterDesarrolloGlobal!=="Todos"
        ? desarrollosConCoords.find(d=>d.nombre===filterDesarrolloGlobal)?.nombre||""
        : "";
      const anclaKey = benchDesarrolloAncla || anclaKeyFromFilter || (desarrollosConCoords[0]?.nombre||"");
      const ancla = desarrollosConCoords.find(d=>d.nombre===anclaKey) || desarrollosConCoords[0];
      // Competidores filtrados por radio y tipo — excluye el desarrollo ancla
      const anclaNameNorm = (ancla?.nombre||"").toLowerCase().trim();
      const competidoresEnRadio = !ancla ? [] : competencia
        .filter(c => c.lat && c.lng && benchTipos.includes(c.tipo))
        .filter(c => c.nombre.toLowerCase().trim() !== anclaNameNorm) // excluir propio desarrollo
        .map(c => ({...c, distancia: haversineKm(ancla.lat,ancla.lng,c.lat,c.lng)}))
        .filter(c => c.distancia <= benchRadio)
        .filter(c => benchFiltroDesarrollador==="Todos" || (c.desarrollador||"—")===benchFiltroDesarrollador)
        .filter(c => !benchFiltroNombre.trim() || (c.nombre||"").toLowerCase().includes(benchFiltroNombre.trim().toLowerCase()))
        .sort((a,b)=>a.distancia-b.distancia);
      // KPIs
      const conPrecio = competidoresEnRadio.filter(c=>(c.pm2_lote||c.pm2_dpto||c.pm2_casa)>0);
      const getPm2=(c)=>c.pm2_lote||c.pm2_dpto||c.pm2_casa||0;
      const getPm2Tipo=(c)=>c.pm2_lote?"lote":c.pm2_dpto?"depto":c.pm2_casa?"casa":"—";
      const preciosPM2 = conPrecio.map(c=>getPm2(c));
      const promMercado = preciosPM2.length>0 ? preciosPM2.reduce((a,b)=>a+b,0)/preciosPM2.length : 0;
      const minMercado = preciosPM2.length>0 ? Math.min(...preciosPM2) : 0;
      const maxMercado = preciosPM2.length>0 ? Math.max(...preciosPM2) : 0;
      const pm2Ancla = ancla?.pm2_ancla||0;
      const masBaratos = conPrecio.filter(c=>getPm2(c)<pm2Ancla).length;
      const percentil = conPrecio.length>0 ? Math.round(masBaratos/conPrecio.length*100) : null;
      const areasProm = competidoresEnRadio.filter(c=>c.area_lote>0).map(c=>c.area_lote);
      const areaMercado = areasProm.length>0 ? areasProm.reduce((a,b)=>a+b,0)/areasProm.length : 0;
      const areaAncla = inventory.filter(l=>(l.desarrollo||"")===(ancla?.nombre||"")&&l.sup_m2>0).map(l=>l.sup_m2);
      const areaAnclaAvg = areaAncla.length>0 ? areaAncla.reduce((a,b)=>a+b,0)/areaAncla.length : 0;
      const ventajaArea = areaMercado>0&&areaAnclaAvg>0 ? Math.round((areaAnclaAvg/areaMercado-1)*100) : null;
      // Badge vs ancla
      const vsBadge = (pm2) => {
        if(!pm2||!pm2Ancla) return {label:"—",bg:"#f3f4f6",col:"#9ca3af"};
        const d=(pm2-pm2Ancla)/pm2Ancla;
        if(d<-0.05) return {label:"más barato",bg:"#dcfce7",col:"#16a34a"};
        if(d>0.05)  return {label:"más caro",  bg:"#fee2e2",col:"#dc2626"};
        return {label:"similar",bg:"#fef9c3",col:"#854d0e"};
      };
      // Sorting de tabla
      const doSort = (col) => {
        if(benchSortCol===col){ setBenchSortDir(d=>d==="asc"?"desc":"asc"); }
        else{ setBenchSortCol(col); setBenchSortDir("asc"); }
      };
      const sortIcon = (col) => benchSortCol===col ? (benchSortDir==="asc"?" ↑":" ↓") : " ↕";
      const sorted = [...competidoresEnRadio].sort((a,b)=>{
        const va = a[benchSortCol]??("distancia"===benchSortCol?9999:benchSortCol==="pm2_lote"?-1:0);
        const vb = b[benchSortCol]??("distancia"===benchSortCol?9999:benchSortCol==="pm2_lote"?-1:0);
        return benchSortDir==="asc" ? (va||0)-(vb||0) : (vb||0)-(va||0);
      });
      // Histograma (rangos precio/m²)
      const ranges=[[0,5000],[5000,10000],[10000,15000],[15000,20000],[20000,99999]];
      const histLabels=["$0–5k","$5–10k","$10–15k","$15–20k","$20k+"];
      const histCounts=ranges.map(([mn,mx])=>conPrecio.filter(c=>getPm2(c)>=mn&&getPm2(c)<mx).length);
      const histMax=Math.max(...histCounts,1);
      const pm2AnclaRange=ranges.findIndex(([mn,mx])=>pm2Ancla>=mn&&pm2Ancla<mx);
      // Sub-helpers de UI
      const kpi=(label,val,sub,col)=>(
        <div style={{background:B.white,borderRadius:12,padding:"16px 18px",borderLeft:`4px solid ${col||B.gold}`,boxShadow:"0 2px 8px rgba(0,43,73,0.06)"}}>
          <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:1.2,color:B.grey3,marginBottom:4}}>{label}</div>
          <div style={{fontSize:22,fontWeight:800,color:B.navy,lineHeight:1.1}}>{val}</div>
          {sub&&<div style={{fontSize:11,color:B.grey4,marginTop:3}}>{sub}</div>}
        </div>
      );
      const thStyle = {padding:"8px 10px",fontSize:10,fontWeight:700,color:B.grey3,textTransform:"uppercase",letterSpacing:0.7,cursor:"pointer",userSelect:"none",whiteSpace:"nowrap"};
      const tdStyle = {padding:"8px 10px",fontSize:12,borderBottom:`1px solid ${B.grey1}`};
      // Sin datos de competencia
      if(competencia.length===0) return (
        <div style={{padding:"48px 20px",textAlign:"center"}}>
          <div style={{fontSize:48,marginBottom:16}}>📊</div>
          <div style={{fontSize:20,fontWeight:800,color:B.navy,marginBottom:8}}>Sin datos de competencia</div>
          <div style={{fontSize:14,color:B.grey3,marginBottom:24}}>Carga el archivo Excel de mercado desde el botón "📥 Competencia" en la barra superior.</div>
          <div style={{background:"#fef3c7",borderRadius:12,padding:"16px 20px",maxWidth:480,margin:"0 auto",fontSize:13,color:"#92400e",textAlign:"left"}}>
            <b>Formato esperado:</b> Excel con columnas desarrollo, desarrollador, lat, long, big_zone, dev_type, total_units, price_m2_avg_lot, area_total_avg_lot, etc. (corte GDL–Chapala).
          </div>
        </div>
      );
      return (
        <div style={{width:"100%"}}>
          {/* ── FILTROS ── */}
          <div style={{background:B.white,borderRadius:14,padding:"16px 20px",marginBottom:18,boxShadow:"0 2px 8px rgba(0,43,73,0.06)",display:"flex",gap:14,flexWrap:"wrap",alignItems:"flex-end",border:`1px solid ${B.grey1}`}}>
            <div>
              <div style={{fontSize:10,fontWeight:700,color:B.grey3,textTransform:"uppercase",letterSpacing:1,marginBottom:5}}>Desarrollo ancla</div>
              <select value={anclaKey} onChange={e=>setBenchDesarrolloAncla(e.target.value)} style={{...s.select,minWidth:200}}>
                {todosDesarrollos.map(d=>{
                  const tieneCoords=desarrollosConCoords.some(x=>x.nombre===d);
                  const fuente=desarrollosConCoords.find(x=>x.nombre===d)?.fuente;
                  return <option key={d} value={d} disabled={!tieneCoords}>{d}{!tieneCoords?" (sin coordenadas)":fuente==="competencia"?" ✓":""}</option>;
                })}
              </select>
            </div>
            <div>
              <div style={{fontSize:10,fontWeight:700,color:B.grey3,textTransform:"uppercase",letterSpacing:1,marginBottom:5}}>Radio</div>
              <div style={{display:"flex",gap:4}}>
                {[3,5,10,15,20].map(r=>(
                  <button key={r} onClick={()=>setBenchRadio(r)} style={{padding:"7px 16px",borderRadius:8,border:"none",cursor:"pointer",fontWeight:700,fontSize:12,fontFamily:"'DM Sans',sans-serif",background:benchRadio===r?B.gold:"transparent",color:benchRadio===r?B.navy:B.grey4,outline:`1px solid ${benchRadio===r?B.gold:B.grey1}`,transition:"all 0.15s"}}>{r} km</button>
                ))}
              </div>
            </div>
            <div>
              <div style={{fontSize:10,fontWeight:700,color:B.grey3,textTransform:"uppercase",letterSpacing:1,marginBottom:5}}>Tipo de desarrollo</div>
              <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                {["horizontal","mixto","vertical","vertical rentas"].map(t=>{
                  const active=benchTipos.includes(t);
                  return <button key={t} onClick={()=>setBenchTipos(prev=>prev.includes(t)?prev.filter(x=>x!==t):[...prev,t])} style={{padding:"5px 11px",borderRadius:8,border:"none",cursor:"pointer",fontWeight:700,fontSize:11,fontFamily:"'DM Sans',sans-serif",background:active?B.navy:B.offW,color:active?"#fff":B.grey4,outline:`1px solid ${active?B.navy:B.grey1}`,transition:"all 0.15s"}}>{t.charAt(0).toUpperCase()+t.slice(1)}</button>;
                })}
              </div>
            </div>
            <div style={{marginLeft:"auto",fontSize:12,color:B.grey3,alignSelf:"center",textAlign:"right"}}>
              <b style={{color:B.navy,fontSize:18}}>{competidoresEnRadio.length}</b> competidores<br/>
              <span style={{fontSize:10}}>en {benchRadio} km desde {anclaKey.split(" ")[0]||"ancla"}</span>
            </div>
          </div>
          {/* ── FILA 2: Filtros de desarrollador + nombre ── */}
          <div style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:16,paddingTop:12,borderTop:"1px solid "+B.grey1,alignItems:"flex-end"}}>
            <div style={{flex:1,minWidth:180}}>
              <div style={{fontSize:10,fontWeight:700,color:B.grey3,textTransform:"uppercase",letterSpacing:1,marginBottom:5}}>Desarrollador</div>
              <select value={benchFiltroDesarrollador} onChange={e=>setBenchFiltroDesarrollador(e.target.value)}
                style={{width:"100%",padding:"7px 10px",borderRadius:8,border:"1.5px solid "+(benchFiltroDesarrollador!=="Todos"?B.gold:B.grey1),fontSize:12,fontFamily:"'DM Sans',sans-serif",outline:"none",background:B.white,color:B.navy}}>
                <option value="Todos">Todos los desarrolladores</option>
                {[...new Set(competencia.map(c=>c.desarrollador).filter(Boolean))].sort().map(d=>(
                  <option key={d} value={d}>{d}</option>
                ))}
              </select>
            </div>
            <div style={{flex:1,minWidth:180}}>
              <div style={{fontSize:10,fontWeight:700,color:B.grey3,textTransform:"uppercase",letterSpacing:1,marginBottom:5}}>Buscar por nombre</div>
              <input value={benchFiltroNombre} onChange={e=>setBenchFiltroNombre(e.target.value)} placeholder="Ej: Capital Norte..."
                style={{width:"100%",padding:"7px 10px",borderRadius:8,border:"1.5px solid "+(benchFiltroNombre?B.gold:B.grey1),fontSize:12,fontFamily:"'DM Sans',sans-serif",outline:"none",boxSizing:"border-box"}}/>
            </div>
            {(benchFiltroDesarrollador!=="Todos"||benchFiltroNombre)&&(
              <button onClick={()=>{setBenchFiltroDesarrollador("Todos");setBenchFiltroNombre("");}}

    const haversineKmCRM = (la1,lo1,la2,lo2) => {
      const R=6371,dL=(la2-la1)*Math.PI/180,dN=(lo2-lo1)*Math.PI/180;
      const a=Math.sin(dL/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dN/2)**2;
      return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    };
    const iaAnalisisProspecto = async (lot, p, cli, crm) => {

              .filter(c=>c.lat&&c.lng&&getPm2c(c)>0)
              .map(c=>({...c,dist:haversineKmCRM(matchComp.lat,matchComp.lng,c.lat,c.lng),pm2_efectivo:getPm2c(c)}))
              .filter(c=>c.dist<=radio)
              .sort((a,b)=>a.dist-b.dist)
              .slice(0,6);
            // Guardar para el modal
            setAnalisisCompetidores(cercanos);
            setAnalisisAncla({...matchComp, nombre:lot.desarrollo, pm2_ancla:lot.precio_m2||0});
            if(cercanos.length>0){
              const pm2Lot = lot.precio_m2||0;
              compCtx = `\nCOMPETENCIA EN ${radio}km (con precio/m²):\n`+cercanos.map(c=>{
                const vs = pm2Lot>0?(c.pm2_efectivo<pm2Lot*0.95?"más barato":c.pm2_efectivo>pm2Lot*1.05?"más caro":"similar"):"—";

            }

            setAnalisisAncla(null);

          : "  Sin interacciones registradas";
        const prompt = `Eres un estratega comercial inmobiliario de alto nivel. Analiza este caso y responde en español con formato claro.

PROSPECTO: ${p.nombre}${p.empresa||cli?.empresa?" | "+(p.empresa||cli?.empresa):""}
TEMPERATURA: ${cli?.temperatura||"No definida"} | ETAPA: ${p.pipeline||"Prospecto"} | ASESOR: ${cli?.asesor||"—"}
PRESUPUESTO: ${cli?.presupuesto_max?fmtM(cli.presupuesto_max):"No definido"} | PLAZO DE CIERRE: ${cli?.plazo_cierre||"No definido"}
INTERESES: ${(cli?.uso_interes||[]).join(", ")||"—"} | CIUDADES: ${(cli?.ciudad_interes||[]).join(", ")||"—"}

LOTE ASIGNADO: ${lot.nombre} | ${lot.desarrollo} | ${lot.ciudad}
SUPERFICIE: ${lot.sup_m2||"—"}m² | PRECIO/m²: $${lot.precio_m2?lot.precio_m2.toLocaleString("es-MX"):"—"} | TOTAL: ${fmtM(lot.precio_total)}

${compCtx}
ÚLTIMAS INTERACCIONES:
${interCtx}

            <div style={{background:B.white,borderRadius:14,width:"100%",maxWidth:540,boxShadow:"0 20px 60px rgba(0,43,73,0.3)",overflow:"hidden"}}>

        {showConvertModal&&(

            <div style={{background:B.white,borderRadius:14,width:"100%",maxWidth:540,boxShadow:"0 20px 60px rgba(0,43,73,0.3)",overflow:"hidden"}}>
              <div style={{background:"linear-gradient(135deg,#15803d,#22c55e)",padding:"16px 22px"}}>
                <div style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,0.85)",letterSpacing:2,textTransform:"uppercase",marginBottom:3}}>🎉 Convertir a Prospecto Formal</div>

                <input type="text" value={convertForm.nombre} onChange={e=>setConvertForm({...convertForm,nombre:e.target.value})}

  // ─── GENERAR PDF EJECUTIVO ──────────────────────────────────
  const generarPDFEjecutivo = async (modo) => {
    if(typeof window.jspdf === "undefined"){ toast("jsPDF no cargado. Recarga la pagina."); return; }
    setPdfGenerando(true);
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF("p","mm","a4");
      const pageW = doc.internal.pageSize.getWidth();
      const pageH = doc.internal.pageSize.getHeight();
      const margin = 14;
      let Y = margin;
      const navy=[0,43,73], gold=[196,154,34], white=[255,255,255], grey=[100,116,139],
            red=[220,38,38], green=[22,163,74], amber=[217,119,6], lightgrey=[241,245,249];
      const ahora = new Date();
      const mesActual = ahora.getMonth();
      const fmtMoney=(v)=>{if(!v||v===0)return "$0";if(v>=1e9)return "$"+(v/1e9).toFixed(2)+"B";if(v>=1e6)return "$"+(v/1e6).toFixed(1)+"M";if(v>=1e3)return "$"+Math.round(v/1e3)+"k";return "$"+v.toFixed(0);};
      const fechaStr = ahora.toLocaleDateString("es-MX",{year:"numeric",month:"long",day:"numeric"});
      const MESES_ES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
      const ACTIVE_STAGES=["Prospecto","Contactado","En negociacion","Propuesta","Apartado","Contrato"];
      const stageProb={"Prospecto":0.05,"Contactado":0.15,"En negociacion":0.35,"Propuesta":0.55,"Apartado":0.75,"Contrato":0.90,"Vendido":1.00,"Perdido":0.00,"Disponible":0.00};
      const tempColor=(t)=>t==="Caliente"?[220,38,38]:t==="Tibio"?[217,119,6]:t==="Frio"||t==="Frio"?[37,99,235]:[107,114,128];
      const stageColor=(s)=>s==="Contrato"?green:s==="Propuesta"||s==="Apartado"?amber:s==="En negociacion"?[8,145,178]:grey;

      // Datos filtrados
      const srcInvE = inventory.length>0?inventory:SAMPLE_INVENTORY;
      const lotesFiltrados = srcInvE.filter(l=>{
        if(ejecFiltroDesarrollador!=="Todos"&&(l.desarrollador||l.desarrollo)!==ejecFiltroDesarrollador) return false;
        if(ejecFiltroDesarrollo!=="Todos"&&l.desarrollo!==ejecFiltroDesarrollo) return false;
        return true;
      });
      const getLotePipelineLocal=(lotId)=>{
        const e=crmData[lotId]; if(!e) return "Disponible";
        const prospectos=e.prospectos||[];
        if(prospectos.length===0) return e.pipeline||"Disponible";
        let best="Disponible"; let maxOrd=0;
        const ord={"Prospecto":1,"Contactado":2,"En negociacion":3,"Propuesta":4,"Apartado":5,"Contrato":6,"Vendido":7};
        prospectos.forEach(p=>{ if(p&&p.pipeline){ const o=ord[p.pipeline]||0; if(o>maxOrd){maxOrd=o;best=p.pipeline;} } });
        return best;
      };

      // Prospectos activos con detalle completo
      const prospActivos=[];
      lotesFiltrados.forEach(lot=>{
        const crm=crmData[lot.id]; if(!crm||!crm.prospectos) return;
        crm.prospectos.forEach((p,idx)=>{
          if(!p||!p.pipeline) return;
          const pip=p.pipeline;
          if(pip==="Perdido"||pip==="Vendido") return;
          if(ejecFiltroEtapa!=="Todos"&&pip!==ejecFiltroEtapa) return;
          const asesor=p.asesor||crm.asesorResponsable||"Sin asignar";
          if(ejecFiltroAsesor!=="Todos"&&asesor!==ejecFiltroAsesor) return;
          const acts=(p.actividades||[]).filter(a=>!a.completada).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
          const proximaAct=acts[0]||null;
          const actVencida=proximaAct&&new Date(proximaAct.fecha+"T12:00:00")<new Date()?true:false;
          const diasEnPipeline=crm.lastContact?Math.floor((Date.now()-new Date(crm.lastContact).getTime())/864e5):null;
          const interacciones=(crm.interacciones||[]).length;
          prospActivos.push({lot,p,pip,asesor,proximaAct,actVencida,diasEnPipeline,interacciones,
            temperatura:p.temperatura||"Sin definir",nota:p.nota||"",valor:lot.precio_total||0});
        });
      });

      // KPIs de meta
      let metaAnual=0,realYTD=0,metaYTD=0,realUds=0;
      Object.entries(metasData||{}).forEach(([nombre,d])=>{
        if(!d||!d.plan||!d.real) return;
        if(ejecFiltroDesarrollador!=="Todos"&&d.desarrollador!==ejecFiltroDesarrollador) return;
        if(ejecFiltroDesarrollo!=="Todos"&&nombre!==ejecFiltroDesarrollo) return;
        metaAnual+=(d.plan.monto||[]).reduce((a,b)=>a+(b||0),0);
        realYTD+=(d.real.monto||[]).slice(0,mesActual+1).reduce((a,b)=>a+(b||0),0);
        metaYTD+=(d.plan.monto||[]).slice(0,mesActual+1).reduce((a,b)=>a+(b||0),0);
        realUds+=(d.real.uds||[]).slice(0,mesActual+1).reduce((a,b)=>a+(b||0),0);
      });
      const cumplYTD=metaYTD>0?realYTD/metaYTD:0;
      const cumplAnual=metaAnual>0?realYTD/metaAnual:0;
      const status=cumplYTD>=0.95?"ON TRACK":cumplYTD>=0.75?"EN RIESGO":"BEHIND";
      const statusCol=cumplYTD>=0.95?green:cumplYTD>=0.75?amber:red;

      // Pipeline por etapa
      const pipeEtapa={};
      ACTIVE_STAGES.forEach(s=>{ pipeEtapa[s]={count:0,valor:0,ponderado:0}; });
      lotesFiltrados.forEach(lot=>{
        const pip=getLotePipelineLocal(lot.id);
        if(!ACTIVE_STAGES.includes(pip)) return;
        const val=lot.precio_total||0;
        pipeEtapa[pip].count++;
        pipeEtapa[pip].valor+=val;
        pipeEtapa[pip].ponderado+=val*(stageProb[pip]||0);
      });
      const totalBruto=Object.values(pipeEtapa).reduce((a,e)=>a+e.valor,0);
      const totalPonderado=Object.values(pipeEtapa).reduce((a,e)=>a+e.ponderado,0);

      // Forecast 30/60/90
      const hoy=new Date(); hoy.setHours(0,0,0,0);
      const forecast30=prospActivos.filter(p=>{
        if(!p.proximaAct) return false;
        const d=new Date(p.proximaAct.fecha+"T12:00:00");
        return d>=hoy&&Math.floor((d-hoy)/864e5)<=30;
      });

      // ─── HELPERS DE LAYOUT ───
      const checkPage=(needed)=>{ if(Y+needed>pageH-18){doc.addPage();Y=margin+5;} };
      const sectionHeader=(title,color=navy)=>{
        checkPage(16);
        doc.setFillColor(...color);
        doc.rect(margin,Y,pageW-margin*2,8,"F");
        doc.setTextColor(...white);
        doc.setFont("helvetica","bold");
        doc.setFontSize(9);
        doc.text(title,margin+3,Y+5.5);
        Y+=12;
        doc.setTextColor(0,0,0);
      };
      const addFooter=()=>{
        const total=doc.internal.getNumberOfPages();
        for(let i=1;i<=total;i++){
          doc.setPage(i);
          doc.setDrawColor(...gold); doc.setLineWidth(0.3);
          doc.line(margin,pageH-12,pageW-margin,pageH-12);
          doc.setFont("helvetica","normal"); doc.setFontSize(7); doc.setTextColor(...grey);
          doc.text("MacroPro  |  Grupo Guia",margin,pageH-7);
          doc.text(modo==="ceo"?"CONFIDENCIAL - Uso interno":"Reporte Ejecutivo",pageW/2,pageH-7,{align:"center"});
          doc.text("Pagina "+i+" de "+total,pageW-margin,pageH-7,{align:"right"});
        }
      };

      // ══════════════════════════════════════════
      // PORTADA
      // ══════════════════════════════════════════
      doc.setFillColor(...navy); doc.rect(0,0,pageW,52,"F");
      doc.setFillColor(...gold); doc.rect(0,52,pageW,2,"F");
      doc.setTextColor(...white); doc.setFont("helvetica","bold"); doc.setFontSize(26);
      doc.text("MacroPro",margin,24);
      doc.setFontSize(10); doc.setFont("helvetica","normal");
      doc.text("by Grupo Guia",margin,31);
      doc.setFontSize(9); doc.setTextColor(...gold);
      doc.text(modo==="ceo"?"REPORTE EJECUTIVO INTERNO  |  CEO":"REPORTE EJECUTIVO  |  CLIENTE",pageW-margin,24,{align:"right"});
      doc.setTextColor(...white); doc.setFontSize(8);
      doc.text(fechaStr,pageW-margin,31,{align:"right"});
      Y=66;
      doc.setTextColor(...navy); doc.setFont("helvetica","bold"); doc.setFontSize(19);
      doc.text("Vista Ejecutiva",margin,Y); Y+=7;
      doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...grey);
      const alcance=[ejecFiltroDesarrollador!=="Todos"?"Desarrollador: "+ejecFiltroDesarrollador:null,ejecFiltroDesarrollo!=="Todos"?"Desarrollo: "+ejecFiltroDesarrollo:null,ejecFiltroAsesor!=="Todos"?"Asesor: "+ejecFiltroAsesor:null].filter(Boolean).join("  |  ")||"Todos los desarrollos";
      doc.text("Alcance: "+alcance,margin,Y); Y+=9;

      // ── HERO KPIs ──
      doc.setFillColor(...navy); doc.roundedRect(margin,Y,pageW-margin*2,48,3,3,"F");
      doc.setTextColor(...gold); doc.setFont("helvetica","bold"); doc.setFontSize(8);
      doc.text("CIERRE "+ahora.getFullYear(),margin+5,Y+8);
      doc.setTextColor(...white); doc.setFontSize(20);
      doc.text(fmtMoney(realYTD),margin+5,Y+21);
      doc.setFontSize(9); doc.setFont("helvetica","normal");
      doc.text("de "+fmtMoney(metaAnual)+" meta anual  ("+Math.round(cumplAnual*100)+"%)",margin+5,Y+28);
      // Mini KPIs
      const kx=margin+85;
      [[{l:"VENDIDO YTD",v:realUds+" uds"},{l:"META YTD",v:Math.round(cumplYTD*100)+"%"}],[{l:"PIPELINE BRUTO",v:fmtMoney(totalBruto)},{l:"PONDERADO",v:fmtMoney(totalPonderado)}]].forEach((row,ri)=>{
        row.forEach((k,ki)=>{
          const kx2=kx+(ki*45);
          doc.setFont("helvetica","normal"); doc.setFontSize(7); doc.setTextColor(160,160,160);
          doc.text(k.l,kx2,Y+8+(ri*20));
          doc.setFont("helvetica","bold"); doc.setFontSize(11);
          const kc=ri===0&&ki===1?(cumplYTD>=0.95?[167,243,208]:cumplYTD>=0.75?[253,230,138]:[254,202,202]):white;
          doc.setTextColor(...kc);
          doc.text(k.v,kx2,Y+14+(ri*20));
        });
      });

    // Forecast 30 días: prospectos en Apartado + Contrato + Propuesta caliente
    const forecast30 = prospectosActivos.filter(p=>{
      return p.pipeline==="Apartado"||p.pipeline==="Contrato"||(p.pipeline==="Propuesta"&&p.temperatura==="Caliente");
    });
    const valorForecast30 = forecast30.reduce((a,p)=>a+p.valor*stageProb[p.pipeline],0);

    // ─── SECCIÓN 5: Top performers ──────────────────────────────────
    const performanceAsesores = {};
    Object.entries(crmData).forEach(([loteId, crm])=>{
      const lot = srcInvE.find(l=>l.id===loteId);
      if(!lot) return;
      if(ejecFiltroDesarrollador!=="Todos"&&(lot.desarrollador||lot.desarrollo)!==ejecFiltroDesarrollador) return;
      if(ejecFiltroDesarrollo!=="Todos"&&lot.desarrollo!==ejecFiltroDesarrollo) return;
      const pip = getLotePipelineLocal(loteId);
      const valor = lot.precio_total||0;
      const asesoresLote = new Set();
      if(crm.asesorResponsable) asesoresLote.add(crm.asesorResponsable);
      (crm.prospectos||[]).forEach(p=>{ if(p.asesor) asesoresLote.add(p.asesor); });
      asesoresLote.forEach(asesor=>{
        if(!performanceAsesores[asesor]) performanceAsesores[asesor] = {asesor, vendido:0, pipeline:0, lotes:0, deals:0};
        performanceAsesores[asesor].lotes++;
        if(pip==="Vendido"){ performanceAsesores[asesor].vendido += valor; performanceAsesores[asesor].deals++; }
        else if(ACTIVE_STAGES_LOCAL.includes(pip)) performanceAsesores[asesor].pipeline += valor;
      });
    });
    const topAsesores = Object.values(performanceAsesores).sort((a,b)=>b.vendido - a.vendido).slice(0,5);

    // Top deals en pipeline
    const topDeals = lotesFiltrados.map(l=>({
      lot:l, valor:l.precio_total||0, pipeline:getLotePipelineLocal(l.id), ponderado:(l.precio_total||0)*stageProb[getLotePipelineLocal(l.id)]
    }))
    .filter(d=>ACTIVE_STAGES_LOCAL.includes(d.pipeline))
    .sort((a,b)=>b.ponderado - a.ponderado)
    .slice(0,5);

    // ─── SECCIÓN 6: Tendencia 12 meses ──────────────────────────────
    const meses12 = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
    const ventasMensuales = new Array(12).fill(0);
    const planMensual = new Array(12).fill(0);
    Object.entries(metasData||{}).forEach(([nombre, d])=>{
      if(!d||!d.real||!d.plan) return;
      if(ejecFiltroDesarrollador!=="Todos" && d.desarrollador!==ejecFiltroDesarrollador) return;
      if(ejecFiltroDesarrollo!=="Todos" && nombre!==ejecFiltroDesarrollo) return;
      (d.real.monto||[]).forEach((v,i)=>{ if(i<12) ventasMensuales[i]+=v||0; });
      (d.plan.monto||[]).forEach((v,i)=>{ if(i<12) planMensual[i]+=v||0; });
    });
    const maxVentaMes = Math.max(...ventasMensuales, ...planMensual, 1);
    const mejorMesIdx = ventasMensuales.indexOf(Math.max(...ventasMensuales.slice(0, mesActual+1)));
    const peorMesIdx = ventasMensuales.slice(0, mesActual+1).reduce((acc,v,i,arr)=>v<arr[acc]?i:acc,0);
    // Tendencia últimos 3 meses (avg)
    const ult3 = mesActual>=2 ? (ventasMensuales[mesActual]+ventasMensuales[mesActual-1]+ventasMensuales[mesActual-2])/3 : 0;
    const prev3 = mesActual>=5 ? (ventasMensuales[mesActual-3]+ventasMensuales[mesActual-4]+ventasMensuales[mesActual-5])/3 : 0;
    const tendenciaPct = prev3>0 ? (ult3-prev3)/prev3 : 0;

    // ─── Limpiar filtros ────────────────────────────────────────────

      setEjecFiltroDesarrollo("Todos");

  const ViewMetas = () => {
    // Desarrolladores: combinación de metas + inventario + oficiales (siempre completos)
    const desarrolladoresMetas = getDesarrolladoresActivos(metasData, inventory);
    // Desarrollos: si hay filtro de desarrollador, solo los suyos (filtro inteligente)
    const desarrollosMetas = (() => {
      if(metasFiltroDesarrollador==="Todos"){
        // Todos los desarrollos conocidos: metas + mapeo + inventario
        const set = new Set(Object.keys(metasData||{}));
        const mapeo = loadMapeoDesarrollador();
        Object.keys(mapeo).forEach(d=>set.add(d));
        if(Array.isArray(inventory)) inventory.forEach(l=>{ if(l&&l.desarrollo) set.add(l.desarrollo); });
        return [...set].sort();
      }
      // Filtro inteligente: solo desarrollos del desarrollador seleccionado
      const list = getDesarrollosPorDesarrollador(metasFiltroDesarrollador, metasData, inventory);
      return list || [];
    })();

    const resumen = calcularMetasResumen(metasData, metasFiltroDesarrollador, metasFiltroDesarrollo);
    const mesActualIdx = new Date().getMonth(); // 0-11
    const mesActualNombre = MESES_LARGO[mesActualIdx];

    // Calcular meta acumulada al mes actual
    let metaAlMesUds=0, metaAlMesMonto=0;
    Object.entries(metasData).forEach(([nombre, d])=>{
      if(metasFiltroDesarrollador!=="Todos"&&d.desarrollador!==metasFiltroDesarrollador) return;
      if(metasFiltroDesarrollo!=="Todos"&&nombre!==metasFiltroDesarrollo) return;
      metaAlMesUds += calcularMetaAlMes(d.plan?.uds||[], mesActualIdx);
      metaAlMesMonto += calcularMetaAlMes(d.plan?.monto||[], mesActualIdx);
    });

    const estatusUds = getEstatusMeta(resumen.cumplUds, resumen.planUdsTotal, resumen.realUdsTotal);
    const estatusMonto = getEstatusMeta(resumen.cumplMonto, resumen.planMontoTotal, resumen.realMontoTotal);

    const limpiarFiltros = () => {
      setMetasFiltroDesarrollador("Todos");
      setMetasFiltroDesarrollo("Todos");
    };

    const resetearMetasASeed = () => {
      if(!window.confirm("⚠ Esto reemplazará TODAS tus metas con los datos originales del Excel. ¿Continuar?")) return;
      const seed = JSON.parse(JSON.stringify(METAS_SEED));
      setMetasData(seed); saveMetas(seed);
      toast("✅ Metas restauradas desde Excel original");
    };

    return (
      <div style={{padding:"20px 24px", maxWidth:1400, margin:"0 auto"}}>
