    };

    // ══════════════════════════════════════════════════════════════
    // KANBAN BOARD — por prospecto individual (no por lote)
    // ══════════════════════════════════════════════════════════════
    // Mueve un prospecto específico a otra etapa del pipeline
    const LOSS_REASONS=["Precio muy alto","Plazo / tiempo de entrega","Competencia (otro lote o vendedor)","Ubicación / zona","Producto no ajustaba (uso/sup/características)","Financiamiento","Cliente ya no disponible","Otro"];
    const [lossModal,setLossModal]=React.useState(null); // {lotId, prospectoIdx, prospectoNombre}
    const [lossForm,setLossForm]=React.useState({motivo:"",nota:""});
    // Preservar scroll position antes de updates (múltiples niveles)
    const preserveScroll=(fn)=>{
      const scrollY=window.scrollY||window.pageYOffset||document.documentElement.scrollTop||0;
      const scrollX=window.scrollX||window.pageXOffset||document.documentElement.scrollLeft||0;
      // Capturar también scroll del elemento activo si está dentro de un contenedor scrolleable
      const active=document.activeElement;
      fn();
      // Restaurar en múltiples frames para superar re-renders de React
      const restore=()=>{window.scrollTo(scrollX,scrollY);};
      requestAnimationFrame(()=>{
        restore();
        requestAnimationFrame(()=>{
          restore();
          setTimeout(restore,50);
        });
      });
    };

    // ═══════════════════════════════════════════════════════════
    // SISTEMA DE ACTIVIDADES (Sprint 2)
    // ═══════════════════════════════════════════════════════════
    const ACTIVITY_TYPES=[
      {id:"Llamada",icon:"📞",color:"#3B82F6"},
      {id:"WhatsApp",icon:"📱",color:"#25d366"},
      {id:"Email",icon:"✉️",color:"#8B5CF6"},
      {id:"Visita al terreno",icon:"🚗",color:"#F59E0B"},
      {id:"Reunión",icon:"🤝",color:"#0EA5E9"},
      {id:"Propuesta",icon:"📋",color:"#EC4899"},
      {id:"Seguimiento",icon:"🔄",color:"#14B8A6"},
      {id:"Otro",icon:"📌",color:"#6B7280"}
    ];
    // Sugerencias automáticas de actividad por etapa
    const AUTO_ACTIVITY_BY_STAGE={
      "Contactado":{tipo:"Email",descripcion:"Enviar ficha técnica",diasHabiles:1},
      "En negociación":{tipo:"Visita al terreno",descripcion:"Agendar visita al terreno",diasHabiles:3},
      "Propuesta":{tipo:"Seguimiento",descripcion:"Dar seguimiento a propuesta",diasHabiles:5},
      "Contrato":{tipo:"Reunión",descripcion:"Revisar firma de contrato",diasHabiles:7}
    };
    const STAGES_REQUIRING_ACTIVITY=["En negociación","Propuesta","Contrato"];
    // Sumar días hábiles (saltando sábado y domingo)
    const addBusinessDays=(baseDate,days)=>{
      const d=new Date(baseDate);
      let added=0;
      while(added<days){
        d.setDate(d.getDate()+1);
        const dow=d.getDay(); // 0=dom, 6=sab
        if(dow!==0&&dow!==6) added++;
      }
      return d.toISOString().slice(0,10);
    };
    // Si cae en fin de semana, mover al lunes siguiente
    const ensureWeekday=(dateStr)=>{
      const d=new Date(dateStr+"T12:00:00");
      const dow=d.getDay();
      if(dow===6) d.setDate(d.getDate()+2); // sáb → lun
      else if(dow===0) d.setDate(d.getDate()+1); // dom → lun
      return d.toISOString().slice(0,10);
    };
    // Clasificar urgencia de una actividad
    const getActivityUrgency=(act)=>{
      if(act.completada) return {label:"Completada",color:"#16a34a",bg:"#dcfce7",rank:5,icon:"✅"};
      const hoy=new Date();hoy.setHours(0,0,0,0);
      const fechaAct=new Date(act.fecha+"T12:00:00");
      const diffDias=Math.floor((fechaAct-hoy)/864e5);
      if(diffDias<0) return {label:Math.abs(diffDias)+"d vencida",color:"#fff",bg:"#dc2626",rank:1,icon:"🔴"};
      if(diffDias===0) return {label:"Hoy",color:"#92400e",bg:"#fef3c7",rank:2,icon:"🟡"};
      if(diffDias<=7) return {label:"En "+diffDias+"d",color:"#1e40af",bg:"#dbeafe",rank:3,icon:"🔵"};
      return {label:"En "+diffDias+"d",color:"#4b5563",bg:"#f3f4f6",rank:4,icon:"⚪"};
    };
    // ═══════════════════════════════════════════════════════════
    // SEGUIMIENTO POR ASESOR (sin cliente identificado)
    // ═══════════════════════════════════════════════════════════
    // Asigna o actualiza el seguimiento por asesor de un lote
    const assignSeguimientoAsesor=(lotId,asesorNombre,nota)=>{
      preserveScroll(()=>{
        setCrmData(prev=>{
          const entry=prev[lotId]||{pipeline:"Disponible",interacciones:[],prospectos:[],devFeedback:[]};
          const existing=entry.seguimientoAsesor||{};
          const seguimientoAsesor={
            asesor:asesorNombre,
            pipeline:existing.pipeline||"Prospecto",
            temperatura:existing.temperatura||"Tibio",
            notas:nota!==undefined?nota:(existing.notas||""),
            fechaInicio:existing.fechaInicio||new Date().toISOString().slice(0,10),
            actividades:existing.actividades||[],
            interacciones:existing.interacciones||[]
          };
          const next={...prev,[lotId]:{...entry,seguimientoAsesor}};
          saveCRM(next);
          return next;
        });
      });
      toast("✅ Seguimiento asignado a "+asesorNombre);
    };
    // Actualizar etapa del seguimiento por asesor
    const updateSeguimientoPipeline=(lotId,newStage)=>{
      preserveScroll(()=>{
        setCrmData(prev=>{
          const entry=prev[lotId]||{};
          if(!entry.seguimientoAsesor) return prev;
          const sa={...entry.seguimientoAsesor,pipeline:newStage};
          // Auto-crear actividad si aplica
          const sugerencia=AUTO_ACTIVITY_BY_STAGE[newStage];
          if(sugerencia){
            const acts=[...(sa.actividades||[])];
            const tienePendiente=acts.some(a=>!a.completada);
            if(!tienePendiente){
              acts.push({
                id:"act-"+Date.now()+"-sa-auto",
                tipo:sugerencia.tipo,
                descripcion:sugerencia.descripcion,
                fecha:addBusinessDays(new Date(),sugerencia.diasHabiles),
                hora:"",
                completada:false,
                creadaEn:new Date().toISOString().slice(0,10),
                autoGenerada:true
              });
              sa.actividades=acts;
            }
          }
          const next={...prev,[lotId]:{...entry,seguimientoAsesor:sa}};
          saveCRM(next);
          return next;
        });
      });
    };
    // Crear actividad en seguimiento por asesor
    const createActivitySeguimiento=(lotId,actData)=>{
      preserveScroll(()=>{
        setCrmData(prev=>{
          const entry=prev[lotId]||{};
          if(!entry.seguimientoAsesor) return prev;
          const acts=[...(entry.seguimientoAsesor.actividades||[])];
          acts.push({
            id:"act-"+Date.now()+"-sa-"+Math.floor(Math.random()*1000),
            tipo:actData.tipo||"Seguimiento",
            descripcion:actData.descripcion||"",
            fecha:ensureWeekday(actData.fecha||new Date().toISOString().slice(0,10)),
            hora:actData.hora||"",
            completada:false,
            creadaEn:new Date().toISOString().slice(0,10)
          });
          const sa={...entry.seguimientoAsesor,actividades:acts};
          const next={...prev,[lotId]:{...entry,seguimientoAsesor:sa}};
          saveCRM(next);
          return next;
        });
      });
    };
    // Completar actividad en seguimiento
    const completeActivitySeguimiento=(lotId,actId,resultado,nota)=>{
      preserveScroll(()=>{
        setCrmData(prev=>{
          const entry=prev[lotId]||{};
          if(!entry.seguimientoAsesor) return prev;
          const acts=(entry.seguimientoAsesor.actividades||[]).map(a=>a.id===actId?{...a,completada:true,fechaCompletada:new Date().toISOString().slice(0,10),resultado:resultado||"Positivo",notaResultado:nota||""}:a);
          const sa={...entry.seguimientoAsesor,actividades:acts};
          const next={...prev,[lotId]:{...entry,seguimientoAsesor:sa}};
          saveCRM(next);
          return next;
        });
      });
      toast("✅ Actividad completada");
    };
    // Eliminar seguimiento por asesor
    const deleteSeguimientoAsesor=(lotId)=>{
      if(!window.confirm("¿Eliminar el seguimiento por asesor de este lote? Se perderán las actividades e interacciones asociadas.")) return;
      preserveScroll(()=>{
        setCrmData(prev=>{
          const entry=prev[lotId]||{};
          const copy={...entry};
          delete copy.seguimientoAsesor;
          const next={...prev,[lotId]:copy};
          saveCRM(next);
          return next;
        });
      });
      toast("🗑 Seguimiento eliminado");
    };
    // CONVERTIR seguimiento por asesor en prospecto formal (migra todo)
    const convertSeguimientoToProspecto=(lotId,clienteNombre,clienteEmpresa,clienteTel,clienteEmail)=>{
      if(!clienteNombre||!clienteNombre.trim()){toast("⚠ Nombre del cliente requerido");return;}
      preserveScroll(()=>{
        setCrmData(prev=>{
          const entry=prev[lotId]||{};
          const sa=entry.seguimientoAsesor;
          if(!sa){toast("⚠ Este lote no tiene seguimiento activo");return prev;}
          const prospectos=[...(entry.prospectos||[])];
          // Crear nuevo prospecto heredando todo del seguimiento
          prospectos.push({
            nombre:clienteNombre.trim(),
            empresa:clienteEmpresa||"",
            telefono:clienteTel||"",
            email:clienteEmail||"",
            asesor:sa.asesor,
            pipeline:sa.pipeline,
            temperatura:sa.temperatura,
            nota:sa.notas?sa.notas+" (convertido desde seguimiento)":"Convertido desde seguimiento por asesor el "+new Date().toLocaleDateString("es-MX"),
            actividades:sa.actividades||[],
            fechaInicio:sa.fechaInicio
          });
          // Mezclar interacciones (las del seguimiento van al log del lote)
          const interacciones=[...(entry.interacciones||[]),...(sa.interacciones||[])];
          const copy={...entry,prospectos,interacciones};
          delete copy.seguimientoAsesor;
          // Actualizar pipeline del lote si hace falta
          const stageOrder={"Prospecto":1,"Contactado":2,"En negociación":3,"Propuesta":4,"Contrato":5,"Cierre":6,"Perdido":0,"Disponible":0};
          const lotePipeline=prospectos.reduce((max,p)=>{
            const ord=stageOrder[p.pipeline]||0;
            return ord>stageOrder[max]?p.pipeline:max;
          },"Disponible");
          copy.pipeline=lotePipeline;
          const next={...prev,[lotId]:copy};
          saveCRM(next);
          return next;
        });
      });
      toast("🎉 Convertido a prospecto formal: "+clienteNombre);
    };
    // Crear actividad
    const createActivity=(lotId,prospectoIdx,actData)=>{
      preserveScroll(()=>{
        setCrmData(prev=>{
          const entry=prev[lotId]||{pipeline:"Disponible",interacciones:[],prospectos:[],devFeedback:[]};
          const prospectos=[...(entry.prospectos||[])];
          if(prospectos[prospectoIdx]){
            const p={...prospectos[prospectoIdx]};
            const actividades=[...(p.actividades||[])];
            actividades.push({
              id:"act-"+Date.now()+"-"+Math.floor(Math.random()*1000),
              tipo:actData.tipo||"Seguimiento",
              descripcion:actData.descripcion||"",
              fecha:ensureWeekday(actData.fecha||new Date().toISOString().slice(0,10)),
              hora:actData.hora||"",
              completada:false,
              creadaEn:new Date().toISOString().slice(0,10)
            });
            p.actividades=actividades;
            prospectos[prospectoIdx]=p;
          }
          const next={...prev,[lotId]:{...entry,prospectos}};
          saveCRM(next);
          return next;
        });
      });
    };
    // Completar actividad
    const completeActivity=(lotId,prospectoIdx,actId,resultado,nota)=>{
      preserveScroll(()=>{
        setCrmData(prev=>{
          const entry=prev[lotId]||{pipeline:"Disponible",interacciones:[],prospectos:[],devFeedback:[]};
          const prospectos=[...(entry.prospectos||[])];
          if(prospectos[prospectoIdx]){
            const p={...prospectos[prospectoIdx]};
            p.actividades=(p.actividades||[]).map(a=>a.id===actId?{...a,completada:true,fechaCompletada:new Date().toISOString().slice(0,10),resultado:resultado||"Positivo",notaResultado:nota||""}:a);
            prospectos[prospectoIdx]=p;
          }
          const next={...prev,[lotId]:{...entry,prospectos,lastContact:new Date().toISOString().slice(0,10)}};
          saveCRM(next);
          return next;
        });
      });
      toast("✅ Actividad completada");
    };
    // Eliminar actividad
    const deleteActivity=(lotId,prospectoIdx,actId)=>{
      if(!window.confirm("¿Eliminar esta actividad?")) return;
      preserveScroll(()=>{
        setCrmData(prev=>{
          const entry=prev[lotId]||{pipeline:"Disponible",interacciones:[],prospectos:[],devFeedback:[]};
          const prospectos=[...(entry.prospectos||[])];
          if(prospectos[prospectoIdx]){
            const p={...prospectos[prospectoIdx]};
            p.actividades=(p.actividades||[]).filter(a=>a.id!==actId);
            prospectos[prospectoIdx]=p;
          }
          const next={...prev,[lotId]:{...entry,prospectos}};
          saveCRM(next);
          return next;
        });
      });
    };
    // Actualizar actividad (editar fecha, hora, descripción)
    const updateActivity=(lotId,prospectoIdx,actId,patch)=>{
      preserveScroll(()=>{
        setCrmData(prev=>{
          const entry=prev[lotId]||{pipeline:"Disponible",interacciones:[],prospectos:[],devFeedback:[]};
          const prospectos=[...(entry.prospectos||[])];
          if(prospectos[prospectoIdx]){
            const p={...prospectos[prospectoIdx]};
            const fixedPatch={...patch};
            if(fixedPatch.fecha) fixedPatch.fecha=ensureWeekday(fixedPatch.fecha);
            p.actividades=(p.actividades||[]).map(a=>a.id===actId?{...a,...fixedPatch}:a);
            prospectos[prospectoIdx]=p;
          }
          const next={...prev,[lotId]:{...entry,prospectos}};
          saveCRM(next);
          return next;
        });
      });
    };
    // Estados de modales de actividad
    const [showActivityModal,setShowActivityModal]=React.useState(null); // {mode:'create'|'edit'|'complete', lotId, prospectoIdx, activity?}
    const [activityForm,setActivityForm]=React.useState({tipo:"Seguimiento",descripcion:"",fecha:"",hora:""});
    const [completeForm,setCompleteForm]=React.useState({resultado:"Positivo",nota:""});
    const updateProspectoPipeline=(lotId,prospectoIdx,newStage)=>{
      // Si se mueve a "Perdido", pedir motivo primero (bloqueante)
      if(newStage==="Perdido"){
        const entry=crmData[lotId]||{};
        const prospectos=entry.prospectos||[];
        const currentStage=prospectos[prospectoIdx]&&prospectos[prospectoIdx].pipeline;
        // Solo abrir modal si NO venía ya de Perdido
        if(currentStage!=="Perdido"){
          setLossModal({
            lotId,
            prospectoIdx,
            prospectoNombre:(prospectos[prospectoIdx]&&prospectos[prospectoIdx].nombre)||"(sin nombre)"
          });
          setLossForm({motivo:"",nota:""});
          return; // No aplicar cambio hasta que confirme en modal
        }
      }
      preserveScroll(()=>{
        setCrmData(prev=>{
          const entry=prev[lotId]||{pipeline:"Disponible",interacciones:[],prospectos:[],devFeedback:[]};
          const prospectos=[...(entry.prospectos||[])];
          if(prospectos[prospectoIdx]){
            const updated={...prospectos[prospectoIdx],pipeline:newStage};
            // Si se mueve de "Perdido" a otra etapa, limpiar motivo
            if(newStage!=="Perdido"){
              delete updated.motivoPerdida;
              delete updated.notaPerdida;
              delete updated.fechaPerdida;
            }
            // AUTO-CREAR actividad sugerida si la etapa la tiene y no hay actividad pendiente
            const sugerencia=AUTO_ACTIVITY_BY_STAGE[newStage];
            if(sugerencia){
              const actividades=[...(updated.actividades||[])];
              const tienePendiente=actividades.some(a=>!a.completada);
              if(!tienePendiente){
                const fechaSugerida=addBusinessDays(new Date(),sugerencia.diasHabiles);
                actividades.push({
                  id:"act-"+Date.now()+"-auto",
                  tipo:sugerencia.tipo,
                  descripcion:sugerencia.descripcion,
                  fecha:fechaSugerida,
                  hora:"",
                  completada:false,
                  creadaEn:new Date().toISOString().slice(0,10),
                  autoGenerada:true
                });
                updated.actividades=actividades;
              }
            }
            prospectos[prospectoIdx]=updated;
          }
          const stageOrder={"Prospecto":1,"Contactado":2,"En negociación":3,"Propuesta":4,"Contrato":5,"Cierre":6,"Perdido":0,"Disponible":0};
          const lotePipeline=prospectos.reduce((max,p)=>{
            const ord=stageOrder[p.pipeline]||0;
            return ord>stageOrder[max]?p.pipeline:max;
          },"Disponible");
          const next={...prev,[lotId]:{...entry,prospectos,pipeline:lotePipeline}};
          saveCRM(next);
          return next;
        });
      });
      // Toast informativo si se creó actividad automática
      if(AUTO_ACTIVITY_BY_STAGE[newStage]){
        const s=AUTO_ACTIVITY_BY_STAGE[newStage];
        toast("✅ Etapa actualizada. Actividad auto-creada: "+s.descripcion+" (en "+s.diasHabiles+"d hábiles)");
      }
    };
    // Confirmación del motivo de pérdida (modal)
    const confirmLossReason=()=>{
      if(!lossForm.motivo){toast("⚠ Elige un motivo de pérdida");return;}
      const {lotId,prospectoIdx}=lossModal;
      preserveScroll(()=>{
        setCrmData(prev=>{
          const entry=prev[lotId]||{pipeline:"Disponible",interacciones:[],prospectos:[],devFeedback:[]};
          const prospectos=[...(entry.prospectos||[])];
          if(prospectos[prospectoIdx]){
            prospectos[prospectoIdx]={
              ...prospectos[prospectoIdx],
              pipeline:"Perdido",
              motivoPerdida:lossForm.motivo,
              notaPerdida:lossForm.nota.trim(),
              fechaPerdida:new Date().toISOString().slice(0,10)
            };
          }
          const stageOrder={"Prospecto":1,"Contactado":2,"En negociación":3,"Propuesta":4,"Contrato":5,"Cierre":6,"Perdido":0,"Disponible":0};
          const lotePipeline=prospectos.reduce((max,p)=>{
            const ord=stageOrder[p.pipeline]||0;
            return ord>stageOrder[max]?p.pipeline:max;
          },"Disponible");
          const next={...prev,[lotId]:{...entry,prospectos,pipeline:lotePipeline}};
          saveCRM(next);
          return next;
        });
      });
      setLossModal(null);
      toast("✅ Marcado como Perdido: "+lossForm.motivo);
    };
    // Cambia la temperatura de un prospecto específico (override por deal)
    const updateProspectoTemperatura=(lotId,prospectoIdx,newTemp)=>{
      preserveScroll(()=>{
        setCrmData(prev=>{
          const entry=prev[lotId]||{pipeline:"Disponible",interacciones:[],prospectos:[],devFeedback:[]};
          const prospectos=[...(entry.prospectos||[])];
          if(prospectos[prospectoIdx]){
            prospectos[prospectoIdx]={...prospectos[prospectoIdx],temperatura:newTemp};
          }
          const next={...prev,[lotId]:{...entry,prospectos}};
          saveCRM(next);
          return next;
        });

    const updateClienteTemperatura=(nombreCliente,newTemp)=>{
      const idx=clients.findIndex(c=>c.nombre&&c.nombre.toLowerCase().trim()===nombreCliente.toLowerCase().trim());
      if(idx<0){toast("⚠ Cliente no está en catálogo para edición global. Usa edición por deal.");return;}
      const next=[...clients];
      next[idx]={...next[idx],temperatura:newTemp};
      setClients(next);
      try{localStorage.setItem("macropro_clients_v1",JSON.stringify(next));}catch(e){}
      toast("🌡 Temperatura de "+nombreCliente+" actualizada globalmente");
    };
    const KanbanBoard=()=>{
      // Aplicar filtro de desarrollo sobre los prospectos
      const prospectosFiltrados=allProspectos.filter(x=>{
        return filterDesarrolloCRM==="Todos"||x.lot.desarrollo===filterDesarrolloCRM;
      });
      // Agregar lotes con seguimientoAsesor (sin cliente) como tarjetas especiales
      const lotesConSeguimiento=[];
      srcInvFiltrado.forEach(lot=>{
        if(filterDesarrolloCRM!=="Todos"&&lot.desarrollo!==filterDesarrolloCRM) return;
        const crm=crmData[lot.id];
        if(crm&&crm.seguimientoAsesor){
          lotesConSeguimiento.push({
            lotId:lot.id,
            lot,
            seguimiento:crm.seguimientoAsesor,
            pipeline:crm.seguimientoAsesor.pipeline,
            isSeguimiento:true
          });
        }
      });
      return (
      <div style={{overflowX:"auto",paddingBottom:8}}>
        <div style={{display:"flex",gap:12,minWidth:1100}}>
          {PIPELINE_STAGES.map(stage=>{
            const col=PIPELINE_COLORS[stage];
            const stageProsps=prospectosFiltrados.filter(x=>x.pipeline===stage);
            const stageSeguimientos=lotesConSeguimiento.filter(x=>x.pipeline===stage);

                  <span style={{background:col,color:"#fff",borderRadius:20,padding:"1px 8px",fontSize:10,fontWeight:700,minWidth:22,textAlign:"center"}}>{totalInColumn}</span>
                </div>
                <div style={{padding:8,maxHeight:600,overflowY:"auto",flex:1}}>
                  {totalInColumn===0&&<div style={{fontSize:10,color:B.grey3,textAlign:"center",padding:"18px 0"}}>Sin prospectos</div>}
                  {/* Tarjetas de Seguimiento por asesor (sin cliente) — van primero */}
                  {stageSeguimientos.map((x,i)=>(
                    <div key={"seg_"+x.lotId+"_"+i} onClick={()=>{setSelectedLotCRM(x.lot);setActiveTab("kanban");}}
                      style={{background:"#eff6ff",borderRadius:10,padding:"10px 11px",marginBottom:8,cursor:"pointer",border:"1.5px dashed #3B82F6",transition:"all 0.15s"}}

                      <div style={{fontSize:9,fontWeight:800,color:"#2563AC",marginBottom:4,textTransform:"uppercase",letterSpacing:0.8}}>🎯 Sin cliente aún</div>

                    return (
                      <div key={x.lotId+"_"+x.prospectoIdx+"_"+i} onClick={()=>{setSelectedLotCRM(x.lot);setActiveTab("kanban");}}

                        {/* Nombre del prospecto */}
                        <div style={{fontSize:12,fontWeight:800,color:B.navy,marginBottom:6,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.nombre||"(Sin nombre)"}</div>
                        {/* Lote + Desarrollo */}
                        <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:3}}>
                          <Semaforo lotId={x.lotId} size={7}/>
                          <span style={{fontSize:10,fontWeight:700,color:B.navy,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{x.lot.nombre}</span>
                        </div>
                        <div style={{fontSize:9,color:B.grey4,marginBottom:5}}>{x.lot.desarrollo}</div>
                        {/* Asesor */}
                        {asesor&&<div style={{fontSize:9,color:B.grey4,marginBottom:3,display:"flex",alignItems:"center",gap:4}}>
                          <span style={{opacity:0.6}}>👤</span><span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{asesor}</span>
                        </div>}
                        {/* Temperatura */}
                        {temp&&tCol&&<div style={{fontSize:9,color:tCol,fontWeight:700,marginBottom:4,display:"flex",alignItems:"center",gap:3}}>
                          <span>🌡</span><span>{temp}</span>
                        </div>}
                        {/* Selector de etapa INLINE en la tarjeta del Kanban */}
                        <div onClick={e=>e.stopPropagation()} style={{marginTop:6,marginBottom:4}}>
                          <select value={VALID_STAGES_SET.has(x.pipeline)?x.pipeline:"__legacy__"} onChange={e=>{if(e.target.value!=="__legacy__")updateProspectoPipeline(x.lotId,x.prospectoIdx,e.target.value);}}
                            style={{width:"100%",fontSize:9,fontWeight:700,color:VALID_STAGES_SET.has(x.pipeline)?col:"#dc2626",background:VALID_STAGES_SET.has(x.pipeline)?col+"15":"#fee2e2",border:"1.5px solid "+(VALID_STAGES_SET.has(x.pipeline)?col+"55":"#dc2626"),borderRadius:6,padding:"3px 6px",cursor:"pointer",fontFamily:"'DM Sans',sans-serif",outline:"none"}}>
                            {!VALID_STAGES_SET.has(x.pipeline)&&<option value="__legacy__">⚠ {x.pipeline}</option>}
                            {PIPELINE_STAGES.map(s=><option key={s} value={s}>→ {s}</option>)}
                          </select>
                        </div>
                        {/* Footer: interacciones + días */}
                        <div style={{fontSize:9,color:B.grey3,borderTop:"1px solid "+B.grey1,paddingTop:5,marginTop:2}}>
                          {x.interacciones} interacc.{x.diasSinContacto!==null?" · "+x.diasSinContacto+"d":""}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>
      );
    };

    // ══════════════════════════════════════════════════════════════
    // LISTA + LOT PANEL (derecho)
    // ══════════════════════════════════════════════════════════════
    const ListView=()=>(
      <div>
        {lotsFiltered.length===0&&<div style={{textAlign:"center",padding:40,color:B.grey3,fontSize:13}}>Sin lotes con estos filtros</div>}
        {lotsFiltered.map(l=>{
          const crm=crmData[l.id]||{};
          const lastI=crm.interacciones&&crm.interacciones.length>0?crm.interacciones[crm.interacciones.length-1]:null;
          const days=crm.lastContact?Math.floor((Date.now()-new Date(crm.lastContact).getTime())/864e5):null;
          const sem=getSemaforo(l.id);
          const semCol=semaforoColor[sem];
          const nProsp=(crm.prospectos||[]).length;
          const selected=selectedLotCRM&&selectedLotCRM.id===l.id;
          return (
            <div key={l.id} style={{background:selected?B.navy:B.white,borderRadius:12,padding:"12px 16px",marginBottom:8,boxShadow:"0 2px 8px rgba(0,43,73,0.06)",border:"2px solid "+(selected?B.gold:semCol+"44"),cursor:"pointer",transition:"all 0.15s"}}
              onClick={()=>setSelectedLotCRM(selected?null:l)}
              onMouseEnter={e=>{if(!selected)e.currentTarget.style.borderColor=semCol;}}
              onMouseLeave={e=>{if(!selected)e.currentTarget.style.borderColor=semCol+"44";}}>
              <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
                <div style={{paddingTop:2}}><Semaforo lotId={l.id} size={12}/></div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:2,flexWrap:"wrap"}}>
                    <span style={{fontSize:13,fontWeight:800,color:selected?"#fff":B.navy}}>{l.nombre}</span>
                    <PipelineBadge stage={crm.pipeline||"Disponible"}/>
                  </div>
                  <div style={{fontSize:11,color:selected?B.grey2:B.grey4}}>{l.desarrollo} · {l.ciudad} · {fmtM(l.precio_total||0)}</div>
                  <div style={{display:"flex",gap:12,marginTop:3,flexWrap:"wrap"}}>
                    <span style={{fontSize:10,color:selected?B.grey2:B.grey3}}>🔄 {crm.interacciones?crm.interacciones.length:0} interacc.</span>
                    {nProsp>0&&<span style={{fontSize:10,color:selected?"#93c5fd":"#3B82F6",fontWeight:600}}>👤 {nProsp} prospecto{nProsp!==1?"s":""}</span>}
                    {days!==null&&<span style={{fontSize:10,color:days>30?"#ef4444":selected?B.grey2:B.grey3}}>📅 hace {days}d</span>}
                    {lastI&&<span style={{fontSize:10,color:selected?B.grey2:B.grey4}}>Último: {lastI.canal}</span>}
                  </div>
                </div>
                <button onClick={e=>{e.stopPropagation();setSelectedLotCRM(l);setShowInterModal(true);}} style={{padding:"4px 9px",background:B.gold,color:B.navy,border:"none",borderRadius:6,cursor:"pointer",fontSize:10,fontWeight:700,flexShrink:0}}>+ Acción</button>
              </div>
            </div>
          );
        })}
      </div>
    );

    // ══════════════════════════════════════════════════════════════
    // LOT PANEL (detalle del lote seleccionado - lado derecho en lista)
    // ══════════════════════════════════════════════════════════════
    const LotPanel=()=>{
      if(!selectedLotCRM) return (
        <div style={{background:B.white,borderRadius:14,padding:32,textAlign:"center",color:B.grey3,border:"2px dashed "+B.grey1}}>
          <div style={{fontSize:34,marginBottom:8}}>🏗</div>
          <div style={{fontSize:12,fontWeight:600}}>Selecciona un lote</div>
          <div style={{fontSize:11,marginTop:4}}>para ver su seguimiento</div>
        </div>
      );
      const l=selectedLotCRM;
      const crm=crmData[l.id]||{pipeline:"Disponible",interacciones:[],prospectos:[],devFeedback:[]};
      const sem=getSemaforo(l.id);
      const precioTot=l.precio_total||(l.sup_m2&&l.precio_m2?l.sup_m2*l.precio_m2:0);
      return (
        <div style={{background:B.white,borderRadius:14,overflow:"hidden",boxShadow:"0 4px 20px rgba(0,43,73,0.1)"}}>
          {/* Header */}
          <div style={{background:"linear-gradient(135deg,"+B.navy+","+B.navyL+")",padding:"16px 20px"}}>
            <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:10}}>
              <div>
                <div style={{fontSize:9,fontWeight:700,color:B.gold,letterSpacing:2,textTransform:"uppercase",marginBottom:3}}>{l.desarrollo} · {l.id}</div>
                <div style={{fontSize:17,fontWeight:800,color:"#fff",fontFamily:"'Playfair Display',serif"}}>{l.nombre}</div>
                <div style={{fontSize:11,color:"#93c5fd",marginTop:2}}>{l.ciudad}, {l.estado}</div>
              </div>
              <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:5}}>
                <div style={{display:"flex",alignItems:"center",gap:5}}>
                  <div style={{width:9,height:9,borderRadius:"50%",background:semaforoColor[sem]}}/>
                  <span style={{fontSize:9,color:"#fff",fontWeight:600}}>{semaforoLabel[sem]}</span>
                </div>
                <PipelineBadge stage={crm.pipeline||"Disponible"}/>
              </div>
            </div>
            <div style={{display:"flex",gap:10,marginTop:10}}>
              {[["Sup",l.sup_m2?(l.sup_m2.toLocaleString()+" m²"):"-"],["$/m²",l.precio_m2?"$"+l.precio_m2.toLocaleString():"-"],["Total",precioTot?"$"+(precioTot/1e6).toFixed(1)+"M":"-"]].map(([k,v])=>(
                <div key={k} style={{background:"rgba(255,255,255,0.12)",borderRadius:6,padding:"4px 9px",textAlign:"center"}}>
                  <div style={{fontSize:8,color:"#93c5fd",textTransform:"uppercase"}}>{k}</div>
                  <div style={{fontSize:12,fontWeight:700,color:"#fff"}}>{v}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Etapa del lote (calculada automáticamente por el prospecto más avanzado) */}
          {(() => {
            const loteStage=crm.pipeline||"Disponible";
            const loteCol=PIPELINE_COLORS[loteStage]||B.grey3;
            const nProsp=(crm.prospectos||[]).length;
            return (
              <div style={{padding:"10px 14px",background:B.offW,borderBottom:"1px solid "+B.grey1,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <span style={{fontSize:9,fontWeight:700,color:B.grey4,textTransform:"uppercase",letterSpacing:1}}>Etapa del lote:</span>
                <span style={{padding:"3px 10px",borderRadius:20,background:loteCol+"22",color:loteCol,fontSize:11,fontWeight:800,border:"1.5px solid "+loteCol+"55"}}>{loteStage}</span>
                <span style={{fontSize:9,color:B.grey3,fontStyle:"italic"}}>{nProsp>0?"(calculada automáticamente por el prospecto más avanzado)":"(sin prospectos asignados)"}</span>
              </div>
            );
          })()}

          {/* Contenido scrollable */}
          <div style={{padding:"12px 14px",maxHeight:420,overflowY:"auto"}}>

            {/* Asesor Asignado */}
            <div style={{marginBottom:12,background:B.offW,borderRadius:8,padding:"8px 10px",display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:9,fontWeight:700,color:B.grey3,textTransform:"uppercase",letterSpacing:1,flexShrink:0}}>👤 Asesor:</span>
              <input
                key={l.id+"_asesor"}
                defaultValue={crm.asesorResponsable||l.asesor||""}
                onBlur={e=>updateCRM(l.id,{asesorResponsable:e.target.value.trim()})}
                placeholder="Nombre del asesor responsable..."
                style={{flex:1,border:"none",background:"transparent",fontSize:11,color:B.navy,fontFamily:"'DM Sans',sans-serif",outline:"none",fontWeight:600}}
              />
            </div>

            {/* Notas del lote */}
            <div style={{marginBottom:14}}>
              <div style={{fontSize:10,fontWeight:700,color:B.grey4,marginBottom:5,textTransform:"uppercase",letterSpacing:0.8}}>📝 Notas del lote</div>
              <textarea key={l.id+"_n"} defaultValue={crm.notas||""} onBlur={e=>updateCRM(l.id,{notas:e.target.value})} placeholder="Observaciones, restricciones, puntos clave..." style={{width:"100%",borderRadius:8,border:"1px solid "+B.grey1,padding:"8px 10px",fontSize:11,color:B.navy,fontFamily:"'DM Sans',sans-serif",resize:"none",height:52,outline:"none",boxSizing:"border-box"}}/>
            </div>

            {/* Interacciones */}
            <div style={{marginBottom:14}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7}}>
                <div style={{fontSize:10,fontWeight:700,color:B.grey4,textTransform:"uppercase",letterSpacing:0.8}}>🔄 Seguimiento ({crm.interacciones?crm.interacciones.length:0})</div>
                <button onClick={()=>setShowInterModal(true)} style={{padding:"4px 10px",background:B.gold,color:B.navy,border:"none",borderRadius:7,cursor:"pointer",fontSize:10,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>+ Agregar</button>
              </div>
              {(!crm.interacciones||crm.interacciones.length===0)&&<div style={{fontSize:11,color:B.grey3,padding:"6px 0",fontStyle:"italic"}}>Sin seguimiento registrado</div>}
              {(crm.interacciones||[]).slice().reverse().map((inter,i)=>(
                <div key={i} style={{background:B.offW,borderRadius:8,padding:"8px 10px",marginBottom:5,borderLeft:"3px solid "+B.gold}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:2}}>
                    <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                      <span style={{fontSize:10,fontWeight:700,color:B.navy}}>{inter.canal}</span>
                      <span style={{padding:"1px 6px",borderRadius:10,fontSize:9,fontWeight:700,background:inter.reaccion==="Muy interesado"?"#dcfce7":inter.reaccion==="Interesado"?"#dbeafe":"#fef9c3",color:inter.reaccion==="Muy interesado"?"#16a34a":inter.reaccion==="Interesado"?"#2563eb":"#d97706"}}>{inter.reaccion}</span>
                      {inter.contacto&&<span style={{fontSize:9,color:B.grey3}}>con {inter.contacto}</span>}
                    </div>
                    <span style={{fontSize:9,color:B.grey3}}>{inter.fecha}</span>
                  </div>
                  {inter.nota&&<div style={{fontSize:11,color:B.grey4}}>{inter.nota}</div>}
                </div>
              ))}
            </div>

            {/* Seguimiento por Asesor (sin cliente identificado aún) */}
            {(() => {
              const sa=crm.seguimientoAsesor;
              return (
                <div style={{marginBottom:14,background:sa?"#eff6ff":B.offW,borderRadius:10,padding:"10px 12px",border:"1.5px solid "+(sa?"#3B82F6":B.grey1)}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:sa?8:0,flexWrap:"wrap",gap:6}}>
                    <div style={{fontSize:10,fontWeight:700,color:sa?"#2563AC":B.grey4,textTransform:"uppercase",letterSpacing:0.8}}>
                      {sa?"🎯 Seguimiento por Asesor (sin cliente)":"🎯 Seguimiento sin cliente"}
                    </div>
                    <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                      {sa&&(
                        <button onClick={()=>{setShowConvertModal({lotId:l.id,lot:l,seguimiento:sa});setConvertForm({nombre:"",empresa:"",telefono:"",email:""});}}
                          style={{padding:"4px 10px",background:"#16a34a",color:"#fff",border:"none",borderRadius:6,cursor:"pointer",fontSize:10,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>🎉 Convertir a prospecto</button>
                      )}
                      <button onClick={()=>{setShowSeguimientoModal({lotId:l.id,lot:l});setSeguimientoForm({asesor:(sa&&sa.asesor)||"",notas:(sa&&sa.notas)||""});}}
                        style={{padding:"4px 10px",background:sa?B.white:"#2563AC",color:sa?"#2563AC":"#fff",border:"1.5px solid #2563AC",borderRadius:6,cursor:"pointer",fontSize:10,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>
                        {sa?"✏ Editar":"+ Asignar asesor"}
                      </button>
                    </div>
                  </div>
                  {!sa&&(
                    <div style={{fontSize:10,color:B.grey3,marginTop:4,fontStyle:"italic"}}>Asigna un asesor responsable cuando aún no tienes nombre del cliente. Cuando aparezca, conviértelo a prospecto formal.</div>
                  )}
                  {sa&&(
                    <>
                      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6,flexWrap:"wrap"}}>
                        <div style={{flex:"1 1 140px",minWidth:120}}>
                          <div style={{fontSize:9,color:B.grey3,textTransform:"uppercase",letterSpacing:0.8,fontWeight:700}}>Asesor</div>
                          <div style={{fontSize:13,fontWeight:800,color:B.navy}}>👤 {sa.asesor}</div>
                        </div>
                        <div>
                          <div style={{fontSize:9,color:B.grey3,textTransform:"uppercase",letterSpacing:0.8,fontWeight:700}}>Etapa</div>
                          <select value={VALID_STAGES_SET.has(sa.pipeline)?sa.pipeline:"__legacy__"} onChange={e=>{if(e.target.value!=="__legacy__")updateSeguimientoPipeline(l.id,e.target.value);}}
                            style={{padding:"3px 8px",borderRadius:6,border:"1.5px solid "+(PIPELINE_COLORS[sa.pipeline]||B.grey3),background:(PIPELINE_COLORS[sa.pipeline]||B.grey3)+"18",color:PIPELINE_COLORS[sa.pipeline]||B.grey3,fontSize:10,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",outline:"none"}}>
                            {PIPELINE_STAGES.map(s=><option key={s} value={s}>{s}</option>)}
                          </select>
                        </div>
                        <div>
                          <div style={{fontSize:9,color:B.grey3,textTransform:"uppercase",letterSpacing:0.8,fontWeight:700}}>Inicio</div>
                          <div style={{fontSize:11,color:B.grey4}}>{sa.fechaInicio}</div>
                        </div>
                      </div>
                      {sa.notas&&<div style={{fontSize:11,color:B.grey4,padding:"6px 8px",background:B.white,borderRadius:6,marginBottom:6,fontStyle:"italic",borderLeft:"2px solid #3B82F6"}}>"{sa.notas}"</div>}
                      {/* Actividades del seguimiento */}
                      <div style={{marginTop:8,paddingTop:8,borderTop:"1px dashed "+B.grey1}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
                          <div style={{fontSize:9,fontWeight:700,color:B.grey4,textTransform:"uppercase",letterSpacing:0.8}}>📅 Actividades del seguimiento ({(sa.actividades||[]).filter(a=>!a.completada).length} pendientes)</div>
                          <button onClick={()=>{
                            const actData={tipo:"Seguimiento",descripcion:"",fecha:addBusinessDays(new Date(),2),hora:""};
                            const descripcion=window.prompt("Descripción de la actividad:","Seguimiento al asesor "+sa.asesor);
                            if(!descripcion) return;
                            createActivitySeguimiento(l.id,{...actData,descripcion});
                            toast("✅ Actividad creada");
                          }} style={{padding:"3px 8px",background:"#3B82F6",color:"#fff",border:"none",borderRadius:5,cursor:"pointer",fontSize:9,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>+ Actividad</button>
                        </div>
                        {(sa.actividades||[]).length===0&&<div style={{fontSize:10,color:B.grey3,fontStyle:"italic"}}>Sin actividades — se crean automáticamente al cambiar etapa</div>}
                        {(sa.actividades||[]).filter(a=>!a.completada).slice(0,3).map(a=>{
                          const urg=getActivityUrgency(a);
                          const tipo=ACTIVITY_TYPES.find(t=>t.id===a.tipo)||ACTIVITY_TYPES[0];
                          return (
                            <div key={a.id} onClick={()=>{const res=window.prompt("Resultado (Positivo/Negativo/Sin respuesta/Reagendada):","Positivo");if(!res) return;const nota=window.prompt("Nota (opcional):","");completeActivitySeguimiento(l.id,a.id,res,nota||"");}}
                              style={{padding:"5px 8px",background:urg.bg,borderRadius:6,marginBottom:4,cursor:"pointer",display:"flex",alignItems:"center",gap:6,borderLeft:"3px solid "+(urg.rank===1?"#dc2626":urg.rank===2?"#d97706":urg.rank===3?"#1e40af":"#6b7280")}}>
                              <span style={{fontSize:12}}>{tipo.icon}</span>
                              <span style={{fontSize:10,fontWeight:700,color:urg.color,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{urg.icon} {urg.label} · {a.descripcion||a.tipo}</span>
                              <span style={{fontSize:9,color:urg.color}}>{a.fecha}</span>
                            </div>
                          );
                        })}
                      </div>
                    </>
                  )}
                </div>
              );
            })()}

            {/* Prospectos con ficha de cliente */}
            <div style={{marginBottom:14}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7}}>
                <div style={{fontSize:10,fontWeight:700,color:B.grey4,textTransform:"uppercase",letterSpacing:0.8}}>👤 Prospectos ({crm.prospectos?crm.prospectos.length:0})</div>
              </div>
              {(!crm.prospectos||crm.prospectos.length===0)&&<div style={{fontSize:11,color:B.grey3,padding:"6px 0",fontStyle:"italic"}}>Sin prospectos — asigna desde el match</div>}
              {(crm.prospectos||[]).map((p,i)=>{
                const cli=cliSrcCRM.find(c=>c.nombre&&c.nombre.toLowerCase().trim()===p.nombre.toLowerCase().trim());
                const pStage=p.pipeline||"Prospecto";
                const pCol=PIPELINE_COLORS[pStage]||B.grey3;
                return (
                  <div key={i} style={{background:B.offW,borderRadius:8,padding:"10px 11px",marginBottom:7,borderLeft:"3px solid "+pCol}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                      <div style={{flex:1}}>
                        <div style={{fontSize:12,fontWeight:700,color:B.navy,marginBottom:4}}>{p.nombre}{p.empresa&&<span style={{fontWeight:400,color:B.grey4}}> · {p.empresa}</span>}</div>
                        {cli&&(
                          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:3,fontSize:10,color:B.grey4,marginBottom:4}}>
                            {cli.asesor&&<div style={{color:"#2563AC",fontWeight:600}}>👤 {cli.asesor}</div>}
                            {cli.temperatura&&<div style={{color:cli.temperatura==="Caliente"?"#dc2626":cli.temperatura==="Frío"?"#2563eb":"#d97706",fontWeight:600}}>{cli.temperatura}</div>}
                            {(cli.telefono||p.telefono)&&<div>📞 {cli.telefono||p.telefono}</div>}
                            {(cli.email||p.email)&&<div>✉ {cli.email||p.email}</div>}
                            {cli.presupuesto_max&&<div>💰 hasta {fmtM(cli.presupuesto_max)}</div>}
                            {cli.plazo_cierre&&<div>📅 {cli.plazo_cierre}</div>}
                          </div>
                        )}
                        {!cli&&(p.telefono||p.email)&&<div style={{fontSize:10,color:B.grey4,marginBottom:4}}>{p.telefono&&"📞 "+p.telefono} {p.email&&"✉ "+p.email}</div>}
                        {p.nota&&<div style={{fontSize:10,color:B.grey3,fontStyle:"italic"}}>{p.nota}</div>}
                      </div>
                      <button onClick={()=>{const prospectos=(crm.prospectos||[]).filter((_,idx)=>idx!==i);updateCRM(l.id,{prospectos});}} style={{background:"#fee2e2",color:"#dc2626",border:"none",borderRadius:5,cursor:"pointer",padding:"2px 7px",fontSize:10,fontWeight:700,flexShrink:0,marginLeft:6}}>✕</button>
                    </div>
                    {/* Selector de etapa INDIVIDUAL por prospecto */}
                    <div style={{marginTop:10,paddingTop:10,borderTop:"1px dashed "+B.grey1,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>

        const fromCRM=crmData[l.id]&&crmData[l.id].asesorResponsable;
        if(fromCRM&&fromCRM.trim()) return fromCRM.trim();
        if(l.asesor&&l.asesor.trim()) return l.asesor.trim();

        const prospectos=crm.prospectos||[];
        for(const p of prospectos){
          const cli=cliSrcCRM.find(c=>c.nombre&&c.nombre.toLowerCase().trim()===p.nombre.toLowerCase().trim());
          if(cli&&cli.asesor) return cli.asesor;

        const dias=crm.lastContact?Math.floor((now3-new Date(crm.lastContact).getTime())/864e5):null;
        const interacciones=(crm.interacciones||[]).length;
        const asesor=getAsesorDeLote(l);

          if(!asesorMap[asesor]) asesorMap[asesor]=[];
          if(!asesorMap[asesor].find(x=>x.lotId===l.id)) asesorMap[asesor].push(entry);
        } else {
          sinAsesor.push(entry);
        }

        return {label:dias+"d ✓",col:"#15803d",bg:"#f0fdf4"};

                      <td style={{padding:"7px 8px",textAlign:"center",color:x.interacciones>0?B.navy:B.grey3}}>{x.interacciones}</td>
                      <td style={{padding:"7px 8px",textAlign:"center",fontSize:10,color:B.grey4}}>{x.cli?x.cli.nombre:x.prospecto?x.prospecto.nombre:"—"}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
      const renderAsesorCard=(nombre,datosCatalogo,isDetected)=>{
        const lotes=asesorMap[nombre]||[];
        const frios=lotes.filter(x=>x.diasSinContacto===null||x.diasSinContacto>60).length;
        const enPipeline=lotes.filter(x=>x.pipeline!=="Disponible"&&x.pipeline!=="Perdido").length;
        const cierres=lotes.filter(x=>x.pipeline==="Cierre").length;
        const isSelected=selectedAsesorLotes===nombre;
        const avatarBg=getAvatarColor(nombre);
        return (
          <div key={nombre} style={{background:isSelected?B.navy:B.white,borderRadius:12,padding:"14px 16px",border:"2px solid "+(isSelected?B.navy:isDetected?"#f59e0b55":B.grey1),transition:"all 0.15s",boxShadow:isSelected?"0 4px 14px rgba(0,43,73,0.2)":"0 1px 4px rgba(0,43,73,0.06)",display:"flex",flexDirection:"column",gap:8}}>
            {/* Avatar + nombre + acciones */}
            <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
              <div style={{width:40,height:40,borderRadius:10,background:avatarBg,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:800,fontSize:14,flexShrink:0}}>{getInitials(nombre)}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:800,color:isSelected?"#fff":B.navy,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{nombre}</div>
                {datosCatalogo&&datosCatalogo.zona&&<div style={{fontSize:10,color:isSelected?"rgba(255,255,255,0.7)":B.grey3,marginTop:1}}>📍 {datosCatalogo.zona}</div>}
                {isDetected&&!datosCatalogo&&<div style={{fontSize:9,color:"#b45309",marginTop:1,fontStyle:"italic"}}>⚠ No está en catálogo</div>}
              </div>
            </div>
            {/* Contacto (si está en catálogo) */}
            {datosCatalogo&&(datosCatalogo.telefono||datosCatalogo.email)&&(
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {datosCatalogo.telefono&&<a href={"https://wa.me/52"+datosCatalogo.telefono.replace(/\D/g,"")} target="_blank" rel="noopener" onClick={e=>e.stopPropagation()} style={{fontSize:10,fontWeight:600,color:isSelected?"#fff":"#15803d",background:isSelected?"rgba(255,255,255,0.15)":"#dcfce7",padding:"3px 8px",borderRadius:6,textDecoration:"none"}}>📱 WA</a>}
                {datosCatalogo.telefono&&<a href={"tel:"+datosCatalogo.telefono} onClick={e=>e.stopPropagation()} style={{fontSize:10,fontWeight:600,color:isSelected?"#fff":B.navy,background:isSelected?"rgba(255,255,255,0.15)":B.blueL,padding:"3px 8px",borderRadius:6,textDecoration:"none"}}>📞 Call</a>}
                {datosCatalogo.email&&<a href={"mailto:"+datosCatalogo.email} onClick={e=>e.stopPropagation()} style={{fontSize:10,fontWeight:600,color:isSelected?"#fff":B.grey4,background:isSelected?"rgba(255,255,255,0.15)":B.offW,padding:"3px 8px",borderRadius:6,textDecoration:"none"}}>✉ Email</a>}
              </div>
            )}
            {/* Stats */}
            <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
              <span style={{fontSize:10,fontWeight:700,color:isSelected?"#fff":B.grey4,background:isSelected?"rgba(255,255,255,0.1)":B.grey1,borderRadius:6,padding:"2px 7px"}}>{lotes.length} lote{lotes.length!==1?"s":""}</span>
              {enPipeline>0&&<span style={{fontSize:10,fontWeight:700,color:isSelected?B.gold:"#d97706",background:isSelected?"rgba(255,255,255,0.1)":"#fef3c7",borderRadius:6,padding:"2px 7px"}}>{enPipeline} activo{enPipeline!==1?"s":""}</span>}
              {cierres>0&&<span style={{fontSize:10,fontWeight:700,color:isSelected?"#4ade80":"#15803d",background:isSelected?"rgba(255,255,255,0.1)":"#dcfce7",borderRadius:6,padding:"2px 7px"}}>🏆 {cierres}</span>}
              {frios>0&&<span style={{fontSize:10,fontWeight:700,color:"#fff",background:"#ef4444",borderRadius:6,padding:"2px 7px"}}>⚠ {frios} frío{frios!==1?"s":""}</span>}
            </div>
            {/* Acciones */}
            <div style={{display:"flex",gap:6,borderTop:"1px solid "+(isSelected?"rgba(255,255,255,0.15)":B.grey1),paddingTop:8,marginTop:2}}>
              {lotes.length>0&&<button onClick={()=>setSelectedAsesorLotes(isSelected?null:nombre)} style={{flex:1,fontSize:10,fontWeight:700,color:isSelected?B.navy:"#fff",background:isSelected?"#fff":B.navy,border:"none",borderRadius:6,padding:"5px 8px",cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>{isSelected?"▲ Cerrar":"▼ Ver lotes"}</button>}
              {datosCatalogo&&<button onClick={()=>openEditAsesor(datosCatalogo)} style={{fontSize:10,fontWeight:700,color:isSelected?"#fff":B.grey4,background:isSelected?"rgba(255,255,255,0.15)":B.offW,border:"1px solid "+(isSelected?"rgba(255,255,255,0.2)":B.grey1),borderRadius:6,padding:"5px 10px",cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>✏</button>}
              {!datosCatalogo&&isDetected&&<button onClick={()=>{setEditingAsesor(null);setAsesorForm({nombre:nombre,zona:"",telefono:"",email:""});setShowAsesorModal(true);}} style={{fontSize:10,fontWeight:700,color:"#b45309",background:"#fef3c7",border:"1px solid #f59e0b66",borderRadius:6,padding:"5px 10px",cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>+ Catálogo</button>}
              {datosCatalogo&&<button onClick={()=>deleteAsesor(datosCatalogo.id)} style={{fontSize:10,fontWeight:700,color:isSelected?"#fca5a5":"#dc2626",background:isSelected?"rgba(255,255,255,0.1)":"#fee2e2",border:"none",borderRadius:6,padding:"5px 10px",cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>🗑</button>}
            </div>
          </div>
        );
      };
      const totalAsesores=asesoresCatalog.length;
      const totalConLotes=asesoresCatalog.filter(a=>asesorMap[a.nombre]&&asesorMap[a.nombre].length>0).length;
      return (
        <div>
          {/* Header catálogo */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:10}}>
            <div>
              <div style={{fontSize:10,fontWeight:700,color:B.grey3,textTransform:"uppercase",letterSpacing:1.5}}>🧑‍💼 Catálogo de Asesores</div>
              <div style={{fontSize:18,fontWeight:800,color:B.navy,fontFamily:"'Playfair Display',serif",marginTop:2}}>{totalAsesores} asesor{totalAsesores!==1?"es":""} registrado{totalAsesores!==1?"s":""} <span style={{fontSize:11,fontWeight:500,color:B.grey3,fontFamily:"'DM Sans',sans-serif"}}>· {totalConLotes} con lotes asignados</span></div>
            </div>
            <button onClick={openNewAsesor} style={{background:B.navy,color:"#fff",border:"none",borderRadius:8,padding:"9px 16px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",display:"inline-flex",alignItems:"center",gap:6}}
              onMouseEnter={e=>e.currentTarget.style.background=B.navyL} onMouseLeave={e=>e.currentTarget.style.background=B.navy}>
              <span style={{fontSize:16,lineHeight:1}}>+</span> Agregar asesor
            </button>
          </div>
          {/* Catálogo de asesores registrados */}
          {asesoresCatalog.length>0&&(
            <div style={{marginBottom:18}}>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:10}}>
                {[...asesoresCatalog].sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(a=>renderAsesorCard(a.nombre,a,false))}
              </div>
              {selectedAsesorLotes&&asesorMap[selectedAsesorLotes]&&renderLotesTable(asesorMap[selectedAsesorLotes],selectedAsesorLotes)}
            </div>
          )}
          {/* Asesores detectados en lotes pero NO en catálogo */}
          {asesoresDetectados.length>0&&(
            <div style={{marginBottom:18}}>
              <div style={{fontSize:11,fontWeight:700,color:"#b45309",textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>⚠ Asesores detectados en lotes pero sin catálogo ({asesoresDetectados.length})</div>
              <div style={{fontSize:10,color:B.grey3,marginBottom:8}}>Agrégalos al catálogo para completar sus datos de contacto.</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:10}}>
                {asesoresDetectados.map(n=>renderAsesorCard(n,null,true))}
              </div>
            </div>
          )}
          {/* Estado vacío */}
          {asesoresCatalog.length===0&&asesoresDetectados.length===0&&(
            <div style={{textAlign:"center",padding:60,color:B.grey3,background:B.white,borderRadius:12,border:"2px dashed "+B.grey1}}>
              <div style={{fontSize:40,marginBottom:12}}>🧑‍💼</div>
              <div style={{fontSize:14,fontWeight:700,color:B.navy,marginBottom:8}}>Sin asesores en el catálogo</div>
              <div style={{fontSize:12,maxWidth:420,margin:"0 auto 16px",lineHeight:1.6}}>Empieza a construir tu equipo comercial. Agrega nombre, zona, teléfono y email de cada asesor para asignarlos a lotes.</div>
              <button onClick={openNewAsesor} style={{background:B.navy,color:"#fff",border:"none",borderRadius:8,padding:"10px 18px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>+ Agregar primer asesor</button>
            </div>
          )}
          {/* Lotes sin asesor asignado */}
          {sinAsesor.length>0&&(
            <div style={{marginTop:16}}>
              <div style={{fontSize:11,fontWeight:700,color:B.grey3,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>
                ⚠ Sin asesor asignado ({sinAsesor.length} lote{sinAsesor.length!==1?"s":""})
                <span style={{fontSize:10,fontWeight:400,color:B.grey3,marginLeft:8,textTransform:"none"}}>— Abre el lote en Kanban para asignar</span>
              </div>
              <div style={{background:"#fffbeb",border:"1px solid #f59e0b",borderRadius:10,padding:"8px 0",overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                  <thead>
                    <tr style={{borderBottom:"1px solid #f59e0b33"}}>
                      {["Terreno","Desarrollo","Precio","Pipeline","Días sin mov."].map((h,i)=>(
                        <th key={i} style={{textAlign:i<2?"left":"center",padding:"5px 10px",fontSize:9,fontWeight:800,color:"#92400e",textTransform:"uppercase",letterSpacing:0.8}}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {[...sinAsesor].sort((a,b)=>(b.diasSinContacto||999)-(a.diasSinContacto||999)).slice(0,20).map((x,i)=>{
                      const mb=movBadgeA(x.diasSinContacto);
                      return (
                        <tr key={i} onClick={()=>{setSelectedLotCRM(x.lot);setActiveTab("kanban");}} style={{borderBottom:"1px solid #f59e0b22",cursor:"pointer"}}
                          onMouseEnter={e=>e.currentTarget.style.background="#fef3c7"}
                          onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                          <td style={{padding:"6px 10px",fontWeight:600,color:B.navy}}>{x.lot.nombre}</td>
                          <td style={{padding:"6px 10px",color:B.grey4}}>{x.lot.desarrollo}</td>
                          <td style={{padding:"6px 10px",textAlign:"center",color:B.navy}}>{fmtM(x.lot.precio_total||0)}</td>
                          <td style={{padding:"6px 10px",textAlign:"center"}}><span style={{padding:"1px 6px",borderRadius:10,fontSize:9,fontWeight:700,background:(PIPELINE_COLORS[x.pipeline]||B.grey3)+"22",color:PIPELINE_COLORS[x.pipeline]||B.grey3}}>{x.pipeline}</span></td>
                          <td style={{padding:"6px 10px",textAlign:"center"}}><span style={{padding:"2px 7px",borderRadius:7,fontSize:10,fontWeight:700,background:mb.bg,color:mb.col}}>{mb.label}</span></td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                {sinAsesor.length>20&&<div style={{textAlign:"center",padding:"6px",fontSize:10,color:"#92400e"}}>...y {sinAsesor.length-20} lotes más sin asesor</div>}
              </div>
            </div>
          )}
        </div>
      );
    };

    // ══════════════════════════════════════════════════════════════
    // VISTA "MI DÍA" — Actividades por vencimiento
    // ══════════════════════════════════════════════════════════════
    const VistaMiDia=()=>{
      // Recolectar todas las actividades pendientes/completadas
      const allActs=[];
      srcInvCRM.forEach(lot=>{
        const crm=crmData[lot.id]||{};
        // Actividades de prospectos (clientes identificados)
        (crm.prospectos||[]).forEach((p,idx)=>{
          (p.actividades||[]).forEach(act=>{
            const urg=getActivityUrgency(act);
            allActs.push({
              act,
              urgencia:urg,
              lot,
              lotId:lot.id,
              prospecto:p,
              prospectoIdx:idx,
              cli:cliSrcCRM.find(c=>c.nombre&&c.nombre.toLowerCase().trim()===p.nombre.toLowerCase().trim()),
              asesor:(crm.asesorResponsable)||(p.asesor)||null,
              isSeguimiento:false
            });
          });
        });
        // Actividades de seguimiento por asesor (sin cliente)
        if(crm.seguimientoAsesor){
          const sa=crm.seguimientoAsesor;
          (sa.actividades||[]).forEach(act=>{
            const urg=getActivityUrgency(act);
            allActs.push({
              act,
              urgencia:urg,
              lot,
              lotId:lot.id,
              prospecto:{nombre:"(Sin cliente aún)",seguimiento:sa},
              prospectoIdx:-1, // sentinela indicando seguimiento
              cli:null,
              asesor:sa.asesor,
              isSeguimiento:true,
              seguimiento:sa
            });
          });
        }
      });
      // Filtrar por asesor si aplica
      const actsFiltrados=filterAsesor==="Todos"?allActs:allActs.filter(a=>{
        const aName=a.asesor||(a.cli&&a.cli.asesor)||null;
        return aName===filterAsesor;
      });
      // Agrupar
      const vencidas=actsFiltrados.filter(a=>a.urgencia.rank===1).sort((a,b)=>new Date(a.act.fecha)-new Date(b.act.fecha));
      const hoy=actsFiltrados.filter(a=>a.urgencia.rank===2);
      const semana=actsFiltrados.filter(a=>a.urgencia.rank===3).sort((a,b)=>new Date(a.act.fecha)-new Date(b.act.fecha));
      const futuras=actsFiltrados.filter(a=>a.urgencia.rank===4).sort((a,b)=>new Date(a.act.fecha)-new Date(b.act.fecha));
      const completadas=actsFiltrados.filter(a=>a.urgencia.rank===5).sort((a,b)=>new Date(b.act.fechaCompletada||b.act.fecha)-new Date(a.act.fechaCompletada||a.act.fecha)).slice(0,20);

      const asesoresUnicos=[...new Set(allActs.map(a=>a.asesor||(a.cli&&a.cli.asesor)).filter(Boolean))].sort();

      const renderActCard=(a)=>{
        const tipo=ACTIVITY_TYPES.find(t=>t.id===a.act.tipo)||ACTIVITY_TYPES[ACTIVITY_TYPES.length-1];
        return (
          <div key={a.lotId+"::"+a.prospectoIdx+"::"+a.act.id} style={{background:B.white,borderRadius:10,padding:"12px 14px",marginBottom:8,border:"1px solid "+B.grey1,borderLeft:"4px solid "+a.urgencia.bg,boxShadow:"0 1px 3px rgba(0,43,73,0.05)",display:"flex",gap:12,alignItems:"flex-start",flexWrap:"wrap"}}>
            {/* Icono + Tipo */}
            <div style={{width:44,height:44,borderRadius:10,background:tipo.color+"15",border:"1px solid "+tipo.color+"33",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>{tipo.icon}</div>
            {/* Contenido */}
            <div style={{flex:"1 1 240px",minWidth:200}}>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4,flexWrap:"wrap"}}>
                <span style={{padding:"2px 8px",borderRadius:10,fontSize:10,fontWeight:800,background:a.urgencia.bg,color:a.urgencia.color}}>{a.urgencia.icon} {a.urgencia.label}</span>
                <span style={{fontSize:10,color:B.grey3,fontWeight:600}}>{a.act.fecha}{a.act.hora?" · "+a.act.hora:""}</span>
                {a.act.autoGenerada&&<span style={{fontSize:9,color:B.grey3,fontStyle:"italic"}}>· auto</span>}
              </div>
              <div style={{fontSize:13,fontWeight:800,color:B.navy,marginBottom:3}}>{a.act.descripcion||a.act.tipo}</div>
              <div style={{fontSize:11,color:B.grey4,marginBottom:2}}>
                <strong style={{color:B.navy}}>{a.prospecto.nombre}</strong> · {a.lot.nombre} · {a.lot.desarrollo}
              </div>
              {a.asesor&&<div style={{fontSize:10,color:"#2563AC",fontWeight:600}}>👤 {a.asesor}</div>}
              {a.act.completada&&a.act.resultado&&(
                <div style={{marginTop:6,fontSize:10,color:"#166534"}}>Resultado: <strong>{a.act.resultado}</strong>{a.act.notaResultado&&" — "+a.act.notaResultado}</div>
              )}
            </div>
            {/* Acciones */}
            <div style={{display:"flex",gap:5,flexWrap:"wrap",alignItems:"center"}}>
              {!a.act.completada&&<button onClick={()=>{setShowActivityModal({mode:"complete",lotId:a.lotId,prospectoIdx:a.prospectoIdx,activity:a.act});setCompleteForm({resultado:"Positivo",nota:""});}} style={{padding:"6px 12px",background:"#16a34a",color:"#fff",border:"none",borderRadius:7,cursor:"pointer",fontSize:11,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>✓ Completar</button>}
              {!a.act.completada&&<button onClick={()=>{setShowActivityModal({mode:"edit",lotId:a.lotId,prospectoIdx:a.prospectoIdx,activity:a.act});setActivityForm({tipo:a.act.tipo,descripcion:a.act.descripcion,fecha:a.act.fecha,hora:a.act.hora||""});}} style={{padding:"6px 10px",background:B.offW,color:B.grey4,border:"1px solid "+B.grey1,borderRadius:7,cursor:"pointer",fontSize:11,fontWeight:600,fontFamily:"'DM Sans',sans-serif"}}>✏ Editar</button>}
              <button onClick={()=>{setSelectedLotCRM(a.lot);setActiveTab("kanban");}} style={{padding:"6px 10px",background:B.offW,color:B.grey4,border:"1px solid "+B.grey1,borderRadius:7,cursor:"pointer",fontSize:11,fontWeight:600,fontFamily:"'DM Sans',sans-serif"}}>Ver lote</button>
              <button onClick={()=>deleteActivity(a.lotId,a.prospectoIdx,a.act.id)} style={{padding:"6px 8px",background:"#fee2e2",color:"#dc2626",border:"none",borderRadius:7,cursor:"pointer",fontSize:10,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>🗑</button>
            </div>
          </div>
        );
      };
      const renderSection=(titulo,emoji,acts,colorSection,subtitulo)=>(
        <div style={{marginBottom:22}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,paddingBottom:6,borderBottom:"2px solid "+colorSection}}>
            <div style={{fontSize:14,fontWeight:800,color:colorSection,fontFamily:"'Playfair Display',serif"}}>{emoji} {titulo}</div>
            <span style={{padding:"2px 10px",borderRadius:12,background:colorSection,color:"#fff",fontSize:11,fontWeight:700}}>{acts.length}</span>
            {subtitulo&&<span style={{fontSize:10,color:B.grey3,fontStyle:"italic"}}>{subtitulo}</span>}
          </div>
          {acts.length===0?(
            <div style={{textAlign:"center",padding:24,color:B.grey3,background:B.offW,borderRadius:10,border:"1px dashed "+B.grey1,fontSize:12}}>Sin actividades</div>
          ):acts.map(a=>renderActCard(a))}
        </div>
      );

      return (
        <div>
          {/* Header + Filtro asesor */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:18,flexWrap:"wrap",gap:10}}>
            <div>
              <div style={{fontSize:10,fontWeight:700,color:B.grey3,textTransform:"uppercase",letterSpacing:1.5}}>📅 Agenda Comercial</div>
              <div style={{fontSize:20,fontWeight:800,color:B.navy,fontFamily:"'Playfair Display',serif",marginTop:2}}>Mi día</div>
              <div style={{fontSize:11,color:B.grey4,marginTop:3}}>
                <strong style={{color:"#dc2626"}}>{vencidas.length}</strong> vencidas · <strong style={{color:"#d97706"}}>{hoy.length}</strong> hoy · <strong style={{color:"#1e40af"}}>{semana.length}</strong> esta semana · <strong style={{color:"#4b5563"}}>{futuras.length}</strong> futuras
              </div>
            </div>
            {asesoresUnicos.length>1&&(
              <select value={filterAsesor} onChange={e=>setFilterAsesor(e.target.value)}
                style={{padding:"8px 12px",borderRadius:8,border:"1.5px solid "+B.grey1,fontSize:12,fontFamily:"'DM Sans',sans-serif",fontWeight:600,color:B.navy,background:B.white,cursor:"pointer",outline:"none"}}>
                <option value="Todos">Todos los asesores</option>
                {asesoresUnicos.map(a=><option key={a} value={a}>{a}</option>)}
              </select>
            )}
          </div>

          {/* Advertencia si hay prospectos activos SIN actividad pendiente */}
          {(() => {
            const prospSinAct=allProspectos.filter(x=>STAGES_REQUIRING_ACTIVITY.includes(x.pipeline)&&!(x.prospecto.actividades||[]).some(a=>!a.completada));
            if(prospSinAct.length===0) return null;
            return (
              <div style={{background:"#fef3c7",border:"1.5px solid #f59e0b",borderRadius:10,padding:"10px 14px",marginBottom:16,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                <span style={{fontSize:18}}>⚠</span>
                <div style={{flex:1,minWidth:200}}>
                  <div style={{fontSize:12,fontWeight:800,color:"#92400e"}}>{prospSinAct.length} prospecto{prospSinAct.length!==1?"s":""} activo{prospSinAct.length!==1?"s":""} sin actividad pendiente</div>
                  <div style={{fontSize:10,color:"#78350f",marginTop:2}}>Prospectos en Negociación / Propuesta / Contrato deberían tener siempre una acción programada.</div>
                </div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  {prospSinAct.slice(0,3).map((x,i)=>(
                    <button key={i} onClick={()=>{setShowActivityModal({mode:"create",lotId:x.lotId,prospectoIdx:x.prospectoIdx});setActivityForm({tipo:"Seguimiento",descripcion:"",fecha:addBusinessDays(new Date(),2),hora:""});}} style={{padding:"5px 10px",background:B.white,border:"1.5px solid #f59e0b",borderRadius:7,cursor:"pointer",fontSize:10,fontWeight:700,color:"#92400e",fontFamily:"'DM Sans',sans-serif"}}>+ {x.prospecto.nombre.split(" ")[0]}</button>
                  ))}
                  {prospSinAct.length>3&&<span style={{fontSize:10,color:"#78350f",fontWeight:600,padding:"5px 4px"}}>+{prospSinAct.length-3}</span>}
                </div>
              </div>
            );
          })()}

          {allActs.length===0?(
            <div style={{textAlign:"center",padding:60,color:B.grey3,background:B.white,borderRadius:12,border:"2px dashed "+B.grey1}}>
              <div style={{fontSize:40,marginBottom:12}}>📅</div>
              <div style={{fontSize:14,fontWeight:700,color:B.navy,marginBottom:6}}>Sin actividades registradas</div>
              <div style={{fontSize:12,maxWidth:420,margin:"0 auto",lineHeight:1.6}}>Las actividades se crean automáticamente al cambiar la etapa de un prospecto, o manualmente desde cada prospecto.</div>
            </div>
          ):(
            <>
              {vencidas.length>0&&renderSection("Vencidas","🔴",vencidas,"#dc2626","requieren atención inmediata")}
              {hoy.length>0&&renderSection("Hoy","🟡",hoy,"#d97706","")}
              {semana.length>0&&renderSection("Esta semana","🔵",semana,"#1e40af","")}
              {futuras.length>0&&renderSection("Futuras","⚪",futuras,"#6b7280","más allá de 7 días")}
              {completadas.length>0&&renderSection("Completadas recientes","✅",completadas,"#16a34a","últimas 20")}
            </>
          )}
        </div>
      );
    };

    // ══════════════════════════════════════════════════════════════
    // RENDER PRINCIPAL
    // ══════════════════════════════════════════════════════════════
    return (
      <div style={{maxWidth:1400,margin:"0 auto",padding:"24px 20px 40px"}}>
        {/* Header */}
        <div style={{marginBottom:20,display:"flex",justifyContent:"space-between",alignItems:"flex-end",flexWrap:"wrap",gap:12}}>
          <div>
            <div style={{fontSize:10,fontWeight:600,textTransform:"uppercase",letterSpacing:1.5,color:B.gold,marginBottom:3}}>🎯 CRM Macrolotes</div>
            <div style={{fontSize:24,fontWeight:800,color:B.navy,fontFamily:"'Playfair Display',serif"}}>Seguimiento Activo{filterDevCompania!=="Todos"&&<span style={{fontSize:14,color:B.gold,marginLeft:8}}>— {filterDevCompania}{filterDesarrolloGlobal!=="Todos"&&<span style={{fontSize:12,opacity:.8}}> / {filterDesarrolloGlobal.split(" / ")[0]}</span>}</span>}</div>
            <div style={{fontSize:12,color:B.grey3,marginTop:3}}>
              {srcInvCRM.length} lotes · {totalProspActivos} prospectos activos · {totalInteracciones} interacciones
              {totalFriosF>0&&<span style={{color:"#ef4444",fontWeight:700}}> · {totalFriosF} fríos ⚠</span>}
            </div>
          </div>
          <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
            <button onClick={()=>{
              // Contar cuántas etapas legacy hay antes
              let before=0;
              Object.keys(crmData||{}).forEach(id=>{
                const e=crmData[id]; if(!e)return;
                if(e.pipeline&&STAGE_MIGRATION[e.pipeline]) before++;
                (e.prospectos||[]).forEach(p=>{if(p&&p.pipeline&&(STAGE_MIGRATION[p.pipeline]||!VALID_STAGES_SET.has(p.pipeline))) before++;});
              });
              const cloned=JSON.parse(JSON.stringify(crmData||{}));
              const migrated=migrateCRM(cloned);
              setCrmData(migrated); saveCRM(migrated);
              toast(before>0?"🔧 "+before+" registros legacy migrados":"✅ Datos ya estaban limpios");
            }} style={{padding:"8px 13px",background:"#f59e0b",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:11,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}} title="Migra etapas antiguas (Prospectado, Propuesta formal, Baja) al nuevo pipeline">🔧 Sanear datos</button>
            <button onClick={exportCRMJson} style={{padding:"8px 13px",background:B.navy,color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:11,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>⬇ Exportar JSON</button>
            <label style={{padding:"8px 13px",background:B.offW,color:B.grey4,border:"1px solid "+B.grey1,borderRadius:8,cursor:"pointer",fontSize:11,fontWeight:700,display:"inline-flex",alignItems:"center",gap:4,fontFamily:"'DM Sans',sans-serif"}}>
              ⬆ Importar<input type="file" accept=".json" onChange={importCRMJson} style={{display:"none"}}/>
            </label>
          </div>
        </div>

        {/* Filtro por Empresa Desarrolladora — Nivel 1 */}
        <div style={{marginBottom:desarrollosDeCompania.length>0?6:14,display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
          <span style={{fontSize:10,fontWeight:700,color:B.grey3,textTransform:"uppercase",letterSpacing:1,marginRight:2}}>Empresa:</span>
          <button onClick={()=>{setFilterDevCompania("Todos");setFilterDesarrolloGlobal("Todos");}} style={{padding:"4px 11px",borderRadius:20,border:"none",cursor:"pointer",fontSize:11,fontWeight:700,fontFamily:"'DM Sans',sans-serif",background:filterDevCompania==="Todos"?B.navy:"transparent",color:filterDevCompania==="Todos"?"#fff":B.grey4,outline:"1px solid "+(filterDevCompania==="Todos"?B.navy:B.grey1)}}>Todos</button>
          {companiasCRM.map(c=>(
            <button key={c} onClick={()=>{if(filterDevCompania===c){setFilterDevCompania("Todos");setFilterDesarrolloGlobal("Todos");}else{setFilterDevCompania(c);setFilterDesarrolloGlobal("Todos");}}} style={{padding:"4px 11px",borderRadius:20,border:"none",cursor:"pointer",fontSize:11,fontWeight:700,fontFamily:"'DM Sans',sans-serif",background:filterDevCompania===c?B.gold:B.offW,color:filterDevCompania===c?B.navy:B.grey4,outline:"1px solid "+(filterDevCompania===c?B.gold:B.grey1)}}>{c}</button>
          ))}
        </div>
        {/* Nivel 2: Desarrollos de la empresa seleccionada */}
        {desarrollosDeCompania.length>0&&(
          <div style={{marginBottom:14,display:"flex",gap:5,flexWrap:"wrap",alignItems:"center",paddingLeft:16,borderLeft:"3px solid "+B.gold}}>
            <span style={{fontSize:10,fontWeight:700,color:B.gold,textTransform:"uppercase",letterSpacing:1,marginRight:2}}>↳ Desarrollo:</span>
            <button onClick={()=>setFilterDesarrolloGlobal("Todos")} style={{padding:"3px 10px",borderRadius:20,border:"none",cursor:"pointer",fontSize:10,fontWeight:700,fontFamily:"'DM Sans',sans-serif",background:filterDesarrolloGlobal==="Todos"?B.navy:"transparent",color:filterDesarrolloGlobal==="Todos"?"#fff":B.grey4,outline:"1px solid "+(filterDesarrolloGlobal==="Todos"?B.navy:B.grey1)}}>Todos</button>
            {desarrollosDeCompania.map(d=>{
              const label=d.includes(" / ")?d.split(" / ")[0].trim():d;
              return <button key={d} onClick={()=>setFilterDesarrolloGlobal(filterDesarrolloGlobal===d?"Todos":d)} style={{padding:"3px 10px",borderRadius:20,border:"none",cursor:"pointer",fontSize:10,fontWeight:700,fontFamily:"'DM Sans',sans-serif",background:filterDesarrolloGlobal===d?B.navy:B.offW,color:filterDesarrolloGlobal===d?"#fff":B.grey4,outline:"1px solid "+(filterDesarrolloGlobal===d?B.navy:B.grey1)}}>{label}</button>;
            })}
          </div>
        )}

        {/* Tabs */}
        <div style={{display:"flex",gap:2,marginBottom:18,background:B.white,borderRadius:10,padding:4,border:"1px solid "+B.grey1,width:"fit-content"}}>
          {[["dashboard","📊 Dashboard"],["midia","📅 Mi día"],["prospectos","👤 Prospectos"],["kanban","📋 Kanban"],["asesores","🧑‍💼 Asesores"]].map(([t,l])=>(
            <button key={t} onClick={()=>setActiveTab(t)} style={{padding:"7px 16px",borderRadius:7,border:"none",cursor:"pointer",fontWeight:700,fontSize:12,fontFamily:"'DM Sans',sans-serif",background:activeTab===t?B.navy:"transparent",color:activeTab===t?"#fff":B.grey4,transition:"all 0.15s"}}>{l}</button>
          ))}
        </div>

        {/* Filtros (en tabs lista/kanban) */}
        {activeTab==="kanban"&&(
          <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
            {[["filterDesarrolloCRM",filterDesarrolloCRM,setFilterDesarrolloCRM,["Todos los desarrollos",...desarrollosCRM]],
              ["filterPipeline",filterPipeline,setFilterPipeline,["Todos",...PIPELINE_STAGES]]].map(([key,val,setter,opts])=>(
              <select key={key} value={val} onChange={e=>setter(e.target.value)} style={{padding:"7px 10px",borderRadius:8,border:"1px solid "+B.grey1,fontSize:12,color:B.navy,background:B.white,outline:"none",fontFamily:"'DM Sans',sans-serif"}}>
                {opts.map(o=><option key={o} value={o==="Todos los desarrollos"?"Todos":o}>{o}</option>)}
              </select>

            <select value={filterSemaforo} onChange={e=>setFilterSemaforo(e.target.value)} style={{padding:"7px 10px",borderRadius:8,border:"1px solid "+B.grey1,fontSize:12,color:B.navy,background:B.white,outline:"none",fontFamily:"'DM Sans',sans-serif"}}>
