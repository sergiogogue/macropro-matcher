  // VIEW: ⬡ EJECUTIVO — Operación diaria del pipeline
  // ═══════════════════════════════════════════════════════════════
  const ViewEjecutivo = () => {
    // Helpers locales (replicados para no depender de scope de otras vistas)
    const STAGES_REQUIRING_ACTIVITY_LOCAL = ["En negociación","Propuesta","Contrato"];
    // getLotePipeline local: deriva la etapa del lote como la más avanzada de sus prospectos
    const stageOrder={"Prospecto":1,"Contactado":2,"En negociación":3,"Propuesta":4,"Apartado":5,"Contrato":6,"Vendido":7,"Perdido":0,"Disponible":0};
    const getLotePipelineLocal = (lotId) => {
      const e = crmData[lotId];
      if(!e) return "Disponible";
      if(e.pipeline==="Vendido"||e.pipeline==="Perdido") return e.pipeline;
      const prospectos = e.prospectos||[];
      if(prospectos.length===0) return e.pipeline||"Disponible";
      let masAvanzada = "Disponible"; let maxOrden = 0;
      prospectos.forEach(p=>{
        if(!p||!p.pipeline) return;
        const ord = stageOrder[p.pipeline]||0;
        if(ord>maxOrden){ maxOrden=ord; masAvanzada=p.pipeline; }
      });
      return masAvanzada;
    };
    // updateProspectoPipeline local (versión simplificada sin modal de pérdida)
    const updateProspectoPipelineLocal = (lotId, prospectoIdx, newStage) => {
      setCrmData(prev=>{
        const entry = prev[lotId]||{pipeline:"Disponible",interacciones:[],prospectos:[],devFeedback:[]};
        const prospectos = [...(entry.prospectos||[])];
        if(prospectos[prospectoIdx]){
          prospectos[prospectoIdx] = {...prospectos[prospectoIdx], pipeline:newStage};
        }
        const next = {...prev, [lotId]:{...entry, prospectos, lastContact:new Date().toISOString().slice(0,10)}};
        saveCRM(next);
        return next;
      });
      toast("✅ Etapa actualizada a "+newStage);
    };

    // Datos base
    const srcInvE = inventory.length>0?inventory:DEMO_LOTS;
    // Aplicar filtros
    const desarrolladoresUnicos = [...new Set(srcInvE.map(l=>l.desarrollador||l.desarrollo).filter(Boolean))].sort();
    const desarrollosUnicos = [...new Set(srcInvE.filter(l=>{
      if(ejecFiltroDesarrollador==="Todos") return true;
      return (l.desarrollador||l.desarrollo)===ejecFiltroDesarrollador;
    }).map(l=>l.desarrollo).filter(Boolean))].sort();
    const asesoresUnicos = [...new Set(Object.values(crmData).flatMap(e=>{
      const arr=[];
      if(e.asesorResponsable) arr.push(e.asesorResponsable);
      (e.prospectos||[]).forEach(p=>{ if(p.asesor) arr.push(p.asesor); });
      return arr;
    }).filter(Boolean))].sort();

    const lotesFiltrados = srcInvE.filter(l=>{
      if(ejecFiltroDesarrollador!=="Todos"&&(l.desarrollador||l.desarrollo)!==ejecFiltroDesarrollador) return false;
      if(ejecFiltroDesarrollo!=="Todos"&&l.desarrollo!==ejecFiltroDesarrollo) return false;
      return true;
    });

    // Construir lista de prospectos activos con filtros aplicados
    const prospectosActivos = [];
    lotesFiltrados.forEach(lot=>{
      const crm = crmData[lot.id];
      if(!crm||!crm.prospectos) return;
      crm.prospectos.forEach((p,idx)=>{
        if(!p||!p.pipeline) return;
        const pipelineP = p.pipeline||"Prospecto";
        if(pipelineP==="Perdido"||pipelineP==="Vendido") return;
        if(ejecFiltroEtapa!=="Todos"&&pipelineP!==ejecFiltroEtapa) return;
        const asesorP = p.asesor||crm.asesorResponsable||"Sin asignar";
        if(ejecFiltroAsesor!=="Todos"&&asesorP!==ejecFiltroAsesor) return;
        // Última actividad y próxima
        const acts = p.actividades||[];
        const proximaAct = acts.filter(a=>!a.completada).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha))[0];
        const ultimaInteraccion = (crm.lastContact)||(acts.filter(a=>a.completada).sort((a,b)=>new Date(b.fechaCompletada||b.fecha)-new Date(a.fechaCompletada||a.fecha))[0]||{}).fechaCompletada||null;
        const diasSinContacto = ultimaInteraccion?Math.floor((Date.now()-new Date(ultimaInteraccion).getTime())/(864e5)):null;
        prospectosActivos.push({
          lot, prospecto:p, prospectoIdx:idx, pipeline:pipelineP,
          asesor:asesorP, proximaAct, diasSinContacto,
          temperatura: p.temperatura||"Sin definir",
          valor: lot.precio_total||0
        });
      });
    });

    // KPIs operativos
    const kpiPipelineActivo = lotesFiltrados.filter(l=>{
      const e=crmData[l.id]; if(!e) return false;
      const pip=getLotePipelineLocal(l.id); 
      return pip&&pip!=="Disponible"&&pip!=="Perdido"&&pip!=="Vendido";
    });
    const valorPipelineActivo = kpiPipelineActivo.reduce((a,l)=>a+(l.precio_total||0),0);
    const apartados = lotesFiltrados.filter(l=>getLotePipelineLocal(l.id)==="Apartado");
    const valorApartados = apartados.reduce((a,l)=>a+(l.precio_total||0),0);
    const vendidos = lotesFiltrados.filter(l=>getLotePipelineLocal(l.id)==="Vendido");
    const valorVendidos = vendidos.reduce((a,l)=>a+(l.precio_total||0),0);

    // Alertas
    const lotesSinMov60 = lotesFiltrados.filter(l=>{
      const e=crmData[l.id]; if(!e||!e.lastContact) return false;
      const pip=getLotePipelineLocal(l.id);
      if(pip==="Perdido"||pip==="Vendido"||pip==="Disponible") return false;
      const dias=Math.floor((Date.now()-new Date(e.lastContact).getTime())/(864e5));
      return dias>60;
    });
    const prospSinActividad = prospectosActivos.filter(p=>{
      if(!STAGES_REQUIRING_ACTIVITY_LOCAL.includes(p.pipeline)) return false;
      return !p.proximaAct;
    });

    // Top 5 lotes por valor en pipeline
    const top5Lotes = [...kpiPipelineActivo].sort((a,b)=>(b.precio_total||0)-(a.precio_total||0)).slice(0,5);

    const limpiarFiltros = () => {
      setEjecFiltroDesarrollador("Todos");
      setEjecFiltroDesarrollo("Todos");
      setEjecFiltroAsesor("Todos");
      setEjecFiltroEtapa("Todos");
    };

    const KPICard = ({label, valor, subvalor, color, icon}) => (
      <div style={{background:B.white, borderRadius:14, padding:"18px 20px", border:"1px solid "+B.grey1, boxShadow:"0 2px 8px rgba(0,43,73,0.05)", flex:"1 1 200px", minWidth:200}}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:6}}>
          <div style={{fontSize:10, fontWeight:700, color:B.grey3, textTransform:"uppercase", letterSpacing:1.2}}>{label}</div>
          <div style={{fontSize:18}}>{icon}</div>
        </div>
        <div style={{fontSize:26, fontWeight:800, color:color||B.navy, fontFamily:"'Playfair Display',serif", lineHeight:1}}>{valor}</div>
        {subvalor&&<div style={{fontSize:11, color:B.grey4, marginTop:6, fontWeight:600}}>{subvalor}</div>}
      </div>
    );

    return (
      <div style={{padding:"20px 24px", maxWidth:1400, margin:"0 auto"}}>
        {/* Header */}
        <div style={{marginBottom:24}}>
          <div style={{fontSize:11, fontWeight:700, color:B.gold, letterSpacing:2, textTransform:"uppercase"}}>⬡ Vista Ejecutiva</div>
          <div style={{fontSize:28, fontWeight:800, color:B.navy, fontFamily:"'Playfair Display',serif", marginTop:2}}>Operación del Pipeline</div>
          <div style={{fontSize:12, color:B.grey4, marginTop:4}}>Visión consolidada de prospectos activos, alertas y oportunidades de cierre</div>
        </div>

        {/* Filtros */}
        <div style={{background:B.white, borderRadius:12, padding:"14px 18px", marginBottom:20, border:"1px solid "+B.grey1, display:"flex", gap:12, flexWrap:"wrap", alignItems:"center"}}>
          <div style={{fontSize:10, fontWeight:800, color:B.navy, textTransform:"uppercase", letterSpacing:1.2}}>🔍 Filtros:</div>
          <select value={ejecFiltroDesarrollador} onChange={e=>setEjecFiltroDesarrollador(e.target.value)}
            style={{padding:"7px 11px", borderRadius:7, border:"1.5px solid "+B.grey1, fontSize:12, fontWeight:600, color:B.navy, background:B.white, cursor:"pointer", outline:"none"}}>
            <option value="Todos">Desarrollador: Todos</option>
            {desarrolladoresUnicos.map(d=><option key={d} value={d}>{d}</option>)}
          </select>
          <select value={ejecFiltroDesarrollo} onChange={e=>setEjecFiltroDesarrollo(e.target.value)}
            style={{padding:"7px 11px", borderRadius:7, border:"1.5px solid "+B.grey1, fontSize:12, fontWeight:600, color:B.navy, background:B.white, cursor:"pointer", outline:"none"}}>
            <option value="Todos">Desarrollo: Todos</option>
            {desarrollosUnicos.map(d=><option key={d} value={d}>{d}</option>)}
          </select>
          <select value={ejecFiltroAsesor} onChange={e=>setEjecFiltroAsesor(e.target.value)}
            style={{padding:"7px 11px", borderRadius:7, border:"1.5px solid "+B.grey1, fontSize:12, fontWeight:600, color:B.navy, background:B.white, cursor:"pointer", outline:"none"}}>
            <option value="Todos">Asesor: Todos</option>
            {asesoresUnicos.map(a=><option key={a} value={a}>{a}</option>)}
          </select>
          <select value={ejecFiltroEtapa} onChange={e=>setEjecFiltroEtapa(e.target.value)}
            style={{padding:"7px 11px", borderRadius:7, border:"1.5px solid "+B.grey1, fontSize:12, fontWeight:600, color:B.navy, background:B.white, cursor:"pointer", outline:"none"}}>
            <option value="Todos">Etapa: Todas</option>
            {PIPELINE_STAGES.filter(s=>s!=="Perdido"&&s!=="Vendido").map(s=><option key={s} value={s}>{s}</option>)}
          </select>
          <button onClick={limpiarFiltros}
            style={{padding:"7px 13px", borderRadius:7, border:"1px solid "+B.grey1, fontSize:11, fontWeight:700, color:B.grey4, background:B.offW, cursor:"pointer", fontFamily:"'DM Sans',sans-serif"}}>
            🧹 Limpiar
          </button>
          <div style={{marginLeft:"auto", fontSize:11, color:B.grey3}}>{lotesFiltrados.length} de {srcInvE.length} lotes · {prospectosActivos.length} prospectos activos</div>
        </div>

        {/* KPIs */}
        <div style={{display:"flex", gap:14, marginBottom:24, flexWrap:"wrap"}}>
          <KPICard icon="🎯" label="Pipeline Activo" valor={kpiPipelineActivo.length} subvalor={fmtMiles(Math.round(valorPipelineActivo/1000))+" miles"} color={B.navy}/>
          <KPICard icon="👤" label="Prospectos Activos" valor={prospectosActivos.length} subvalor={asesoresUnicos.length+" asesores involucrados"} color="#3B82F6"/>
          <KPICard icon="🟡" label="Apartados" valor={apartados.length} subvalor={fmtMiles(Math.round(valorApartados/1000))+" miles"} color="#F59E0B"/>
          <KPICard icon="✅" label="Vendidos" valor={vendidos.length} subvalor={fmtMiles(Math.round(valorVendidos/1000))+" miles"} color="#22c55e"/>
        </div>

        {/* Alertas */}
        {(lotesSinMov60.length>0||prospSinActividad.length>0)&&(
          <div style={{background:"#fef3c7", border:"1.5px solid #f59e0b", borderRadius:12, padding:"14px 18px", marginBottom:20}}>
            <div style={{fontSize:13, fontWeight:800, color:"#92400e", marginBottom:10, textTransform:"uppercase", letterSpacing:1}}>⚠️ Alertas operativas</div>
            <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(280px, 1fr))", gap:10}}>
              {lotesSinMov60.length>0&&(
                <div style={{background:"#fff", borderRadius:8, padding:"10px 12px", borderLeft:"3px solid #dc2626"}}>
                  <div style={{fontSize:18, fontWeight:800, color:"#991b1b"}}>{lotesSinMov60.length}</div>
                  <div style={{fontSize:11, color:"#78350f", fontWeight:600}}>lotes sin movimiento &gt;60 días</div>
                </div>
              )}
              {prospSinActividad.length>0&&(
                <div style={{background:"#fff", borderRadius:8, padding:"10px 12px", borderLeft:"3px solid #f59e0b"}}>
                  <div style={{fontSize:18, fontWeight:800, color:"#b45309"}}>{prospSinActividad.length}</div>
                  <div style={{fontSize:11, color:"#78350f", fontWeight:600}}>prospectos activos sin actividad pendiente</div>
                </div>
              )}
            </div>
          </div>
        )}

        {/* Top 5 lotes en pipeline */}
        {top5Lotes.length>0&&(
          <div style={{background:B.white, borderRadius:12, padding:"18px 20px", marginBottom:20, border:"1px solid "+B.grey1}}>
            <div style={{fontSize:13, fontWeight:800, color:B.navy, marginBottom:12, textTransform:"uppercase", letterSpacing:1}}>🏆 Top 5 lotes por valor en pipeline</div>
            <div style={{display:"flex", flexDirection:"column", gap:8}}>
              {top5Lotes.map((l,i)=>{
                const pip=getLotePipelineLocal(l.id);
                const c=PIPELINE_COLORS[pip]||B.grey3;
                return (
                  <div key={l.id} style={{display:"flex", alignItems:"center", gap:12, padding:"10px 12px", background:B.offW, borderRadius:8, borderLeft:"3px solid "+c}}>
                    <div style={{width:28, height:28, borderRadius:14, background:B.navy, color:B.gold, display:"flex", alignItems:"center", justifyContent:"center", fontSize:13, fontWeight:800}}>#{i+1}</div>
                    <div style={{flex:1, minWidth:0}}>
                      <div style={{fontSize:13, fontWeight:700, color:B.navy}}>{l.nombre}</div>
                      <div style={{fontSize:10, color:B.grey4}}>{l.desarrollo} · {l.ciudad}</div>
                    </div>
                    <span style={{padding:"3px 10px", borderRadius:12, fontSize:10, fontWeight:700, background:c+"22", color:c}}>{pip}</span>
                    <div style={{fontSize:14, fontWeight:800, color:B.navy, fontFamily:"'Playfair Display',serif", textAlign:"right", minWidth:120}}>{fmtMiles(Math.round((l.precio_total||0)/1000))+"k"}</div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* Tabla de prospectos activos */}
        <div style={{background:B.white, borderRadius:12, padding:"18px 20px", marginBottom:20, border:"1px solid "+B.grey1}}>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12}}>
            <div style={{fontSize:13, fontWeight:800, color:B.navy, textTransform:"uppercase", letterSpacing:1}}>👥 Prospectos activos · {prospectosActivos.length}</div>
            <div style={{fontSize:11, color:B.grey3, fontStyle:"italic"}}>Etapa editable inline</div>
          </div>
          {prospectosActivos.length===0?(
            <div style={{padding:30, textAlign:"center", color:B.grey3, fontSize:13, background:B.offW, borderRadius:8}}>Sin prospectos activos con los filtros actuales</div>
          ):(
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%", borderCollapse:"collapse", fontSize:12}}>
                <thead>
                  <tr style={{background:B.navy, color:B.white}}>
                    <th style={{padding:"10px 8px", textAlign:"left", fontSize:10, fontWeight:700, textTransform:"uppercase", letterSpacing:0.8}}>Cliente</th>
                    <th style={{padding:"10px 8px", textAlign:"left", fontSize:10, fontWeight:700, textTransform:"uppercase", letterSpacing:0.8}}>Asesor</th>
                    <th style={{padding:"10px 8px", textAlign:"left", fontSize:10, fontWeight:700, textTransform:"uppercase", letterSpacing:0.8}}>Lote</th>
                    <th style={{padding:"10px 8px", textAlign:"left", fontSize:10, fontWeight:700, textTransform:"uppercase", letterSpacing:0.8}}>Desarrollo</th>
                    <th style={{padding:"10px 8px", textAlign:"right", fontSize:10, fontWeight:700, textTransform:"uppercase", letterSpacing:0.8}}>Valor</th>
                    <th style={{padding:"10px 8px", textAlign:"center", fontSize:10, fontWeight:700, textTransform:"uppercase", letterSpacing:0.8}}>Etapa</th>
                    <th style={{padding:"10px 8px", textAlign:"center", fontSize:10, fontWeight:700, textTransform:"uppercase", letterSpacing:0.8}}>Temp.</th>
                    <th style={{padding:"10px 8px", textAlign:"center", fontSize:10, fontWeight:700, textTransform:"uppercase", letterSpacing:0.8}}>Próx. acción</th>
                    <th style={{padding:"10px 8px", textAlign:"center", fontSize:10, fontWeight:700, textTransform:"uppercase", letterSpacing:0.8}}>Días s/c</th>
                  </tr>
                </thead>
                <tbody>
                  {prospectosActivos.sort((a,b)=>{
                    const orden={"Apartado":1,"Contrato":2,"Propuesta":3,"En negociación":4,"Contactado":5,"Prospecto":6};
                    return (orden[a.pipeline]||9)-(orden[b.pipeline]||9);
                  }).map((p,i)=>{
                    const pipColor = PIPELINE_COLORS[p.pipeline]||B.grey3;
                    const tempC = tempColor(p.temperatura);
                    const tempBgC = tempBg(p.temperatura);
                    const diasC = p.diasSinContacto===null?B.grey3:(p.diasSinContacto>30?"#dc2626":p.diasSinContacto>14?"#d97706":"#16a34a");
                    return (
                      <tr key={p.lot.id+"-"+p.prospectoIdx} style={{borderBottom:"1px solid "+B.grey1, background:i%2===0?B.white:B.offW}}>
                        <td style={{padding:"10px 8px", fontWeight:700, color:B.navy}}>{p.prospecto.nombre||"—"}</td>
                        <td style={{padding:"10px 8px", color:B.grey4, fontSize:11}}>{p.asesor}</td>
                        <td style={{padding:"10px 8px", color:B.grey4, fontSize:11}}>{p.lot.nombre}</td>
                        <td style={{padding:"10px 8px", color:B.grey4, fontSize:11}}>{p.lot.desarrollo}</td>
                        <td style={{padding:"10px 8px", textAlign:"right", fontWeight:700, color:B.navy, fontSize:11}}>{fmtMiles(Math.round(p.valor/1000))+"k"}</td>
                        <td style={{padding:"6px 8px", textAlign:"center"}}>
                          <select value={p.pipeline} onChange={e=>updateProspectoPipelineLocal(p.lot.id,p.prospectoIdx,e.target.value)}
                            style={{padding:"4px 8px", borderRadius:6, border:"1.5px solid "+pipColor, background:pipColor+"15", color:pipColor, fontSize:10, fontWeight:700, cursor:"pointer", outline:"none", fontFamily:"'DM Sans',sans-serif"}}>
                            {PIPELINE_STAGES.map(s=><option key={s} value={s}>{s}</option>)}
                          </select>
                        </td>
                        <td style={{padding:"10px 8px", textAlign:"center"}}>
                          <span style={{padding:"3px 8px", borderRadius:10, fontSize:10, fontWeight:700, background:tempBgC, color:tempC}}>{p.temperatura}</span>
                        </td>
                        <td style={{padding:"10px 8px", textAlign:"center", fontSize:10, color:B.grey4}}>
                          {p.proximaAct?(p.proximaAct.fecha+(p.proximaAct.tipo?" · "+p.proximaAct.tipo:"")):<span style={{color:"#dc2626", fontWeight:700}}>—</span>}
                        </td>
                        <td style={{padding:"10px 8px", textAlign:"center", fontSize:11, fontWeight:700, color:diasC}}>{p.diasSinContacto===null?"—":p.diasSinContacto+"d"}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      </div>
    );
  };

  // ═══════════════════════════════════════════════════════════════
  // VIEW: 🎯 METAS — Objetivos Plan vs Real por desarrollo
  // ═══════════════════════════════════════════════════════════════
  const ViewMetas = () => {
    // Desarrolladores: combinación de metas + inventario + oficiales (siempre completos)
    const desarrolladoresMetas = getDesarrolladoresActivos(metasData, inventory);
    // Desarrollos: si hay filtro de desarrollador, solo los suyos (filtro inteligente)
    const desarrollosMetas = (() => {
      if(metasFiltroDesarrollador==="Todos"){
        // Todos los desarrollos conocidos: metas + mapeo + inventario
        const set = new Set(Object.keys(metasData||{}));
        const mapeo = loadMapeoDesarrollador();
        Object.keys(mapeo).forEach(d=>set.add(d));
        if(Array.isArray(inventory)) inventory.forEach(l=>{ if(l&&l.desarrollo) set.add(l.desarrollo); });
        return [...set].sort();
      }
      // Filtro inteligente: solo desarrollos del desarrollador seleccionado
      const list = getDesarrollosPorDesarrollador(metasFiltroDesarrollador, metasData, inventory);
      return list || [];
    })();

    const resumen = calcularMetasResumen(metasData, metasFiltroDesarrollador, metasFiltroDesarrollo);
    const mesActualIdx = new Date().getMonth(); // 0-11
    const mesActualNombre = MESES_LARGO[mesActualIdx];

    // Calcular meta acumulada al mes actual
    let metaAlMesUds=0, metaAlMesMonto=0;
    Object.entries(metasData).forEach(([nombre, d])=>{
      if(metasFiltroDesarrollador!=="Todos"&&d.desarrollador!==metasFiltroDesarrollador) return;
      if(metasFiltroDesarrollo!=="Todos"&&nombre!==metasFiltroDesarrollo) return;
      metaAlMesUds += calcularMetaAlMes(d.plan?.uds||[], mesActualIdx);
      metaAlMesMonto += calcularMetaAlMes(d.plan?.monto||[], mesActualIdx);
    });

    const estatusUds = getEstatusMeta(resumen.cumplUds, resumen.planUdsTotal, resumen.realUdsTotal);
    const estatusMonto = getEstatusMeta(resumen.cumplMonto, resumen.planMontoTotal, resumen.realMontoTotal);

    const limpiarFiltros = () => {
      setMetasFiltroDesarrollador("Todos");
      setMetasFiltroDesarrollo("Todos");
    };

    const resetearMetasASeed = () => {
      if(!window.confirm("⚠ Esto reemplazará TODAS tus metas con los datos originales del Excel. ¿Continuar?")) return;
      const seed = JSON.parse(JSON.stringify(METAS_SEED));
      setMetasData(seed); saveMetas(seed);
      toast("✅ Metas restauradas desde Excel original");
    };

    return (
      <div style={{padding:"20px 24px", maxWidth:1400, margin:"0 auto"}}>
        {/* Header */}
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-end", marginBottom:24, flexWrap:"wrap", gap:12}}>
          <div>
            <div style={{fontSize:11, fontWeight:700, color:B.gold, letterSpacing:2, textTransform:"uppercase"}}>🎯 Metas 2026</div>
            <div style={{fontSize:28, fontWeight:800, color:B.navy, fontFamily:"'Playfair Display',serif", marginTop:2}}>Plan Anual vs Resultados</div>
            <div style={{fontSize:12, color:B.grey4, marginTop:4}}>Hoy es {new Date().toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"})} · Mes en curso: <strong>{mesActualNombre}</strong></div>
          </div>
          <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
            <button onClick={()=>{setShowImportModal(true);setImportPreview(null);}}
              style={{padding:"10px 16px", borderRadius:8, border:"none", background:"linear-gradient(135deg,#16a34a,#22c55e)", color:"#fff", fontSize:12, fontWeight:800, cursor:"pointer", fontFamily:"'DM Sans',sans-serif", boxShadow:"0 2px 8px rgba(22,163,74,0.25)"}}>
              📤 Importar Excel
            </button>
            <button onClick={resetearMetasASeed}
              style={{padding:"9px 14px", borderRadius:8, border:"1.5px solid "+B.grey1, fontSize:11, fontWeight:700, color:B.grey4, background:B.white, cursor:"pointer", fontFamily:"'DM Sans',sans-serif"}}>
              🔄 Restaurar seed
            </button>
          </div>
        </div>

        {/* Filtros */}
        <div style={{background:B.white, borderRadius:12, padding:"14px 18px", marginBottom:20, border:"1px solid "+B.grey1, display:"flex", gap:12, flexWrap:"wrap", alignItems:"center"}}>
          <div style={{fontSize:10, fontWeight:800, color:B.navy, textTransform:"uppercase", letterSpacing:1.2}}>🔍 Filtros:</div>
          <select value={metasFiltroDesarrollador} onChange={e=>setMetasFiltroDesarrollador(e.target.value)}
            style={{padding:"7px 11px", borderRadius:7, border:"1.5px solid "+B.grey1, fontSize:12, fontWeight:600, color:B.navy, background:B.white, cursor:"pointer", outline:"none", minWidth:180}}>
            <option value="Todos">Desarrollador: Todos</option>
            {desarrolladoresMetas.map(d=><option key={d} value={d}>{d}</option>)}
          </select>
          <select value={metasFiltroDesarrollo} onChange={e=>setMetasFiltroDesarrollo(e.target.value)}
            style={{padding:"7px 11px", borderRadius:7, border:"1.5px solid "+B.grey1, fontSize:12, fontWeight:600, color:B.navy, background:B.white, cursor:"pointer", outline:"none", minWidth:180}}>
            <option value="Todos">Desarrollo: Todos</option>
            {desarrollosMetas.map(d=><option key={d} value={d}>{d}</option>)}
          </select>
          <button onClick={limpiarFiltros}
            style={{padding:"7px 13px", borderRadius:7, border:"1px solid "+B.grey1, fontSize:11, fontWeight:700, color:B.grey4, background:B.offW, cursor:"pointer", fontFamily:"'DM Sans',sans-serif"}}>
            🧹 Limpiar
          </button>
        </div>

        {/* Aviso de splits detectados en inventario */}
        {splitsDetectados&&splitsDetectados.length>0&&(

      {view==="crm"&&<ViewCRM/>}
      {view==="dashboard"&&<ViewDashboard/>}
      {view==="ejecutivo"&&<ViewEjecutivo/>}
      {view==="metas"&&<ViewMetas/>}
      {view==="asesores"&&<ViewAsesores/>}
      {view==="matchClient"&&<ViewMatchClient/>}
      {view==="matchLot"&&<ViewMatchLot/>}
      {view==="result"&&<ViewResults/>}
      {view==="quickSearch"&&<ViewQuickSearch/>}
      {view==="clients"&&<ViewClients/>}
      {view==="lots"&&<ViewLots/>}
      <ModalApiKey/>
      <ModalMigrate/>

      {/* ═══════════════════════════════════════════════════════════════
          MODAL: Nueva/Editar solicitud de asesor
          ═══════════════════════════════════════════════════════════════ */}
      {showSolicitudModal&&(() => {
        const isEdit = editingSolicitud!==null;

        return <ModalAsesorForm

          isEdit={isEdit}
          inventory={inventory.length>0?inventory:DEMO_LOTS}

          onSave={(data)=>{ guardarAsesor(data); setShowSolicitudModal(false); setEditingSolicitud(null); }}

          B={B}
        />;
      })()}

      {/* ═══════════════════════════════════════════════════════════════
          MODAL: Matches encontrados en inventario
          ═══════════════════════════════════════════════════════════════ */}
      {showMatchesModal&&solicitudActiva&&(
        <div style={{position:"fixed", inset:0, background:"rgba(0,0,0,0.55)", zIndex:2200, display:"flex", alignItems:"center", justifyContent:"center", padding:20}} onClick={e=>e.target===e.currentTarget&&setShowMatchesModal(false)}>
          <div style={{background:"#fff", borderRadius:14, width:"100%", maxWidth:900, boxShadow:"0 20px 60px rgba(0,43,73,0.3)", overflow:"hidden", maxHeight:"90vh", display:"flex", flexDirection:"column"}}>
            <div style={{background:"linear-gradient(135deg,#1e40af,#3b82f6)", padding:"18px 22px"}}>
              <div style={{fontSize:10, fontWeight:700, color:"rgba(255,255,255,0.85)", letterSpacing:2, textTransform:"uppercase", marginBottom:3}}>⚡ Matches en inventario</div>
              <div style={{fontSize:18, fontWeight:800, color:"#fff", fontFamily:"'Playfair Display',serif"}}>{solicitudActiva.asesorNombre} → {solicitudActiva.clienteNombre||"Cliente"}</div>
              <div style={{fontSize:11, color:"rgba(255,255,255,0.85)", marginTop:4}}>
                Buscando: {solicitudActiva.superficieMin}m²+ {solicitudActiva.frenteMinimo?"· "+solicitudActiva.frenteMinimo+"m frente ":""}· {solicitudActiva.ciudad||""} {solicitudActiva.estado||""} · Max ${parseFloat(solicitudActiva.precioMaximo||0).toLocaleString("es-MX")}
              </div>
            </div>
            <div style={{padding:"16px 22px", overflowY:"auto", flex:1}}>
              {(() => {
                const calificados = matchesActuales.filter(m=>!m.descalificado).slice(0,15);
                const descalificados = matchesActuales.filter(m=>m.descalificado).slice(0,5);
                if(matchesActuales.length===0) return <div style={{padding:"30px", textAlign:"center", color:B.grey4}}>No hay lotes en el inventario para evaluar.</div>;
                return (
                  <>
                    <div style={{marginBottom:14, padding:"10px 14px", background:"#dcfce7", borderRadius:8, borderLeft:"3px solid #16a34a"}}>

                    {calificados.length>0&&calificados.map(m=>(
                      <div key={m.lot.id} style={{background:B.white, border:"1px solid "+B.grey1, borderRadius:10, padding:"12px 14px", marginBottom:10, borderLeft:"3px solid #16a34a"}}>
                        <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:6, gap:10}}>
                          <div style={{flex:1, minWidth:0}}>
                            <div style={{fontSize:14, fontWeight:800, color:B.navy}}>{m.lot.nombre||m.lot.id}</div>
                            <div style={{fontSize:10, color:B.grey4, marginTop:2}}>{m.lot.desarrollo||""} · {m.lot.desarrollador||""}</div>
                          </div>
                          <div style={{textAlign:"right"}}>
                            <div style={{fontSize:9, color:B.grey4, fontWeight:700, textTransform:"uppercase", letterSpacing:1}}>Score</div>
                            <div style={{fontSize:18, fontWeight:800, color:"#15803d", fontFamily:"'Playfair Display',serif"}}>{m.score}</div>
                          </div>
                        </div>
                        <div style={{fontSize:11, color:B.grey4, lineHeight:1.7, marginBottom:6}}>
                          {m.lot.superficie&&<>📐 {parseFloat(m.lot.superficie).toLocaleString("es-MX")}m² </>}
                          {m.lot.frente&&<>· 📏 {m.lot.frente}m </>}
                          {m.lot.ciudad&&<>· 📍 {m.lot.ciudad}</>}
                          {m.lot.estado&&<>, {m.lot.estado} </>}
                          {m.lot.precio_total&&<>· 💰 ${parseFloat(m.lot.precio_total).toLocaleString("es-MX")}</>}
                          {m.lot.uso_suelo&&<> · Uso: {m.lot.uso_suelo}</>}
                        </div>
                        {m.razones.length>0&&<div style={{fontSize:10, color:"#15803d", marginBottom:6}}>{m.razones.join(" · ")}</div>}
                        <div style={{display:"flex", gap:6, flexWrap:"wrap"}}>
                          <button onClick={()=>{
                            const newId = m.lot.id;
                            setSolicitudesAsesor(prev=>prev.map(a=>{
                              if(a.id!==solicitudActiva.id) return a;
                              const enviados = [...(a.lotesEnviados||[])];
                              if(!enviados.includes(newId)) enviados.push(newId);
                              return {...a, lotesEnviados:enviados, fechaUltimaActividad:new Date().toISOString(), historial:[...(a.historial||[]),{fecha:new Date().toISOString(),tipo:"envio",descripcion:`Lote ${m.lot.nombre||newId} agregado a opciones enviadas`}]};
                            }));
                            toast("✓ Lote marcado como enviado");
                          }}
                            style={{padding:"6px 12px", borderRadius:6, border:"1px solid "+B.grey1, background:B.white, color:B.navy, fontSize:10, fontWeight:700, cursor:"pointer", fontFamily:"'DM Sans',sans-serif"}}>
                            📤 Marcar enviado
                          </button>
                          <button onClick={()=>convertirAsesorAProspecto(solicitudActiva, m.lot.id)}
                            style={{padding:"6px 12px", borderRadius:6, border:"none", background:"linear-gradient(135deg,#15803d,#16a34a)", color:"#fff", fontSize:10, fontWeight:800, cursor:"pointer", fontFamily:"'DM Sans',sans-serif"}}>
                            ✅ Match → CRM
                          </button>
                        </div>
                      </div>
                    ))}
                    {calificados.length===0&&(
                      <div style={{padding:"18px", textAlign:"center", color:B.grey4, background:B.offW, borderRadius:8}}>
                        Ningún lote cumple con todos los criterios obligatorios. Revisa los descalificados abajo o ajusta el requerimiento.
                      </div>
                    )}
                    {descalificados.length>0&&(
                      <details style={{marginTop:14}}>
                        <summary style={{cursor:"pointer", fontSize:11, fontWeight:700, color:B.grey4, padding:"6px 0"}}>Ver {descalificados.length} descalificado(s)</summary>
                        {descalificados.map(m=>(
                          <div key={m.lot.id} style={{background:B.offW, border:"1px solid "+B.grey1, borderRadius:8, padding:"10px 12px", marginTop:6, borderLeft:"3px solid #dc2626"}}>
                            <div style={{fontSize:12, fontWeight:700, color:B.navy}}>{m.lot.nombre||m.lot.id}</div>
                            <div style={{fontSize:10, color:"#991b1b", marginTop:3}}>{m.descalificadores.join(" · ")}</div>
                          </div>
                        ))}
                      </details>
                    )}
                  </>
                );
              })()}
            </div>
            <div style={{padding:"12px 22px", borderTop:"1px solid "+B.grey1, background:B.offW, display:"flex", justifyContent:"flex-end"}}>
              <button onClick={()=>setShowMatchesModal(false)} style={{padding:"9px 18px", borderRadius:8, border:"1.5px solid "+B.grey1, background:B.white, color:B.navy, fontSize:12, fontWeight:700, cursor:"pointer", fontFamily:"'DM Sans',sans-serif"}}>
                Cerrar
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ═══════════════════════════════════════════════════════════════
          MODAL: Importación de Excel a Metas
          ═══════════════════════════════════════════════════════════════ */}
      {showImportModal&&(() => {
        const handleFileSelect = (e) => {
          const file = e.target.files&&e.target.files[0];
          if(!file) return;
          if(!/\.(xlsx|xls)$/i.test(file.name)){
            toast("⚠ El archivo debe ser .xlsx o .xls");
            return;
          }
          const reader = new FileReader();
          reader.onload = (ev) => {
            try{
              const result = parseExcelMetas(ev.target.result);
              // Calcular qué desarrollos son nuevos vs existentes
              const existentes = Object.keys(metasData);
              const nombresImportados = Object.keys(result.metas);
              result.desarrollosNuevos = nombresImportados.filter(n=>!existentes.includes(n));
              result.desarrollosActualizados = nombresImportados.filter(n=>existentes.includes(n));
              setImportPreview(result);
            }catch(err){
              setImportPreview({ok:false, errores:["Error leyendo archivo: "+err.message]});
            }
          };
          reader.onerror = () => setImportPreview({ok:false, errores:["No se pudo leer el archivo"]});
          reader.readAsArrayBuffer(file);
        };
        const confirmarImportacion = () => {
          if(!importPreview||!importPreview.ok) return;
          // Backup automático antes de sobreescribir
          try{ localStorage.setItem("macropro_metas_v1_backup", JSON.stringify(metasData)); }catch(e){}
          // Sobreescribir todo (decisión del usuario: sobreescribir, no fusionar)
          setMetasData(importPreview.metas);
          saveMetas(importPreview.metas);
          const total = Object.keys(importPreview.metas).length;
          const nuevos = importPreview.desarrollosNuevos.length;
          toast("✅ Importación completada: "+total+" desarrollos"+(nuevos>0?" ("+nuevos+" nuevos)":"")+". Backup guardado.");
          setShowImportModal(false);
          setImportPreview(null);
        };
        const restaurarBackup = () => {
          try{
            const raw = localStorage.getItem("macropro_metas_v1_backup");
            if(!raw){ toast("⚠ No hay backup disponible"); return; }
            const restored = JSON.parse(raw);
            if(!window.confirm("Restaurar metas desde el backup más reciente? (Antes de la última importación)")) return;
            setMetasData(restored);
            saveMetas(restored);
            toast("✅ Backup restaurado");
            setShowImportModal(false);
          }catch(e){ toast("⚠ Error restaurando backup: "+e.message); }
        };
        const hayBackup = !!localStorage.getItem("macropro_metas_v1_backup");
        return (
          <div style={{position:"fixed", inset:0, background:"rgba(0,0,0,0.55)", zIndex:2200, display:"flex", alignItems:"center", justifyContent:"center", padding:20}} onClick={e=>e.target===e.currentTarget&&setShowImportModal(false)}>
            <div style={{background:"#fff", borderRadius:14, width:"100%", maxWidth:640, boxShadow:"0 20px 60px rgba(0,43,73,0.3)", overflow:"hidden", maxHeight:"90vh", display:"flex", flexDirection:"column"}}>
              <div style={{background:"linear-gradient(135deg,#15803d,#16a34a)", padding:"18px 22px", display:"flex", justifyContent:"space-between", alignItems:"center"}}>
                <div>
                  <div style={{fontSize:10, fontWeight:700, color:"rgba(255,255,255,0.85)", letterSpacing:2, textTransform:"uppercase", marginBottom:3}}>📤 Importar metas</div>
                  <div style={{fontSize:18, fontWeight:800, color:"#fff", fontFamily:"'Playfair Display',serif"}}>Sincronizar desde Excel</div>
                </div>
                <button onClick={()=>{setShowImportModal(false);setImportPreview(null);}} style={{background:"rgba(255,255,255,0.2)", border:"none", color:"#fff", borderRadius:8, padding:"6px 10px", cursor:"pointer", fontSize:13, fontWeight:700, fontFamily:"'DM Sans',sans-serif"}}>✕</button>
              </div>

              <div style={{padding:"22px 24px", overflowY:"auto", flex:1}}>
                {!importPreview&&(
                  <>
                    <div style={{fontSize:13, color:B.navy, marginBottom:14, lineHeight:1.6}}>
                      Selecciona tu archivo de metas. El sistema leerá la hoja <strong>📋 Captura Ventas</strong> y actualizará automáticamente:
                    </div>
                    <ul style={{fontSize:12, color:B.grey4, lineHeight:1.8, marginBottom:18, paddingLeft:18}}>
                      <li><strong>Plan mensual</strong> por desarrollo (Ene-Dic, unidades y monto)</li>
                      <li><strong>Real mensual</strong> por desarrollo (lo que ya capturaste)</li>
                      <li>Desarrollos <strong>nuevos</strong> se crean automáticamente (con desarrollador inferido)</li>
                    </ul>
                    <div style={{padding:"12px 14px", background:"#fef3c7", borderRadius:8, fontSize:11, color:"#92400e", marginBottom:18, borderLeft:"3px solid #f59e0b"}}>

                    </div>
                    <label style={{display:"block", padding:"24px 18px", border:"2px dashed "+B.grey1, borderRadius:10, cursor:"pointer", textAlign:"center", background:B.offW, fontFamily:"'DM Sans',sans-serif"}}>

                      <div style={{fontSize:32, marginBottom:8}}>📁</div>
                      <div style={{fontSize:13, color:B.navy, fontWeight:700}}>Click para seleccionar archivo .xlsx</div>
                      <div style={{fontSize:11, color:B.grey3, marginTop:4}}>El archivo debe tener la hoja "📋 Captura Ventas"</div>
                    </label>
                    {hayBackup&&(
                      <div style={{marginTop:16, padding:"10px 14px", background:B.offW, borderRadius:8, border:"1px solid "+B.grey1, display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:8}}>
                        <div style={{fontSize:11, color:B.grey4}}>💾 Hay un backup de la importación anterior disponible</div>
                        <button onClick={restaurarBackup} style={{padding:"7px 14px", borderRadius:7, border:"1px solid "+B.grey1, background:B.white, color:B.navy, fontSize:11, fontWeight:700, cursor:"pointer", fontFamily:"'DM Sans',sans-serif"}}>
                          🔄 Restaurar backup
                        </button>
                      </div>
                    )}
                  </>
                )}

                {importPreview&&!importPreview.ok&&(
                  <div>
                    <div style={{padding:"12px 14px", background:"#fee2e2", borderRadius:8, marginBottom:14, borderLeft:"3px solid #dc2626"}}>
                      <div style={{fontSize:13, fontWeight:800, color:"#991b1b", marginBottom:6}}>❌ No se pudo procesar el archivo</div>
                      {(importPreview.errores||[]).map((err,i)=>(
                        <div key={i} style={{fontSize:11, color:"#7f1d1d", marginTop:3}}>· {err}</div>
                      ))}
                    </div>
                    <button onClick={()=>setImportPreview(null)} style={{padding:"9px 14px", borderRadius:8, border:"1.5px solid "+B.grey1, background:B.white, color:B.navy, fontSize:12, fontWeight:700, cursor:"pointer", fontFamily:"'DM Sans',sans-serif"}}>
                      ← Probar otro archivo
                    </button>
                  </div>
                )}

                {importPreview&&importPreview.ok&&(
                  <div>
                    <div style={{padding:"14px 16px", background:"#dcfce7", borderRadius:10, marginBottom:14, borderLeft:"3px solid #16a34a"}}>
                      <div style={{fontSize:13, fontWeight:800, color:"#15803d", marginBottom:8}}>✅ Archivo procesado correctamente</div>
                      <div style={{fontSize:12, color:"#166534", lineHeight:1.7}}>
                        Total desarrollos detectados: <strong>{Object.keys(importPreview.metas).length}</strong>
                      </div>
                    </div>

                    {importPreview.desarrollosActualizados.length>0&&(
                      <div style={{marginBottom:12}}>
                        <div style={{fontSize:11, fontWeight:800, color:B.navy, textTransform:"uppercase", letterSpacing:0.8, marginBottom:6}}>🔄 Se actualizarán ({importPreview.desarrollosActualizados.length})</div>
                        <div style={{display:"flex", flexWrap:"wrap", gap:5}}>
                          {importPreview.desarrollosActualizados.map(n=>(
                            <span key={n} style={{padding:"4px 10px", borderRadius:12, fontSize:11, fontWeight:600, background:"#dbeafe", color:"#1e40af"}}>{n}</span>
                          ))}
                        </div>
                      </div>
                    )}

                    {importPreview.desarrollosNuevos.length>0&&(
                      <div style={{marginBottom:12, padding:"10px 12px", background:"#fef3c7", borderRadius:8, borderLeft:"3px solid #f59e0b"}}>
                        <div style={{fontSize:11, fontWeight:800, color:"#92400e", textTransform:"uppercase", letterSpacing:0.8, marginBottom:6}}>✨ Desarrollos NUEVOS ({importPreview.desarrollosNuevos.length})</div>
                        <div style={{fontSize:11, color:"#78350f", marginBottom:6}}>Se crearán con desarrollador auto-detectado:</div>
                        <div style={{display:"flex", flexDirection:"column", gap:4}}>
                          {importPreview.desarrollosNuevos.map(n=>(
                            <div key={n} style={{fontSize:11, color:"#92400e"}}>· <strong>{n}</strong> → desarrollador: <strong>{importPreview.metas[n]?.desarrollador||"Otros"}</strong></div>
                          ))}
                        </div>
                      </div>
                    )}

                    {importPreview.advertencias.length>0&&(
                      <div style={{marginBottom:12, padding:"10px 12px", background:"#fef3c7", borderRadius:8, fontSize:11, color:"#78350f"}}>
                        <strong>⚠ Advertencias:</strong>
                        {importPreview.advertencias.map((a,i)=>(<div key={i} style={{marginTop:3}}>· {a}</div>))}
                      </div>
                    )}

                    {/* Preview de cifras */}
                    <div style={{marginTop:14}}>
                      <div style={{fontSize:11, fontWeight:800, color:B.navy, textTransform:"uppercase", letterSpacing:0.8, marginBottom:8}}>📋 Vista previa de totales (anuales)</div>
                      <div style={{overflowX:"auto"}}>
                        <table style={{width:"100%", borderCollapse:"collapse", fontSize:11}}>
                          <thead>
                            <tr style={{background:B.navy, color:B.white}}>
                              <th style={{padding:"7px 8px", textAlign:"left", fontSize:10, fontWeight:700}}>Desarrollo</th>
                              <th style={{padding:"7px 8px", textAlign:"left", fontSize:10, fontWeight:700}}>Desarrollador</th>
                              <th style={{padding:"7px 8px", textAlign:"center", fontSize:10, fontWeight:700}}>Plan U</th>
                              <th style={{padding:"7px 8px", textAlign:"center", fontSize:10, fontWeight:700}}>Real U</th>
                              <th style={{padding:"7px 8px", textAlign:"right", fontSize:10, fontWeight:700}}>Plan $</th>
                              <th style={{padding:"7px 8px", textAlign:"right", fontSize:10, fontWeight:700}}>Real $</th>
                            </tr>
                          </thead>
                          <tbody>
                            {Object.entries(importPreview.metas).map(([n,d],i)=>{
                              const planU = (d.plan?.uds||[]).reduce((a,b)=>a+(b||0),0);
                              const realU = (d.real?.uds||[]).reduce((a,b)=>a+(b||0),0);
                              const planM = (d.plan?.monto||[]).reduce((a,b)=>a+(b||0),0);
                              const realM = (d.real?.monto||[]).reduce((a,b)=>a+(b||0),0);
                              const isNuevo = importPreview.desarrollosNuevos.includes(n);
                              return (
                                <tr key={n} style={{borderBottom:"1px solid "+B.grey1, background:isNuevo?"#fef3c7":(i%2===0?B.white:B.offW)}}>
                                  <td style={{padding:"7px 8px", fontWeight:700, color:B.navy}}>{n} {isNuevo&&<span style={{fontSize:9, color:"#92400e", marginLeft:4}}>(NUEVO)</span>}</td>
                                  <td style={{padding:"7px 8px", color:B.grey4}}>{d.desarrollador}</td>
                                  <td style={{padding:"7px 8px", textAlign:"center", fontWeight:600}}>{planU}</td>
                                  <td style={{padding:"7px 8px", textAlign:"center", fontWeight:600, color:realU>0?"#15803d":B.grey3}}>{realU}</td>
                                  <td style={{padding:"7px 8px", textAlign:"right", color:B.grey4}}>{fmtMiles(planM)}</td>
                                  <td style={{padding:"7px 8px", textAlign:"right", color:realM>0?"#15803d":B.grey3, fontWeight:realM>0?700:400}}>{fmtMiles(realM)}</td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}
              </div>

              {importPreview&&importPreview.ok&&(
                <div style={{padding:"14px 22px", borderTop:"1px solid "+B.grey1, display:"flex", gap:10, justifyContent:"space-between", background:B.offW, flexWrap:"wrap"}}>
                  <button onClick={()=>setImportPreview(null)} style={{padding:"10px 16px", borderRadius:8, border:"1.5px solid "+B.grey1, background:B.white, color:B.navy, fontSize:12, fontWeight:700, cursor:"pointer", fontFamily:"'DM Sans',sans-serif"}}>
                    ← Cancelar
                  </button>
                  <button onClick={confirmarImportacion} style={{padding:"10px 22px", borderRadius:8, border:"none", background:"linear-gradient(135deg,#15803d,#16a34a)", color:"#fff", fontSize:12, fontWeight:800, cursor:"pointer", fontFamily:"'DM Sans',sans-serif", boxShadow:"0 2px 8px rgba(22,163,74,0.3)"}}>
                    ✓ Confirmar y reemplazar metas
                  </button>
                </div>
              )}
            </div>
          </div>
        );
      })()}

      {showAddClient&&(
        <div style={s.overlay} onClick={e=>e.target===e.currentTarget&&setShowAddClient(false)}>
          <div style={s.modal}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <div style={{fontSize:20,fontWeight:800,color:B.navy,fontFamily:"'Playfair Display',serif"}}>Nuevo Cliente</div>
              <button style={s.btn("ghost")} onClick={()=>setShowAddClient(false)}>✕</button>
            </div>
            {[["Nombre completo ★","nombre","text","Ej: Martín Campos"],["Empresa / Fondo","empresa","text","Ej: Campos Desarrollos"],["Asesor responsable","asesor","text","Ej: Sergio González"],["Ciudades de interés (separadas por coma)","ciudad_interes_raw","text","Ej: Zapopan, El Marqués"],["Usos de interés (separados por coma)","uso_interes_raw","text","Ej: Mixto H+C, Habitacional Vertical"],["Presupuesto mínimo (millones MXN)","presupuesto_min","number","Ej: 20"],["Presupuesto máximo (millones MXN)","presupuesto_max","number","Ej: 100"],["Superficie mínima (m²)","sup_min","number","Ej: 5000"],["Superficie máxima (m²)","sup_max","number","Ej: 20000"],["Notas / Perfil del cliente","notas","text","Descripción libre"]].map(([lbl,key,type,ph])=>(
              <div key={key} style={{marginBottom:12}}>
                <div style={{fontSize:12,fontWeight:600,color:B.grey4,marginBottom:4}}>{lbl}</div>
                {key==="notas"?<textarea style={{...s.input,width:"100%",height:64,resize:"none",padding:"9px 12px"}} placeholder={ph} value={newClient[key]||""} onChange={e=>setNewClient({...newClient,[key]:e.target.value})}/>:<input style={{...s.input,width:"100%"}} type={type} placeholder={ph} value={newClient[key]||""} onChange={e=>setNewClient({...newClient,[key]:e.target.value})}/>}
              </div>
            ))}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
              <div><div style={{fontSize:12,fontWeight:600,color:B.grey4,marginBottom:4}}>Temperatura</div><select style={{...s.select,width:"100%"}} value={newClient.temperatura} onChange={e=>setNewClient({...newClient,temperatura:e.target.value})}>{["Caliente","Tibio","Frío"].map(t=><option key={t}>{t}</option>)}</select></div>
              <div><div style={{fontSize:12,fontWeight:600,color:B.grey4,marginBottom:4}}>Status</div><select style={{...s.select,width:"100%"}} value={newClient.status} onChange={e=>setNewClient({...newClient,status:e.target.value})}>{["Nuevo","Calificado","Presentación activa","Negociando","Cerrado"].map(s=><option key={s}>{s}</option>)}</select></div>
            </div>
            <button style={{...s.btn("primary"),width:"100%",justifyContent:"center",padding:"13px"}} onClick={addClient}>➕ Agregar cliente</button>
          </div>
        </div>
      )}
      {selectedLotDetail&&<ModalFichaTecnica lot={selectedLotDetail} onClose={()=>setSelectedLotDetail(null)}/>}
      {/* Modal rápido: Asignar asesor a lote desde cualquier vista */}
      {quickAssignLot&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:3000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={e=>e.target===e.currentTarget&&setQuickAssignLot(null)}>
          <div style={{background:"#fff",borderRadius:14,width:"100%",maxWidth:540,boxShadow:"0 20px 60px rgba(0,43,73,0.35)",overflow:"hidden"}}>
            <div style={{background:"linear-gradient(135deg,#2563AC,#3B82F6)",padding:"18px 22px"}}>
              <div style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,0.85)",letterSpacing:2,textTransform:"uppercase",marginBottom:3,fontFamily:"'DM Sans',sans-serif"}}>👤 Asignar seguimiento por asesor</div>
              <div style={{fontSize:17,fontWeight:800,color:"#fff",fontFamily:"'Playfair Display',serif"}}>{quickAssignLot.nombre}</div>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.85)",marginTop:2,fontFamily:"'DM Sans',sans-serif"}}>{quickAssignLot.desarrollo}</div>
            </div>
            <div style={{padding:"20px 22px"}}>
              <div style={{fontSize:11,color:"#4b5563",marginBottom:14,lineHeight:1.5,padding:"10px 12px",background:"#eff6ff",borderRadius:8,borderLeft:"3px solid #3B82F6",fontFamily:"'DM Sans',sans-serif"}}>
                Este lote no tiene cliente identificado aún. Asigna a un asesor responsable y lo agregas al CRM para darle seguimiento. Cuando tengas nombre del cliente, podrás convertirlo a prospecto formal.
              </div>
              <label style={{fontSize:10,fontWeight:800,color:"#002B49",textTransform:"uppercase",letterSpacing:0.8,display:"block",marginBottom:5,fontFamily:"'DM Sans',sans-serif"}}>Asesor responsable *</label>
              {asesoresCatalog.length>0?(
                <select value={quickAssignForm.asesor} onChange={e=>setQuickAssignForm({...quickAssignForm,asesor:e.target.value})}
                  style={{width:"100%",padding:"10px 12px",borderRadius:8,border:"1.5px solid #e5e7eb",fontSize:12,fontFamily:"'DM Sans',sans-serif",outline:"none",marginBottom:14,boxSizing:"border-box",background:"#fff"}}>
                  <option value="">— Selecciona asesor —</option>
                  {asesoresCatalog.map(a=><option key={a.id} value={a.nombre}>{a.nombre}{a.zona?" · "+a.zona:""}</option>)}
                </select>
              ):(
                <input type="text" value={quickAssignForm.asesor} onChange={e=>setQuickAssignForm({...quickAssignForm,asesor:e.target.value})}
                  placeholder="Nombre del asesor"
                  style={{width:"100%",padding:"10px 12px",borderRadius:8,border:"1.5px solid #e5e7eb",fontSize:12,fontFamily:"'DM Sans',sans-serif",outline:"none",marginBottom:14,boxSizing:"border-box"}}/>
              )}
              <label style={{fontSize:10,fontWeight:800,color:"#002B49",textTransform:"uppercase",letterSpacing:0.8,display:"block",marginBottom:5,fontFamily:"'DM Sans',sans-serif"}}>Notas iniciales (opcional)</label>
              <textarea value={quickAssignForm.notas} onChange={e=>setQuickAssignForm({...quickAssignForm,notas:e.target.value})}
                placeholder="Ej: Jessica me pidió este lote para un cliente suyo, pendiente confirmar datos..."
                style={{width:"100%",minHeight:70,padding:"10px 12px",borderRadius:8,border:"1.5px solid #e5e7eb",fontSize:12,fontFamily:"'DM Sans',sans-serif",outline:"none",resize:"vertical",boxSizing:"border-box"}}/>
            </div>
            <div style={{padding:"14px 22px",borderTop:"1px solid #e5e7eb",display:"flex",gap:10,justifyContent:"flex-end",background:"#f7f8fa"}}>
              <button onClick={()=>setQuickAssignLot(null)} style={{background:"#fff",border:"1.5px solid #e5e7eb",color:"#4b5563",borderRadius:8,padding:"10px 18px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>Cancelar</button>
              <button onClick={executeQuickAssign}
                style={{background:"#2563AC",color:"#fff",border:"none",borderRadius:8,padding:"10px 22px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>
                ✓ Asignar y agregar al CRM
              </button>
            </div>
          </div>
        </div>
      )}
      {/* Modal rápido: Asignar CLIENTE a lote (desde inventario, sin pasar por match) */}
      {quickClientLot&&(() => {
        const srcClients=clients.length>0?clients:DEMO_CLIENTS;
        // Asesores únicos para el filtro
        const asesoresUnicos=[...new Set(srcClients.map(c=>c.asesor).filter(Boolean))].sort();
        // Ya asignados a este lote (para marcarlos)
        const yaAsignados=new Set(((crmData[quickClientLot.id]||{}).prospectos||[]).map(p=>p.nombre&&p.nombre.toLowerCase().trim()));
        // Aplicar filtros
        const q=quickClientSearch.trim().toLowerCase();
        const filtrados=srcClients.filter(c=>{
          if(quickClientFilterAsesor!=="Todos"&&c.asesor!==quickClientFilterAsesor) return false;
          if(q){
            const match=(c.nombre&&c.nombre.toLowerCase().includes(q))
              ||(c.empresa&&c.empresa.toLowerCase().includes(q))
              ||(c.ciudad_interes_raw&&c.ciudad_interes_raw.toLowerCase().includes(q))
              ||(c.asesor&&c.asesor.toLowerCase().includes(q));
            if(!match) return false;
          }
          return true;
        }).slice(0,50); // límite para no saturar DOM

        return (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:3000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={e=>e.target===e.currentTarget&&setQuickClientLot(null)}>
          <div style={{background:"#fff",borderRadius:14,width:"100%",maxWidth:640,maxHeight:"85vh",boxShadow:"0 20px 60px rgba(0,43,73,0.35)",overflow:"hidden",display:"flex",flexDirection:"column"}}>
            <div style={{background:"linear-gradient(135deg,#15803d,#22c55e)",padding:"18px 22px",flexShrink:0}}>
              <div style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,0.85)",letterSpacing:2,textTransform:"uppercase",marginBottom:3,fontFamily:"'DM Sans',sans-serif"}}>👥 Asignar cliente a lote</div>
              <div style={{fontSize:17,fontWeight:800,color:"#fff",fontFamily:"'Playfair Display',serif"}}>{quickClientLot.nombre}</div>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.85)",marginTop:2,fontFamily:"'DM Sans',sans-serif"}}>{quickClientLot.desarrollo}</div>
            </div>
            <div style={{padding:"14px 20px",borderBottom:"1px solid #e5e7eb",flexShrink:0,background:"#f7f8fa"}}>
              <input type="text" value={quickClientSearch} onChange={e=>setQuickClientSearch(e.target.value)}
                placeholder="🔍 Buscar por nombre, empresa, ciudad, asesor..."
                autoFocus
                style={{width:"100%",padding:"10px 14px",borderRadius:8,border:"1.5px solid #e5e7eb",fontSize:13,fontFamily:"'DM Sans',sans-serif",outline:"none",marginBottom:8,boxSizing:"border-box"}}/>
              <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                <span style={{fontSize:10,fontWeight:700,color:"#4b5563",textTransform:"uppercase",letterSpacing:0.8,fontFamily:"'DM Sans',sans-serif"}}>Asesor:</span>
                <select value={quickClientFilterAsesor} onChange={e=>setQuickClientFilterAsesor(e.target.value)}
                  style={{padding:"5px 10px",borderRadius:6,border:"1.5px solid #e5e7eb",fontSize:11,fontFamily:"'DM Sans',sans-serif",fontWeight:600,color:"#002B49",background:"#fff",cursor:"pointer",outline:"none"}}>
                  <option value="Todos">Todos</option>
                  {asesoresUnicos.map(a=><option key={a} value={a}>{a}</option>)}
                </select>
                <span style={{fontSize:10,color:"#6b7280",marginLeft:"auto",fontFamily:"'DM Sans',sans-serif"}}>{filtrados.length} cliente{filtrados.length!==1?"s":""}{srcClients.length>50?" (máx 50)":""}</span>
              </div>
            </div>
            <div style={{flex:1,overflowY:"auto",padding:"10px 16px"}}>
              {filtrados.length===0&&(
                <div style={{textAlign:"center",padding:40,color:"#9ca3af"}}>
                  <div style={{fontSize:32,marginBottom:8}}>🔍</div>
                  <div style={{fontSize:13,fontWeight:700,color:"#4b5563",fontFamily:"'DM Sans',sans-serif"}}>Sin clientes con estos criterios</div>
                  <div style={{fontSize:11,marginTop:4,fontFamily:"'DM Sans',sans-serif"}}>Prueba con otro término o quita filtros</div>
                </div>
              )}
              {filtrados.map((c,i)=>{
                const asignado=yaAsignados.has(c.nombre&&c.nombre.toLowerCase().trim());
                const tempCol=c.temperatura==="Caliente"?"#dc2626":c.temperatura==="Tibio"?"#f59e0b":c.temperatura==="Frío"?"#3B82F6":"#9ca3af";
                return (
                  <div key={c.id||i} onClick={()=>{if(!asignado)executeQuickClient(c);}}
                    style={{background:asignado?"#f3f4f6":"#fff",borderRadius:10,padding:"12px 14px",marginBottom:8,border:"1.5px solid "+(asignado?"#d1d5db":"#e5e7eb"),cursor:asignado?"not-allowed":"pointer",opacity:asignado?0.6:1,transition:"all 0.15s"}}
                    onMouseEnter={e=>{if(!asignado){e.currentTarget.style.borderColor="#22c55e";e.currentTarget.style.background="#f0fdf4";e.currentTarget.style.boxShadow="0 3px 10px rgba(34,197,94,0.15)";}}}
                    onMouseLeave={e=>{if(!asignado){e.currentTarget.style.borderColor="#e5e7eb";e.currentTarget.style.background="#fff";e.currentTarget.style.boxShadow="none";}}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,flexWrap:"wrap"}}>
                      <div style={{flex:"1 1 200px",minWidth:180}}>
                        <div style={{fontSize:13,fontWeight:800,color:"#002B49",marginBottom:3,fontFamily:"'DM Sans',sans-serif"}}>{c.nombre}</div>
                        {c.empresa&&<div style={{fontSize:11,color:"#4b5563",marginBottom:4,fontFamily:"'DM Sans',sans-serif"}}>🏢 {c.empresa}</div>}
                        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
                          {c.ciudad_interes_raw&&<span style={{fontSize:10,color:"#6b7280",fontFamily:"'DM Sans',sans-serif"}}>📍 {c.ciudad_interes_raw}</span>}
                          {c.temperatura&&<span style={{fontSize:10,color:tempCol,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>🌡 {c.temperatura}</span>}
                          {c.asesor&&<span style={{fontSize:10,color:"#2563AC",fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>👤 {c.asesor}</span>}
                        </div>
                      </div>
                      <div style={{flexShrink:0}}>
                        {asignado?(
                          <span style={{padding:"4px 10px",background:"#d1d5db",color:"#6b7280",borderRadius:6,fontSize:10,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>✓ Ya asignado</span>
                        ):(
                          <span style={{padding:"6px 12px",background:"#16a34a",color:"#fff",borderRadius:6,fontSize:11,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>+ Asignar</span>
                        )}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
            <div style={{padding:"12px 20px",borderTop:"1px solid #e5e7eb",background:"#f7f8fa",flexShrink:0}}>
              <label style={{fontSize:10,fontWeight:800,color:"#002B49",textTransform:"uppercase",letterSpacing:0.8,display:"block",marginBottom:5,fontFamily:"'DM Sans',sans-serif"}}>Nota inicial (opcional)</label>
              <input type="text" value={quickClientNota} onChange={e=>setQuickClientNota(e.target.value)}
                placeholder="Ej: referido de Juan, interesado en financiamiento..."
                style={{width:"100%",padding:"8px 12px",borderRadius:8,border:"1.5px solid #e5e7eb",fontSize:12,fontFamily:"'DM Sans',sans-serif",outline:"none",boxSizing:"border-box"}}/>
              <div style={{display:"flex",justifyContent:"flex-end",marginTop:10}}>
                <button onClick={()=>setQuickClientLot(null)} style={{background:"#fff",border:"1.5px solid #e5e7eb",color:"#4b5563",borderRadius:8,padding:"8px 16px",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>Cerrar</button>
              </div>
            </div>
          </div>
        </div>
        );
      })()}

      {/* Modal: Instrucciones instalación iOS (Safari no tiene prompt nativo) */}
      {showIOSInstallHint&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.65)",zIndex:3100,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={e=>e.target===e.currentTarget&&setShowIOSInstallHint(false)}>
          <div style={{background:"#fff",borderRadius:16,width:"100%",maxWidth:440,boxShadow:"0 20px 60px rgba(0,43,73,0.4)",overflow:"hidden"}}>
            <div style={{background:"linear-gradient(135deg,#8B5CF6,#a78bfa)",padding:"20px 24px",textAlign:"center"}}>
              <div style={{fontSize:36,marginBottom:4}}>📱</div>
              <div style={{fontSize:18,fontWeight:800,color:"#fff",fontFamily:"'Playfair Display',serif"}}>Instala MacroPro en tu iPhone</div>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.85)",marginTop:4,fontFamily:"'DM Sans',sans-serif"}}>Funciona como app nativa sin barra del navegador</div>
            </div>
            <div style={{padding:"22px 24px"}}>
              <div style={{fontSize:12,color:"#4b5563",marginBottom:16,lineHeight:1.6,fontFamily:"'DM Sans',sans-serif"}}>Safari en iOS no permite instalación automática. Sigue estos 3 pasos desde tu iPhone:</div>
              <div style={{display:"flex",flexDirection:"column",gap:12}}>
                <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
                  <div style={{width:30,height:30,borderRadius:"50%",background:"#8B5CF6",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:14,flexShrink:0}}>1</div>
                  <div style={{fontSize:13,color:"#002B49",fontFamily:"'DM Sans',sans-serif",lineHeight:1.5}}>Toca el botón <strong>Compartir</strong> <span style={{display:"inline-block",padding:"2px 8px",background:"#f3f4f6",borderRadius:4,fontSize:11,fontWeight:700}}>⎙</span> en la barra inferior de Safari</div>
                </div>
                <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
                  <div style={{width:30,height:30,borderRadius:"50%",background:"#8B5CF6",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:14,flexShrink:0}}>2</div>
                  <div style={{fontSize:13,color:"#002B49",fontFamily:"'DM Sans',sans-serif",lineHeight:1.5}}>Desplázate y toca <strong>"Añadir a pantalla de inicio"</strong> <span style={{fontSize:14}}>➕</span></div>
                </div>
                <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
                  <div style={{width:30,height:30,borderRadius:"50%",background:"#8B5CF6",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:14,flexShrink:0}}>3</div>
                  <div style={{fontSize:13,color:"#002B49",fontFamily:"'DM Sans',sans-serif",lineHeight:1.5}}>Confirma tocando <strong>"Añadir"</strong>. El icono de MacroPro aparecerá en tu home.</div>
                </div>
              </div>
              <div style={{marginTop:18,padding:"10px 12px",background:"#eff6ff",borderRadius:8,borderLeft:"3px solid #3B82F6",fontSize:11,color:"#1e40af",lineHeight:1.5,fontFamily:"'DM Sans',sans-serif"}}>
                💡 Una vez instalada, ábrela como cualquier app. Tus datos quedan guardados ahí y funciona sin internet.
              </div>
            </div>
            <div style={{padding:"14px 24px",borderTop:"1px solid #e5e7eb",background:"#f7f8fa",textAlign:"right"}}>
              <button onClick={()=>setShowIOSInstallHint(false)} style={{background:"#8B5CF6",color:"#fff",border:"none",borderRadius:8,padding:"10px 22px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>Entendido</button>
            </div>
          </div>
        </div>
      )}
      {loading&&<LoadingView/>}
      {toastMsg&&<div style={s.toast}>{toastMsg}</div>}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={hasError:false,error:null};}
  static getDerivedStateFromError(err){return {hasError:true,error:err};}
  componentDidCatch(err,info){console.error("MacroPro crash:",err,info);}
  render(){
    if(this.state.hasError){
      const e=this.state.error;
      return React.createElement("div",{style:{padding:40,fontFamily:"monospace",background:"#fef2f2",minHeight:"100vh"}},
        React.createElement("div",{style:{fontSize:20,fontWeight:800,color:"#dc2626",marginBottom:12}},"⚠ Error de aplicación — Reporte al desarrollador"),
        React.createElement("div",{style:{fontSize:14,color:"#7f1d1d",marginBottom:8}},e&&e.message),
        React.createElement("pre",{style:{fontSize:11,background:"#fff",padding:16,borderRadius:8,overflow:"auto",border:"1px solid #fca5a5"}},e&&e.stack),
        React.createElement("button",{onClick:()=>window.location.reload(),style:{marginTop:16,padding:"10px 20px",background:"#dc2626",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:14}},"🔄 Recargar aplicación")
      );
    }
    return this.props.children;
  }
}

ReactDOM.render(React.createElement(ErrorBoundary,null,React.createElement(MacroProMatcher)), document.getElementById("root"));




</script>
</body>
