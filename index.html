const { useState, useRef, useCallback } = React;

// ═══════════════════════════════════════════════════════════════════
// SUPABASE CLIENT — Conexión a base de datos en la nube
// Fase 2: Solo setup, no se usa todavía para guardar datos.
// Inicialización perezosa (por si la librería tarda en cargar).
// ═══════════════════════════════════════════════════════════════════
const SUPABASE_URL = "https://xugrrabebphdelgwqnwc.supabase.co";
const SUPABASE_KEY = "sb_publishable_n-EUveYY5vHlCQdDLEOU7w_4ndCZaJ0";
// IMPORTANTE: usamos 'sb' (no 'supabase') para no colisionar con window.supabase (la librería)
let sb = null;
function initSupabase() {
  if (sb) return sb;
  const lib = window.supabase;
  if (lib && typeof lib.createClient === 'function') {
    try {
      sb = lib.createClient(SUPABASE_URL, SUPABASE_KEY);
      window.sb = sb;           // Accesible globalmente para debug
      window.__supabase = sb;   // Alias compatibilidad
      console.log("✅ Supabase conectado:", SUPABASE_URL);
      return sb;
    } catch(err) {
      console.error("❌ Error conectando a Supabase:", err);
      return null;
    }
  }
  return null;
}
// Intento inmediato
initSupabase();
// Reintento: CDN puede tardar 1-3 segundos; reintento 30 veces cada 300ms = 9s total
if (!sb) {
  let attempts = 0;
  const retry = setInterval(() => {
    attempts++;
    if (initSupabase() || attempts > 30) {
      clearInterval(retry);
      if (!sb) console.warn("⚠ Supabase no disponible después de 30 intentos (9s). Revisa conexión a CDN.");
    }
  }, 300);
}

// ═══════════════════════════════════════════════════════════════════
// SUPABASE HELPERS — Funciones utilitarias para migración
// Todas retornan { success: bool, count: num, errors: [], message: str }
// ═══════════════════════════════════════════════════════════════════

// Espera hasta que el cliente Supabase esté listo (o timeout)
async function waitForSupabase(timeoutMs = 10000) {
  const start = Date.now();
  while (!sb && (Date.now() - start) < timeoutMs) {
    await new Promise(r => setTimeout(r, 200));
  }
  return !!sb;
}

// Genera clave única para un lote: ID Macrolote limpio (sin sufijo -rN interno)
function loteKey(lote) {
  // El ID interno tiene formato "ML_001-r5" — quitamos el "-rN"
  const idRaw = (lote.id || lote.id_macrolote || "").toString().trim();
  const idLimpio = idRaw.replace(/-r\d+$/, '').trim();
  if (idLimpio) return idLimpio.toLowerCase().replace(/\s+/g, '_');
  // Fallback: nombre+desarrollo
  const nombre = (lote.nombre_lote || lote.nombre || "").toString().trim();
  const desarrollo = (lote.desarrollo || "").toString().trim();
  return `${nombre}__${desarrollo}`.toLowerCase().replace(/\s+/g, '_');
}

// Transforma un lote del localStorage al formato de la tabla Supabase 'lotes'
function loteToSupabase(lote) {
  const nombre = (lote.nombre_lote || lote.nombre || "").toString().trim();
  const desarrollo = (lote.desarrollo || "").toString().trim();
  const idRaw = (lote.id || lote.id_macrolote || "").toString().trim();
  const idLimpio = idRaw.replace(/-r\d+$/, '').trim();
  // precio_total = null si es 0 o no viene (acordado: lotes sin precio visibles con flag)
  const precioTotalRaw = Number(lote.precio_total);
  const precioM2Raw = Number(lote.precio_m2);
  const precioTotal = (precioTotalRaw > 0) ? precioTotalRaw : null;
  const precioM2 = (precioM2Raw > 0) ? precioM2Raw : null;
  return {
    clave_unica: loteKey(lote),
    id_macrolote: idLimpio || null,
    nombre: nombre,
    desarrollo: desarrollo || null,
    desarrollador: lote.desarrollador || null,
    ciudad: lote.ciudad || null,
    estado: lote.estado || null,
    sup_m2: Number(lote.sup_m2) || null,
    precio_m2: precioM2,
    precio_total: precioTotal,
    precio_pendiente: (precioTotal === null),  // flag para UI
    uso: lote.uso || null,
    usos_todos: Array.isArray(lote.usos_todos) ? lote.usos_todos : (lote.uso ? [lote.uso] : []),
    status_inventario: lote.status || lote.status_inventario || 'Disponible',
    fecha_ingreso: lote.fecha_ingreso || null  // null permitido (acordado)
  };
}

// Transforma un cliente del localStorage al formato de la tabla Supabase 'clientes'
function clienteToSupabase(cliente) {
  const email = (cliente.email || "").toString().trim().toLowerCase();
  if (!email) return null; // Sin email no se puede migrar (clave única acordada)
  return {
    email: email,
    id_cliente: (cliente.id || cliente.id_cliente || "").toString().trim() || null,
    nombre: cliente.nombre || null,
    empresa: cliente.empresa || null,
    telefono: cliente.telefono ? cliente.telefono.toString() : null,
    asesor: cliente.asesor || null,
    tipo_comprador: cliente.tipo_comprador || null,
    ciudad_interes: Array.isArray(cliente.ciudad_interes) ? cliente.ciudad_interes : [],
    uso_interes: Array.isArray(cliente.uso_interes) ? cliente.uso_interes : [],
    presupuesto_min: Number(cliente.presupuesto_min) || null,
    presupuesto_max: Number(cliente.presupuesto_max) || null,
    sup_min: Number(cliente.sup_min) || null,
    sup_max: Number(cliente.sup_max) || null,
    temperatura: cliente.temperatura || null,
    status: cliente.status || null,
    plazo_cierre: cliente.plazo_cierre || null,
    deal_breakers: Array.isArray(cliente.deal_breakers) ? cliente.deal_breakers : [],
    activo: cliente.activo !== false
  };
}

// Subir lotes en lotes (batch) a Supabase — upsert por clave_unica
async function migrarLotesASupabase(lotes, onProgress) {
  const ok = await waitForSupabase();
  if (!ok) return { success: false, count: 0, errors: ['Supabase no disponible'], message: 'Timeout esperando Supabase' };
  
  const BATCH_SIZE = 50;
  // Filtrar: requerimos nombre y clave_unica válida (desarrollo puede venir vacío)
  const rows = lotes.map(loteToSupabase).filter(r => r.nombre && r.clave_unica && r.clave_unica.length > 1);
  const skipped = lotes.length - rows.length;
  let uploaded = 0;
  const errors = [];
  
  for (let i = 0; i < rows.length; i += BATCH_SIZE) {
    const batch = rows.slice(i, i + BATCH_SIZE);
    try {
      const { data, error } = await sb.from('lotes').upsert(batch, { onConflict: 'clave_unica' }).select('id');
      if (error) {
        errors.push(`Batch ${Math.floor(i/BATCH_SIZE)+1}: ${error.message}`);
      } else {
        uploaded += (data?.length || batch.length);
      }
    } catch (err) {
      errors.push(`Batch ${Math.floor(i/BATCH_SIZE)+1}: ${err.message}`);
    }
    if (onProgress) onProgress(uploaded, rows.length);
  }
  
  return {
    success: errors.length === 0,
    count: uploaded,
    skipped: skipped,
    errors: errors,
    message: errors.length === 0
      ? `✓ ${uploaded} lotes migrados${skipped ? ` (${skipped} omitidos por datos incompletos)` : ''}`
      : `⚠ ${uploaded}/${rows.length} migrados. ${errors.length} errores.`
  };
}

// Subir clientes en batch a Supabase — upsert por email
async function migrarClientesASupabase(clientes, onProgress) {
  const ok = await waitForSupabase();
  if (!ok) return { success: false, count: 0, errors: ['Supabase no disponible'], message: 'Timeout esperando Supabase' };
  
  const BATCH_SIZE = 50;
  const rows = clientes.map(clienteToSupabase).filter(r => r !== null);
  const skipped = clientes.length - rows.length;
  let uploaded = 0;
  const errors = [];
  
  for (let i = 0; i < rows.length; i += BATCH_SIZE) {
    const batch = rows.slice(i, i + BATCH_SIZE);
    try {
      const { data, error } = await sb.from('clientes').upsert(batch, { onConflict: 'email' }).select('id');
      if (error) {
        errors.push(`Batch ${Math.floor(i/BATCH_SIZE)+1}: ${error.message}`);
      } else {
        uploaded += (data?.length || batch.length);
      }
    } catch (err) {
      errors.push(`Batch ${Math.floor(i/BATCH_SIZE)+1}: ${err.message}`);
    }
    if (onProgress) onProgress(uploaded, rows.length);
  }
  
  return {
    success: errors.length === 0,
    count: uploaded,
    skipped: skipped,
    errors: errors,
    message: errors.length === 0
      ? `✓ ${uploaded} clientes migrados${skipped ? ` (${skipped} omitidos — sin email)` : ''}`
      : `⚠ ${uploaded}/${rows.length} migrados. ${errors.length} errores.`
  };
}

// Migrar CRM (seguimientos por lote) a tabla crm_lotes
// Requiere que los lotes ya estén migrados para obtener sus IDs
async function migrarCRMASupabase(crmData, onProgress) {
  const ok = await waitForSupabase();
  if (!ok) return { success: false, count: 0, errors: ['Supabase no disponible'], message: 'Timeout esperando Supabase' };
  
  // 1. Traer todos los lotes de Supabase para mapear clave_unica -> id
  const { data: lotesDb, error: errLotes } = await sb.from('lotes').select('id, clave_unica');
  if (errLotes) return { success: false, count: 0, errors: [errLotes.message], message: 'Error leyendo lotes de Supabase' };
  
  const claveToId = {};
  lotesDb.forEach(l => { claveToId[l.clave_unica] = l.id; });
  
  // 2. Construir filas crm_lotes
  const rows = [];
  const skippedKeys = [];
  Object.entries(crmData || {}).forEach(([loteClaveOriginal, info]) => {
    // El CRM usa el "ID" del lote como clave (ej: "KU-17-r119")
    // Necesitamos reconstruir la clave_unica real a partir del lote
    // Buscamos en el inventario el lote correspondiente
    const lotesInv = JSON.parse(localStorage.getItem('macropro_inventario') || '[]');
    const loteInv = lotesInv.find(l => l.id === loteClaveOriginal || loteKey(l) === loteClaveOriginal);
    if (!loteInv) {
      skippedKeys.push(loteClaveOriginal);
      return;
    }
    const clave = loteKey(loteInv);
    const loteId = claveToId[clave];
    if (!loteId) {
      skippedKeys.push(loteClaveOriginal);
      return;
    }
    rows.push({
      lote_id: loteId,
      pipeline: info.pipeline || 'Prospecto',
      asesor_asignado: info.asesorResponsable || null,
      prospectos: info.prospectos || [],
      interacciones: info.interacciones || [],
      dev_feedback: info.devFeedback || [],
      seguimientos_asesor: info.seguimientosAsesor || []
    });
  });
  
  // 3. Upsert en batches
  const BATCH_SIZE = 25; // menor porque tienen JSONB pesado
  let uploaded = 0;
  const errors = [];
  for (let i = 0; i < rows.length; i += BATCH_SIZE) {
    const batch = rows.slice(i, i + BATCH_SIZE);
    try {
      const { data, error } = await sb.from('crm_lotes').upsert(batch, { onConflict: 'lote_id' }).select('lote_id');
      if (error) errors.push(`Batch ${Math.floor(i/BATCH_SIZE)+1}: ${error.message}`);
      else uploaded += (data?.length || batch.length);
    } catch (err) {
      errors.push(`Batch ${Math.floor(i/BATCH_SIZE)+1}: ${err.message}`);
    }
    if (onProgress) onProgress(uploaded, rows.length);
  }
  
  return {
    success: errors.length === 0,
    count: uploaded,
    skipped: skippedKeys.length,
    errors: errors,
    message: errors.length === 0
      ? `✓ ${uploaded} seguimientos CRM migrados${skippedKeys.length ? ` (${skippedKeys.length} omitidos — lote no encontrado en nube)` : ''}`
      : `⚠ ${uploaded}/${rows.length} migrados. ${errors.length} errores.`
  };
}

// Contar registros en una tabla (para verificar migración)
async function contarEnSupabase(tabla) {
  const ok = await waitForSupabase();
  if (!ok) return { count: 0, error: 'Supabase no disponible' };
  try {
    const { count, error } = await sb.from(tabla).select('*', { count: 'exact', head: true });
    if (error) return { count: 0, error: error.message };
    return { count: count || 0, error: null };
  } catch (err) {
    return { count: 0, error: err.message };
  }
}

// Exponer helpers globalmente para uso en consola/debug
if (typeof window !== 'undefined') {
  window.sbHelpers = {
    migrarLotes: migrarLotesASupabase,
    migrarClientes: migrarClientesASupabase,
    migrarCRM: migrarCRMASupabase,
    contar: contarEnSupabase,
    loteKey: loteKey
  };
}

// Migración silenciosa: corrige desarrolladores residuales "Otros" si ahora hay mapeo conocido
// También corrige cualquier desarrollador que NO esté en la lista oficial pero coincida con un mapeo
function migrarMetasResiduales(metas){
  if(!metas||typeof metas!=="object") return metas;
  let cambios = 0;
  const mapeo = (typeof loadMapeoDesarrollador==="function")?loadMapeoDesarrollador():{};
  Object.entries(metas).forEach(([nombre, d])=>{
    if(!d||typeof d!=="object") return;
    const actual = d.desarrollador;
    const sugerido = inferirDesarrollador(nombre, mapeo);
    // Reasignar si: actual es "Otros"/vacío, O actual no está en lista oficial y sugerido sí
    const actualEsOficial = DESARROLLADORES_OFICIALES.includes(actual);
    const sugeridoEsOficial = DESARROLLADORES_OFICIALES.includes(sugerido);
    if((!actual||actual==="Otros"||(!actualEsOficial&&sugeridoEsOficial))&&sugerido&&sugerido!==actual){
      d.desarrollador = sugerido;
      cambios++;
    }
  });
  if(cambios>0) console.log("Migración Metas: "+cambios+" desarrollos reasignados a desarrollador correcto");
  return metas;
}

// Auto-popular Metas con desarrollos detectados en inventario que no están en metas
// Crea entradas con valores en cero, listas para que el usuario las llene
function autoPopularMetasDesdeInventario(metas, inventory){
  if(!metas||!Array.isArray(inventory)||inventory.length===0) return { metas, agregados:[] };
  const desarrollosEnInventario = new Set();
  inventory.forEach(lot=>{
    if(lot&&lot.desarrollo) desarrollosEnInventario.add(String(lot.desarrollo).trim());
  });
  const agregados = [];
  desarrollosEnInventario.forEach(desarrollo=>{
    if(!desarrollo) return;
    if(!metas[desarrollo]){
      // Inferir desarrollador desde mapeo (que ya fue enriquecido por aprenderMapeoDesdeInventario)
      const desarrollador = inferirDesarrollador(desarrollo);
      metas[desarrollo] = {
        desarrollador,
        plan: { uds:new Array(12).fill(0), monto:new Array(12).fill(0) },
        real: { uds:new Array(12).fill(0), monto:new Array(12).fill(0) }
      };
      agregados.push({ desarrollo, desarrollador });
    }
  });
  if(agregados.length>0) console.log("Auto-popular Metas: "+agregados.length+" desarrollos agregados desde inventario:", agregados.map(a=>`${a.desarrollo} (${a.desarrollador})`).join(", "));
  return { metas, agregados };
}

// Defensive load: si localStorage tiene datos los usa, si no inicializa con seed
function loadMetas(){
  try{
    const raw=localStorage.getItem(METAS_KEY);
    if(!raw) return migrarMetasResiduales(JSON.parse(JSON.stringify(METAS_SEED)));
    const parsed=JSON.parse(raw);
    if(typeof parsed!=="object"||parsed===null) return migrarMetasResiduales(JSON.parse(JSON.stringify(METAS_SEED)));
    const migrado = migrarMetasResiduales(parsed);
    try{ localStorage.setItem(METAS_KEY, JSON.stringify(migrado)); }catch(e){}
    return migrado;
  }catch(e){
    console.warn("Error cargando metas, usando seed:",e);
    return migrarMetasResiduales(JSON.parse(JSON.stringify(METAS_SEED)));
  }
}

// Helper: calcular totales y % cumplimiento
function calcularMetasResumen(metas, filtroDesarrollador, filtroDesarrollo){
  let planUdsTotal=0, planMontoTotal=0, realUdsTotal=0, realMontoTotal=0;
  const porDesarrollo=[];
  Object.entries(metas||{}).forEach(([nombre, d])=>{
    if(!d||!d.plan||!d.real) return;
    if(filtroDesarrollador&&filtroDesarrollador!=="Todos"&&d.desarrollador!==filtroDesarrollador) return;
    if(filtroDesarrollo&&filtroDesarrollo!=="Todos"&&nombre!==filtroDesarrollo) return;
    const planU=(d.plan.uds||[]).reduce((a,b)=>a+(b||0),0);
    const planM=(d.plan.monto||[]).reduce((a,b)=>a+(b||0),0);
    const realU=(d.real.uds||[]).reduce((a,b)=>a+(b||0),0);
    const realM=(d.real.monto||[]).reduce((a,b)=>a+(b||0),0);
    planUdsTotal+=planU; planMontoTotal+=planM; realUdsTotal+=realU; realMontoTotal+=realM;
    porDesarrollo.push({nombre, desarrollador:d.desarrollador, planUds:planU, planMonto:planM, realUds:realU, realMonto:realM});
  });
  const cumplUds=planUdsTotal>0?(realUdsTotal/planUdsTotal):(realUdsTotal>0?1.5:0);
  const cumplMonto=planMontoTotal>0?(realMontoTotal/planMontoTotal):(realMontoTotal>0?1.5:0);
  return { planUdsTotal, planMontoTotal, realUdsTotal, realMontoTotal, cumplUds, cumplMonto, porDesarrollo };
}

// Match automático: busca lotes del inventario que cumplan con los criterios
function buscarMatchesParaSolicitud(solicitud, inventory){
  if(!solicitud||!Array.isArray(inventory)) return [];
  const supMin = parseFloat(solicitud.superficieMin)||0;
  const supMax = parseFloat(solicitud.superficieMax)||Infinity;
  const frenteMin = parseFloat(solicitud.frenteMinimo)||0;
  const precioMax = parseFloat(solicitud.precioMaximo)||Infinity;
  const estado = (solicitud.estado||"").trim().toLowerCase();
  const ciudad = (solicitud.ciudad||"").trim().toLowerCase();
  const usoSuelo = (solicitud.usoSuelo||"").trim().toLowerCase();
  return inventory.map(lot=>{
    if(!lot) return null;
    const sup = parseFloat(lot.superficie)||0;
    const frente = parseFloat(lot.frente)||0;
    const precio = parseFloat(lot.precio_total)||0;
    const lotEstado = (lot.estado||"").trim().toLowerCase();
    const lotCiudad = (lot.ciudad||"").trim().toLowerCase();
    const lotUso = (lot.uso_suelo||"").trim().toLowerCase();
    let score = 0;
    let razones = [];
    let descalificadores = [];
    // Filtros duros (obligatorios)
    if(supMin>0 && sup<supMin){ descalificadores.push(`Superficie ${sup}m² < mínimo ${supMin}m²`); }
    else if(sup>=supMin) { score+=20; razones.push(`Superficie ${sup}m² ✓`); }
    if(supMax<Infinity && sup>supMax){ descalificadores.push(`Superficie ${sup}m² > máximo ${supMax}m²`); }
    if(frenteMin>0 && frente>0 && frente<frenteMin){ descalificadores.push(`Frente ${frente}m < mínimo ${frenteMin}m`); }
    else if(frenteMin>0&&frente>=frenteMin){ score+=15; razones.push(`Frente ${frente}m ✓`); }
    if(precioMax<Infinity && precio>precioMax){ descalificadores.push(`Precio $${precio.toLocaleString()} > máximo $${precioMax.toLocaleString()}`); }
    else if(precio>0&&precio<=precioMax){ score+=20; razones.push(`Precio en rango ✓`); }
    // Filtros suaves (suman puntos)
    if(estado&&lotEstado){
      // Normalización Cancún/Cancun
      const norm = (s)=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
      if(norm(lotEstado).includes(norm(estado))||norm(estado).includes(norm(lotEstado))){
        score+=15; razones.push(`Estado coincide ✓`);
      }
    }
    if(ciudad&&lotCiudad){
      const norm = (s)=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
      if(norm(lotCiudad).includes(norm(ciudad))||norm(ciudad).includes(norm(lotCiudad))){
        score+=15; razones.push(`Ciudad coincide ✓`);
      }
    }
    if(usoSuelo&&lotUso){
      if(lotUso.includes(usoSuelo)||usoSuelo.includes(lotUso)){
        score+=15; razones.push(`Uso de suelo compatible ✓`);
      }
    }
    return { lot, score, razones, descalificadores, descalificado:descalificadores.length>0 };
  })
  .filter(m=>m!==null)
  .sort((a,b)=>b.score-a.score);
}

// Carga el mapeo desde localStorage (enriquecido por imports + auto-aprendizaje)
function loadMapeoDesarrollador(){
  try{
    const stored = localStorage.getItem(MAPEO_DESARROLLADOR_KEY);
    if(stored){
      const parsed = JSON.parse(stored);
      return { ...MAPEO_DESARROLLADOR_BASE, ...parsed };
    }
  }catch(e){ console.warn("Error cargando mapeo:",e); }
  return { ...MAPEO_DESARROLLADOR_BASE };
}
function saveMapeoDesarrollador(mapeo){
  try{ localStorage.setItem(MAPEO_DESARROLLADOR_KEY, JSON.stringify(mapeo)); }catch(e){}
}

// Auto-aprende mapeo desde el inventario (la fuente de verdad real)
// Devuelve un mapeo desarrollo→desarrollador donde TODOS los desarrollos vienen de lotes reales.
// Si un desarrollo tiene múltiples desarrolladores (split), gana el MAYORITARIO.
// Devuelve también los splits detectados como advertencia.
function aprenderMapeoDesdeInventario(inventory){
  const conteo = {}; // {desarrollo: {desarrollador: count}}
  if(!Array.isArray(inventory)) return { mapeo:{}, splits:[] };
  inventory.forEach(lot=>{
    if(!lot) return;
    const desarrollo = (lot.desarrollo||"").trim();
    const desarrollador = (lot.desarrollador||"").trim();
    if(!desarrollo||!desarrollador) return;
    if(!conteo[desarrollo]) conteo[desarrollo] = {};
    conteo[desarrollo][desarrollador] = (conteo[desarrollo][desarrollador]||0)+1;
  });
  const mapeo = {};
  const splits = [];
  Object.entries(conteo).forEach(([desarrollo, devs])=>{
    const entries = Object.entries(devs).sort((a,b)=>b[1]-a[1]);
    if(entries.length===0) return;
    mapeo[desarrollo] = entries[0][0]; // gana el mayoritario
    if(entries.length>1){
      splits.push({
        desarrollo,
        desarrolladorPrincipal: entries[0][0],
        countPrincipal: entries[0][1],
        otros: entries.slice(1).map(([d,c])=>({desarrollador:d, count:c}))
      });
    }
  });
  return { mapeo, splits };
}

// Sincroniza el mapeo persistido con el aprendido del inventario
// Esto se ejecuta una vez al cargar la app si hay inventario disponible
function sincronizarMapeoConInventario(inventory){
  if(!Array.isArray(inventory)||inventory.length===0) return null;
  const { mapeo:aprendido, splits } = aprenderMapeoDesdeInventario(inventory);
  if(Object.keys(aprendido).length===0) return null;
  // Fusionar: lo aprendido del inventario tiene MÁS PRIORIDAD que lo persistido
  const actual = loadMapeoDesarrollador();
  const fusionado = { ...actual, ...aprendido };
  saveMapeoDesarrollador(fusionado);
  return { aprendido, splits, total:Object.keys(aprendido).length };
}

// Función inteligente: orden de prioridad
// 1. Mapeo activo (que incluye lo aprendido del inventario + base + storage)
// 2. Heurísticas por substring (para desarrollos no registrados)
// 3. Fallback: el nombre como desarrollador propio
function inferirDesarrollador(nombreDesarrollo, mapeoActivo){
  if(!nombreDesarrollo) return "Otros";
  const mapeo = mapeoActivo || loadMapeoDesarrollador();
  // 1. Match exacto
  if(mapeo[nombreDesarrollo]) return mapeo[nombreDesarrollo];
  // 2. Match case-insensitive
  const lc = nombreDesarrollo.toLowerCase().trim();
  for(const [k,v] of Object.entries(mapeo)){
    if(k.toLowerCase().trim()===lc) return v;
  }
  // 3. Heurísticas por substring
  if(lc.includes("capital norte")||lc.startsWith("cn-")||lc.startsWith("cn ")) return "HITO";
  if(lc.includes("corretaje")) return "Corretaje";
  if(lc.includes("garvi")) return "Garvi";
  if(lc.includes("hito")) return "HITO";
  if(lc.includes("favier")) return "Favier";
  if(lc.includes("gyg")||lc==="g&g"||lc==="g y g") return "GyG";
  if(["kulkana","terrasoles","capital sur","alva","punto sur","las rosas"].includes(lc)) return "TYA";
  // 4. Fallback razonable: tratar el nombre como desarrollador propio
  // (mejor que "Otros" — el usuario puede corregirlo)
  return nombreDesarrollo;
}

// Lista dinámica de desarrolladores activos (en metas + oficiales)
function getDesarrolladoresActivos(metasData, inventory){
  const set = new Set();
  Object.values(metasData||{}).forEach(d=>{ if(d&&d.desarrollador) set.add(d.desarrollador); });
  DESARROLLADORES_OFICIALES.forEach(d=>set.add(d));
  if(Array.isArray(inventory)){
    inventory.forEach(lot=>{ if(lot&&lot.desarrollador) set.add(lot.desarrollador); });
  }
  return [...set].sort();
}
// Lista de desarrollos que pertenecen a un desarrollador (filtro inteligente)
// Combina: metas existentes + mapeo + inventario real
function getDesarrollosPorDesarrollador(desarrollador, metasData, inventory, mapeoActivo){
  if(!desarrollador||desarrollador==="Todos") return null; // null = mostrar todos
  const set = new Set();
  const mapeo = mapeoActivo || loadMapeoDesarrollador();
  // 1. Desde metasData
  Object.entries(metasData||{}).forEach(([nombre, d])=>{
    if(d&&d.desarrollador===desarrollador) set.add(nombre);
  });
  // 2. Desde mapeo
  Object.entries(mapeo).forEach(([des, dev])=>{
    if(dev===desarrollador) set.add(des);
  });
  // 3. Desde inventario (fuente de verdad)
  if(Array.isArray(inventory)){
    inventory.forEach(lot=>{
      if(lot&&lot.desarrollador===desarrollador && lot.desarrollo) set.add(lot.desarrollo);
    });
  }
  return [...set].sort();
}
// Calcula momentum desde el CRM Kanban: lotes en Apartado o Contrato
// Devuelve estructura: { porDesarrollo:{[nombre]:{uds:[12], monto:[12], lotes:[...]}}, totalUds:[12], totalMonto:[12], allLotes:[...] }
function calcularMomentumKanban(crmData, inventory, filtroDesarrollador, filtroDesarrollo){
  const ETAPAS_MOMENTUM = new Set(["Apartado","Contrato"]);
  const porDesarrollo = {};
  const totalUds = new Array(12).fill(0);
  const totalMonto = new Array(12).fill(0);
  const allLotes = [];
  if(!crmData||!inventory) return { porDesarrollo, totalUds, totalMonto, allLotes };
  inventory.forEach(lot=>{
    const crm = crmData[lot.id];
    if(!crm||!crm.prospectos||crm.prospectos.length===0) return;
    // Aplicar filtros de desarrollador/desarrollo
    const lotDev = lot.desarrollo||"Otros";
    const lotDesarrollador = lot.desarrollador||inferirDesarrollador(lotDev);
    if(filtroDesarrollador&&filtroDesarrollador!=="Todos"&&lotDesarrollador!==filtroDesarrollador) return;
    if(filtroDesarrollo&&filtroDesarrollo!=="Todos"&&lotDev!==filtroDesarrollo) return;
    // Buscar el prospecto MÁS avanzado del lote en etapa de momentum
    let mejorProspecto = null; let mejorEtapa = null;
    crm.prospectos.forEach(p=>{
      if(!p||!p.pipeline) return;
      if(!ETAPAS_MOMENTUM.has(p.pipeline)) return;
      // "Contrato" más avanzado que "Apartado"
      const ord = p.pipeline==="Contrato"?2:1;
      const ordMejor = mejorEtapa==="Contrato"?2:(mejorEtapa==="Apartado"?1:0);
      if(ord>ordMejor){ mejorProspecto=p; mejorEtapa=p.pipeline; }
    });
    if(!mejorProspecto) return;
    // Determinar mes destino: próxima actividad agendada
    let mesIdx = new Date().getMonth(); // fallback: mes actual
    let fechaUsada = null;
    const acts = mejorProspecto.actividades||[];
    const proxima = acts.filter(a=>!a.completada&&a.fecha).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha))[0];
    if(proxima&&proxima.fecha){
      try{
        const d = new Date(proxima.fecha);
        if(!isNaN(d.getTime())){
          // Solo cuenta si es del año actual (2026 — basamos en fecha actual)
          const yearActual = new Date().getFullYear();
          if(d.getFullYear()===yearActual){
            mesIdx = d.getMonth();
            fechaUsada = proxima.fecha;
          }
        }
      }catch(e){}
    }
    // Acumular: 1 unidad + monto del lote, en el mes detectado
    const monto = Math.round((lot.precio_total||0)/1000); // miles MXN
    if(!porDesarrollo[lotDev]) porDesarrollo[lotDev] = { uds:new Array(12).fill(0), monto:new Array(12).fill(0), lotes:[] };
    porDesarrollo[lotDev].uds[mesIdx] += 1;
    porDesarrollo[lotDev].monto[mesIdx] += monto;
    porDesarrollo[lotDev].lotes.push({
      id:lot.id, nombre:lot.nombre, desarrollo:lotDev, desarrollador:lotDesarrollador,
      etapa:mejorEtapa, mesIdx, fechaUsada, monto, prospecto:mejorProspecto.nombre||"(sin nombre)"
    });
    totalUds[mesIdx] += 1;
    totalMonto[mesIdx] += monto;
    allLotes.push({
      id:lot.id, nombre:lot.nombre, desarrollo:lotDev, desarrollador:lotDesarrollador,
      etapa:mejorEtapa, mesIdx, fechaUsada, monto, prospecto:mejorProspecto.nombre||"(sin nombre)"
    });
  });
  return { porDesarrollo, totalUds, totalMonto, allLotes };
}

// ─── METAS · PARSER DE EXCEL ──────────────────────────────────────
// Parsea el Excel completo:
// 1. Lee la hoja "⚙️ Catálogos" (cols D-E) para enriquecer el mapeo desarrollo→desarrollador
// 2. Lee la hoja "📋 Captura Ventas" para extraer Plan y Real mensuales
// Estructura del bloque en Captura Ventas: 8 filas por desarrollo
// R+0: header (B=nombre, C="Inv: N", D-O=Ene-Dic)
// R+1: Plan Desarr Uds (col D-O)
// R+2: Plan Desarr $ (col D-O)
// R+3,4: Meta SGG (ignorado — solo manejamos Plan)
// R+5: VENTA REAL Uds (col D-O)
// R+6: VENTA REAL $ (col D-O)
// R+7: Diferencia (calculada, ignorada)
function parseExcelMetas(arrayBuffer){
  const result = {
    ok:false, metas:{}, mapeoNuevo:{}, advertencias:[],
    desarrollosNuevos:[], desarrollosActualizados:[], errores:[],
    desarrolladoresEnExcel:new Set()
  };
  try{
    if(typeof XLSX==="undefined"){ result.errores.push("Librería XLSX no disponible"); return result; }
    const wb = XLSX.read(arrayBuffer, {type:"array"});

    // ── PASO 1: Leer hoja Catálogos (si existe) para construir mapeo desarrollo→desarrollador ──
    let catName = null;
    for(const n of wb.SheetNames){
      const norm = n.toLowerCase().replace(/[^a-z]/g,"");
      if(norm.includes("catalogo")||norm.includes("catalog")){ catName=n; break; }
    }
    let mapeoFromExcel = {};
    if(catName){
      try{
        const wsCat = wb.Sheets[catName];
        const catRows = XLSX.utils.sheet_to_json(wsCat, {defval:"", header:1});
        // Buscar columnas de mapeo: típicamente "DESARROLLO" + "DESARROLLADOR" en algún par de columnas
        // Estructura observada: col D="MAPEO DESARROLLO→DESARROLLADOR" + col E=desarrollador
        // Pero tambien la col A puede tener "DESARROLLADOR CEO" como lista de desarrolladores
        // Procesamiento defensivo: buscar el header
        let mapeoCol = -1, devCol = -1;
        let desarrolladorCEOCol = -1;
        for(let r=0;r<Math.min(catRows.length,3);r++){
          const row = catRows[r]||[];
          for(let c=0;c<row.length;c++){
            const cell = String(row[c]||"").toLowerCase();
            if(cell.includes("mapeo")&&cell.includes("desarrollo")){ mapeoCol=c; devCol=c+1; }
            if(cell.includes("desarrollador")&&cell.includes("ceo")){ desarrolladorCEOCol=c; }
          }
        }
        // Extraer mapeo desarrollo → desarrollador
        if(mapeoCol>=0&&devCol>=0){
          for(let r=1;r<catRows.length;r++){
            const row = catRows[r]||[];
            const desarrollo = String(row[mapeoCol]||"").trim();
            const desarrollador = String(row[devCol]||"").trim();
            if(desarrollo&&desarrollador&&desarrollo.toLowerCase()!=="todos"){
              mapeoFromExcel[desarrollo] = desarrollador;
              result.desarrolladoresEnExcel.add(desarrollador);
            }
          }
        }
        // Extraer también los desarrolladores oficiales de la columna "DESARROLLADOR CEO"
        if(desarrolladorCEOCol>=0){
          for(let r=1;r<catRows.length;r++){
            const row = catRows[r]||[];
            const dev = String(row[desarrolladorCEOCol]||"").trim();
            if(dev&&dev.toLowerCase()!=="todos"){
              result.desarrolladoresEnExcel.add(dev);
              // Auto-asignar: cualquier desarrollador propio que sea también nombre de desarrollo
              if(!mapeoFromExcel[dev]) mapeoFromExcel[dev] = dev;
            }
          }
        }
        result.mapeoNuevo = mapeoFromExcel;
        if(Object.keys(mapeoFromExcel).length>0){
          // Persistir el mapeo enriquecido
          const mapeoActual = loadMapeoDesarrollador();
          const mapeoFusionado = { ...mapeoActual, ...mapeoFromExcel };
          saveMapeoDesarrollador(mapeoFusionado);
        }
      }catch(e){
        result.advertencias.push("No se pudo leer hoja Catálogos: "+e.message);
      }
    } else {
      result.advertencias.push("No se encontró hoja 'Catálogos' (no crítico, se usarán heurísticas)");
    }

    // ── PASO 2: Leer hoja Captura Ventas ──
    let shName = null;
    for(const n of wb.SheetNames){
      if(n.toLowerCase().replace(/[^a-z]/g,"").includes("capturaventas")){ shName=n; break; }
    }
    if(!shName){ result.errores.push("No se encontró la hoja 'Captura Ventas' en el Excel"); return result; }
    const ws = wb.Sheets[shName];
    const rows = XLSX.utils.sheet_to_json(ws, {defval:"", header:1});
    // Recorrer en busca de bloques: cualquier fila cuya columna B tenga nombre y siguiente columna C contenga "Inv:"
    const detected = [];
    for(let i=0;i<rows.length;i++){
      const r = rows[i]||[];
      const colB = String(r[1]||"").trim();
      const colC = String(r[2]||"").trim();
      if(colB&&colC.toLowerCase().startsWith("inv")&&String(r[3]||"").toLowerCase().startsWith("ene")){
        detected.push({nombre:colB, headerRow:i});
      }
    }
    if(detected.length===0){ result.errores.push("No se detectaron bloques de desarrollo en la hoja"); return result; }
    // Mapeo activo combinado: base + storage previo + mapeo del Excel actual
    const mapeoActivo = { ...loadMapeoDesarrollador(), ...mapeoFromExcel };
    detected.forEach(({nombre, headerRow})=>{
      try{
        const planUdsRow = rows[headerRow+1]||[];
        const planMontoRow = rows[headerRow+2]||[];
        const realUdsRow = rows[headerRow+5]||[];
        const realMontoRow = rows[headerRow+6]||[];
        const planLabel = String(planUdsRow[1]||"").trim().toLowerCase();
        if(!planLabel.includes("plan")){
          result.advertencias.push(`'${nombre}': estructura inesperada en R${headerRow+2} (esperaba 'Plan Desarr.', encontró '${planLabel}')`);
          return;
        }
        const toNumArr = (row)=>{
          const arr = new Array(12).fill(0);
          for(let m=0;m<12;m++){
            const raw = row[3+m];
            if(raw===""||raw===null||raw===undefined){ arr[m]=0; continue; }
            const num = parseFloat(raw);
            arr[m] = isNaN(num)?0:Math.round(num);
          }
          return arr;
        };
        result.metas[nombre] = {
          desarrollador: inferirDesarrollador(nombre, mapeoActivo),
          plan: { uds:toNumArr(planUdsRow), monto:toNumArr(planMontoRow) },
          real: { uds:toNumArr(realUdsRow), monto:toNumArr(realMontoRow) }
        };
      }catch(e){
        result.errores.push(`Error procesando bloque '${nombre}': ${e.message}`);
      }
    });
    result.ok = Object.keys(result.metas).length>0;
    return result;
  }catch(e){
    result.errores.push("Error general: "+e.message);
    return result;
  }
}

const fmt = (n) => new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",maximumFractionDigits:0}).format(n||0);
const fmtM = (n) => { if(!n) return "$0"; return n>=1000000?`$${(n/1000000).toFixed(1)} MDP`:fmt(n); };
const scoreColor = (s) => s>=80?B.green:s>=60?B.gold:s>=40?B.blue:B.grey3;
const tempColor = (t) => t==="Caliente"?B.red:t==="Tibio"?B.gold:B.grey3;
const tempBg = (t) => t==="Caliente"?B.redL:t==="Tibio"?"#fff8e7":B.grey1;

// ─── SCORE RING ───────────────────────────────────────────────────
const ScoreRing = ({ score, size=64 }) => {
  const r=(size-8)/2, circ=2*Math.PI*r, dash=(score/100)*circ, color=scoreColor(score);
  return (
    <div style={{position:"relative",width:size,height:size,flexShrink:0}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={B.grey1} strokeWidth={5}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={5}
          strokeDasharray={`${dash} ${circ}`} strokeLinecap="round"
          style={{transition:"stroke-dasharray 0.8s ease"}}/>
      </svg>
      <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
        <span style={{fontSize:size>56?18:13,fontWeight:800,color,fontFamily:"'Playfair Display',serif",lineHeight:1}}>{score}</span>
        <span style={{fontSize:9,color:B.grey3}}>SCORE</span>
      </div>
    </div>
  );
};

// ─── ICS CALENDAR EXPORT ──────────────────────────────────────────
// Genera un archivo .ics descargable que se abre en Google Calendar,
// Apple Calendar, Outlook y cualquier cliente de calendario estándar.
// No requiere OAuth ni conexión externa — funciona offline.
function _icsPad2(n){ return String(n).padStart(2,"0"); }
function _icsEscape(text){
  return String(text||"")
    .replace(/\\/g,"\\\\")
    .replace(/;/g,"\\;")
    .replace(/,/g,"\\,")
    .replace(/\r?\n/g,"\\n");
}
function _icsStampUTC(d){
  return d.getUTCFullYear()+_icsPad2(d.getUTCMonth()+1)+_icsPad2(d.getUTCDate())+"T"+
    _icsPad2(d.getUTCHours())+_icsPad2(d.getUTCMinutes())+_icsPad2(d.getUTCSeconds())+"Z";
}
function _icsLocalStamp(fecha,hora){
  const time=(hora&&/^\d{2}:\d{2}/.test(hora))?hora:"09:00";
  const [Y,M,D]=fecha.split("-").map(Number);
  const [h,m]=time.split(":").map(Number);
  return Y+_icsPad2(M)+_icsPad2(D)+"T"+_icsPad2(h)+_icsPad2(m)+"00";
}
function descargarICS(activity, lote, prospecto, durMinutes){
  try{
    if(!activity||!activity.fecha){
      console.warn("descargarICS: actividad sin fecha");
      return false;
    }
    durMinutes=durMinutes||30;
    const tipo=activity.tipo||"Seguimiento";
    const desc=activity.descripcion||tipo;
    const dtStart=_icsLocalStamp(activity.fecha,activity.hora);
    // Calcular DTEND sumando duración
    const [Y,M,D]=activity.fecha.split("-").map(Number);
    const time=(activity.hora&&/^\d{2}:\d{2}/.test(activity.hora))?activity.hora:"09:00";
    const [h,m]=time.split(":").map(Number);
    const endDate=new Date(Y,M-1,D,h,m+durMinutes,0);
    const dtEnd=endDate.getFullYear()+_icsPad2(endDate.getMonth()+1)+_icsPad2(endDate.getDate())+"T"+
      _icsPad2(endDate.getHours())+_icsPad2(endDate.getMinutes())+"00";
    const uid=(activity.id||("macropro-"+Date.now()))+"@grupoguia.mx";
    const summary="[MacroPro] "+tipo+(desc&&desc!==tipo?": "+desc:"");
    const descParts=[];
    if(prospecto&&prospecto.nombre) descParts.push("Prospecto: "+prospecto.nombre);
    if(lote){
      if(lote.nombre) descParts.push("Lote: "+lote.nombre);
      if(lote.desarrollo) descParts.push("Desarrollo: "+lote.desarrollo);
      if(lote.ciudad) descParts.push("Ciudad: "+lote.ciudad);
    }
    descParts.push("");
    descParts.push("Generado por MacroPro · Grupo Guía");
    const description=descParts.join("\n");
    const location=lote?[lote.desarrollo,lote.ciudad,lote.estado].filter(Boolean).join(", "):"";
    const ics=[
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//Grupo Guia//MacroPro//ES",
      "CALSCALE:GREGORIAN",
      "METHOD:PUBLISH",
      "BEGIN:VTIMEZONE",
      "TZID:America/Mexico_City",
      "BEGIN:STANDARD",
      "DTSTART:19700101T000000",
      "TZOFFSETFROM:-0600",
      "TZOFFSETTO:-0600",
      "TZNAME:CST",
      "END:STANDARD",
      "END:VTIMEZONE",
      "BEGIN:VEVENT",
      "UID:"+uid,
      "DTSTAMP:"+_icsStampUTC(new Date()),
      "DTSTART;TZID=America/Mexico_City:"+dtStart,
      "DTEND;TZID=America/Mexico_City:"+dtEnd,
      "SUMMARY:"+_icsEscape(summary),
      "DESCRIPTION:"+_icsEscape(description),
      "LOCATION:"+_icsEscape(location),
      "STATUS:CONFIRMED",
      "BEGIN:VALARM",
      "ACTION:DISPLAY",
      "DESCRIPTION:"+_icsEscape("Recordatorio: "+summary),
      "TRIGGER:-PT30M",
      "END:VALARM",
      "END:VEVENT",
      "END:VCALENDAR"
    ].join("\r\n");
    const blob=new Blob([ics],{type:"text/calendar;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const fname="MacroPro_"+String(tipo).replace(/[^a-z0-9]/gi,"_")+"_"+activity.fecha+".ics";
    const a=document.createElement("a");
    a.href=url; a.download=fname;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },100);
    return true;
  }catch(err){
    console.error("Error generando ICS:",err);
    return false;
  }
}

// ─── ICS BULK EXPORT ──────────────────────────────────────────────
// Genera UN SOLO archivo .ics con MÚLTIPLES eventos (VEVENT).
// Cada evento usa UID estable basado en activity.id, por lo que
// re-importar el archivo NO duplica eventos en Google Calendar:
// los actualiza si cambiaron los datos (RFC 5545 idempotencia).
function descargarICSBulk(items, fileLabel){
  try{
    if(!items||items.length===0){
      console.warn("descargarICSBulk: sin actividades");
      return { ok:false, count:0 };
    }
    const veventBlocks=[];
    items.forEach(({activity,lote,prospecto,durMinutes})=>{
      if(!activity||!activity.fecha) return;
      const dur=durMinutes||30;
      const tipo=activity.tipo||"Seguimiento";
      const desc=activity.descripcion||tipo;
      const dtStart=_icsLocalStamp(activity.fecha,activity.hora);
      const [Y,M,D]=activity.fecha.split("-").map(Number);
      const time=(activity.hora&&/^\d{2}:\d{2}/.test(activity.hora))?activity.hora:"09:00";
      const [h,m]=time.split(":").map(Number);
      const endDate=new Date(Y,M-1,D,h,m+dur,0);
      const dtEnd=endDate.getFullYear()+_icsPad2(endDate.getMonth()+1)+_icsPad2(endDate.getDate())+"T"+
        _icsPad2(endDate.getHours())+_icsPad2(endDate.getMinutes())+"00";
      // UID ESTABLE: usa activity.id para que re-importar actualice en vez de duplicar
      const uid=(activity.id||("macropro-"+activity.fecha+"-"+Math.random().toString(36).slice(2,8)))+"@grupoguia.mx";
      const summary="[MacroPro] "+tipo+(desc&&desc!==tipo?": "+desc:"");
      const descParts=[];
      if(prospecto&&prospecto.nombre) descParts.push("Prospecto: "+prospecto.nombre);
      if(lote){
        if(lote.nombre) descParts.push("Lote: "+lote.nombre);
        if(lote.desarrollo) descParts.push("Desarrollo: "+lote.desarrollo);
        if(lote.ciudad) descParts.push("Ciudad: "+lote.ciudad);
      }
      if(activity.completada&&activity.resultado) descParts.push("Estado: COMPLETADA · "+activity.resultado);
      descParts.push("");
      descParts.push("Generado por MacroPro · Grupo Guía");
      const description=descParts.join("\n");
      const location=lote?[lote.desarrollo,lote.ciudad,lote.estado].filter(Boolean).join(", "):"";
      const status=activity.completada?"CONFIRMED":"CONFIRMED"; // siempre CONFIRMED en eventos vigentes
      const block=[
        "BEGIN:VEVENT",
        "UID:"+uid,
        "DTSTAMP:"+_icsStampUTC(new Date()),
        "DTSTART;TZID=America/Mexico_City:"+dtStart,
        "DTEND;TZID=America/Mexico_City:"+dtEnd,
        "SUMMARY:"+_icsEscape(summary),
        "DESCRIPTION:"+_icsEscape(description),
        "LOCATION:"+_icsEscape(location),
        "STATUS:"+status,
        "SEQUENCE:1", // marca como revisión: si re-exporto, Google actualiza el evento
        "BEGIN:VALARM",
        "ACTION:DISPLAY",
        "DESCRIPTION:"+_icsEscape("Recordatorio: "+summary),
        "TRIGGER:-PT30M",
        "END:VALARM",
        "END:VEVENT"
      ].join("\r\n");
      veventBlocks.push(block);
    });
    if(veventBlocks.length===0){
      return { ok:false, count:0 };
    }
    const ics=[
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//Grupo Guia//MacroPro Bulk//ES",
      "CALSCALE:GREGORIAN",
      "METHOD:PUBLISH",
      "X-WR-CALNAME:MacroPro Actividades",
      "X-WR-TIMEZONE:America/Mexico_City",
      "BEGIN:VTIMEZONE",
      "TZID:America/Mexico_City",
      "BEGIN:STANDARD",
      "DTSTART:19700101T000000",
      "TZOFFSETFROM:-0600",
      "TZOFFSETTO:-0600",
      "TZNAME:CST",
      "END:STANDARD",
      "END:VTIMEZONE",
      ...veventBlocks,
      "END:VCALENDAR"
    ].join("\r\n");
    const blob=new Blob([ics],{type:"text/calendar;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const today=new Date().toISOString().slice(0,10);
    const fname="MacroPro_"+(fileLabel||"actividades")+"_"+today+".ics";
    const a=document.createElement("a");
    a.href=url; a.download=fname;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },100);
    return { ok:true, count:veventBlocks.length };
  }catch(err){
    console.error("Error generando ICS bulk:",err);
    return { ok:false, count:0, error:err.message };
  }
}

  // Si se usara como <Field/> React lo trataría como nuevo componente cada render → input pierde foco
  const renderField = (label, k, type, options, placeholder, required, full)=>{
    if(type==="select"){
      return (
        <div key={k} style={{marginBottom:10, gridColumn:full?"1 / -1":"auto"}}>

        </div>
      );
    }
    // Para campos numéricos: usamos type="text" + inputMode="numeric" + filtro en onChange
    // type="number" en React tiene comportamiento errático con value controlado en algunos casos
    const isNumeric = type==="number";
    const handleChange = (e)=>{
      const v = e.target.value;
      if(isNumeric){
        // Permitir solo dígitos, punto y coma decimal
        if(v==="" || /^[0-9]*\.?[0-9]*$/.test(v)){

// ─── MAIN APP ─────────────────────────────────────────────────────
function MacroProMatcher() {
  // ═══════════════════════════════════════════════════════════
  // PERSISTENCIA: claves de localStorage y helpers
  // ═══════════════════════════════════════════════════════════
  const STORAGE_KEYS={
    inventory:"macropro_inventory_v1",
    clients:"macropro_clients_v1",
    view:"macropro_view_v1",
    activeTab:"macropro_activeTab_v1",
    filterDevCompania:"macropro_filterDevCompania_v1",
    filterDesarrolloGlobal:"macropro_filterDesarrolloGlobal_v1"
  };
  const loadPersisted=(key,defaultVal)=>{
    try{
      const raw=localStorage.getItem(key);
      if(!raw) return defaultVal;
      return JSON.parse(raw);
    }catch(e){return defaultVal;}
  };
  const savePersisted=(key,val)=>{
    try{localStorage.setItem(key,JSON.stringify(val));}catch(e){console.warn("No se pudo guardar "+key,e);}
  };

  const [view, setViewRaw] = useState(()=>loadPersisted(STORAGE_KEYS.view,"home"));
  // Wrapper de setView que también persiste
  const setView=(v)=>{setViewRaw(v);savePersisted(STORAGE_KEYS.view,v);};

  // ─── CRM STATE (ELEVADO AL PADRE para sobrevivir rerenders de ViewCRM) ───
  const [activeTab, setActiveTabRaw] = React.useState(()=>loadPersisted(STORAGE_KEYS.activeTab,"dashboard"));
  const setActiveTab=(t)=>{setActiveTabRaw(t);savePersisted(STORAGE_KEYS.activeTab,t);};
  const [selectedLotCRM, setSelectedLotCRM] = React.useState(null);
  const [filterPipeline, setFilterPipeline] = React.useState("Todos");
  const [filterDesarrolloCRM, setFilterDesarrolloCRM] = React.useState("Todos");
  const [filterDesarrolloGlobal, setFilterDesarrolloGlobalRaw] = React.useState(()=>loadPersisted(STORAGE_KEYS.filterDesarrolloGlobal,"Todos"));
  const setFilterDesarrolloGlobal=(v)=>{setFilterDesarrolloGlobalRaw(v);savePersisted(STORAGE_KEYS.filterDesarrolloGlobal,v);};
  const [filterDevCompania, setFilterDevCompaniaRaw] = React.useState(()=>loadPersisted(STORAGE_KEYS.filterDevCompania,"Todos"));
  const setFilterDevCompania=(v)=>{setFilterDevCompaniaRaw(v);savePersisted(STORAGE_KEYS.filterDevCompania,v);};
  const [filterSemaforo, setFilterSemaforo] = React.useState("Todos");
  const [selectedAsesorLotes, setSelectedAsesorLotes] = React.useState(null);
  const [inventory, setInventoryRaw] = useState(()=>loadPersisted(STORAGE_KEYS.inventory,[]));
  const setInventory=(data)=>{
    if(typeof data==="function"){
      setInventoryRaw(prev=>{const next=data(prev);savePersisted(STORAGE_KEYS.inventory,next);return next;});
    }else{
      setInventoryRaw(data);savePersisted(STORAGE_KEYS.inventory,data);
    }
  };
  const [clients, setClientsRaw] = useState(()=>loadPersisted(STORAGE_KEYS.clients,[]));
  const setClients=(data)=>{
    if(typeof data==="function"){
      setClientsRaw(prev=>{const next=data(prev);savePersisted(STORAGE_KEYS.clients,next);return next;});
    }else{
      setClientsRaw(data);savePersisted(STORAGE_KEYS.clients,data);
    }
  };
  const [selectedClient, setSelectedClient] = useState(null);
  const [selectedLot, setSelectedLot] = useState(null);
  const [matchResults, setMatchResults] = useState(null);
  const [matchMode, setMatchMode] = useState(null);
  const [loading, setLoading] = useState(false);
  const [loadingMsg, setLoadingMsg] = useState("");
  const [generatingReport, setGeneratingReport] = useState(false);
  const [filterCity, setFilterCity] = useState("Todas");
  const [filterDesarrollo, setFilterDesarrollo] = useState("Todos");
  const [filterUso, setFilterUso] = useState("Todos");
  const [filterAsesor, setFilterAsesor] = useState("Todos");
  const [filterSupMin, setFilterSupMin] = useState("");
  const [filterSupMax, setFilterSupMax] = useState("");
  const [filterPrecioMax, setFilterPrecioMax] = useState("");
  const [showAddClient, setShowAddClient] = useState(false);
  const [newClient, setNewClient] = useState({ nombre:"",empresa:"",asesor:"",ciudad_interes_raw:"",uso_interes_raw:"",presupuesto_min:"",presupuesto_max:"",sup_min:"",sup_max:"",temperatura:"Tibio",status:"Nuevo",notas:"" });
  const [toastMsg, setToastMsg] = useState("");

  // ═══════════════════════════════════════════════════════════
  // PWA: Detección de instalable + estado installed
  // ═══════════════════════════════════════════════════════════
  const [pwaInstallable, setPwaInstallable] = React.useState(!!window.__pwaInstallable);
  const [pwaInstalled, setPwaInstalled] = React.useState(
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone || false
  );
  React.useEffect(()=>{
    const handler=()=>setPwaInstallable(true);
    window.addEventListener('pwa-installable',handler);
    // Detectar si ya se instaló después del arranque
    const installedHandler=()=>{setPwaInstalled(true);setPwaInstallable(false);};
    window.addEventListener('appinstalled',installedHandler);
    return ()=>{
      window.removeEventListener('pwa-installable',handler);
      window.removeEventListener('appinstalled',installedHandler);
    };
  },[]);
  const triggerPWAInstall=()=>{
    if(window.__triggerPWAInstall){
      window.__triggerPWAInstall().then(accepted=>{
        if(accepted){
          toast("🎉 ¡MacroPro instalado en tu dispositivo!");
          setPwaInstalled(true);
          setPwaInstallable(false);
        }
      });
    }
  };
  // Detectar iOS Safari (no soporta beforeinstallprompt — debe mostrar instrucciones manuales)
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
  const [showIOSInstallHint,setShowIOSInstallHint]=React.useState(false);
  // ─── CRM STATE ────────────────────────────────────────────────────
  const CRM_KEY="macropro_crm_v1";
  const STAGE_MIGRATION={"Prospectado":"Prospecto","Propuesta formal":"Propuesta","Baja":"Perdido","Disponible":"Prospecto","Vendido":"Vendido"};
  const VALID_STAGES_SET=new Set(["Prospecto","Contactado","En negociación","Propuesta","Apartado","Contrato","Vendido","Perdido"]);
  const migrateCRM=(d)=>{
    try{
      Object.keys(d||{}).forEach(id=>{
        const e=d[id]; if(!e) return;
        // 1) Migrar pipeline del lote
        if(e.pipeline&&STAGE_MIGRATION[e.pipeline]) e.pipeline=STAGE_MIGRATION[e.pipeline];
        // 2) Migrar pipeline de cada prospecto + rellenar con el del lote si falta
        if(Array.isArray(e.prospectos)) e.prospectos.forEach(p=>{
          if(!p) return;
          if(p.pipeline&&STAGE_MIGRATION[p.pipeline]) p.pipeline=STAGE_MIGRATION[p.pipeline];
          // Si prospecto no tiene pipeline o tiene uno inválido, heredar del lote o poner "Prospecto"
          if(!p.pipeline||!VALID_STAGES_SET.has(p.pipeline)){
            p.pipeline=(e.pipeline&&VALID_STAGES_SET.has(e.pipeline))?e.pipeline:"Prospecto";
          }
        });
      });
    }catch(err){console.warn("migrateCRM:",err);}
    return d;
  };
  const loadCRM=()=>{try{return migrateCRM(JSON.parse(localStorage.getItem(CRM_KEY)||"{}"));}catch(e){return {};}};
  const saveCRM=(d)=>{try{localStorage.setItem(CRM_KEY,JSON.stringify(d));}catch(e){}};
  const [crmData,setCrmData]=React.useState(()=>loadCRM());
  const updateCRM=(id,patch)=>{setCrmData(prev=>{const next={...prev,[id]:{...(prev[id]||{pipeline:"Disponible",interacciones:[],prospectos:[],devFeedback:[]}), ...patch}};saveCRM(next);return next;});};

  // ═ METAS · estado y persistencia ═
  const [metasData, setMetasData] = React.useState(()=>loadMetas());
  // ═══ MÓDULO ASESORES ═══
  const [solicitudesAsesor, setSolicitudesAsesor] = React.useState(()=>loadSolicitudesAsesor());
  const [showSolicitudModal, setShowSolicitudModal] = React.useState(false);
  const [editingSolicitud, setEditingSolicitud] = React.useState(null);
  const [solicitudActiva, setSolicitudActiva] = React.useState(null);
  const [showMatchesModal, setShowMatchesModal] = React.useState(false);
  const [matchesActuales, setMatchesActuales] = React.useState([]);
  const [solicitudFiltroPipeline, setSolicitudFiltroPipeline] = React.useState(()=>localStorage.getItem("macropro_solicitud_filtro_pipeline")||"Todos");
  React.useEffect(()=>{ localStorage.setItem("macropro_solicitud_filtro_pipeline", solicitudFiltroPipeline); },[solicitudFiltroPipeline]);
  React.useEffect(()=>{ saveSolicitudesAsesor(solicitudesAsesor); },[solicitudesAsesor]);

  // Helpers para CRUD de asesores
  const guardarAsesor = (data) => {
    if(data.id&&solicitudesAsesor.some(a=>a.id===data.id)){
      setSolicitudesAsesor(prev=>prev.map(a=>a.id===data.id?{...a,...data,fechaUltimaActividad:new Date().toISOString()}:a));
      toast("✓ Solicitud actualizada");
    } else {
      const nueva = { ...nuevaSolicitudAsesor(), ...data };
      setSolicitudesAsesor(prev=>[nueva, ...prev]);
      toast("✓ Nueva solicitud creada");
    }
  };
  const eliminarAsesor = (id) => {
    if(!window.confirm("¿Eliminar esta solicitud? Esta acción no se puede deshacer.")) return;
    setSolicitudesAsesor(prev=>prev.filter(a=>a.id!==id));
    toast("✓ Solicitud eliminada");
  };
  const cambiarPipelineAsesor = (id, nuevoPipeline) => {
    setSolicitudesAsesor(prev=>prev.map(a=>{
      if(a.id!==id) return a;
      const historial = [...(a.historial||[]), {
        fecha: new Date().toISOString(),
        tipo: "pipeline",
        descripcion: `Pipeline: ${a.pipeline} → ${nuevoPipeline}`
      }];

        const raw = XLSX.utils.sheet_to_json(ws,{defval:"",header:1});

        for(let i=0;i<Math.min(raw.length,10);i++){
          if(raw[i]&&raw[i].some(c=>c&&String(c).includes("ID Macrolote"))){headerRow=i;break;}
        }
        const headers = raw[headerRow].map(h=>String(h||"").replace(/^\* /,"").replace(/ ▼$/,"").trim());
        const norm = (h)=>String(h||"").toLowerCase().replace(/²/g,"2").replace(/³/g,"3").replace(/\./g,"").replace(/\s+/g," ").trim();
        const getVal = (row,...names) => {
          for(const name of names){
            const idx=headers.findIndex(h=>norm(h).includes(norm(name)));
            if(idx>=0&&row[idx]!==undefined&&row[idx]!=="") return row[idx];

        const cleanNum = (v) => parseFloat(String(v).replace(/[$,\s]/g,""))||0;
        const mapped = raw.slice(headerRow+1)

            const sup=cleanNum(getVal(row,"Superficie (m²)"));
            const pm2=cleanNum(getVal(row,"Precio por m²"));
            let total=cleanNum(getVal(row,"Precio Total"));
            if(!total&&sup&&pm2) total=sup*pm2;

              id:String(getVal(row,"ID Macrolote")||("LOT-"+(i+1)))+"-r"+i,

              uso:(()=>{
                // Función especial: busca uso de suelo EXCLUYENDO "Clave Uso de Suelo"
                // Soporta formato v8 (Uso_1/Uso_2/Uso_3) y formato v6 (* Uso de Suelo)
                const getUso = (keywords) => {
                  for(const kw of keywords){
                    const idx = headers.findIndex(h => {
                      const hn = norm(h);
                      return hn.includes(norm(kw)) && !hn.includes("clave");
                    });
                    if(idx>=0 && row[idx]!==undefined && row[idx]!=="") return String(row[idx]).trim();
                  }
                  return "";
                };
                // Intentar formato v8 primero (Uso_1), luego v6 (* Uso de Suelo)
                const raw1 = getUso(["uso_1","* uso_1"]) || getUso(["uso de suelo"]) || ""; return (raw1.toUpperCase()==='N/A'||raw1==='-')?'':raw1;
              })(),
              usos_todos:(()=>{
                const getUso = (keywords) => {
                  for(const kw of keywords){
                    const idx = headers.findIndex(h => {
                      const hn = norm(h);
                      return hn.includes(norm(kw)) && !hn.includes("clave");
                    });
                    if(idx>=0 && row[idx]!==undefined && row[idx]!=="") return String(row[idx]).trim();
                  }
                  return "";
                };
                const u1 = getUso(["uso_1","* uso_1"]) || getUso(["uso de suelo"]);
                const u2 = getUso(["uso_2"]);
                const u3 = getUso(["uso_3"]);
                const cleanUso=(v)=>v&&v.trim()&&v.trim().toUpperCase()!=='N/A'&&v.trim()!=='-'?v.trim():'';
                return [u1,u2,u3].map(cleanUso).filter(Boolean);
              })(),

              asesor:String(getVal(row,"Asesor Responsable","Asesor","Vendedor","Agente","Responsable","Asesor de Ventas","Opcionador")||""),
              condiciones_pago:String(getVal(row,"Condiciones de Pago")||""),
              observaciones:String(getVal(row,"Observaciones")||""),
              fecha_ingreso:(()=>{
                // Busca por nombre de columna primero
                let raw=getVal(row,"Fecha de Ingreso","Fecha Ingreso","Ingreso al Inventario","F. Ingreso","Fecha Alta","Alta");
                // Si no encontró por nombre, intenta columna BL (índice 63)
                if(!raw&&row[63]!==undefined&&row[63]!=="") raw=row[63];
                if(!raw) return "";
                // Parseo: puede ser número serial de Excel o string de fecha
                if(typeof raw==="number"&&raw>40000){
                  // Excel serial date → JS Date (Excel epoch: 1900-01-01 = 1)
                  const jsDate=new Date(Math.round((raw-25569)*864e5));
                  return jsDate.toISOString().slice(0,10);
                }
                // String: intentar parsear distintos formatos
                const s=String(raw).trim();
                if(!s||s==="-"||s==="N/A") return "";
                // dd/mm/yyyy → yyyy-mm-dd
                const ddmm=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
                if(ddmm) return `${ddmm[3]}-${ddmm[2].padStart(2,"0")}-${ddmm[1].padStart(2,"0")}`;
                // mm/dd/yyyy
                const mmdd=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
                // yyyy-mm-dd (ya en formato correcto)
                if(s.match(/^\d{4}-\d{2}-\d{2}/)) return s.slice(0,10);
                // Intento general
                try{ const d=new Date(s); if(!isNaN(d)) return d.toISOString().slice(0,10); }catch(e){}
                return s;
              })(),
            };
          }).filter(l=>l.nombre&&l.nombre.trim()!==""&&l.nombre.trim()!=="0"&&String(l.nombre).length>1);
        if(mapped.length>0){

          ppto_min:colIdx(["ppto min","ppto mín","presupuesto min","presupuesto mínimo","ppto  m n","ppto mn"]),

        const g=(row,key)=>{ const idx=C[key]; if(idx===undefined||idx<0||row[idx]===undefined) return ""; return String(row[idx]).trim(); };
        const toNum=(v)=>{ const s=String(v).replace(/[$\s]/g,""); if(/^\d{1,3}(\.\d{3})+$/.test(s)) return parseFloat(s.replace(/\./g,""))||0; return parseFloat(s.replace(/,/g,""))||0; };
        const cleanTemp=(v)=>{ if(!v) return "Tibio"; if(String(v).includes("Caliente")||String(v).includes("🔴")) return "Caliente"; if(String(v).includes("Tibio")||String(v).includes("🟡")) return "Tibio"; if(String(v).includes("Frío")||String(v).includes("🔵")) return "Frío"; return String(v); };
        const dataRows=raw.slice(headerRow+1).filter(row=>{

  // ── CLAUDE MATCH ENGINE ──────────────────────────────────────────
  const runMatch = async (mode, subject, targets) => {
    setLoading(true); setMatchResults(null);
    const msgs=["Analizando perfil...","Calculando compatibilidad...","Generando argumentos...","Rankeando..."];
    let mi=0; setLoadingMsg(msgs[0]);

      const mCiudad=(lc,bs)=>{if(!bs||!bs.length)return true;const l2=(lc||"").toLowerCase();return bs.some(b=>{const b2=(b||"").toLowerCase();if(!b2)return false;if(l2===b2||l2.includes(b2)||b2.includes(l2))return true;return ZMG.some(z=>l2.includes(z))&&ZMG.some(z=>b2.includes(z));});};
      const mUso=(lu,bu)=>{if(!bu||!bu.length)return true;if(!lu||!lu.length)return true;return bu.some(u=>lu.some(l=>l&&l.trim().toLowerCase()===u.trim().toLowerCase()));};
      if(mode==="clientToLots"){
        // CRÍTICO: targets YA VIENE filtrado por ciudad/desarrollo/uso manual del usuario.
        // NO volver a aplicar filtros que lo abran (eso era el bug del fallback de 3).
        // Solo aplicamos filtros suaves de presupuesto y superficie que el cliente defina.
        const filtered=targets.filter(l=>{
          return (!subject.presupuesto_max||!l.precio_total||l.precio_total<=subject.presupuesto_max*1.5)
            &&(!subject.sup_max||!l.sup_m2||l.sup_m2<=subject.sup_max*2);
        });
        // Si ningún lote pasa el filtro de ppto/sup, usar todos los targets (respeta filtros manuales)
        const pool=filtered.length>0?filtered:targets;
        const top=[...pool].sort((a,b)=>{
          const uA=mUso(a.usos_todos,subject.uso_interes)?1:0;
          const uB=mUso(b.usos_todos,subject.uso_interes)?1:0;
          if(uB!==uA)return uB-uA;
          return(a.precio_total||0)-(b.precio_total||0);
        }).slice(0,20);
        prompt=`Estratega inmobiliario México. Rankea estos lotes para el cliente. Solo JSON, sin texto extra.\nCLIENTE: ${subject.nombre}|${subject.empresa}|Ciudades:${subject.ciudad_interes?.join(",")}|Usos:${subject.uso_interes?.join(",")}|Ppto:${fmtM(subject.presupuesto_min)}-${fmtM(subject.presupuesto_max)}|Sup:${subject.sup_min}-${subject.sup_max}m²|DealBreakers:${subject.deal_breakers?.join(",")||"ninguno"}\nLOTES (${top.length}):\n${top.map(l=>`${l.id}|${l.nombre}|${l.ciudad}|${(l.usos_todos&&l.usos_todos.length>0?l.usos_todos.join("/"):l.uso)}|${l.sup_m2}m²|$${l.precio_m2}/m²|${fmtM(l.precio_total)}`).join("\n")}\nFORMATO JSON EXACTO:{"resultados":[{"id":"CN-001","score":85,"match_label":"Match Excelente","razon_principal":"1 oracion max","argumentos":["a1","a2","a3"],"objecion":"obj","respuesta_objecion":"resp","urgencia":"urg"}]}\nRankea los ${top.length} lotes mayor a menor score.`;
      } else {
        const isFiltro=subject.id==="FILTRO";
        const filtered=targets.filter(c=>{ const cOk=!c.ciudad_interes?.length||c.ciudad_interes.some(ci=>mCiudad(subject.ciudad,[ci])); const pOk=!c.presupuesto_max||c.presupuesto_max>=(subject.precio_total||0)*0.7; const sOk=!c.sup_max||c.sup_max>=(subject.sup_m2||0)*0.7; return isFiltro?true:(cOk&&pOk&&sOk); });
        const top=(filtered.length>0?filtered:targets).slice(0,12);
