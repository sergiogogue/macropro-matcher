              <option value="green">🟢 Activo</option>
              <option value="yellow">🟡 Tibio</option>
              <option value="red">🔴 Frío</option>
              <option value="grey">⚫ Sin seguimiento</option>
            </select>
            <span style={{fontSize:11,color:B.grey3}}>{lotsFiltered.length} lotes</span>
            {(filterPipeline!=="Todos"||filterDesarrolloCRM!=="Todos"||filterSemaforo!=="Todos")&&
              <button onClick={()=>{setFilterPipeline("Todos");setFilterDesarrolloCRM("Todos");setFilterSemaforo("Todos");}} style={{padding:"5px 10px",background:"#fee2e2",color:"#dc2626",border:"none",borderRadius:6,cursor:"pointer",fontSize:11,fontWeight:600,fontFamily:"'DM Sans',sans-serif"}}>✕ Limpiar</button>}
          </div>
        )}

        {/* Contenido */}
        {activeTab==="dashboard"&&DashboardCRM()}
        {activeTab==="midia"&&VistaMiDia()}
        {activeTab==="prospectos"&&VistaProspectos()}
        {activeTab==="asesores"&&VistaAsesores()}
        {activeTab==="kanban"&&(
          <div>
            {KanbanBoard()}
            <div style={{marginTop:14}}>{LotPanel()}</div>
          </div>
        )}


        {/* Modal: Asignar/Editar Seguimiento por Asesor */}
        {showSeguimientoModal&&(
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:2200,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={e=>e.target===e.currentTarget&&setShowSeguimientoModal(null)}>
            <div style={{background:B.white,borderRadius:14,width:"100%",maxWidth:540,boxShadow:"0 20px 60px rgba(0,43,73,0.3)",overflow:"hidden"}}>
              <div style={{background:"linear-gradient(135deg,#2563AC,#3B82F6)",padding:"16px 22px"}}>
                <div style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,0.85)",letterSpacing:2,textTransform:"uppercase",marginBottom:3}}>👤 Seguimiento por Asesor</div>
                <div style={{fontSize:17,fontWeight:800,color:"#fff",fontFamily:"'Playfair Display',serif"}}>{showSeguimientoModal.lot.nombre}</div>
                <div style={{fontSize:11,color:"rgba(255,255,255,0.85)",marginTop:2}}>{showSeguimientoModal.lot.desarrollo}</div>
              </div>
              <div style={{padding:"20px 22px"}}>
                <div style={{fontSize:11,color:B.grey4,marginBottom:14,lineHeight:1.5,padding:"10px 12px",background:"#eff6ff",borderRadius:8,borderLeft:"3px solid #3B82F6"}}>
                  Asigna un asesor responsable cuando aún no tengas nombre del cliente. Cuando el cliente aparezca, podrás convertirlo a prospecto formal conservando todas las actividades e historial.
                </div>
                <label style={{fontSize:10,fontWeight:800,color:B.navy,textTransform:"uppercase",letterSpacing:0.8,display:"block",marginBottom:5}}>Asesor responsable *</label>
                {asesoresCatalog.length>0?(
                  <select value={seguimientoForm.asesor} onChange={e=>setSeguimientoForm({...seguimientoForm,asesor:e.target.value})}
                    style={{width:"100%",padding:"10px 12px",borderRadius:8,border:"1.5px solid "+B.grey1,fontSize:12,fontFamily:"'DM Sans',sans-serif",outline:"none",marginBottom:14,boxSizing:"border-box",background:B.white}}>
                    <option value="">— Selecciona asesor —</option>
                    {asesoresCatalog.map(a=><option key={a.id} value={a.nombre}>{a.nombre}{a.zona?" · "+a.zona:""}</option>)}
                  </select>
                ):(
                  <input type="text" value={seguimientoForm.asesor} onChange={e=>setSeguimientoForm({...seguimientoForm,asesor:e.target.value})}
                    placeholder="Nombre del asesor"
                    style={{width:"100%",padding:"10px 12px",borderRadius:8,border:"1.5px solid "+B.grey1,fontSize:12,fontFamily:"'DM Sans',sans-serif",outline:"none",marginBottom:14,boxSizing:"border-box"}}/>
                )}
                <label style={{fontSize:10,fontWeight:800,color:B.navy,textTransform:"uppercase",letterSpacing:0.8,display:"block",marginBottom:5}}>Notas iniciales (opcional)</label>
                <textarea value={seguimientoForm.notas} onChange={e=>setSeguimientoForm({...seguimientoForm,notas:e.target.value})}
                  placeholder="Ej: Contacto vía anuncio de Meta, mostró interés en lote comercial..."
                  style={{width:"100%",minHeight:80,padding:"10px 12px",borderRadius:8,border:"1.5px solid "+B.grey1,fontSize:12,fontFamily:"'DM Sans',sans-serif",outline:"none",resize:"vertical",boxSizing:"border-box"}}/>
              </div>
              <div style={{padding:"14px 22px",borderTop:"1px solid "+B.grey1,display:"flex",gap:10,justifyContent:"flex-end",background:B.offW,flexWrap:"wrap"}}>
                {(crmData[showSeguimientoModal.lotId]&&crmData[showSeguimientoModal.lotId].seguimientoAsesor)&&(
                  <button onClick={()=>{deleteSeguimientoAsesor(showSeguimientoModal.lotId);setShowSeguimientoModal(null);}} style={{background:"#fee2e2",border:"none",color:"#dc2626",borderRadius:8,padding:"10px 14px",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",marginRight:"auto"}}>🗑 Eliminar seguimiento</button>
                )}
                <button onClick={()=>setShowSeguimientoModal(null)} style={{background:B.white,border:"1.5px solid "+B.grey1,color:B.grey4,borderRadius:8,padding:"10px 18px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>Cancelar</button>
                <button onClick={()=>{
                  if(!seguimientoForm.asesor||!seguimientoForm.asesor.trim()){toast("⚠ Selecciona o escribe un asesor");return;}
                  assignSeguimientoAsesor(showSeguimientoModal.lotId,seguimientoForm.asesor.trim(),seguimientoForm.notas);
                  setShowSeguimientoModal(null);
                }}
                  style={{background:"#2563AC",color:"#fff",border:"none",borderRadius:8,padding:"10px 22px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>
                  ✓ Guardar seguimiento
                </button>
              </div>
            </div>
          </div>
        )}

        {/* Modal: Convertir Seguimiento a Prospecto Formal */}
        {showConvertModal&&(
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:2200,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={e=>e.target===e.currentTarget&&setShowConvertModal(null)}>
            <div style={{background:B.white,borderRadius:14,width:"100%",maxWidth:540,boxShadow:"0 20px 60px rgba(0,43,73,0.3)",overflow:"hidden"}}>
              <div style={{background:"linear-gradient(135deg,#15803d,#22c55e)",padding:"16px 22px"}}>
                <div style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,0.85)",letterSpacing:2,textTransform:"uppercase",marginBottom:3}}>🎉 Convertir a Prospecto Formal</div>
                <div style={{fontSize:17,fontWeight:800,color:"#fff",fontFamily:"'Playfair Display',serif"}}>{showConvertModal.lot.nombre}</div>
                <div style={{fontSize:11,color:"rgba(255,255,255,0.85)",marginTop:2}}>Asesor actual: {showConvertModal.seguimiento.asesor} · Etapa: {showConvertModal.seguimiento.pipeline}</div>
              </div>
              <div style={{padding:"20px 22px"}}>
                <div style={{fontSize:11,color:B.grey4,marginBottom:14,lineHeight:1.5,padding:"10px 12px",background:"#f0fdf4",borderRadius:8,borderLeft:"3px solid #22c55e"}}>
                  Se crea un prospecto formal heredando <strong>todas las actividades, etapa, temperatura y notas</strong> del seguimiento. El seguimiento sin cliente se elimina automáticamente.
                </div>
                <label style={{fontSize:10,fontWeight:800,color:B.navy,textTransform:"uppercase",letterSpacing:0.8,display:"block",marginBottom:5}}>Nombre del cliente *</label>
                <input type="text" value={convertForm.nombre} onChange={e=>setConvertForm({...convertForm,nombre:e.target.value})}
                  placeholder="Nombre completo"
                  style={{width:"100%",padding:"10px 12px",borderRadius:8,border:"1.5px solid "+B.grey1,fontSize:12,fontFamily:"'DM Sans',sans-serif",outline:"none",marginBottom:12,boxSizing:"border-box"}}/>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
                  <div>
                    <label style={{fontSize:10,fontWeight:800,color:B.navy,textTransform:"uppercase",letterSpacing:0.8,display:"block",marginBottom:5}}>Empresa</label>
                    <input type="text" value={convertForm.empresa} onChange={e=>setConvertForm({...convertForm,empresa:e.target.value})}
                      style={{width:"100%",padding:"10px 12px",borderRadius:8,border:"1.5px solid "+B.grey1,fontSize:12,fontFamily:"'DM Sans',sans-serif",outline:"none",boxSizing:"border-box"}}/>
                  </div>
                  <div>
                    <label style={{fontSize:10,fontWeight:800,color:B.navy,textTransform:"uppercase",letterSpacing:0.8,display:"block",marginBottom:5}}>Teléfono</label>
                    <input type="tel" value={convertForm.telefono} onChange={e=>setConvertForm({...convertForm,telefono:e.target.value})}
                      placeholder="+52..."
                      style={{width:"100%",padding:"10px 12px",borderRadius:8,border:"1.5px solid "+B.grey1,fontSize:12,fontFamily:"'DM Sans',sans-serif",outline:"none",boxSizing:"border-box"}}/>
                  </div>
                </div>
                <label style={{fontSize:10,fontWeight:800,color:B.navy,textTransform:"uppercase",letterSpacing:0.8,display:"block",marginBottom:5}}>Email (opcional)</label>
                <input type="email" value={convertForm.email} onChange={e=>setConvertForm({...convertForm,email:e.target.value})}
                  style={{width:"100%",padding:"10px 12px",borderRadius:8,border:"1.5px solid "+B.grey1,fontSize:12,fontFamily:"'DM Sans',sans-serif",outline:"none",boxSizing:"border-box"}}/>
                <div style={{marginTop:14,padding:"10px 12px",background:B.offW,borderRadius:8,fontSize:11}}>
                  <div style={{fontWeight:800,color:B.navy,marginBottom:4}}>📦 Se conservarán:</div>
                  <div style={{color:B.grey4}}>
                    · {(showConvertModal.seguimiento.actividades||[]).length} actividades<br/>
                    · Etapa: <strong>{showConvertModal.seguimiento.pipeline}</strong><br/>
                    · Temperatura: <strong>{showConvertModal.seguimiento.temperatura||"—"}</strong><br/>
                    · {(showConvertModal.seguimiento.notas||"").length>0?"Notas originales":"Sin notas adicionales"}
                  </div>
                </div>
              </div>
              <div style={{padding:"14px 22px",borderTop:"1px solid "+B.grey1,display:"flex",gap:10,justifyContent:"flex-end",background:B.offW}}>
                <button onClick={()=>setShowConvertModal(null)} style={{background:B.white,border:"1.5px solid "+B.grey1,color:B.grey4,borderRadius:8,padding:"10px 18px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>Cancelar</button>
                <button onClick={()=>{
                  if(!convertForm.nombre||!convertForm.nombre.trim()){toast("⚠ Nombre del cliente requerido");return;}
                  convertSeguimientoToProspecto(showConvertModal.lotId,convertForm.nombre,convertForm.empresa,convertForm.telefono,convertForm.email);
                  setShowConvertModal(null);
                  setConvertForm({nombre:"",empresa:"",telefono:"",email:""});
                }}
                  style={{background:"#16a34a",color:"#fff",border:"none",borderRadius:8,padding:"10px 22px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>
                  🎉 Convertir a prospecto
                </button>
              </div>
            </div>
          </div>
        )}

        {/* Modal: Actividad (crear/editar/completar) */}
        {showActivityModal&&(() => {
          const mode=showActivityModal.mode;
          const isComplete=mode==="complete";
          const isEdit=mode==="edit";
          const actExisting=showActivityModal.activity;
          const headerColor=isComplete?"linear-gradient(135deg,#15803d,#22c55e)":"linear-gradient(135deg,"+B.navy+","+B.navyL+")";
          const titleText=isComplete?"Completar actividad":isEdit?"Editar actividad":"Nueva actividad";
          const icon=isComplete?"✅":isEdit?"✏️":"📅";
          return (
            <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:2100,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={e=>e.target===e.currentTarget&&setShowActivityModal(null)}>
              <div style={{background:B.white,borderRadius:14,width:"100%",maxWidth:500,boxShadow:"0 20px 60px rgba(0,43,73,0.3)",overflow:"hidden",maxHeight:"90vh",display:"flex",flexDirection:"column"}}>
                <div style={{background:headerColor,padding:"16px 22px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div>
                    <div style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,0.85)",letterSpacing:2,textTransform:"uppercase",marginBottom:3}}>{icon} Actividad</div>
                    <div style={{fontSize:17,fontWeight:800,color:"#fff",fontFamily:"'Playfair Display',serif"}}>{titleText}</div>
                  </div>
                  <button onClick={()=>setShowActivityModal(null)} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",borderRadius:8,padding:"6px 10px",cursor:"pointer",fontSize:13,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>✕</button>
                </div>
                <div style={{padding:"20px 22px",overflowY:"auto",flex:1}}>
                  {isComplete?(
                    <>
                      <div style={{fontSize:12,color:B.grey4,marginBottom:14,padding:"10px 12px",background:B.offW,borderRadius:8,borderLeft:"3px solid "+(ACTIVITY_TYPES.find(t=>t.id===actExisting.tipo)||ACTIVITY_TYPES[0]).color}}>
                        <strong style={{color:B.navy}}>{actExisting.descripcion||actExisting.tipo}</strong>
                        <div style={{fontSize:10,color:B.grey3,marginTop:2}}>Programada para: {actExisting.fecha}{actExisting.hora?" · "+actExisting.hora:""}</div>

              })}
            </div>
            <div style={{padding:"12px 20px",borderTop:"1px solid #e5e7eb",background:"#f7f8fa",flexShrink:0}}>
              <label style={{fontSize:10,fontWeight:800,color:"#002B49",textTransform:"uppercase",letterSpacing:0.8,display:"block",marginBottom:5,fontFamily:"'DM Sans',sans-serif"}}>Nota inicial (opcional)</label>
              <input type="text" value={quickClientNota} onChange={e=>setQuickClientNota(e.target.value)}
                placeholder="Ej: referido de Juan, interesado en financiamiento..."
                style={{width:"100%",padding:"8px 12px",borderRadius:8,border:"1.5px solid #e5e7eb",fontSize:12,fontFamily:"'DM Sans',sans-serif",outline:"none",boxSizing:"border-box"}}/>
              <div style={{display:"flex",justifyContent:"flex-end",marginTop:10}}>
                <button onClick={()=>setQuickClientLot(null)} style={{background:"#fff",border:"1.5px solid #e5e7eb",color:"#4b5563",borderRadius:8,padding:"8px 16px",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>Cerrar</button>
              </div>
            </div>
          </div>
        </div>
        );
      })()}

      {/* Modal: Instrucciones instalación iOS (Safari no tiene prompt nativo) */}
      {showIOSInstallHint&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.65)",zIndex:3100,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={e=>e.target===e.currentTarget&&setShowIOSInstallHint(false)}>
          <div style={{background:"#fff",borderRadius:16,width:"100%",maxWidth:440,boxShadow:"0 20px 60px rgba(0,43,73,0.4)",overflow:"hidden"}}>
            <div style={{background:"linear-gradient(135deg,#8B5CF6,#a78bfa)",padding:"20px 24px",textAlign:"center"}}>
              <div style={{fontSize:36,marginBottom:4}}>📱</div>
              <div style={{fontSize:18,fontWeight:800,color:"#fff",fontFamily:"'Playfair Display',serif"}}>Instala MacroPro en tu iPhone</div>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.85)",marginTop:4,fontFamily:"'DM Sans',sans-serif"}}>Funciona como app nativa sin barra del navegador</div>
            </div>
            <div style={{padding:"22px 24px"}}>
              <div style={{fontSize:12,color:"#4b5563",marginBottom:16,lineHeight:1.6,fontFamily:"'DM Sans',sans-serif"}}>Safari en iOS no permite instalación automática. Sigue estos 3 pasos desde tu iPhone:</div>
              <div style={{display:"flex",flexDirection:"column",gap:12}}>
                <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
                  <div style={{width:30,height:30,borderRadius:"50%",background:"#8B5CF6",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:14,flexShrink:0}}>1</div>
                  <div style={{fontSize:13,color:"#002B49",fontFamily:"'DM Sans',sans-serif",lineHeight:1.5}}>Toca el botón <strong>Compartir</strong> <span style={{display:"inline-block",padding:"2px 8px",background:"#f3f4f6",borderRadius:4,fontSize:11,fontWeight:700}}>⎙</span> en la barra inferior de Safari</div>
                </div>
                <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
                  <div style={{width:30,height:30,borderRadius:"50%",background:"#8B5CF6",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:14,flexShrink:0}}>2</div>
                  <div style={{fontSize:13,color:"#002B49",fontFamily:"'DM Sans',sans-serif",lineHeight:1.5}}>Desplázate y toca <strong>"Añadir a pantalla de inicio"</strong> <span style={{fontSize:14}}>➕</span></div>
                </div>
                <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
                  <div style={{width:30,height:30,borderRadius:"50%",background:"#8B5CF6",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:14,flexShrink:0}}>3</div>
                  <div style={{fontSize:13,color:"#002B49",fontFamily:"'DM Sans',sans-serif",lineHeight:1.5}}>Confirma tocando <strong>"Añadir"</strong>. El icono de MacroPro aparecerá en tu home.</div>
                </div>
              </div>
              <div style={{marginTop:18,padding:"10px 12px",background:"#eff6ff",borderRadius:8,borderLeft:"3px solid #3B82F6",fontSize:11,color:"#1e40af",lineHeight:1.5,fontFamily:"'DM Sans',sans-serif"}}>
                💡 Una vez instalada, ábrela como cualquier app. Tus datos quedan guardados ahí y funciona sin internet.
              </div>
            </div>
            <div style={{padding:"14px 24px",borderTop:"1px solid #e5e7eb",background:"#f7f8fa",textAlign:"right"}}>
              <button onClick={()=>setShowIOSInstallHint(false)} style={{background:"#8B5CF6",color:"#fff",border:"none",borderRadius:8,padding:"10px 22px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>Entendido</button>
            </div>
          </div>
        </div>
      )}
      {loading&&<LoadingView/>}
      {toastMsg&&<div style={s.toast}>{toastMsg}</div>}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={hasError:false,error:null};}
  static getDerivedStateFromError(err){return {hasError:true,error:err};}
  componentDidCatch(err,info){console.error("MacroPro crash:",err,info);}
  render(){
    if(this.state.hasError){
      const e=this.state.error;
      return React.createElement("div",{style:{padding:40,fontFamily:"monospace",background:"#fef2f2",minHeight:"100vh"}},
        React.createElement("div",{style:{fontSize:20,fontWeight:800,color:"#dc2626",marginBottom:12}},"⚠ Error de aplicación — Reporte al desarrollador"),
        React.createElement("div",{style:{fontSize:14,color:"#7f1d1d",marginBottom:8}},e&&e.message),
        React.createElement("pre",{style:{fontSize:11,background:"#fff",padding:16,borderRadius:8,overflow:"auto",border:"1px solid #fca5a5"}},e&&e.stack),
        React.createElement("button",{onClick:()=>window.location.reload(),style:{marginTop:16,padding:"10px 20px",background:"#dc2626",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:14}},"🔄 Recargar aplicación")
      );
    }
    return this.props.children;
  }
}

ReactDOM.render(React.createElement(ErrorBoundary,null,React.createElement(MacroProMatcher)), document.getElementById("root"));




</script>
</body>
</html>
