              <select style={{...s.select,minWidth:150}} value={filterDesarrollo} onChange={e=>setFilterDesarrollo(e.target.value)}>{desarrollosDisponibles.map(d=><option key={d}>{d}</option>)}</select>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:2}}>
              <span style={{fontSize:10,color:B.grey3,fontWeight:600}}>USO DE SUELO</span>
              <select style={s.select} value={filterUso} onChange={e=>setFilterUso(e.target.value)}>{usos.map(u=><option key={u}>{u}</option>)}</select>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:2}}>
              <span style={{fontSize:10,color:B.grey3,fontWeight:600}}>SUP. MÍN m²</span>
              <input style={s.input} type="number" placeholder="5000" value={filterSupMin} onChange={e=>setFilterSupMin(e.target.value)}/>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:2}}>
              <span style={{fontSize:10,color:B.grey3,fontWeight:600}}>PRECIO MÁX MDP</span>
              <input style={s.input} type="number" placeholder="100" value={filterPrecioMax} onChange={e=>setFilterPrecioMax(e.target.value)}/>
            </div>
          </>):(<>
            <div style={{display:"flex",flexDirection:"column",gap:2}}>
              <span style={{fontSize:10,color:B.grey3,fontWeight:600}}>ASESOR</span>
              <select style={s.select} value={filterAsesor} onChange={e=>setFilterAsesor(e.target.value)}>{asesores.map(a=><option key={a}>{a}</option>)}</select>
            </div>
          </>)}
          <div style={{marginLeft:"auto",fontSize:12,color:B.grey3}}>Mostrando <strong style={{color:B.navy}}>{filtered.length}</strong> de {results.length}</div>
        </div>
        {filtered.map((r,i)=>{
          const item=r.data; if(!item) return null;
          return (
            <div key={r.id} className="result-card" style={s.resultCard(i)}>
              <div style={s.rankBadge(i)}>#{i+1}</div>
              <div style={{display:"flex",gap:18,alignItems:"flex-start"}}>
                <ScoreRing score={r.score} size={76}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:7,flexWrap:"wrap"}}>
                    <span style={{fontSize:17,fontWeight:800,color:B.navy,fontFamily:"'Playfair Display',serif"}}>{item.nombre}</span>
                    <Tag label={r.match_label} color={scoreColor(r.score)} bg={r.score>=80?B.greenL:r.score>=60?"#fff8e7":B.blueL}/>
                    {isClientMode&&(item.usos_todos&&item.usos_todos.length>0?item.usos_todos:[item.uso].filter(Boolean)).map(u=><Tag key={u} label={u} color={B.navy} bg={B.blueL}/>)}
                    {isClientMode&&<Tag label={item.ciudad} color={B.navy} bg={B.grey1}/>}
                    {isClientMode&&item.desarrollo&&<Tag label={item.desarrollo} color={B.goldD} bg="#FFF9EC"/>}
                    {!isClientMode&&<Tag label={item.temperatura||""} color={tempColor(item.temperatura)} bg={tempBg(item.temperatura)}/>}
                  </div>
                  <div style={{fontSize:12,color:B.grey3,marginBottom:10,display:"flex",gap:14,flexWrap:"wrap"}}>
                    {isClientMode?(<><span>📐 {(item.sup_m2||0).toLocaleString()} m²</span><span>💲 ${(item.precio_m2||0).toLocaleString()}/m²</span><span style={{fontWeight:700,color:B.navy}}>{fmtM(item.precio_total)}</span><span>⚡ {item.entrega}</span></>):(<><span>🏢 {item.empresa}</span><span>👨‍💼 {item.asesor}</span><span>💲 {fmtM(item.presupuesto_min)}–{fmtM(item.presupuesto_max)}</span><span>📐 {(item.sup_min||0).toLocaleString()}–{(item.sup_max||0).toLocaleString()} m²</span></>)}
                  </div>
                  <div style={{background:`linear-gradient(90deg,${B.gold}18,transparent)`,borderLeft:`3px solid ${B.gold}`,padding:"9px 13px",borderRadius:"0 8px 8px 0",marginBottom:10,fontSize:13,color:B.navy,fontWeight:600}}>{r.razon_principal}</div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                    <div style={{background:B.greenL,borderRadius:9,padding:12}}>
                      <div style={{fontSize:10,fontWeight:700,color:B.green,letterSpacing:1,textTransform:"uppercase",marginBottom:7}}>✦ Argumentos de venta</div>
                      {r.argumentos?.map((a,ai)=><div key={ai} style={{fontSize:12,color:B.grey4,marginBottom:5,display:"flex",gap:7}}><span style={{color:B.green,fontWeight:700,flexShrink:0}}>{ai+1}.</span><span>{a}</span></div>)}
                    </div>
                    <div>
                      <div style={{background:B.redL,borderRadius:9,padding:12,marginBottom:8}}>
                        <div style={{fontSize:10,fontWeight:700,color:B.red,letterSpacing:1,textTransform:"uppercase",marginBottom:5}}>⚠ Posible objeción</div>
                        <div style={{fontSize:12,color:B.grey4}}>{r.objeccion}</div>
                        <div style={{fontSize:12,color:B.green,marginTop:5,fontWeight:600}}>→ {r.respuesta_objecion}</div>
                      </div>
                      <div style={{background:"#fff8e7",borderRadius:9,padding:12,border:`1px solid ${B.gold}44`}}>
                        <div style={{fontSize:10,fontWeight:700,color:B.goldD,letterSpacing:1,textTransform:"uppercase",marginBottom:5}}>⚡ Urgencia / Cierre</div>
                        <div style={{fontSize:12,color:B.grey4}}>{r.urgencia}</div>
                      </div>
                    </div>
                  </div>
                </div>
                {/* Botones de acción */}
                <div style={{display:"flex",gap:8,marginTop:12,paddingTop:10,borderTop:"1px solid "+B.grey1,flexWrap:"wrap"}}>
                  {isClientMode&&<button onClick={()=>setSelectedLotDetail(item)} style={{padding:"7px 14px",background:B.gold,color:B.navy,border:"none",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>📋 Ficha</button>}
                  {isClientMode&&<button onClick={()=>{
                    const crm=crmData[item.id]||{pipeline:"Disponible",interacciones:[],prospectos:[],devFeedback:[]};
                    const yaExiste=(crm.prospectos||[]).some(p=>p.nombre===subject.nombre);
                    if(!yaExiste){
                      const prospectos=[...(crm.prospectos||[]),{nombre:subject.nombre,empresa:subject.empresa||"",telefono:"",email:"",pipeline:"Prospecto",nota:"Match IA — score: "+r.score+" — "+new Date().toLocaleDateString("es-MX")}];
                      updateCRM(item.id,{prospectos,pipeline:crm.pipeline==="Disponible"?"Prospecto":crm.pipeline,lastContact:new Date().toISOString().slice(0,10)});
                    }
                    setView("crm");
                    toast("✅ "+item.nombre+" asignado a "+subject.nombre);
                  }} style={{padding:"7px 14px",background:"#22c55e",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>📌 Asignar a CRM</button>}
                  {isClientMode&&<button onClick={()=>{setSelectedLot(item);setView("matchLot");}} style={{padding:"7px 14px",background:B.navy,color:B.gold,border:"none",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>🎯 Ver otros clientes</button>}
                  {!isClientMode&&<button onClick={()=>{setSelectedClient(item);setView("matchClient");}} style={{padding:"7px 14px",background:B.gold,color:B.navy,border:"none",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>🎯 Ver lotes</button>}
                </div>
              </div>
            </div>
          );
        })}
        {filtered.length===0&&<div style={{textAlign:"center",padding:40,color:B.grey3}}><div style={{fontSize:36,marginBottom:10}}>🔍</div><div style={{fontSize:15,fontWeight:600}}>Sin resultados con estos filtros</div></div>}
      </div>
    );
  };

  // ─── VIEW QUICK SEARCH ────────────────────────────────────────────
  const ViewQuickSearch = () => {
    // Estado LOCAL para los inputs — evita que el cursor salte al re-renderizar
    const [localUso, setLocalUso] = useState(quickSearchCriteria.uso||"");
    const [localSupMin, setLocalSupMin] = useState(quickSearchCriteria.sup_min||"");
    const [localSupMax, setLocalSupMax] = useState(quickSearchCriteria.sup_max||"");
    const [localPrecioM2, setLocalPrecioM2] = useState(quickSearchCriteria.precio_m2_max||"");
    const [localCiudad, setLocalCiudad] = useState(quickSearchCriteria.ciudad||"");
    const [localDesarrollo, setLocalDesarrollo] = useState(quickSearchCriteria.desarrollo||"");

    const inputStyle = (val) => ({
      width:"100%", padding:"11px 14px",
      border:`2px solid ${val?B.gold:B.grey1}`,
      borderRadius:9, fontSize:14, outline:"none",
      fontFamily:"'DM Sans',sans-serif",
      transition:"border-color 0.2s",
    });

    const limpiarTodo = () => {
      setLocalUso(""); setLocalSupMin(""); setLocalSupMax("");
      setLocalPrecioM2(""); setLocalCiudad(""); setLocalDesarrollo("");
      setQuickSearchCriteria({ciudad:"",desarrollo:"",uso:"",sup_min:"",sup_max:"",presupuesto_max:"",precio_m2_max:""});
      setQuickSearchResults([]); setQuickSearchDone(false);
    };

    const buscar = () => {
      // Sincronizar estado local → criterios globales y buscar
      const criterios = {
        uso: localUso, sup_min: localSupMin, sup_max: localSupMax,
        precio_m2_max: localPrecioM2, ciudad: localCiudad,
        desarrollo: localDesarrollo, presupuesto_max: ""
      };
      setQuickSearchCriteria(criterios);
      // Buscar directamente con los valores locales (no esperar setState)
      const results = srcInv.filter(lote => {
        if(localCiudad && lote.ciudad!==localCiudad) return false;
        if(localDesarrollo && lote.desarrollo!==localDesarrollo) return false;
        if(localUso){const uArr=lote.usos_todos&&lote.usos_todos.length>0?lote.usos_todos:[lote.uso];if(!uArr.includes(localUso)) return false;}
        if(localSupMin && lote.sup_m2<parseFloat(localSupMin)) return false;
        if(localSupMax && lote.sup_m2>parseFloat(localSupMax)) return false;
        if(localPrecioM2 && lote.precio_m2>parseFloat(localPrecioM2)) return false;
        return true;
      });
      setQuickSearchResults(results);
      setQuickSearchDone(true);
    };

    const hayFiltros = localUso||localSupMin||localSupMax||localPrecioM2||localCiudad||localDesarrollo;

    const desarrollosDisp = (()=>{
      const src = localCiudad ? srcInv.filter(l=>l.ciudad===localCiudad) : srcInv;
      return [...new Set(src.map(l=>l.desarrollo).filter(Boolean))].sort();
    })();

    const usosTodos = (()=>{
      const todos=[];
      srcInv.forEach(l=>{
        const arr=l.usos_todos&&l.usos_todos.length>0?l.usos_todos:[l.uso].filter(Boolean);
        arr.forEach(u=>{if(u&&!todos.includes(u))todos.push(u);});
      });
      return todos.sort();
    })();

    return (
      <div style={s.page}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24}}>
          <button style={s.btn("ghost")} onClick={()=>setView("home")}>← Inicio</button>
          {hayFiltros&&<button style={s.btn("ghost")} onClick={limpiarTodo}>🔄 Limpiar filtros</button>}
        </div>
        <div style={s.sectionTitle}>🔍 Búsqueda Rápida de Macrolotes</div>
        <div style={{...s.sectionSub,marginBottom:20}}>Encuentra el lote ideal sin registrar al cliente — filtra por cualquier combinación</div>
        <div style={{background:B.white,padding:28,borderRadius:16,boxShadow:"0 4px 14px rgba(0,43,73,0.08)",marginBottom:24,border:`1px solid ${B.grey1}`}}>
          <div style={{fontSize:13,fontWeight:700,color:B.navy,marginBottom:18}}>¿Qué necesita tu cliente?</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(240px,1fr))",gap:16,marginBottom:20}}>
            <div>
              <label style={{display:"block",color:B.navy,fontSize:13,marginBottom:6,fontWeight:600}}>1. Uso de Suelo {localUso&&<span style={{color:B.green}}>✓</span>}</label>
              <select value={localUso} onChange={e=>setLocalUso(e.target.value)} style={inputStyle(localUso)}>
                <option value="">— Selecciona uso de suelo —</option>
                {usosTodos.map(u=><option key={u} value={u}>{u}</option>)}
              </select>
            </div>
            <div>
              <label style={{display:"block",color:B.navy,fontSize:13,marginBottom:6,fontWeight:600}}>2. Superficie Mínima (m²) {localSupMin&&<span style={{color:B.green}}>✓</span>}</label>
              <input
                type="text"
                inputMode="numeric"
                value={localSupMin}
                onChange={e=>setLocalSupMin(e.target.value.replace(/[^0-9.]/g,""))}
                placeholder="Ej: 5000"
                style={inputStyle(localSupMin)}
              />
            </div>
            <div>
              <label style={{display:"block",color:B.navy,fontSize:13,marginBottom:6,fontWeight:600}}>3. Superficie Máxima (m²) {localSupMax&&<span style={{color:B.green}}>✓</span>}</label>
              <input
                type="text"
                inputMode="numeric"
                value={localSupMax}
                onChange={e=>setLocalSupMax(e.target.value.replace(/[^0-9.]/g,""))}
                placeholder="Ej: 15000"
                style={inputStyle(localSupMax)}
              />
            </div>
            <div>
              <label style={{display:"block",color:B.navy,fontSize:13,marginBottom:6,fontWeight:600}}>4. Precio máximo/m² ($MXN) {localPrecioM2&&<span style={{color:B.green}}>✓</span>}</label>
              <input
                type="text"
                inputMode="numeric"
                value={localPrecioM2}
                onChange={e=>setLocalPrecioM2(e.target.value.replace(/[^0-9.]/g,""))}
                placeholder="Ej: 8000"
                style={inputStyle(localPrecioM2)}
              />
              {localPrecioM2&&<span style={{fontSize:11,color:B.grey3,marginTop:3,display:"block"}}>Máximo {fmt(parseFloat(localPrecioM2)||0)} por m²</span>}
            </div>
            <div>
              <label style={{display:"block",color:B.grey4,fontSize:13,marginBottom:6,fontWeight:500}}>Ciudad (opcional) {localCiudad&&<span style={{color:B.green}}>✓</span>}</label>
              <select value={localCiudad} onChange={e=>{setLocalCiudad(e.target.value);setLocalDesarrollo("");}} style={inputStyle(localCiudad)}>
                <option value="">Todas las ciudades</option>
                {[...new Set(srcInv.map(l=>l.ciudad).filter(Boolean))].sort().map(c=><option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div>
              <label style={{display:"block",color:B.grey4,fontSize:13,marginBottom:6,fontWeight:500}}>Desarrollo (opcional) {localDesarrollo&&<span style={{color:B.green}}>✓</span>}</label>
              <select value={localDesarrollo} onChange={e=>setLocalDesarrollo(e.target.value)} style={inputStyle(localDesarrollo)}>
                <option value="">Todos los desarrollos</option>
                {desarrollosDisp.map(d=><option key={d} value={d}>{d}</option>)}
              </select>
            </div>
          </div>
          <button onClick={buscar} style={{width:"100%",padding:"15px 28px",background:B.gold,color:B.navy,border:"none",borderRadius:12,cursor:"pointer",fontWeight:700,fontSize:15,boxShadow:`0 4px 16px ${B.gold}44`,transition:"all 0.2s"}} onMouseEnter={e=>e.currentTarget.style.transform="translateY(-2px)"} onMouseLeave={e=>e.currentTarget.style.transform="translateY(0)"}>
            🔍 Buscar Lotes Disponibles
          </button>
        </div>
        {quickSearchDone&&quickSearchResults.length>0&&(
          <div style={{background:B.white,padding:24,borderRadius:16,boxShadow:"0 4px 14px rgba(0,43,73,0.08)",border:`1px solid ${B.grey1}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
              <div>
                <span style={{fontSize:18,fontWeight:700,color:B.navy}}>✅ {quickSearchResults.length} Lote{quickSearchResults.length!==1?"s":""} Encontrado{quickSearchResults.length!==1?"s":""}</span>
                <span style={{fontSize:12,color:B.grey3,marginLeft:10}}>de {srcInv.length} en inventario</span>
              </div>
            </div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",minWidth:900}}>
                <thead>
                  <tr style={{background:B.navy}}>
                    {["Nombre","Ciudad","Desarrollo","Uso","Superficie","Precio/m²","Precio Total","Acción"].map((h,i)=>(
                      <th key={i} style={{padding:"13px 11px",textAlign:i>=4&&i<7?"right":i===7?"center":"left",color:B.white,fontSize:12,fontWeight:600,whiteSpace:"nowrap"}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {quickSearchResults.map((lote,idx)=>(
                    <tr key={lote.id} style={{background:idx%2===0?B.offW:B.white,borderBottom:`1px solid ${B.grey1}`}} onMouseEnter={e=>e.currentTarget.style.background="#EEF4FF"} onMouseLeave={e=>e.currentTarget.style.background=idx%2===0?B.offW:B.white}>
                      <td style={{padding:"12px 11px",fontSize:13,fontWeight:700,color:B.navy}}>{lote.nombre}</td>
                      <td style={{padding:"12px 11px",fontSize:12,color:B.grey4}}>{lote.ciudad}</td>
                      <td style={{padding:"12px 11px",fontSize:12,color:B.grey4}}>{lote.desarrollo}</td>
                      <td style={{padding:"12px 11px"}}><div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{(lote.usos_todos&&lote.usos_todos.length>0?lote.usos_todos:[lote.uso].filter(Boolean)).map((u,i)=><span key={i} style={{padding:"3px 9px",background:i===0?B.blueL:"#FFF9EC",borderRadius:5,fontSize:11,fontWeight:600,color:i===0?B.navy:B.goldD,whiteSpace:"nowrap"}}>{u}</span>)}</div></td>
                      <td style={{padding:"12px 11px",textAlign:"right",fontSize:13,fontWeight:600}}>{(lote.sup_m2||0).toLocaleString()} m²</td>
                      <td style={{padding:"12px 11px",textAlign:"right",fontSize:13,fontWeight:600,color:B.blue}}>{fmt(lote.precio_m2)}</td>
                      <td style={{padding:"12px 11px",textAlign:"right",fontSize:14,fontWeight:700,color:B.green}}>{fmtM(lote.precio_total)}</td>
                      <td style={{padding:"12px 11px",textAlign:"center"}}>
                        <div style={{display:"flex",gap:5,justifyContent:"center"}}>
                          <button onClick={()=>setSelectedLotDetail(lote)} style={{padding:"6px 12px",background:B.gold,color:B.navy,border:"none",borderRadius:7,cursor:"pointer",fontSize:11,fontWeight:700}}>📋 Ficha</button>
                          <button onClick={()=>{setSelectedLot(lote);setView("matchLot");}} style={{padding:"6px 12px",background:B.navy,color:B.gold,border:"none",borderRadius:7,cursor:"pointer",fontSize:11,fontWeight:700}}>🎯 Match</button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}
        {quickSearchDone&&quickSearchResults.length===0&&(()=>{
          // Diagnóstico inteligente: ¿qué filtro está bloqueando los resultados?
          const soloUso = localUso ? srcInv.filter(l=>{
            const uArr=l.usos_todos&&l.usos_todos.length>0?l.usos_todos:[l.uso];
            return uArr.includes(localUso);
          }) : [];
          const soloUsoYSup = soloUso.filter(l=>
            (!localSupMin||l.sup_m2>=parseFloat(localSupMin||0))&&
            (!localSupMax||l.sup_m2<=parseFloat(localSupMax||999999999))
          );
          const soloUsoYPrecio = soloUso.filter(l=>
            !localPrecioM2||l.precio_m2<=parseFloat(localPrecioM2||999999999)
          );

          let mensajePrincipal = "Sin resultados con estos criterios";
          let mensajeDetalle = "Intenta ampliar los filtros";
          let pista = null;

          if(localUso && soloUso.length > 0 && soloUsoYSup.length === 0 && localSupMax){
            // El uso sí existe pero la superficie lo bloquea
            const supMin_real = Math.min(...soloUso.map(l=>l.sup_m2));
            const supMax_real = Math.max(...soloUso.map(l=>l.sup_m2));
            mensajePrincipal = `Hay ${soloUso.length} lote${soloUso.length>1?"s":""} con "${localUso}"`;
            mensajeDetalle = `pero su superficie real es entre ${supMin_real.toLocaleString()} – ${supMax_real.toLocaleString()} m²`;
            pista = `Tu filtro de superficie máxima (${parseFloat(localSupMax).toLocaleString()} m²) los está excluyendo`;
          } else if(localUso && soloUso.length > 0 && soloUsoYPrecio.length === 0 && localPrecioM2){
            const pm2_min = Math.min(...soloUso.map(l=>l.precio_m2).filter(p=>p>0));
            mensajePrincipal = `Hay ${soloUso.length} lote${soloUso.length>1?"s":""} con "${localUso}"`;
            mensajeDetalle = `pero su precio/m² real inicia desde $${pm2_min.toLocaleString()}`;
            pista = `Tu filtro de precio máximo ($${parseFloat(localPrecioM2).toLocaleString()}/m²) los está excluyendo`;
          } else if(localUso && soloUso.length === 0){
            mensajePrincipal = `No hay lotes con uso "${localUso}" en el inventario`;
            mensajeDetalle = "Verifica que el Excel esté cargado correctamente";
          } else if(localCiudad){
            mensajePrincipal = "Sin lotes con esa combinación en esta ciudad";
            mensajeDetalle = "Prueba quitando el filtro de ciudad";
          }

          return (
            <div style={{background:B.white,padding:40,borderRadius:16,boxShadow:"0 4px 14px rgba(0,43,73,0.08)",border:`1px solid ${B.grey1}`}}>
              <div style={{textAlign:"center",marginBottom:pista?24:0}}>
                <div style={{fontSize:44,marginBottom:12}}>🔍</div>
                <div style={{fontSize:17,fontWeight:700,color:B.navy,marginBottom:6}}>{mensajePrincipal}</div>
                <div style={{fontSize:13,color:B.grey3,marginBottom:pista?8:16}}>{mensajeDetalle}</div>
                {pista&&(
                  <div style={{background:"#fff8e7",border:`1px solid ${B.gold}`,borderRadius:9,padding:"10px 16px",display:"inline-block",fontSize:13,color:B.goldD,fontWeight:600,marginBottom:16}}>
                    ⚠ {pista}
                  </div>
                )}
              </div>
              {pista&&soloUso.length>0&&(
                <div style={{borderTop:`1px solid ${B.grey1}`,paddingTop:18}}>
                  <div style={{fontSize:12,fontWeight:700,color:B.grey4,textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>
                    Lotes con "{localUso}" disponibles — ajusta tus filtros para verlos:
                  </div>
                  <div style={{overflowX:"auto"}}>
                    <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>

  const ViewCRM = () => {
    const srcInvCRM = inventory.length>0 ? inventory : SAMPLE_INVENTORY;
    const cliSrcCRM = clients.length>0 ? clients : DEMO_CLIENTS;

    // ── STATE ──────────────────────────────────────────────────────
    // ── STATE LOCAL DE VIEWCRM (los críticos están en el padre) ───
    const [showInterModal, setShowInterModal] = React.useState(false);

    const [selectedFichaItem, setSelectedFichaItem] = React.useState(null);

    const [interForm, setInterForm] = React.useState({fecha:new Date().toISOString().slice(0,10),canal:"Llamada",contacto:"",reaccion:"Interesado",nota:""});
    const [noteText, setNoteText] = React.useState("");
    const [drawerLotes, setDrawerLotes] = React.useState(null); // {titulo, lotes, diasMin}
    const [drawerInventario, setDrawerInventario] = React.useState(null); // {titulo, lotes, semColor}
    // Modales de seguimiento por asesor
    const [showSeguimientoModal, setShowSeguimientoModal] = React.useState(null); // {lotId, lot}
    const [seguimientoForm, setSeguimientoForm] = React.useState({asesor:"",notas:""});
    const [showConvertModal, setShowConvertModal] = React.useState(null); // {lotId, lot, seguimiento}
    const [convertForm, setConvertForm] = React.useState({nombre:"",empresa:"",telefono:"",email:""});

    const desarrolladoresCRM = [...new Set(srcInvCRM.map(l=>l.desarrollador||l.desarrollo).filter(Boolean))].sort();
    const desarrollosCRM = [...new Set(srcInvCRM.map(l=>l.desarrollo).filter(Boolean))];
    // Helper: extrae la empresa del campo "Desarrollo / Empresa" y normaliza variantes
    const getCompaniaDev=(v)=>{
      if(!v) return v;
      const parts=v.split(" / ");
      const c=parts.length>1?parts[parts.length-1].trim():v;
      return c.replace(/^Grupo\s+/i,"").trim(); // "Grupo TYA"→"TYA"
    };
    const companiasCRM=[...new Set(desarrolladoresCRM.map(getCompaniaDev).filter(Boolean))].sort();
    const desarrollosDeCompania=filterDevCompania==="Todos"?[]:
      [...new Set(srcInvCRM.filter(l=>getCompaniaDev(l.desarrollador||l.desarrollo)===filterDevCompania).map(l=>l.desarrollo).filter(Boolean))].sort();
    // Inventario filtrado: primero por empresa, luego por desarrollo específico
    const srcInvFiltrado=(()=>{
      let r=srcInvCRM;
      if(filterDevCompania!=="Todos") r=r.filter(l=>getCompaniaDev(l.desarrollador||l.desarrollo)===filterDevCompania);
      if(filterDesarrolloGlobal!=="Todos") r=r.filter(l=>l.desarrollo===filterDesarrolloGlobal);
      return r;
    })();

    // ── COMPUTED: todos los prospectos en el CRM (vista cliente-céntrica) ──
    const allProspectos = React.useMemo(()=>{
      const list=[];
      srcInvFiltrado.forEach(lot=>{
        const crm=crmData[lot.id]||{};
        (crm.prospectos||[]).forEach((p,idx)=>{
          const cli=cliSrcCRM.find(c=>c.nombre&&c.nombre.toLowerCase().trim()===p.nombre.toLowerCase().trim());
          const dias=crm.lastContact?Math.floor((Date.now()-new Date(crm.lastContact).getTime())/864e5):null;
          list.push({lotId:lot.id,lot,prospectoIdx:idx,prospecto:p,crm,cli,
            semaforo:getSemaforo(lot.id),
            pipeline:p.pipeline||crm.pipeline||"Prospecto",
            interacciones:(crm.interacciones||[]).length,
            lastContact:crm.lastContact,
            diasSinContacto:dias
          });
        });
      });
      return list.sort((a,b)=>{
        const sc={red:0,yellow:1,green:2,grey:3};
        if(sc[a.semaforo]!==sc[b.semaforo]) return sc[a.semaforo]-sc[b.semaforo];
        return (b.diasSinContacto||999)-(a.diasSinContacto||999);
      });
    },[crmData,srcInvFiltrado,cliSrcCRM,filterDesarrolloGlobal]);

    const lotsFiltered=srcInvFiltrado.filter(l=>{
      const crm=crmData[l.id]||{};
      const pip=crm.pipeline||"Disponible";
      const sem=getSemaforo(l.id);
      return (filterPipeline==="Todos"||pip===filterPipeline)&&(filterDesarrolloCRM==="Todos"||l.desarrollo===filterDesarrolloCRM)&&(filterSemaforo==="Todos"||sem===filterSemaforo);
    });

    // ── KPIs ───────────────────────────────────────────────────────
    const totalEnPipeline=srcInvCRM.filter(l=>{const p=crmData[l.id]&&crmData[l.id].pipeline;return p&&p!=="Disponible"&&p!=="Perdido";}).length;
    const totalFrios=srcInvCRM.filter(l=>getSemaforo(l.id)==="red").length;
    const totalFriosF=srcInvFiltrado.filter(l=>getSemaforo(l.id)==="red").length;
    const totalPropuesta=srcInvFiltrado.filter(l=>crmData[l.id]&&crmData[l.id].pipeline==="Propuesta").length;
    const totalCerrado=srcInvCRM.filter(l=>crmData[l.id]&&crmData[l.id].pipeline==="Vendido").length;
    const totalInteracciones=Object.values(crmData).reduce((a,v)=>a+(v.interacciones?v.interacciones.length:0),0);
    const totalProspActivos=allProspectos.filter(p=>p.pipeline!=="Perdido"&&p.pipeline!=="Disponible").length;

    // ── MINI COMPONENTS ────────────────────────────────────────────
    const Semaforo=({lotId,size})=>{
      const sz=size||14; const col=semaforoColor[getSemaforo(lotId)];
      return React.createElement("span",{title:semaforoLabel[getSemaforo(lotId)],style:{display:"inline-block",width:sz,height:sz,borderRadius:"50%",background:col,flexShrink:0,boxShadow:"0 0 5px "+col+"88"}});
    };
    const PipelineBadge=({stage})=>{
      const col=PIPELINE_COLORS[stage]||B.grey3;
      return <span style={{padding:"2px 8px",borderRadius:20,fontSize:10,fontWeight:700,background:col+"22",color:col,border:"1px solid "+col+"44",whiteSpace:"nowrap"}}>{stage||"Disponible"}</span>;
    };

    // ══════════════════════════════════════════════════════════════
    // DASHBOARD CEO
    // ══════════════════════════════════════════════════════════════
    const DashboardCRM=()=>{
      // ── Cálculos centrales ─────────────────────────────────────
      const byPipeline={};
      PIPELINE_STAGES.forEach(s=>{byPipeline[s]=srcInvFiltrado.filter(l=>((crmData[l.id]&&crmData[l.id].pipeline)||"Disponible")===s).length;});

      // Valor pipeline en MDP (lotes con precio y etapa activa)
      const valorPipeline=srcInvFiltrado.reduce((acc,l)=>{
        const pip=(crmData[l.id]&&crmData[l.id].pipeline)||"Disponible";
        if(pip==="Disponible"||pip==="Perdido") return acc;
        const precio=l.precio_total||(l.sup_m2&&l.precio_m2?l.sup_m2*l.precio_m2:0);
        return acc+precio;
      },0);
      const valorPropuestas=srcInvFiltrado.reduce((acc,l)=>{
        const pip=(crmData[l.id]&&crmData[l.id].pipeline)||"Disponible";
        if(pip!=="Propuesta"&&pip!=="Vendido") return acc;
        const precio=l.precio_total||(l.sup_m2&&l.precio_m2?l.sup_m2*l.precio_m2:0);
        return acc+precio;
      },0);

      // Lotes sin movimiento por periodo
      const now=Date.now();
      const lotesSinContacto60=srcInvFiltrado.filter(l=>{
        const crm=crmData[l.id]||{}; const pip=crm.pipeline||"Disponible";
        if(pip==="Perdido"||pip==="Vendido") return false;
        const dias=crm.lastContact?Math.floor((now-new Date(crm.lastContact).getTime())/864e5):999;
        return dias>60;
      });
      const lotesSinContacto120=srcInvFiltrado.filter(l=>{
        const crm=crmData[l.id]||{}; const pip=crm.pipeline||"Disponible";
        if(pip==="Perdido"||pip==="Vendido") return false;
        const dias=crm.lastContact?Math.floor((now-new Date(crm.lastContact).getTime())/864e5):999;
        return dias>120;
      });
      const lotesSinContacto180=srcInvFiltrado.filter(l=>{
        const crm=crmData[l.id]||{}; const pip=crm.pipeline||"Disponible";
        if(pip==="Perdido"||pip==="Vendido") return false;
        const dias=crm.lastContact?Math.floor((now-new Date(crm.lastContact).getTime())/864e5):999;
        return dias>180;
      });

      // Por desarrollo + por desarrollador (agrupado)
      const byDev={};
      const byDesarrollador={};
      srcInvFiltrado.forEach(l=>{
        const d=l.desarrollo||"?";
        const precio=l.precio_total||(l.sup_m2&&l.precio_m2?l.sup_m2*l.precio_m2:0);
        if(!byDev[d]) byDev[d]={total:0,interacciones:0,prospectos:0,enPipeline:0,propuesta:0,vendido:0,valorPipeline:0,valorPropuesta:0,sinMovimiento:0,sinMovimientoValor:0};
        byDev[d].total++;
        byDev[d].interacciones+=(crmData[l.id]&&crmData[l.id].interacciones?crmData[l.id].interacciones.length:0);
        byDev[d].prospectos+=(crmData[l.id]&&crmData[l.id].prospectos?crmData[l.id].prospectos.length:0);
        const pip=(crmData[l.id]&&crmData[l.id].pipeline)||"Disponible";
        if(pip!=="Disponible"&&pip!=="Perdido"){byDev[d].enPipeline++;byDev[d].valorPipeline+=precio;}
        if(pip==="Propuesta"){byDev[d].propuesta++;byDev[d].valorPropuesta+=precio;}
        if(pip==="Vendido") byDev[d].vendido++;
        const dias2=crmData[l.id]&&crmData[l.id].lastContact?Math.floor((now-new Date(crmData[l.id].lastContact).getTime())/864e5):999;
        if(dias2>60&&pip!=="Perdido"&&pip!=="Vendido"){byDev[d].sinMovimiento++;byDev[d].sinMovimientoValor+=precio;}
        // Acumular por desarrollador (para banner TYA, etc.)
        const devName=l.desarrollador||l.desarrollo||"?";
        if(!byDesarrollador[devName]) byDesarrollador[devName]={total:0,enPipeline:0,prospectos:0,propuesta:0,vendido:0,valorPipeline:0,valorPropuesta:0,sinMovimiento:0,sinMovimientoValor:0,desarrollos:new Set()};
        byDesarrollador[devName].total++;
        byDesarrollador[devName].desarrollos.add(d);
        byDesarrollador[devName].enPipeline+=byDev[d].enPipeline>0&&pip!=="Disponible"&&pip!=="Perdido"?1:0;
        byDesarrollador[devName].prospectos+=(crmData[l.id]&&crmData[l.id].prospectos?crmData[l.id].prospectos.length:0);
        if(pip==="Propuesta"){byDesarrollador[devName].propuesta++;byDesarrollador[devName].valorPropuesta+=precio;}
        if(pip==="Vendido") byDesarrollador[devName].vendido++;
        if(pip!=="Disponible"&&pip!=="Perdido"){byDesarrollador[devName].valorPipeline+=precio;}
        if(dias2>60&&pip!=="Perdido"&&pip!=="Vendido"){byDesarrollador[devName].sinMovimiento++;byDesarrollador[devName].sinMovimientoValor+=precio;}
      });

      // Asesores: combina prospectos asignados + lotes con asesor en inventario
      const byAsesor={};
      // Fuente 1: prospectos CRM registrados
      allProspectos.forEach(item=>{
        const asesor=(item.cli&&item.cli.asesor)||"Sin asignar";
        if(!byAsesor[asesor]) byAsesor[asesor]={prospectos:0,interacciones:0,propuestas:0,vendidos:0,sinMovimiento:0};
        byAsesor[asesor].prospectos++;
        byAsesor[asesor].interacciones+=item.interacciones;
        if(item.pipeline==="Propuesta") byAsesor[asesor].propuestas++;
        if(item.pipeline==="Vendido") byAsesor[asesor].vendidos++;
        if(item.semaforo==="red") byAsesor[asesor].sinMovimiento++;
      });
      // Fuente 2: lotes con campo asesor en inventario (aunque no tengan prospecto CRM)
      srcInvFiltrado.forEach(l=>{
        if(!l.asesor||!l.asesor.trim()) return;
        const asesor=l.asesor.trim();
        if(!byAsesor[asesor]) byAsesor[asesor]={prospectos:0,interacciones:0,propuestas:0,vendidos:0,sinMovimiento:0};
        // Contar solo si no ya está en byAsesor via prospectos
      });

      // KPIs recalculados sobre srcInvFiltrado (respetan filtro global de desarrollo)
      const totalEnPipelineF=srcInvFiltrado.filter(l=>{const p=crmData[l.id]&&crmData[l.id].pipeline;return p&&p!=="Disponible"&&p!=="Perdido";}).length;
      const totalPropuestaF=srcInvFiltrado.filter(l=>crmData[l.id]&&crmData[l.id].pipeline==="Propuesta").length;
      const totalCerradoF=srcInvFiltrado.filter(l=>crmData[l.id]&&crmData[l.id].pipeline==="Vendido").length;
      const totalInteraccionesF=srcInvFiltrado.reduce((a,l)=>a+(crmData[l.id]&&crmData[l.id].interacciones?crmData[l.id].interacciones.length:0),0);
      const totalProspActivosF=allProspectos.filter(p=>srcInvFiltrado.find(l=>l.id===p.lotId)&&p.pipeline!=="Perdido"&&p.pipeline!=="Disponible").length;
      const allProspF=allProspectos.filter(p=>srcInvFiltrado.find(l=>l.id===p.lotId));

      // ═══════════════════════════════════════════════════════════
      // FORECAST PONDERADO (Sprint 3)
      // ═══════════════════════════════════════════════════════════
      // Iteramos sobre prospectos individuales (no lotes) porque cada uno tiene su etapa
      const forecastByStage={};
      const forecastByDesarrollador={};
      const forecastByAsesor={};
      const forecastByTimeline={"30d":0,"60d":0,"90d":0,"90d+":0};
      let forecastTotal=0;       // Σ(precio × probabilidad) de todos los activos
      let pipelineTotalReal=0;   // Suma total de precios activos (sin ponderar)
      let compromisoAlto=0;      // Propuesta + Contrato + Cierre (>= 55% prob)
      ACTIVE_STAGES.concat("Vendido").forEach(s=>{forecastByStage[s]={count:0,valor:0,ponderado:0};});

      allProspF.forEach(item=>{
        const pip=item.pipeline;
        if(pip==="Perdido"||pip==="Disponible") return;
        const precio=item.lot.precio_total||(item.lot.sup_m2&&item.lot.precio_m2?item.lot.sup_m2*item.lot.precio_m2:0);
        if(precio<=0) return;
        const prob=STAGE_PROBABILITY[pip]||0;
        const ponderado=precio*prob;

        // Por etapa
        if(!forecastByStage[pip]) forecastByStage[pip]={count:0,valor:0,ponderado:0};
        forecastByStage[pip].count++;
        forecastByStage[pip].valor+=precio;
        forecastByStage[pip].ponderado+=ponderado;

        // Totales
        forecastTotal+=ponderado;
        pipelineTotalReal+=precio;
        if(pip==="Propuesta"||pip==="Contrato"||pip==="Vendido") compromisoAlto+=precio;

        // Por desarrollador
        const devRaw=item.lot.desarrollador||item.lot.desarrollo||"Sin asignar";
        const devNombre=devRaw.split(" / ").slice(-1)[0].replace(/^Grupo\s+/i,"").trim()||"Sin asignar";
        if(!forecastByDesarrollador[devNombre]) forecastByDesarrollador[devNombre]={count:0,valor:0,ponderado:0};
        forecastByDesarrollador[devNombre].count++;
        forecastByDesarrollador[devNombre].valor+=precio;
        forecastByDesarrollador[devNombre].ponderado+=ponderado;

        // Por asesor
        const asesorLocal=(item.cli&&item.cli.asesor)||item.prospecto.asesor||(item.crm&&item.crm.asesorResponsable)||"Sin asesor";
        if(!forecastByAsesor[asesorLocal]) forecastByAsesor[asesorLocal]={count:0,valor:0,ponderado:0};
        forecastByAsesor[asesorLocal].count++;
        forecastByAsesor[asesorLocal].valor+=precio;
        forecastByAsesor[asesorLocal].ponderado+=ponderado;

        // Timeline: proyección por etapa (estimación de días a cierre según etapa)
        // Prospecto->90d+, Contactado->90d+, Negociación->90d, Propuesta->60d, Contrato->30d, Cierre->30d
        let bucket="90d+";
        if(pip==="Vendido"||pip==="Contrato") bucket="30d";
        else if(pip==="Propuesta") bucket="60d";
        else if(pip==="En negociación") bucket="90d";
        forecastByTimeline[bucket]+=ponderado;
      });

      const fmtMDP=v=>v>=1e6?"$"+(v/1e6).toFixed(1)+"M":v>0?"$"+(v/1000).toFixed(0)+"K":"—";

      // KPI card
      const Kpi=({icon,label,val,sub,col,tag,onClick})=>(
        <div onClick={onClick} style={{background:B.white,borderRadius:12,padding:"16px 18px",boxShadow:"0 2px 12px rgba(0,43,73,0.07)",borderLeft:"4px solid "+col,cursor:onClick?"pointer":"default",transition:"transform 0.12s,box-shadow 0.12s"}}
          onMouseEnter={e=>{if(onClick){e.currentTarget.style.transform="translateY(-2px)";e.currentTarget.style.boxShadow="0 6px 20px rgba(0,43,73,0.13)";}}}
          onMouseLeave={e=>{e.currentTarget.style.transform="translateY(0)";e.currentTarget.style.boxShadow="0 2px 12px rgba(0,43,73,0.07)";}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
            <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:1.1,color:B.grey3}}>{label}</div>
            <div style={{fontSize:18}}>{icon}</div>
          </div>
          <div style={{fontSize:28,fontWeight:800,color:B.navy,lineHeight:1,marginBottom:3}}>{val}</div>
          {sub&&<div style={{fontSize:11,color:B.grey4}}>{sub}</div>}
          {tag&&<div style={{display:"inline-block",marginTop:5,padding:"2px 7px",borderRadius:8,fontSize:9,fontWeight:700,background:col+"18",color:col}}>{tag}</div>}
        </div>
      );

      return (
        <div>
          {/* ══════════════════════════════════════════════════════ */}
          {/* FORECAST PONDERADO (Sprint 3)                           */}
          {/* ══════════════════════════════════════════════════════ */}
          <div style={{background:"linear-gradient(135deg,"+B.navy+","+B.navyL+")",borderRadius:14,padding:"18px 22px",marginBottom:16,color:"#fff",boxShadow:"0 6px 24px rgba(0,43,73,0.18)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14,flexWrap:"wrap",gap:10}}>
              <div>
                <div style={{fontSize:10,fontWeight:700,color:B.gold,letterSpacing:2,textTransform:"uppercase",marginBottom:4}}>📊 Forecast Comercial</div>
                <div style={{fontSize:19,fontWeight:800,fontFamily:"'Playfair Display',serif"}}>Proyección de cierre ponderada</div>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.65)",marginTop:3}}>Cada deal ponderado por probabilidad de cierre según su etapa</div>
              </div>
              <div style={{display:"flex",gap:4,flexWrap:"wrap",alignItems:"center"}}>
                {ACTIVE_STAGES.concat("Vendido").map(s=>(
                  <span key={s} style={{padding:"2px 7px",borderRadius:10,fontSize:9,fontWeight:700,background:PIPELINE_COLORS[s]+"44",color:"#fff",border:"1px solid "+PIPELINE_COLORS[s]}}>{s}: {Math.round(STAGE_PROBABILITY[s]*100)}%</span>
                ))}
              </div>
            </div>
            {/* 3 KPIs estrella */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:12,marginBottom:14}}>
              <div style={{background:"rgba(255,255,255,0.08)",borderRadius:10,padding:"14px 16px",borderLeft:"4px solid "+B.gold}}>
                <div style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,0.65)",textTransform:"uppercase",letterSpacing:1}}>Pipeline Total</div>
                <div style={{fontSize:26,fontWeight:800,color:"#fff",lineHeight:1.1,marginTop:4,fontFamily:"'Playfair Display',serif"}}>{fmtMDP(pipelineTotalReal)}</div>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.55)",marginTop:4}}>{totalProspActivosF} deals activos · sin ponderar</div>
              </div>
              <div style={{background:"rgba(245,179,53,0.15)",borderRadius:10,padding:"14px 16px",borderLeft:"4px solid "+B.gold,boxShadow:"0 2px 10px rgba(245,179,53,0.25)"}}>
                <div style={{fontSize:10,fontWeight:700,color:B.gold,textTransform:"uppercase",letterSpacing:1}}>⭐ Forecast Esperado</div>
                <div style={{fontSize:28,fontWeight:800,color:B.gold,lineHeight:1.1,marginTop:4,fontFamily:"'Playfair Display',serif"}}>{fmtMDP(forecastTotal)}</div>
                <div style={{fontSize:10,color:"rgba(255,215,120,0.75)",marginTop:4}}>Σ (deal × prob etapa) — lo más realista</div>
              </div>
              <div style={{background:"rgba(34,197,94,0.12)",borderRadius:10,padding:"14px 16px",borderLeft:"4px solid #22c55e"}}>
                <div style={{fontSize:10,fontWeight:700,color:"#86efac",textTransform:"uppercase",letterSpacing:1}}>✓ Compromiso (≥55%)</div>
                <div style={{fontSize:26,fontWeight:800,color:"#86efac",lineHeight:1.1,marginTop:4,fontFamily:"'Playfair Display',serif"}}>{fmtMDP(compromisoAlto)}</div>
                <div style={{fontSize:10,color:"rgba(134,239,172,0.7)",marginTop:4}}>Propuesta + Contrato + Cierre</div>
              </div>
            </div>
            {/* Timeline 30/60/90 */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:8}}>
              {[{k:"30d",l:"Próximos 30d",c:"#22c55e"},{k:"60d",l:"30-60d",c:"#06B6D4"},{k:"90d",l:"60-90d",c:B.gold},{k:"90d+",l:"Más de 90d",c:"rgba(255,255,255,0.5)"}].map(t=>(
                <div key={t.k} style={{background:"rgba(255,255,255,0.06)",borderRadius:8,padding:"10px 12px",borderTop:"2px solid "+t.c}}>
                  <div style={{fontSize:9,color:"rgba(255,255,255,0.6)",fontWeight:700,textTransform:"uppercase",letterSpacing:0.8}}>{t.l}</div>
                  <div style={{fontSize:15,fontWeight:800,color:"#fff",marginTop:2}}>{fmtMDP(forecastByTimeline[t.k]||0)}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Desglose por etapa: barras visuales */}
          <div style={{background:B.white,borderRadius:12,padding:"16px 20px",marginBottom:16,boxShadow:"0 2px 12px rgba(0,43,73,0.07)"}}>
            <div style={{fontSize:11,fontWeight:700,color:B.grey3,textTransform:"uppercase",letterSpacing:1,marginBottom:12}}>📈 Forecast por Etapa</div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {ACTIVE_STAGES.concat("Vendido").map(s=>{
                const d=forecastByStage[s]||{count:0,valor:0,ponderado:0};
                const maxPond=Math.max(...Object.values(forecastByStage).map(x=>x.ponderado),1);
                const pct=maxPond>0?(d.ponderado/maxPond)*100:0;
                const col=PIPELINE_COLORS[s];
                return (
                  <div key={s} onClick={()=>{setFilterPipeline(s);setActiveTab("kanban");}} style={{cursor:"pointer",padding:"8px 10px",borderRadius:8,transition:"background 0.15s"}}
                    onMouseEnter={e=>e.currentTarget.style.background=B.offW}
                    onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:4,alignItems:"center",gap:8,flexWrap:"wrap"}}>
                      <div style={{display:"flex",alignItems:"center",gap:8,minWidth:160}}>
                        <span style={{width:10,height:10,borderRadius:3,background:col,flexShrink:0}}/>
                        <span style={{fontSize:12,fontWeight:700,color:B.navy}}>{s}</span>
                        <span style={{fontSize:10,color:B.grey3}}>{d.count} deal{d.count!==1?"s":""}</span>
                      </div>
                      <div style={{fontSize:11,color:B.grey4,whiteSpace:"nowrap"}}>
                        <span style={{color:B.grey3}}>{fmtMDP(d.valor)}</span>
                        <span style={{color:B.grey3,margin:"0 4px"}}>×</span>
                        <span style={{color:col,fontWeight:700}}>{Math.round(STAGE_PROBABILITY[s]*100)}%</span>
                        <span style={{color:B.grey3,margin:"0 4px"}}>=</span>
                        <span style={{color:B.navy,fontWeight:800,fontSize:13}}>{fmtMDP(d.ponderado)}</span>
                      </div>
                    </div>
                    <div style={{height:6,background:B.grey1,borderRadius:3,overflow:"hidden"}}>
                      <div style={{width:pct+"%",height:"100%",background:col,transition:"width 0.4s ease-out"}}/>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Desglose por Desarrollador y Asesor (lado a lado) */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(320px,1fr))",gap:12,marginBottom:16}}>
            {/* Por Desarrollador */}
            <div style={{background:B.white,borderRadius:12,padding:"16px 18px",boxShadow:"0 2px 12px rgba(0,43,73,0.07)"}}>
              <div style={{fontSize:11,fontWeight:700,color:B.grey3,textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>🏗 Forecast por Desarrollador</div>
              {Object.keys(forecastByDesarrollador).length===0?(
                <div style={{fontSize:12,color:B.grey3,fontStyle:"italic",padding:"12px 0"}}>Sin deals activos</div>
              ):Object.entries(forecastByDesarrollador).sort((a,b)=>b[1].ponderado-a[1].ponderado).map(([dev,d])=>{
                const maxD=Math.max(...Object.values(forecastByDesarrollador).map(x=>x.ponderado),1);
                const pct=(d.ponderado/maxD)*100;
                return (
                  <div key={dev} onClick={()=>{setFilterDevCompania(dev);setActiveTab("kanban");}} style={{marginBottom:8,padding:"6px 0",cursor:"pointer",borderBottom:"1px dashed "+B.grey1}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                      <div style={{fontSize:12,fontWeight:700,color:B.navy}}>{dev}</div>
                      <div style={{fontSize:11}}>
                        <span style={{color:B.grey3}}>{d.count} · {fmtMDP(d.valor)} · </span>
                        <span style={{color:B.navy,fontWeight:800}}>{fmtMDP(d.ponderado)}</span>
                      </div>
                    </div>
                    <div style={{height:5,background:B.grey1,borderRadius:3,overflow:"hidden"}}>
                      <div style={{width:pct+"%",height:"100%",background:B.navy,transition:"width 0.4s ease-out"}}/>
                    </div>
                  </div>
                );
              })}
            </div>
            {/* Por Asesor */}
            <div style={{background:B.white,borderRadius:12,padding:"16px 18px",boxShadow:"0 2px 12px rgba(0,43,73,0.07)"}}>
              <div style={{fontSize:11,fontWeight:700,color:B.grey3,textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>👤 Forecast por Asesor</div>
              {Object.keys(forecastByAsesor).length===0?(
                <div style={{fontSize:12,color:B.grey3,fontStyle:"italic",padding:"12px 0"}}>Sin deals activos</div>
              ):Object.entries(forecastByAsesor).sort((a,b)=>b[1].ponderado-a[1].ponderado).slice(0,8).map(([as,d])=>{
                const maxA=Math.max(...Object.values(forecastByAsesor).map(x=>x.ponderado),1);
                const pct=(d.ponderado/maxA)*100;
                const isSinAsesor=as==="Sin asesor";
                return (
                  <div key={as} onClick={()=>{if(!isSinAsesor){setFilterAsesor(as);setActiveTab("prospectos");}}} style={{marginBottom:8,padding:"6px 0",cursor:isSinAsesor?"default":"pointer",borderBottom:"1px dashed "+B.grey1}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                      <div style={{fontSize:12,fontWeight:700,color:isSinAsesor?"#dc2626":B.navy}}>{isSinAsesor?"⚠ ":""}{as}</div>
                      <div style={{fontSize:11}}>
                        <span style={{color:B.grey3}}>{d.count} · {fmtMDP(d.valor)} · </span>
                        <span style={{color:isSinAsesor?"#dc2626":B.navy,fontWeight:800}}>{fmtMDP(d.ponderado)}</span>
                      </div>
                    </div>
                    <div style={{height:5,background:B.grey1,borderRadius:3,overflow:"hidden"}}>
                      <div style={{width:pct+"%",height:"100%",background:isSinAsesor?"#dc2626":"#2563AC",transition:"width 0.4s ease-out"}}/>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* ── FILA 1: KPIs principales ── */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:10,marginBottom:16}}>
            <Kpi icon="💰" label="Valor Pipeline" val={fmtMDP(valorPipeline)} sub={totalEnPipelineF+" lotes activos"} col="#f59e0b" tag="MDP en juego" onClick={()=>setActiveTab("kanban")}/>
            <Kpi icon="📋" label="En propuesta" val={fmtMDP(valorPropuestas)} sub={totalPropuestaF+" propuesta"+(totalPropuestaF!==1?"s":"")} col="#8B5CF6" tag="Cierre inminente" onClick={()=>{setFilterPipeline("Propuesta");setActiveTab("kanban");}}/>
            <Kpi icon="🏆" label="Cierres" val={totalCerradoF} sub="operaciones ganadas" col="#22c55e"/>
            <Kpi icon="👤" label="Prospectos activos" val={totalProspActivosF} sub={allProspF.length+" registrados total"} col="#3B82F6" onClick={()=>setActiveTab("prospectos")}/>
            <Kpi icon="🔄" label="Interacciones" val={totalInteraccionesF} sub="seguimientos registrados" col={B.navyL}/>
            <Kpi icon="📦" label="Inventario total" val={srcInvFiltrado.length} sub={srcInvFiltrado.filter(l=>!crmData[l.id]||!crmData[l.id].prospectos||crmData[l.id].prospectos.length===0).length+" sin prospectos"} col={B.grey3}/>
          </div>

          {/* ── BANNER DESARROLLADOR (si hay filtro activo) ── */}
          {(filterDevCompania!=="Todos"||filterDesarrolloGlobal!=="Todos")&&(()=>{
            const bannerKey=filterDesarrolloGlobal!=="Todos"?filterDesarrolloGlobal:filterDevCompania;
            const devData=(byDesarrollador[bannerKey]||byDev[bannerKey])||{total:0,enPipeline:0,prospectos:0,propuesta:0,vendido:0,valorPipeline:0,valorPropuesta:0,sinMovimiento:0,sinMovimientoValor:0};
            return (
              <div style={{background:"linear-gradient(135deg,"+B.navy+",#1a4a6b)",borderRadius:14,padding:"18px 20px",marginBottom:14,color:"#fff"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:8}}>
                  <div>
                    <div style={{fontSize:10,fontWeight:700,color:B.gold,letterSpacing:2,textTransform:"uppercase",marginBottom:2}}>Dashboard Ejecutivo</div>
                    <div style={{fontSize:20,fontWeight:800,fontFamily:"'Playfair Display',serif"}}>{filterDesarrolloGlobal!=="Todos"?filterDesarrolloGlobal.split(" / ")[0]:filterDevCompania}</div>
                  </div>
                  <div style={{display:"flex",gap:6}}>
                    {devData.propuesta>0&&<span style={{background:"#8B5CF6",borderRadius:8,padding:"4px 10px",fontSize:11,fontWeight:700}}>🎯 {devData.propuesta} en propuesta</span>}
                    {devData.vendido>0&&<span style={{background:"#22c55e",borderRadius:8,padding:"4px 10px",fontSize:11,fontWeight:700}}>✅ {devData.vendido} vendido{devData.vendido!==1?"s":""}</span>}
                    {devData.sinMovimiento>0&&<span style={{background:"#ef4444",borderRadius:8,padding:"4px 10px",fontSize:11,fontWeight:700}}>⚠ {devData.sinMovimiento} sin movimiento</span>}
                  </div>
                </div>
                <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                  {[

                        style={{background:g.bg,borderRadius:10,padding:"12px 14px",cursor:"pointer",border:"2px solid "+g.col+"44",transition:"all 0.15s",boxShadow:"0 1px 4px rgba(0,0,0,0.06)"}}

                          <span style={{fontSize:12,fontWeight:800,color:g.col}}>{g.label}</span>
                        </div>

                        <div style={{fontSize:10,color:g.col,opacity:.8,marginTop:2}}>lote{g.lotes.length!==1?"s":""}</div>

                      </div>

            );
          })()}

        </div>
      );
    };

    // ══════════════════════════════════════════════════════════════
    // VISTA PROSPECTOS (centrada en el cliente)

        if(filterAsesor!=="Todos"&&(!p.cli||p.cli.asesor!==filterAsesor)) return false;
        if(filterPipeline!=="Todos"&&p.pipeline!==filterPipeline) return false;
        return true;

      return (
        <div>
          <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>

              {asesores.map(a=><option key={a}>{a}</option>)}

            <select value={filterPipeline} onChange={e=>setFilterPipeline(e.target.value)} style={{padding:"7px 10px",borderRadius:8,border:"1px solid "+B.grey1,fontSize:12,color:B.navy,background:B.white,outline:"none",fontFamily:"'DM Sans',sans-serif"}}>

            <span style={{fontSize:11,color:B.grey3,marginLeft:"auto"}}>{filtered.length} prospecto{filtered.length!==1?"s":""}</span>
          </div>

          {filterAsesor!=="Todos"&&(()=>{
            const myItems=allProspectos.filter(x=>(x.cli&&x.cli.asesor===filterAsesor)||(x.prospecto&&x.prospecto.asesor===filterAsesor));

                  <div style={{fontSize:11,color:"rgba(255,255,255,0.6)",marginTop:2}}>{myItems.length} terreno{myItems.length!==1?"s":""} opcionado{myItems.length!==1?"s":""}</div>
                </div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  {frios>0&&<div style={{background:"#ef4444",borderRadius:8,padding:"6px 12px",textAlign:"center"}}>
                    <div style={{fontSize:18,fontWeight:800}}>{frios}</div>
                    <div style={{fontSize:9,opacity:.8}}>FRÍOS &gt;60d</div>
                  </div>}
                  {tibios>0&&<div style={{background:"#f59e0b",borderRadius:8,padding:"6px 12px",textAlign:"center"}}>
                    <div style={{fontSize:18,fontWeight:800}}>{tibios}</div>
                    <div style={{fontSize:9,opacity:.8}}>TIBIOS 30-60d</div>
                  </div>}
                  {sinInter>0&&<div style={{background:"rgba(255,255,255,0.15)",borderRadius:8,padding:"6px 12px",textAlign:"center"}}>
                    <div style={{fontSize:18,fontWeight:800}}>{sinInter}</div>
                    <div style={{fontSize:9,opacity:.8}}>SIN INTERACCIÓN</div>
                  </div>}
                  <div style={{background:"rgba(255,255,255,0.1)",borderRadius:8,padding:"6px 12px",textAlign:"center"}}>
                    <div style={{fontSize:18,fontWeight:800}}>{myItems.length-frios-tibios}</div>
                    <div style={{fontSize:9,opacity:.8}}>AL DÍA</div>
                  </div>
                </div>
                <button onClick={()=>setFilterAsesor("Todos")} style={{background:"rgba(255,255,255,0.15)",border:"none",borderRadius:8,padding:"6px 12px",color:"#fff",cursor:"pointer",fontSize:11,fontWeight:600,fontFamily:"'DM Sans',sans-serif"}}>✕ Ver todos</button>
              </div>
            );
          })()}

          {filtered.length===0&&(
            <div style={{textAlign:"center",padding:48,color:B.grey3}}>
              <div style={{fontSize:36,marginBottom:8}}>👤</div>
              <div style={{fontSize:13,fontWeight:600}}>No hay prospectos activos</div>
              <div style={{fontSize:11,marginTop:4}}>Asigna clientes desde el match o desde el inventario</div>
            </div>
          )}

          {filtered.map((item,i)=>{
            const cli=item.cli; const crm=item.crm; const p=item.prospecto;
            const semCol=semaforoColor[item.semaforo];
            const lastInterSorted=(crm.interacciones||[]).slice().reverse();
            const lastInter=lastInterSorted[0];
            // KEY ESTABLE: basada en identidad del prospecto, no en posición del array
            const stableKey=item.lotId+"::"+item.prospectoIdx+"::"+p.nombre;
            return (
              <div key={stableKey} style={{background:B.white,borderRadius:14,marginBottom:10,overflow:"hidden",boxShadow:"0 2px 10px rgba(0,43,73,0.07)",border:"1px solid "+semCol+"55"}}>
                <div style={{display:"flex"}}>
                  <div style={{width:5,background:semCol,flexShrink:0,borderRadius:"14px 0 0 14px"}}/>
                  <div style={{flex:1,padding:"14px 16px"}}>
                    <div style={{display:"flex",alignItems:"flex-start",gap:12,flexWrap:"wrap"}}>

                      {/* Columna izquierda: cliente */}
                      <div style={{flex:"0 0 220px",minWidth:180}}>
                        <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:6}}>
                          <Semaforo lotId={item.lotId} size={10}/>
                          <span style={{fontSize:15,fontWeight:800,color:B.navy}}>{p.nombre}</span>
                          <button onClick={(e)=>{e.stopPropagation();setSelectedFichaItem(item);setShowFichaModal(true);}} style={{background:B.navy,color:"#fff",border:"none",borderRadius:6,padding:"2px 8px",fontSize:10,fontWeight:700,cursor:"pointer",marginLeft:4,fontFamily:"'DM Sans',sans-serif"}}>Ver ficha</button>

                            {(cli.email||p.email)&&<div style={{color:B.grey4,marginBottom:2}}>✉ {cli.email||p.email}</div>}
                            {/* Selector de temperatura híbrido */}
                            {(() => {
                              const tempActiva=p.temperatura||cli.temperatura||"";
                              const isOverride=!!p.temperatura&&p.temperatura!==cli.temperatura;
                              const tCol=tempActiva==="Caliente"?"#dc2626":tempActiva==="Tibio"?"#d97706":tempActiva==="Frío"?"#2563eb":B.grey3;
                              const tBg=tempActiva==="Caliente"?"#fee2e2":tempActiva==="Tibio"?"#fef3c7":tempActiva==="Frío"?"#dbeafe":B.grey1;
                              return (
                                <div onClick={e=>e.stopPropagation()} style={{marginTop:5,display:"flex",alignItems:"center",gap:4,flexWrap:"wrap"}}>
                                  <span style={{fontSize:9,fontWeight:700,color:B.grey3,textTransform:"uppercase",letterSpacing:0.6}}>🌡</span>
                                  <select value={tempActiva} onChange={e=>updateProspectoTemperatura(item.lotId,item.prospectoIdx,e.target.value)}
                                    style={{fontSize:9,fontWeight:700,color:tCol,background:tBg,border:"1.5px solid "+tCol+"66",borderRadius:10,padding:"1px 6px",cursor:"pointer",fontFamily:"'DM Sans',sans-serif",outline:"none"}}
                                    title={isOverride?"Temperatura específica de este deal (override)":"Temperatura heredada del cliente"}>
                                    <option value="">—</option>
                                    <option value="Caliente">Caliente</option>
                                    <option value="Tibio">Tibio</option>
                                    <option value="Frío">Frío</option>
                                  </select>
                                  {isOverride&&<span title="Esta temperatura es override del deal. Clic para restaurar la del cliente." onClick={()=>updateProspectoTemperatura(item.lotId,item.prospectoIdx,"")} style={{fontSize:9,color:tCol,fontWeight:700,cursor:"pointer",background:"transparent",border:"1px dashed "+tCol+"88",borderRadius:8,padding:"0 5px"}}>deal</span>}
                                  {!isOverride&&cli.temperatura&&<button onClick={()=>{const newTemp=window.prompt("Cambiar temperatura GLOBAL del cliente "+cli.nombre+"\\n(afecta todos sus prospectos).\\n\\nEscribe: Caliente, Tibio, o Frío","")||"";const valid=["Caliente","Tibio","Frío"];if(valid.includes(newTemp.trim())){updateClienteTemperatura(cli.nombre,newTemp.trim());}else if(newTemp){toast("⚠ Valor inválido. Usa: Caliente, Tibio o Frío");}}} title="Cambia la temperatura del CLIENTE en el catálogo (afecta todos sus deals)" style={{fontSize:8,color:B.grey4,background:"transparent",border:"1px dashed "+B.grey2,borderRadius:8,padding:"0 5px",cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>edit cliente</button>}
                                </div>
                              );
                            })()}
                            {cli.uso_interes&&cli.uso_interes.length>0&&<div style={{marginTop:4}}><span style={{padding:"1px 6px",borderRadius:10,fontSize:9,background:B.blueL,color:B.blue}}>{cli.uso_interes[0]}</span></div>}
                          </div>
                        ):(
                          <div style={{background:B.offW,borderRadius:8,padding:"8px 10px",fontSize:11,color:B.grey3}}>
                            {p.empresa&&<div>🏢 {p.empresa}</div>}
                            {p.telefono&&<div>📞 {p.telefono}</div>}

                              const tCol=tempActiva==="Caliente"?"#dc2626":tempActiva==="Tibio"?"#d97706":tempActiva==="Frío"?"#2563eb":B.grey3;
                              const tBg=tempActiva==="Caliente"?"#fee2e2":tempActiva==="Tibio"?"#fef3c7":tempActiva==="Frío"?"#dbeafe":B.grey1;
                              return (
                                <div onClick={e=>e.stopPropagation()} style={{marginTop:5,display:"flex",alignItems:"center",gap:4}}>
                                  <span style={{fontSize:9,fontWeight:700,color:B.grey3}}>🌡</span>
                                  <select value={tempActiva} onChange={e=>updateProspectoTemperatura(item.lotId,item.prospectoIdx,e.target.value)}
                                    style={{fontSize:9,fontWeight:700,color:tCol,background:tBg,border:"1.5px solid "+tCol+"66",borderRadius:10,padding:"1px 6px",cursor:"pointer",fontFamily:"'DM Sans',sans-serif",outline:"none"}}>

                        {/* Selector de etapa INLINE */}
                        {(() => {

                              <select value={isLegacy?"__legacy__":pStage} onChange={e=>{if(e.target.value!=="__legacy__")updateProspectoPipeline(item.lotId,item.prospectoIdx,e.target.value);}}
                                style={{width:"100%",fontSize:11,fontWeight:700,color:isLegacy?"#dc2626":pCol,background:isLegacy?"#fee2e2":pCol+"18",border:"2px solid "+(isLegacy?"#dc2626":pCol),borderRadius:8,padding:"5px 10px",cursor:"pointer",fontFamily:"'DM Sans',sans-serif",outline:"none"}}>
                                {isLegacy&&<option value="__legacy__">⚠ {pStage} (legacy)</option>}
                                {PIPELINE_STAGES.map(s=><option key={s} value={s}>{s}</option>)}
                              </select>
                            </div>
                          );
                        })()}
                      </div>

                      {/* Columna derecha: último seguimiento + acciones */}
                      <div style={{flex:1,minWidth:180}}>
                        <div style={{fontSize:10,fontWeight:700,color:B.grey3,textTransform:"uppercase",letterSpacing:1,marginBottom:4}}>
                          Último contacto {item.diasSinContacto!==null&&<span style={{color:item.semaforo==="red"?"#ef4444":item.semaforo==="yellow"?"#f59e0b":"#22c55e",fontWeight:item.semaforo==="red"?800:600,background:item.semaforo==="red"?"#fee2e2":item.semaforo==="yellow"?"#fef3c7":"transparent",borderRadius:6,padding:item.semaforo==="red"||item.semaforo==="yellow"?"1px 5px":"0"}}>· hace {item.diasSinContacto}d {item.semaforo==="red"?"⚠":item.semaforo==="yellow"?"·":""}</span>}
                        </div>
                        {lastInter?(
                          <div style={{background:B.offW,borderRadius:8,padding:"8px 10px",marginBottom:8}}>
                            <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:3}}>
                              <span style={{fontSize:10,fontWeight:700,color:B.navy}}>{lastInter.canal}</span>
                              <span style={{padding:"1px 6px",borderRadius:10,fontSize:9,fontWeight:700,background:"#dbeafe",color:"#2563eb"}}>{lastInter.reaccion}</span>
                              <span style={{fontSize:9,color:B.grey3,marginLeft:"auto"}}>{lastInter.fecha}</span>
                            </div>
                            {lastInter.nota&&<div style={{fontSize:11,color:B.grey4,fontStyle:"italic"}}>{lastInter.nota.slice(0,80)}{lastInter.nota.length>80?"...":""}</div>}
                          </div>
                        ):(
                          <div style={{background:"#fef9c3",borderRadius:8,padding:"8px 10px",marginBottom:8,fontSize:11,color:"#92400e"}}>
                            ⚠ Sin interacciones registradas
                          </div>
                        )}
                        {p.nota&&<div style={{fontSize:10,color:B.grey3,fontStyle:"italic",marginBottom:6}}>{p.nota.slice(0,60)}{p.nota.length>60?"...":""}</div>}
                        {/* Próxima actividad pendiente */}
                        {(() => {
                          const acts=(p.actividades||[]).filter(a=>!a.completada).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
                          const proxima=acts[0];
                          const esEtapaCritica=STAGES_REQUIRING_ACTIVITY.includes(item.pipeline);
                          if(!proxima){
                            if(esEtapaCritica){
                              return (
                                <div style={{marginBottom:8,padding:"6px 9px",background:"#fef3c7",borderRadius:7,border:"1.5px dashed #f59e0b",display:"flex",alignItems:"center",gap:6}}>
                                  <span style={{fontSize:11}}>⚠</span>
                                  <span style={{fontSize:10,fontWeight:700,color:"#92400e",flex:1}}>Sin actividad pendiente</span>
                                  <button onClick={()=>{setShowActivityModal({mode:"create",lotId:item.lotId,prospectoIdx:item.prospectoIdx});setActivityForm({tipo:"Seguimiento",descripcion:"",fecha:addBusinessDays(new Date(),2),hora:""});}} style={{padding:"3px 8px",background:"#f59e0b",color:"#fff",border:"none",borderRadius:5,cursor:"pointer",fontSize:10,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>+ Agendar</button>
                                </div>
                              );
                            }
                            return null;
                          }
                          const urg=getActivityUrgency(proxima);
                          const tipo=ACTIVITY_TYPES.find(t=>t.id===proxima.tipo)||ACTIVITY_TYPES[0];
                          return (
                            <div style={{marginBottom:8,padding:"7px 10px",background:urg.bg,borderRadius:7,borderLeft:"3px solid "+(urg.rank===1?"#dc2626":urg.rank===2?"#d97706":urg.rank===3?"#1e40af":"#6b7280"),display:"flex",alignItems:"center",gap:6,cursor:"pointer"}} onClick={()=>{setShowActivityModal({mode:"complete",lotId:item.lotId,prospectoIdx:item.prospectoIdx,activity:proxima});setCompleteForm({resultado:"Positivo",nota:""});}}>
                              <span style={{fontSize:14}}>{tipo.icon}</span>
                              <div style={{flex:1,minWidth:0}}>
                                <div style={{fontSize:10,fontWeight:800,color:urg.color,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{urg.icon} {urg.label} · {proxima.descripcion||proxima.tipo}</div>
                                <div style={{fontSize:9,color:urg.color,opacity:0.8}}>{proxima.fecha}{proxima.hora?" · "+proxima.hora:""}</div>
                              </div>
                              <span style={{fontSize:9,color:urg.color,fontWeight:700}}>✓</span>
                            </div>
                          );
                        })()}
                        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                          <button onClick={()=>{setSelectedLotCRM(item.lot);setShowInterModal(true);}} style={{padding:"5px 10px",background:B.gold,color:B.navy,border:"none",borderRadius:7,cursor:"pointer",fontSize:11,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>+ Interacción</button>
                          <button onClick={()=>{setShowActivityModal({mode:"create",lotId:item.lotId,prospectoIdx:item.prospectoIdx});setActivityForm({tipo:"Seguimiento",descripcion:"",fecha:addBusinessDays(new Date(),2),hora:""});}} style={{padding:"5px 10px",background:"#0EA5E9",color:"#fff",border:"none",borderRadius:7,cursor:"pointer",fontSize:11,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>📅 Actividad</button>
                          <button onClick={()=>setShowTemplatesModal({item})} style={{padding:"5px 10px",background:"#25d366",color:"#fff",border:"none",borderRadius:7,cursor:"pointer",fontSize:11,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>📱 WA</button>
                          <button onClick={()=>{setSelectedLotCRM(item.lot);setActiveTab("kanban");}} style={{padding:"5px 10px",background:B.offW,color:B.grey4,border:"1px solid "+B.grey1,borderRadius:7,cursor:"pointer",fontSize:11,fontWeight:600,fontFamily:"'DM Sans',sans-serif"}}>Ver lote</button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

    };

    // ══════════════════════════════════════════════════════════════
    // KANBAN BOARD — por prospecto individual (no por lote)
    // ══════════════════════════════════════════════════════════════
    // Mueve un prospecto específico a otra etapa del pipeline
    const LOSS_REASONS=["Precio muy alto","Plazo / tiempo de entrega","Competencia (otro lote o vendedor)","Ubicación / zona","Producto no ajustaba (uso/sup/características)","Financiamiento","Cliente ya no disponible","Otro"];
    const [lossModal,setLossModal]=React.useState(null); // {lotId, prospectoIdx, prospectoNombre}
    const [lossForm,setLossForm]=React.useState({motivo:"",nota:""});
    // Preservar scroll position antes de updates (múltiples niveles)
    const preserveScroll=(fn)=>{
      const scrollY=window.scrollY||window.pageYOffset||document.documentElement.scrollTop||0;
      const scrollX=window.scrollX||window.pageXOffset||document.documentElement.scrollLeft||0;
      // Capturar también scroll del elemento activo si está dentro de un contenedor scrolleable
      const active=document.activeElement;
      fn();
      // Restaurar en múltiples frames para superar re-renders de React
      const restore=()=>{window.scrollTo(scrollX,scrollY);};
      requestAnimationFrame(()=>{
        restore();
        requestAnimationFrame(()=>{
          restore();
          setTimeout(restore,50);
        });
      });
    };

    // ═══════════════════════════════════════════════════════════
    // SISTEMA DE ACTIVIDADES (Sprint 2)
    // ═══════════════════════════════════════════════════════════
    const ACTIVITY_TYPES=[
      {id:"Llamada",icon:"📞",color:"#3B82F6"},
      {id:"WhatsApp",icon:"📱",color:"#25d366"},
      {id:"Email",icon:"✉️",color:"#8B5CF6"},
      {id:"Visita al terreno",icon:"🚗",color:"#F59E0B"},
      {id:"Reunión",icon:"🤝",color:"#0EA5E9"},
      {id:"Propuesta",icon:"📋",color:"#EC4899"},
      {id:"Seguimiento",icon:"🔄",color:"#14B8A6"},
      {id:"Otro",icon:"📌",color:"#6B7280"}
    ];
    // Sugerencias automáticas de actividad por etapa
    const AUTO_ACTIVITY_BY_STAGE={
      "Contactado":{tipo:"Email",descripcion:"Enviar ficha técnica",diasHabiles:1},
      "En negociación":{tipo:"Visita al terreno",descripcion:"Agendar visita al terreno",diasHabiles:3},
      "Propuesta":{tipo:"Seguimiento",descripcion:"Dar seguimiento a propuesta",diasHabiles:5},
      "Contrato":{tipo:"Reunión",descripcion:"Revisar firma de contrato",diasHabiles:7}
    };
    const STAGES_REQUIRING_ACTIVITY=["En negociación","Propuesta","Contrato"];
    // Sumar días hábiles (saltando sábado y domingo)
    const addBusinessDays=(baseDate,days)=>{
      const d=new Date(baseDate);
      let added=0;
      while(added<days){
        d.setDate(d.getDate()+1);
        const dow=d.getDay(); // 0=dom, 6=sab
        if(dow!==0&&dow!==6) added++;
      }
      return d.toISOString().slice(0,10);
    };
    // Si cae en fin de semana, mover al lunes siguiente
    const ensureWeekday=(dateStr)=>{
      const d=new Date(dateStr+"T12:00:00");
      const dow=d.getDay();
      if(dow===6) d.setDate(d.getDate()+2); // sáb → lun
      else if(dow===0) d.setDate(d.getDate()+1); // dom → lun
      return d.toISOString().slice(0,10);
    };
    // Clasificar urgencia de una actividad
    const getActivityUrgency=(act)=>{
      if(act.completada) return {label:"Completada",color:"#16a34a",bg:"#dcfce7",rank:5,icon:"✅"};
      const hoy=new Date();hoy.setHours(0,0,0,0);
      const fechaAct=new Date(act.fecha+"T12:00:00");
      const diffDias=Math.floor((fechaAct-hoy)/864e5);
      if(diffDias<0) return {label:Math.abs(diffDias)+"d vencida",color:"#fff",bg:"#dc2626",rank:1,icon:"🔴"};
      if(diffDias===0) return {label:"Hoy",color:"#92400e",bg:"#fef3c7",rank:2,icon:"🟡"};
      if(diffDias<=7) return {label:"En "+diffDias+"d",color:"#1e40af",bg:"#dbeafe",rank:3,icon:"🔵"};
      return {label:"En "+diffDias+"d",color:"#4b5563",bg:"#f3f4f6",rank:4,icon:"⚪"};
    };
    // ═══════════════════════════════════════════════════════════
    // SEGUIMIENTO POR ASESOR (sin cliente identificado)
    // ═══════════════════════════════════════════════════════════
    // Asigna o actualiza el seguimiento por asesor de un lote
    const assignSeguimientoAsesor=(lotId,asesorNombre,nota)=>{
      preserveScroll(()=>{
        setCrmData(prev=>{
          const entry=prev[lotId]||{pipeline:"Disponible",interacciones:[],prospectos:[],devFeedback:[]};
          const existing=entry.seguimientoAsesor||{};
          const seguimientoAsesor={
            asesor:asesorNombre,
            pipeline:existing.pipeline||"Prospecto",
            temperatura:existing.temperatura||"Tibio",
            notas:nota!==undefined?nota:(existing.notas||""),
            fechaInicio:existing.fechaInicio||new Date().toISOString().slice(0,10),
            actividades:existing.actividades||[],
            interacciones:existing.interacciones||[]
          };
          const next={...prev,[lotId]:{...entry,seguimientoAsesor}};
          saveCRM(next);
          return next;
        });
      });
      toast("✅ Seguimiento asignado a "+asesorNombre);
    };
    // Actualizar etapa del seguimiento por asesor
    const updateSeguimientoPipeline=(lotId,newStage)=>{
      preserveScroll(()=>{
        setCrmData(prev=>{
          const entry=prev[lotId]||{};
          if(!entry.seguimientoAsesor) return prev;
          const sa={...entry.seguimientoAsesor,pipeline:newStage};
          // Auto-crear actividad si aplica
          const sugerencia=AUTO_ACTIVITY_BY_STAGE[newStage];
          if(sugerencia){
            const acts=[...(sa.actividades||[])];
            const tienePendiente=acts.some(a=>!a.completada);
            if(!tienePendiente){
              acts.push({
                id:"act-"+Date.now()+"-sa-auto",
                tipo:sugerencia.tipo,
                descripcion:sugerencia.descripcion,
                fecha:addBusinessDays(new Date(),sugerencia.diasHabiles),
                hora:"",
                completada:false,
                creadaEn:new Date().toISOString().slice(0,10),
                autoGenerada:true
              });
              sa.actividades=acts;
            }
          }
          const next={...prev,[lotId]:{...entry,seguimientoAsesor:sa}};
          saveCRM(next);
          return next;
        });
      });
    };
    // Crear actividad en seguimiento por asesor
    const createActivitySeguimiento=(lotId,actData)=>{
      preserveScroll(()=>{
        setCrmData(prev=>{
          const entry=prev[lotId]||{};
          if(!entry.seguimientoAsesor) return prev;
          const acts=[...(entry.seguimientoAsesor.actividades||[])];
          acts.push({
            id:"act-"+Date.now()+"-sa-"+Math.floor(Math.random()*1000),
            tipo:actData.tipo||"Seguimiento",
            descripcion:actData.descripcion||"",
            fecha:ensureWeekday(actData.fecha||new Date().toISOString().slice(0,10)),
            hora:actData.hora||"",
            completada:false,
            creadaEn:new Date().toISOString().slice(0,10)
          });
          const sa={...entry.seguimientoAsesor,actividades:acts};
          const next={...prev,[lotId]:{...entry,seguimientoAsesor:sa}};
          saveCRM(next);
          return next;
        });
      });
    };
    // Completar actividad en seguimiento
    const completeActivitySeguimiento=(lotId,actId,resultado,nota)=>{
      preserveScroll(()=>{
        setCrmData(prev=>{
          const entry=prev[lotId]||{};
          if(!entry.seguimientoAsesor) return prev;
          const acts=(entry.seguimientoAsesor.actividades||[]).map(a=>a.id===actId?{...a,completada:true,fechaCompletada:new Date().toISOString().slice(0,10),resultado:resultado||"Positivo",notaResultado:nota||""}:a);
          const sa={...entry.seguimientoAsesor,actividades:acts};
          const next={...prev,[lotId]:{...entry,seguimientoAsesor:sa}};

          return next;

    // Eliminar seguimiento por asesor
    const deleteSeguimientoAsesor=(lotId)=>{
      if(!window.confirm("¿Eliminar el seguimiento por asesor de este lote? Se perderán las actividades e interacciones asociadas.")) return;
      preserveScroll(()=>{
        setCrmData(prev=>{
          const entry=prev[lotId]||{};

          delete copy.seguimientoAsesor;
          const next={...prev,[lotId]:copy};

          return next;
