<script type="text/babel">




const { useState, useRef, useCallback } = React;

// ═══════════════════════════════════════════════════════════════════
// SUPABASE CLIENT — Conexión a base de datos en la nube
// Fase 2: Solo setup, no se usa todavía para guardar datos.
// Inicialización perezosa (por si la librería tarda en cargar).
// ═══════════════════════════════════════════════════════════════════
const SUPABASE_URL = "https://xugrrabebphdelgwqnwc.supabase.co";
const SUPABASE_KEY = "sb_publishable_n-EUveYY5vHlCQdDLEOU7w_4ndCZaJ0";
// IMPORTANTE: usamos 'sb' (no 'supabase') para no colisionar con window.supabase (la librería)
let sb = null;
function initSupabase() {
  if (sb) return sb;
  const lib = window.supabase;
  if (lib && typeof lib.createClient === 'function') {
    try {
      sb = lib.createClient(SUPABASE_URL, SUPABASE_KEY);
      window.sb = sb;           // Accesible globalmente para debug
      window.__supabase = sb;   // Alias compatibilidad
      console.log("✅ Supabase conectado:", SUPABASE_URL);
      return sb;
    } catch(err) {
      console.error("❌ Error conectando a Supabase:", err);
      return null;
    }
  }
  return null;
}
// Intento inmediato
initSupabase();
// Reintento: CDN puede tardar 1-3 segundos; reintento 30 veces cada 300ms = 9s total
if (!sb) {
  let attempts = 0;
  const retry = setInterval(() => {
    attempts++;
    if (initSupabase() || attempts > 30) {
      clearInterval(retry);
      if (!sb) console.warn("⚠ Supabase no disponible después de 30 intentos (9s). Revisa conexión a CDN.");
    }
  }, 300);
}

// ═══════════════════════════════════════════════════════════════════
// SUPABASE HELPERS — Funciones utilitarias para migración
// Todas retornan { success: bool, count: num, errors: [], message: str }
// ═══════════════════════════════════════════════════════════════════

// Espera hasta que el cliente Supabase esté listo (o timeout)
async function waitForSupabase(timeoutMs = 10000) {
  const start = Date.now();
  while (!sb && (Date.now() - start) < timeoutMs) {
    await new Promise(r => setTimeout(r, 200));
  }
  return !!sb;
}

// Genera clave única para un lote: ID Macrolote limpio (sin sufijo -rN interno)
function loteKey(lote) {
  // El ID interno tiene formato "ML_001-r5" — quitamos el "-rN"
  const idRaw = (lote.id || lote.id_macrolote || "").toString().trim();
  const idLimpio = idRaw.replace(/-r\d+$/, '').trim();
  if (idLimpio) return idLimpio.toLowerCase().replace(/\s+/g, '_');
  // Fallback: nombre+desarrollo
  const nombre = (lote.nombre_lote || lote.nombre || "").toString().trim();
  const desarrollo = (lote.desarrollo || "").toString().trim();
  return `${nombre}__${desarrollo}`.toLowerCase().replace(/\s+/g, '_');
}

// Transforma un lote del localStorage al formato de la tabla Supabase 'lotes'
function loteToSupabase(lote) {
  const nombre = (lote.nombre_lote || lote.nombre || "").toString().trim();
  const desarrollo = (lote.desarrollo || "").toString().trim();
  const idRaw = (lote.id || lote.id_macrolote || "").toString().trim();
  const idLimpio = idRaw.replace(/-r\d+$/, '').trim();
  // precio_total = null si es 0 o no viene (acordado: lotes sin precio visibles con flag)
  const precioTotalRaw = Number(lote.precio_total);
  const precioM2Raw = Number(lote.precio_m2);
  const precioTotal = (precioTotalRaw > 0) ? precioTotalRaw : null;
  const precioM2 = (precioM2Raw > 0) ? precioM2Raw : null;
  return {
    clave_unica: loteKey(lote),
    id_macrolote: idLimpio || null,
    nombre: nombre,
    desarrollo: desarrollo || null,
    desarrollador: lote.desarrollador || null,
    ciudad: lote.ciudad || null,
    estado: lote.estado || null,
    sup_m2: Number(lote.sup_m2) || null,
    precio_m2: precioM2,
    precio_total: precioTotal,
    precio_pendiente: (precioTotal === null),  // flag para UI
    uso: lote.uso || null,
    usos_todos: Array.isArray(lote.usos_todos) ? lote.usos_todos : (lote.uso ? [lote.uso] : []),
    status_inventario: lote.status || lote.status_inventario || 'Disponible',
    fecha_ingreso: lote.fecha_ingreso || null  // null permitido (acordado)
  };
}

// Transforma un cliente del localStorage al formato de la tabla Supabase 'clientes'
function clienteToSupabase(cliente) {
  const email = (cliente.email || "").toString().trim().toLowerCase();
  if (!email) return null; // Sin email no se puede migrar (clave única acordada)
  return {
    email: email,
    id_cliente: (cliente.id || cliente.id_cliente || "").toString().trim() || null,
    nombre: cliente.nombre || null,
    empresa: cliente.empresa || null,
    telefono: cliente.telefono ? cliente.telefono.toString() : null,
    asesor: cliente.asesor || null,
    tipo_comprador: cliente.tipo_comprador || null,
    ciudad_interes: Array.isArray(cliente.ciudad_interes) ? cliente.ciudad_interes : [],
    uso_interes: Array.isArray(cliente.uso_interes) ? cliente.uso_interes : [],
    presupuesto_min: Number(cliente.presupuesto_min) || null,
    presupuesto_max: Number(cliente.presupuesto_max) || null,
    sup_min: Number(cliente.sup_min) || null,
    sup_max: Number(cliente.sup_max) || null,
    temperatura: cliente.temperatura || null,
    status: cliente.status || null,
    plazo_cierre: cliente.plazo_cierre || null,
    deal_breakers: Array.isArray(cliente.deal_breakers) ? cliente.deal_breakers : [],
    activo: cliente.activo !== false
  };
}

// Subir lotes en lotes (batch) a Supabase — upsert por clave_unica
async function migrarLotesASupabase(lotes, onProgress) {
  const ok = await waitForSupabase();
  if (!ok) return { success: false, count: 0, errors: ['Supabase no disponible'], message: 'Timeout esperando Supabase' };
  
  const BATCH_SIZE = 50;
  // Filtrar: requerimos nombre y clave_unica válida (desarrollo puede venir vacío)
  const rows = lotes.map(loteToSupabase).filter(r => r.nombre && r.clave_unica && r.clave_unica.length > 1);
  const skipped = lotes.length - rows.length;
  let uploaded = 0;
  const errors = [];
  
  for (let i = 0; i < rows.length; i += BATCH_SIZE) {
    const batch = rows.slice(i, i + BATCH_SIZE);
    try {
      const { data, error } = await sb.from('lotes').upsert(batch, { onConflict: 'clave_unica' }).select('id');
      if (error) {
        errors.push(`Batch ${Math.floor(i/BATCH_SIZE)+1}: ${error.message}`);
      } else {
        uploaded += (data?.length || batch.length);
      }
    } catch (err) {
      errors.push(`Batch ${Math.floor(i/BATCH_SIZE)+1}: ${err.message}`);
    }
    if (onProgress) onProgress(uploaded, rows.length);
  }
  
  return {
    success: errors.length === 0,
    count: uploaded,
    skipped: skipped,
    errors: errors,
    message: errors.length === 0
      ? `✓ ${uploaded} lotes migrados${skipped ? ` (${skipped} omitidos por datos incompletos)` : ''}`
      : `⚠ ${uploaded}/${rows.length} migrados. ${errors.length} errores.`
  };
}

// Subir clientes en batch a Supabase — upsert por email
async function migrarClientesASupabase(clientes, onProgress) {
  const ok = await waitForSupabase();
  if (!ok) return { success: false, count: 0, errors: ['Supabase no disponible'], message: 'Timeout esperando Supabase' };
  
  const BATCH_SIZE = 50;
  const rows = clientes.map(clienteToSupabase).filter(r => r !== null);
  const skipped = clientes.length - rows.length;
  let uploaded = 0;
  const errors = [];
  
  for (let i = 0; i < rows.length; i += BATCH_SIZE) {
    const batch = rows.slice(i, i + BATCH_SIZE);
    try {
      const { data, error } = await sb.from('clientes').upsert(batch, { onConflict: 'email' }).select('id');
      if (error) {
        errors.push(`Batch ${Math.floor(i/BATCH_SIZE)+1}: ${error.message}`);
      } else {
        uploaded += (data?.length || batch.length);
      }
    } catch (err) {
      errors.push(`Batch ${Math.floor(i/BATCH_SIZE)+1}: ${err.message}`);
    }
    if (onProgress) onProgress(uploaded, rows.length);
  }
  
  return {
    success: errors.length === 0,
    count: uploaded,
    skipped: skipped,
    errors: errors,
    message: errors.length === 0
      ? `✓ ${uploaded} clientes migrados${skipped ? ` (${skipped} omitidos — sin email)` : ''}`
      : `⚠ ${uploaded}/${rows.length} migrados. ${errors.length} errores.`
  };
}

// Migrar CRM (seguimientos por lote) a tabla crm_lotes
// Requiere que los lotes ya estén migrados para obtener sus IDs
async function migrarCRMASupabase(crmData, onProgress) {
  const ok = await waitForSupabase();
  if (!ok) return { success: false, count: 0, errors: ['Supabase no disponible'], message: 'Timeout esperando Supabase' };
  
  // 1. Traer todos los lotes de Supabase para mapear clave_unica -> id
  const { data: lotesDb, error: errLotes } = await sb.from('lotes').select('id, clave_unica');
  if (errLotes) return { success: false, count: 0, errors: [errLotes.message], message: 'Error leyendo lotes de Supabase' };
  
  const claveToId = {};
  lotesDb.forEach(l => { claveToId[l.clave_unica] = l.id; });
  
  // 2. Construir filas crm_lotes
  const rows = [];
  const skippedKeys = [];
  Object.entries(crmData || {}).forEach(([loteClaveOriginal, info]) => {
    // El CRM usa el "ID" del lote como clave (ej: "KU-17-r119")
    // Necesitamos reconstruir la clave_unica real a partir del lote
    // Buscamos en el inventario el lote correspondiente
    const lotesInv = JSON.parse(localStorage.getItem('macropro_inventario') || '[]');
    const loteInv = lotesInv.find(l => l.id === loteClaveOriginal || loteKey(l) === loteClaveOriginal);
    if (!loteInv) {
      skippedKeys.push(loteClaveOriginal);
      return;
    }
    const clave = loteKey(loteInv);
    const loteId = claveToId[clave];
    if (!loteId) {
      skippedKeys.push(loteClaveOriginal);
      return;
    }
    rows.push({
      lote_id: loteId,
      pipeline: info.pipeline || 'Prospecto',
      asesor_asignado: info.asesorResponsable || null,
      prospectos: info.prospectos || [],
      interacciones: info.interacciones || [],
      dev_feedback: info.devFeedback || [],
      seguimientos_asesor: info.seguimientosAsesor || []
    });
  });
  
  // 3. Upsert en batches
  const BATCH_SIZE = 25; // menor porque tienen JSONB pesado
  let uploaded = 0;
  const errors = [];
  for (let i = 0; i < rows.length; i += BATCH_SIZE) {
    const batch = rows.slice(i, i + BATCH_SIZE);
    try {
      const { data, error } = await sb.from('crm_lotes').upsert(batch, { onConflict: 'lote_id' }).select('lote_id');
      if (error) errors.push(`Batch ${Math.floor(i/BATCH_SIZE)+1}: ${error.message}`);
      else uploaded += (data?.length || batch.length);
    } catch (err) {
      errors.push(`Batch ${Math.floor(i/BATCH_SIZE)+1}: ${err.message}`);
    }
    if (onProgress) onProgress(uploaded, rows.length);
  }
  
  return {
    success: errors.length === 0,
    count: uploaded,
    skipped: skippedKeys.length,
    errors: errors,
    message: errors.length === 0
      ? `✓ ${uploaded} seguimientos CRM migrados${skippedKeys.length ? ` (${skippedKeys.length} omitidos — lote no encontrado en nube)` : ''}`
      : `⚠ ${uploaded}/${rows.length} migrados. ${errors.length} errores.`
  };
}

// Contar registros en una tabla (para verificar migración)
async function contarEnSupabase(tabla) {
  const ok = await waitForSupabase();
  if (!ok) return { count: 0, error: 'Supabase no disponible' };
  try {
    const { count, error } = await sb.from(tabla).select('*', { count: 'exact', head: true });
    if (error) return { count: 0, error: error.message };
    return { count: count || 0, error: null };
  } catch (err) {
    return { count: 0, error: err.message };
  }
}

// Exponer helpers globalmente para uso en consola/debug
if (typeof window !== 'undefined') {
  window.sbHelpers = {
    migrarLotes: migrarLotesASupabase,
    migrarClientes: migrarClientesASupabase,
    migrarCRM: migrarCRMASupabase,
    contar: contarEnSupabase,
    loteKey: loteKey
  };
}


// ─── MATCH ASESOR ──────────────────────────────────────────────────
function buscarMatchesParaSolicitud(solicitud, inventory){
  if(!solicitud||!Array.isArray(inventory)) return [];
  const supMin=parseFloat(solicitud.superficieMin)||0;
  const supMax=parseFloat(solicitud.superficieMax)||Infinity;
  const frenteMin=parseFloat(solicitud.frenteMinimo)||0;
  const precioMax=parseFloat(solicitud.precioMaximo)||Infinity;
  const estado=(solicitud.estado||"").trim().toLowerCase();
  const ciudad=(solicitud.ciudad||"").trim().toLowerCase();
  const usoSuelo=(solicitud.usoSuelo||"").trim().toLowerCase();
  const norm=(s)=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  return inventory.map(lot=>{
    if(!lot) return null;
    const sup=parseFloat(lot.superficie)||0;
    const frente=parseFloat(lot.frente)||0;
    const precio=parseFloat(lot.precio_total)||0;
    const lotEstado=(lot.estado||"").trim().toLowerCase();
    const lotCiudad=(lot.ciudad||"").trim().toLowerCase();
    const lotUso=(lot.uso_suelo||"").trim().toLowerCase();
    let score=0; let razones=[]; let descalificadores=[];
    if(supMin>0&&sup<supMin) descalificadores.push(`Superficie ${sup}m² < mínimo ${supMin}m²`);
    else if(sup>=supMin){score+=20;razones.push(`Superficie ${sup}m² ✓`);}
    if(supMax<Infinity&&sup>supMax) descalificadores.push(`Superficie ${sup}m² > máximo ${supMax}m²`);
    if(frenteMin>0&&frente>0&&frente<frenteMin) descalificadores.push(`Frente ${frente}m < mínimo ${frenteMin}m`);
    else if(frenteMin>0&&frente>=frenteMin){score+=15;razones.push(`Frente ${frente}m ✓`);}
    if(precioMax<Infinity&&precio>precioMax) descalificadores.push(`Precio > máximo`);
    else if(precio>0&&precio<=precioMax){score+=20;razones.push(`Precio en rango ✓`);}
    if(estado&&lotEstado&&(norm(lotEstado).includes(norm(estado))||norm(estado).includes(norm(lotEstado)))){score+=15;razones.push(`Estado ✓`);}
    if(ciudad&&lotCiudad&&(norm(lotCiudad).includes(norm(ciudad))||norm(ciudad).includes(norm(lotCiudad)))){score+=15;razones.push(`Ciudad ✓`);}
    if(usoSuelo&&lotUso&&(lotUso.includes(usoSuelo)||usoSuelo.includes(lotUso))){score+=15;razones.push(`Uso ✓`);}
    return {lot,score,razones,descalificadores,descalificado:descalificadores.length>0};
  }).filter(m=>m!==null).sort((a,b)=>b.score-a.score);
}

// ─── ICS CALENDAR EXPORT ──────────────────────────────────────────
function descargarICS(activity, lote, prospecto, durMinutes){
  try{
    if(!activity||!activity.fecha){ console.warn("descargarICS: actividad sin fecha"); return false; }
    const tipo = activity.tipo||"Actividad";
    const desc = activity.descripcion||"";
    const fecha = activity.fecha; // YYYY-MM-DD
    const hora = activity.hora||"09:00";
    const dur = durMinutes||60;
    const [hh,mm] = hora.split(":").map(Number);
    const dtStart = fecha.replace(/-/g,"")+"T"+String(hh).padStart(2,"0")+String(mm).padStart(2,"0")+"00";
    const endH = hh + Math.floor((mm+dur)/60), endM = (mm+dur)%60;
    const dtEnd = fecha.replace(/-/g,"")+"T"+String(endH).padStart(2,"0")+String(endM).padStart(2,"0")+"00";
    const uid = (activity.id||("act-"+Date.now()))+"@macropro.grupoguia.mx";
    const prospectoStr = prospecto?(" · "+( prospecto.nombre||"")):"";
    const loteStr = lote?(" | "+lote.nombre+" "+( lote.desarrollo||"")):"";
    const summary = tipo+(desc?" — "+desc:"")+prospectoStr+loteStr;
    const icsBody = [
      "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//MacroPro//Grupo Guía//ES","CALSCALE:GREGORIAN","METHOD:PUBLISH",
      "BEGIN:VEVENT",
      "UID:"+uid,"DTSTART:"+dtStart,"DTEND:"+dtEnd,
      "SUMMARY:"+summary.replace(/,/g,"\\,").replace(/;/g,"\\;").replace(/\n/g,"\\n"),
      "DESCRIPTION:Generado por MacroPro · Grupo Guía\\nhttps://sergiogogue.github.io/macropro-matcher/",
      "END:VEVENT","END:VCALENDAR"
    ].join("\r\n");
    const blob = new Blob([icsBody],{type:"text/calendar;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href=url; a.download="MacroPro_"+(tipo).replace(/[^a-z0-9]/gi,"_")+"_"+fecha+".ics";
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },300);
    return true;
  }catch(err){ console.error("Error generando ICS:",err); return false; }
}

function calcularMetasResumen(metas, filtroDesarrollador, filtroDesarrollo){
  let planUdsTotal=0, planMontoTotal=0, realUdsTotal=0, realMontoTotal=0;
  const porDesarrollo=[];
  Object.entries(metas||{}).forEach(([nombre, d])=>{
    if(!d||!d.plan||!d.real) return;
    if(filtroDesarrollador&&filtroDesarrollador!=="Todos"&&d.desarrollador!==filtroDesarrollador) return;
    if(filtroDesarrollo&&filtroDesarrollo!=="Todos"&&nombre!==filtroDesarrollo) return;
    const planU=(d.plan.uds||[]).reduce((a,b)=>a+(b||0),0);
    const planM=(d.plan.monto||[]).reduce((a,b)=>a+(b||0),0);
    const realU=(d.real.uds||[]).reduce((a,b)=>a+(b||0),0);
    const realM=(d.real.monto||[]).reduce((a,b)=>a+(b||0),0);
    planUdsTotal+=planU; planMontoTotal+=planM; realUdsTotal+=realU; realMontoTotal+=realM;
    porDesarrollo.push({nombre, desarrollador:d.desarrollador, planUds:planU, planMonto:planM, realUds:realU, realMonto:realM});
  });
  const cumplUds=planUdsTotal>0?(realUdsTotal/planUdsTotal):(realUdsTotal>0?1.5:0);
  const cumplMonto=planMontoTotal>0?(realMontoTotal/planMontoTotal):(realMontoTotal>0?1.5:0);
  return { planUdsTotal, planMontoTotal, realUdsTotal, realMontoTotal, cumplUds, cumplMonto, porDesarrollo };
}

// Auto-aprende mapeo desde el inventario (la fuente de verdad real)
// Devuelve un mapeo desarrollo→desarrollador donde TODOS los desarrollos vienen de lotes reales.
// Si un desarrollo tiene múltiples desarrolladores (split), gana el MAYORITARIO.
// Devuelve también los splits detectados como advertencia.
function aprenderMapeoDesdeInventario(inventory){
  const conteo = {}; // {desarrollo: {desarrollador: count}}
  if(!Array.isArray(inventory)) return { mapeo:{}, splits:[] };
  inventory.forEach(lot=>{
    if(!lot) return;
    const desarrollo = (lot.desarrollo||"").trim();
    const desarrollador = (lot.desarrollador||"").trim();
    if(!desarrollo||!desarrollador) return;
    if(!conteo[desarrollo]) conteo[desarrollo] = {};
    conteo[desarrollo][desarrollador] = (conteo[desarrollo][desarrollador]||0)+1;
  });
  const mapeo = {};
  const splits = [];
  Object.entries(conteo).forEach(([desarrollo, devs])=>{
    const entries = Object.entries(devs).sort((a,b)=>b[1]-a[1]);
    if(entries.length===0) return;
    mapeo[desarrollo] = entries[0][0]; // gana el mayoritario
    if(entries.length>1){
      splits.push({
        desarrollo,
        desarrolladorPrincipal: entries[0][0],
        countPrincipal: entries[0][1],
        otros: entries.slice(1).map(([d,c])=>({desarrollador:d, count:c}))
      });
    }
  });
  return { mapeo, splits };
}

// Sincroniza el mapeo persistido con el aprendido del inventario
// Esto se ejecuta una vez al cargar la app si hay inventario disponible
function sincronizarMapeoConInventario(inventory){
  if(!Array.isArray(inventory)||inventory.length===0) return null;
  const { mapeo:aprendido, splits } = aprenderMapeoDesdeInventario(inventory);
  if(Object.keys(aprendido).length===0) return null;
  // Fusionar: lo aprendido del inventario tiene MÁS PRIORIDAD que lo persistido
  const actual = loadMapeoDesarrollador();
  const fusionado = { ...actual, ...aprendido };
  saveMapeoDesarrollador(fusionado);
  return { aprendido, splits, total:Object.keys(aprendido).length };
}

// Función inteligente: orden de prioridad
// 1. Mapeo activo (que incluye lo aprendido del inventario + base + storage)
// 2. Heurísticas por substring (para desarrollos no registrados)
// 3. Fallback: el nombre como desarrollador propio
function inferirDesarrollador(nombreDesarrollo, mapeoActivo){
  if(!nombreDesarrollo) return "Otros";
  const mapeo = mapeoActivo || loadMapeoDesarrollador();
  // 1. Match exacto
  if(mapeo[nombreDesarrollo]) return mapeo[nombreDesarrollo];
  // 2. Match case-insensitive
  const lc = nombreDesarrollo.toLowerCase().trim();
  for(const [k,v] of Object.entries(mapeo)){
    if(k.toLowerCase().trim()===lc) return v;
  }
  // 3. Heurísticas por substring
  if(lc.includes("capital norte")||lc.startsWith("cn-")||lc.startsWith("cn ")) return "HITO";
  if(lc.includes("corretaje")) return "Corretaje";
  if(lc.includes("garvi")) return "Garvi";
  if(lc.includes("hito")) return "HITO";
  if(lc.includes("favier")) return "Favier";
  if(lc.includes("gyg")||lc==="g&g"||lc==="g y g") return "GyG";
  if(["kulkana","terrasoles","capital sur","alva","punto sur","las rosas"].includes(lc)) return "TYA";
  // 4. Fallback razonable: tratar el nombre como desarrollador propio
  // (mejor que "Otros" — el usuario puede corregirlo)
  return nombreDesarrollo;
}

// Lista dinámica de desarrolladores activos (en metas + oficiales)
function getDesarrolladoresActivos(metasData, inventory){
  const set = new Set();
  Object.values(metasData||{}).forEach(d=>{ if(d&&d.desarrollador) set.add(d.desarrollador); });
  DESARROLLADORES_OFICIALES.forEach(d=>set.add(d));
  if(Array.isArray(inventory)){
    inventory.forEach(lot=>{ if(lot&&lot.desarrollador) set.add(lot.desarrollador); });
  }
  return [...set].sort();
}
// Lista de desarrollos que pertenecen a un desarrollador (filtro inteligente)
// Combina: metas existentes + mapeo + inventario real
function getDesarrollosPorDesarrollador(desarrollador, metasData, inventory, mapeoActivo){
  if(!desarrollador||desarrollador==="Todos") return null; // null = mostrar todos
  const set = new Set();
  const mapeo = mapeoActivo || loadMapeoDesarrollador();
  // 1. Desde metasData
  Object.entries(metasData||{}).forEach(([nombre, d])=>{
    if(d&&d.desarrollador===desarrollador) set.add(nombre);
  });
  // 2. Desde mapeo
  Object.entries(mapeo).forEach(([des, dev])=>{
    if(dev===desarrollador) set.add(des);
  });
  // 3. Desde inventario (fuente de verdad)
  if(Array.isArray(inventory)){
    inventory.forEach(lot=>{
      if(lot&&lot.desarrollador===desarrollador && lot.desarrollo) set.add(lot.desarrollo);
    });
  }
  return [...set].sort();
}
// Calcula momentum desde el CRM Kanban: lotes en Apartado o Contrato
// Devuelve estructura: { porDesarrollo:{[nombre]:{uds:[12], monto:[12], lotes:[...]}}, totalUds:[12], totalMonto:[12], allLotes:[...] }
function calcularMomentumKanban(crmData, inventory, filtroDesarrollador, filtroDesarrollo){
  const ETAPAS_MOMENTUM = new Set(["Apartado","Contrato"]);
  const porDesarrollo = {};
  const totalUds = new Array(12).fill(0);
  const totalMonto = new Array(12).fill(0);
  const allLotes = [];
  if(!crmData||!inventory) return { porDesarrollo, totalUds, totalMonto, allLotes };
  inventory.forEach(lot=>{
    const crm = crmData[lot.id];
    if(!crm||!crm.prospectos||crm.prospectos.length===0) return;
    // Aplicar filtros de desarrollador/desarrollo
    const lotDev = lot.desarrollo||"Otros";
    const lotDesarrollador = lot.desarrollador||inferirDesarrollador(lotDev);
    if(filtroDesarrollador&&filtroDesarrollador!=="Todos"&&lotDesarrollador!==filtroDesarrollador) return;
    if(filtroDesarrollo&&filtroDesarrollo!=="Todos"&&lotDev!==filtroDesarrollo) return;
    // Buscar el prospecto MÁS avanzado del lote en etapa de momentum
    let mejorProspecto = null; let mejorEtapa = null;
    crm.prospectos.forEach(p=>{
      if(!p||!p.pipeline) return;
      if(!ETAPAS_MOMENTUM.has(p.pipeline)) return;
      // "Contrato" más avanzado que "Apartado"
      const ord = p.pipeline==="Contrato"?2:1;
      const ordMejor = mejorEtapa==="Contrato"?2:(mejorEtapa==="Apartado"?1:0);
      if(ord>ordMejor){ mejorProspecto=p; mejorEtapa=p.pipeline; }
    });
    if(!mejorProspecto) return;
    // Determinar mes destino: próxima actividad agendada
    let mesIdx = new Date().getMonth(); // fallback: mes actual
    let fechaUsada = null;
    const acts = mejorProspecto.actividades||[];
    const proxima = acts.filter(a=>!a.completada&&a.fecha).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha))[0];
    if(proxima&&proxima.fecha){
      try{
        const d = new Date(proxima.fecha);
        if(!isNaN(d.getTime())){
          // Solo cuenta si es del año actual (2026 — basamos en fecha actual)
          const yearActual = new Date().getFullYear();
          if(d.getFullYear()===yearActual){
            mesIdx = d.getMonth();
            fechaUsada = proxima.fecha;
          }
        }
      }catch(e){}
    }
    // Acumular: 1 unidad + monto del lote, en el mes detectado
    const monto = Math.round((lot.precio_total||0)/1000); // miles MXN
    if(!porDesarrollo[lotDev]) porDesarrollo[lotDev] = { uds:new Array(12).fill(0), monto:new Array(12).fill(0), lotes:[] };
    porDesarrollo[lotDev].uds[mesIdx] += 1;
    porDesarrollo[lotDev].monto[mesIdx] += monto;
    porDesarrollo[lotDev].lotes.push({
      id:lot.id, nombre:lot.nombre, desarrollo:lotDev, desarrollador:lotDesarrollador,
      etapa:mejorEtapa, mesIdx, fechaUsada, monto, prospecto:mejorProspecto.nombre||"(sin nombre)"
    });
    totalUds[mesIdx] += 1;
    totalMonto[mesIdx] += monto;
    allLotes.push({
      id:lot.id, nombre:lot.nombre, desarrollo:lotDev, desarrollador:lotDesarrollador,
      etapa:mejorEtapa, mesIdx, fechaUsada, monto, prospecto:mejorProspecto.nombre||"(sin nombre)"
    });
  });
  return { porDesarrollo, totalUds, totalMonto, allLotes };
}

// ─── HELPERS ──────────────────────────────────────────────────────
const fmt = (n) => new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",maximumFractionDigits:0}).format(n||0);
const fmtM = (n) => { if(!n) return "$0"; return n>=1000000?`$${(n/1000000).toFixed(1)} MDP`:fmt(n); };
const scoreColor = (s) => s>=80?B.green:s>=60?B.gold:s>=40?B.blue:B.grey3;
const tempColor = (t) => t==="Caliente"?B.red:t==="Tibio"?B.gold:B.grey3;
const tempBg = (t) => t==="Caliente"?B.redL:t==="Tibio"?"#fff8e7":B.grey1;

// ─── SCORE RING ───────────────────────────────────────────────────
const ScoreRing = ({ score, size=64 }) => {
  const r=(size-8)/2, circ=2*Math.PI*r, dash=(score/100)*circ, color=scoreColor(score);
  return (
    <div style={{position:"relative",width:size,height:size,flexShrink:0}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={B.grey1} strokeWidth={5}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={5}
          strokeDasharray={`${dash} ${circ}`} strokeLinecap="round"
          style={{transition:"stroke-dasharray 0.8s ease"}}/>
      </svg>
      <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
        <span style={{fontSize:size>56?18:13,fontWeight:800,color,fontFamily:"'Playfair Display',serif",lineHeight:1}}>{score}</span>
        <span style={{fontSize:9,color:B.grey3}}>SCORE</span>
      </div>
    </div>
  );
};

const Tag = ({ label, color=B.navy, bg=B.blueL }) => (
  <span style={{display:"inline-flex",alignItems:"center",padding:"2px 10px",borderRadius:20,fontSize:11,fontWeight:600,color,backgroundColor:bg,whiteSpace:"nowrap"}}>{label}</span>
);

async function generarFichaTecnica(lot) {
  const pptx = new PptxGenJS();
  pptx.layout = "LAYOUT_WIDE";
  const usoCompleto = lot.usos_todos&&lot.usos_todos.length>0 ? lot.usos_todos.join(" / ") : (lot.uso||"N/D");

  // ── SLIDE 1: PORTADA ─────────────────────────────────────────────
  const s1 = pptx.addSlide();
  s1.background = { color:"002B49" };
  s1.addShape(pptx.ShapeType.rect, { x:0, y:0, w:0.18, h:7.5, fill:{color:"F5B335"} });
  s1.addText("FICHA TÉCNICA · MACROLOTE", { x:0.5, y:0.4, w:12, h:0.35, fontSize:10, color:"F5B335", bold:true, charSpacing:3 });
  s1.addText("GRUPO GUÍA", { x:0.5, y:0.75, w:12, h:0.3, fontSize:11, color:"8FA3B4", bold:true, charSpacing:2 });
  s1.addText(lot.nombre, { x:0.5, y:1.2, w:12, h:1.0, fontSize:42, color:"FFFFFF", bold:true, fontFace:"Playfair Display" });
  s1.addText(`${lot.desarrollo||""} · ${lot.ciudad||""}, ${lot.estado||""}`, { x:0.5, y:2.2, w:12, h:0.4, fontSize:15, color:"F5B335" });
  s1.addText(usoCompleto, { x:0.5, y:2.65, w:12, h:0.35, fontSize:13, color:"8FA3B4" });
  // KPIs principales en portada
  const kpis=[
    ["Superficie",`${(lot.sup_m2||0).toLocaleString("es-MX")} m²`],
    ["Precio / m²",`$${(lot.precio_m2||0).toLocaleString("es-MX")}`],
    ["Precio Total",fmtM(lot.precio_total)],
    ["Entrega",lot.entrega||"N/D"],
  ];
  kpis.forEach(([k,v],i)=>{
    const x=0.5+i*3.2;
    s1.addShape(pptx.ShapeType.rect,{x,y:3.3,w:3.0,h:1.1,fill:{color:"0a3d5c"},line:{color:"F5B335",width:1}});
    s1.addText(k,{x,y:3.35,w:3.0,h:0.3,fontSize:9,color:"8FA3B4",bold:true,align:"center",charSpacing:1});
    s1.addText(v,{x,y:3.65,w:3.0,h:0.5,fontSize:18,color:"F5B335",bold:true,align:"center"});
  });
  if(lot.fortaleza) s1.addText(`"${lot.fortaleza}"`,{x:0.5,y:4.65,w:12,h:0.8,fontSize:12,color:"FFFFFF",italic:true,align:"center"});
  s1.addText("CONFIDENCIAL · MacroPro · Grupo Guía",{x:0.5,y:7.1,w:12,h:0.25,fontSize:8,color:"4A6175",align:"center"});

  // ── SLIDE 2: PARÁMETROS TÉCNICOS ──────────────────────────────────
  const s2 = pptx.addSlide();
  s2.background = { color:"FFFFFF" };
  s2.addShape(pptx.ShapeType.rect,{x:0,y:0,w:13.33,h:1.2,fill:{color:"002B49"}});
  s2.addText("PARÁMETROS TÉCNICOS Y URBANOS",{x:0.5,y:0.15,w:12,h:0.4,fontSize:11,color:"F5B335",bold:true,charSpacing:2});
  s2.addText(`${lot.nombre} · ${lot.ciudad}, ${lot.estado}`,{x:0.5,y:0.6,w:12,h:0.4,fontSize:14,color:"FFFFFF",bold:true});
  // Grid de datos técnicos
  const params=[
    ["Uso de Suelo", usoCompleto],
    ["COS (Coef. Ocupación)", lot.cos?String(lot.cos):"N/D"],
    ["CUS (Coef. Utilización)", lot.cus?String(lot.cus):"N/D"],
    ["Niveles Permitidos", lot.niveles||"N/D"],
    ["Viviendas Máx.", lot.viv_max?String(lot.viv_max):"N/D"],
    ["Condiciones de Pago", lot.condiciones_pago||"Consultar"],
  ];
  params.forEach(([k,v],i)=>{
    const col=i%2, row=Math.floor(i/2);
    const x=0.5+col*6.4, y=1.5+row*1.4;
    s2.addShape(pptx.ShapeType.rect,{x,y,w:6.0,h:1.2,fill:{color:"F8FAFC"},line:{color:"E8EDF2",width:1}});
    s2.addShape(pptx.ShapeType.rect,{x,y,w:0.08,h:1.2,fill:{color:"F5B335"}});
    s2.addText(k,{x:x+0.2,y:y+0.1,w:5.7,h:0.3,fontSize:9,color:"8FA3B4",bold:true,charSpacing:1});
    s2.addText(v,{x:x+0.2,y:y+0.45,w:5.7,h:0.5,fontSize:15,color:"002B49",bold:true});
  });
  s2.addText("CONFIDENCIAL · MacroPro · Grupo Guía",{x:0.5,y:7.1,w:12,h:0.25,fontSize:8,color:"C5D0DC",align:"center"});

  // ── SLIDE 3: INFRAESTRUCTURA Y CONDICIONES ─────────────────────────
  const s3 = pptx.addSlide();
  s3.background = { color:"FFFFFF" };
  s3.addShape(pptx.ShapeType.rect,{x:0,y:0,w:13.33,h:1.2,fill:{color:"002B49"}});
  s3.addText("INFRAESTRUCTURA Y CONDICIONES FÍSICAS",{x:0.5,y:0.15,w:12,h:0.4,fontSize:11,color:"F5B335",bold:true,charSpacing:2});
  s3.addText(`${lot.nombre} · ${lot.ciudad}, ${lot.estado}`,{x:0.5,y:0.6,w:12,h:0.4,fontSize:14,color:"FFFFFF",bold:true});
  const infra=[
    ["Agua Potable", lot.agua||"N/D"],
    ["Energía Eléctrica", lot.luz||"N/D"],
    ["Drenaje Sanitario", lot.drenaje||"N/D"],
    ["Acceso a Vialidad", lot.acceso||"N/D"],
  ];
  infra.forEach(([k,v],i)=>{
    const col=i%2, row=Math.floor(i/2);
    const x=0.5+col*6.4, y=1.5+row*1.4;
    const ok=v&&v!=="N/D"&&v.toLowerCase()!=="no";
    s3.addShape(pptx.ShapeType.rect,{x,y,w:6.0,h:1.2,fill:{color:ok?"e6f7ed":"F8FAFC"},line:{color:ok?"1a8a4a":"E8EDF2",width:1}});
    s3.addText(k,{x:x+0.2,y:y+0.1,w:5.7,h:0.3,fontSize:9,color:"8FA3B4",bold:true,charSpacing:1});
    s3.addText(v,{x:x+0.2,y:y+0.45,w:5.7,h:0.5,fontSize:15,color:ok?"1a8a4a":"002B49",bold:true});
  });
  // Atributos estratégicos
  if(lot.atributos){
    s3.addText("ATRIBUTOS ESTRATÉGICOS",{x:0.5,y:4.5,w:12,h:0.3,fontSize:9,color:"002B49",bold:true,charSpacing:1});
    s3.addShape(pptx.ShapeType.rect,{x:0.5,y:4.85,w:12.3,h:1.3,fill:{color:"F8FAFC"},line:{color:"F5B335",width:1}});
    s3.addText(lot.atributos,{x:0.7,y:4.95,w:11.9,h:1.1,fontSize:12,color:"002B49"});
  }
  s3.addText("CONFIDENCIAL · MacroPro · Grupo Guía",{x:0.5,y:7.1,w:12,h:0.25,fontSize:8,color:"C5D0DC",align:"center"});

  // ── SLIDE 4: ESTRATEGIA COMERCIAL ─────────────────────────────────
  const s4 = pptx.addSlide();
  s4.background = { color:"FFFFFF" };
  s4.addShape(pptx.ShapeType.rect,{x:0,y:0,w:13.33,h:1.2,fill:{color:"002B49"}});
  s4.addText("ESTRATEGIA COMERCIAL",{x:0.5,y:0.15,w:12,h:0.4,fontSize:11,color:"F5B335",bold:true,charSpacing:2});
  s4.addText(`${lot.nombre} · ${lot.ciudad}, ${lot.estado}`,{x:0.5,y:0.6,w:12,h:0.4,fontSize:14,color:"FFFFFF",bold:true});
  // Comprador ideal
  s4.addText("COMPRADOR IDEAL",{x:0.5,y:1.4,w:12,h:0.3,fontSize:9,color:"8FA3B4",bold:true,charSpacing:1});
  s4.addShape(pptx.ShapeType.rect,{x:0.5,y:1.75,w:12.3,h:0.7,fill:{color:"FFF9EC"},line:{color:"F5B335",width:2}});
  s4.addText(lot.comprador||"Desarrollador inmobiliario",{x:0.7,y:1.85,w:11.9,h:0.5,fontSize:16,color:"002B49",bold:true});
  // Fortaleza principal
  s4.addText("FORTALEZA PRINCIPAL",{x:0.5,y:2.65,w:12,h:0.3,fontSize:9,color:"8FA3B4",bold:true,charSpacing:1});
  s4.addShape(pptx.ShapeType.rect,{x:0.5,y:3.0,w:12.3,h:1.2,fill:{color:"e6f7ed"},line:{color:"1a8a4a",width:1}});
  s4.addShape(pptx.ShapeType.rect,{x:0.5,y:3.0,w:0.1,h:1.2,fill:{color:"1a8a4a"}});
  s4.addText(lot.fortaleza||"",{x:0.7,y:3.1,w:11.9,h:1.0,fontSize:12,color:"002B49",italic:true});
  // Precio y cierre
  s4.addText("PRECIO DE LISTA",{x:0.5,y:4.4,w:5.8,h:0.3,fontSize:9,color:"8FA3B4",bold:true,charSpacing:1});
  s4.addText("PRECIO / M²",{x:6.8,y:4.4,w:5.8,h:0.3,fontSize:9,color:"8FA3B4",bold:true,charSpacing:1});
  s4.addShape(pptx.ShapeType.rect,{x:0.5,y:4.75,w:5.8,h:0.9,fill:{color:"002B49"}});
  s4.addText(fmtM(lot.precio_total),{x:0.5,y:4.8,w:5.8,h:0.8,fontSize:24,color:"F5B335",bold:true,align:"center"});
  s4.addShape(pptx.ShapeType.rect,{x:6.8,y:4.75,w:5.8,h:0.9,fill:{color:"0a3d5c"}});
  s4.addText(`$${(lot.precio_m2||0).toLocaleString("es-MX")}/m²`,{x:6.8,y:4.8,w:5.8,h:0.8,fontSize:24,color:"F5B335",bold:true,align:"center"});
  s4.addText("CONFIDENCIAL · MacroPro · Grupo Guía · Para uso interno exclusivo",{x:0.5,y:7.1,w:12,h:0.25,fontSize:8,color:"C5D0DC",align:"center"});

  await pptx.writeFile({ fileName: `FichaTecnica_${lot.nombre.replace(/[\s\/]/g,"_")}.pptx` });
}

async function generarMatchClienteLotes(cliente, resultados) {
  const pptx = new PptxGenJS();
  pptx.layout = "LAYOUT_WIDE";
  const s1 = pptx.addSlide();
  s1.background = { color:"002B49" };
  s1.addText("MOTOR DE MATCHING · MACROPRO", { x:0.5,y:0.4,w:12,h:0.4,fontSize:10,color:"F5B335",bold:true,charSpacing:3 });
  s1.addText(cliente.nombre, { x:0.5,y:0.9,w:12,h:0.9,fontSize:40,color:"FFFFFF",bold:true,fontFace:"Playfair Display" });
  s1.addText(cliente.empresa||"", { x:0.5,y:1.85,w:12,h:0.4,fontSize:16,color:"8FA3B4" });
  s1.addText(`${resultados.length} macrolotes rankeados por compatibilidad`, { x:0.5,y:2.3,w:12,h:0.4,fontSize:14,color:"F5B335" });
  const info = [
    `Ciudades: ${cliente.ciudad_interes?.join(", ")||"N/D"}`,
    `Uso: ${cliente.uso_interes?.join(", ")||"N/D"}`,
    `Presupuesto: ${fmtM(cliente.presupuesto_min)} – ${fmtM(cliente.presupuesto_max)}`,
    `Superficie: ${(cliente.sup_min||0).toLocaleString()} – ${(cliente.sup_max||0).toLocaleString()} m²`,
  ];
  info.forEach((t,i) => s1.addText(t, { x:0.5,y:3.0+i*0.45,w:12,h:0.4,fontSize:13,color:"C5D0DC" }));
  s1.addText("CONFIDENCIAL · MacroPro · Grupo Guía", { x:0.5,y:6.8,w:12,h:0.3,fontSize:9,color:"4A6175",align:"center" });
  resultados.slice(0,8).forEach((r,i) => {
    const slide = pptx.addSlide();
    slide.background = { color:"FFFFFF" };
    slide.addShape(pptx.ShapeType.rect, { x:0,y:0,w:13.33,h:1.4,fill:{color:"002B49"} });
    slide.addText(`#${i+1} · Score ${r.score}`, { x:0.5,y:0.15,w:4,h:0.4,fontSize:12,color:"F5B335",bold:true });
    slide.addText(r.nombre||r.data?.nombre||"", { x:0.5,y:0.55,w:9,h:0.6,fontSize:22,color:"FFFFFF",bold:true });

  const handleExcelUpload = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(ev.target.result,{type:"binary"});
        const sheetName = wb.SheetNames.find(n=>n.includes("INVENTARIO")||n.includes("inventario"))||wb.SheetNames[0];
        const ws = wb.Sheets[sheetName];
        const raw = XLSX.utils.sheet_to_json(ws,{defval:"",header:1});
        let headerRow=4;
        for(let i=0;i<Math.min(raw.length,10);i++){
          if(raw[i]&&raw[i].some(c=>c&&String(c).includes("ID Macrolote"))){headerRow=i;break;}
        }
        const headers = raw[headerRow].map(h=>String(h||"").replace(/^\* /,"").replace(/ ▼$/,"").trim());
        const norm = (h)=>String(h||"").toLowerCase().replace(/²/g,"2").replace(/³/g,"3").replace(/\./g,"").replace(/\s+/g," ").trim();
        const getVal = (row,...names) => {
          for(const name of names){
            const idx=headers.findIndex(h=>norm(h).includes(norm(name)));
            if(idx>=0&&row[idx]!==undefined&&row[idx]!=="") return row[idx];
          }
          return "";
        };
        // getValExact: coincidencia EXACTA — evita que "Lat" encuentre "Restricción Lateral"
        const getValExact = (row,...names) => {
          for(const name of names){
            const idx=headers.findIndex(h=>norm(h)===norm(name));
            if(idx>=0&&row[idx]!==undefined&&row[idx]!=="") return row[idx];
          }
          return "";
        };
        const cleanNum = (v) => parseFloat(String(v).replace(/[$,\s]/g,""))||0;
        const mapped = raw.slice(headerRow+1)
          .filter(row=>row[0]&&String(row[0]).trim()!==""&&!String(row[0]).includes("Ej:"))
          .map((row,i)=>{
            const sup=cleanNum(getVal(row,"Superficie (m²)"));
            const pm2=cleanNum(getVal(row,"Precio por m²"));
            let total=cleanNum(getVal(row,"Precio Total"));
            if(!total&&sup&&pm2) total=sup*pm2;
            return {
              id:String(getVal(row,"ID Macrolote")||("LOT-"+(i+1))),
              nombre:String(getVal(row,"Nombre / Clave")||`Lote ${i+1}`),
              desarrollo:String(getVal(row,"Desarrollo / Proyecto")||"").trim(),
              desarrollador:String(getVal(row,"Empresa Desarrolladora","Desarrollador","Empresa Propietaria","Propietario")||"").trim(),
              tipo:String(getVal(row,"Tipo de Inventario")||"").trim(),
              ciudad:String(getVal(row,"Ciudad / Municipio","Ciudad/Municipio","Ciudad","Municipio","Ciudad Municipio","ciudad","municipio")||"").trim(),
              estado:String(getVal(row,"Estado","Estado / Entidad","Entidad","estado")||"").trim(),
              colonia:String(getVal(row,"Colonia / Corredor")||"").trim(),
              uso:(()=>{
                // Función especial: busca uso de suelo EXCLUYENDO "Clave Uso de Suelo"
                // Soporta formato v8 (Uso_1/Uso_2/Uso_3) y formato v6 (* Uso de Suelo)
                const getUso = (keywords) => {
                  for(const kw of keywords){
                    const idx = headers.findIndex(h => {
                      const hn = norm(h);
                      return hn.includes(norm(kw)) && !hn.includes("clave");
                    });
                    if(idx>=0 && row[idx]!==undefined && row[idx]!=="") return String(row[idx]).trim();
                  }
                  return "";
                };
                // Intentar formato v8 primero (Uso_1), luego v6 (* Uso de Suelo)
                const raw1 = getUso(["uso_1","* uso_1"]) || getUso(["uso de suelo"]) || ""; return (raw1.toUpperCase()==='N/A'||raw1==='-')?'':raw1;
              })(),
              usos_todos:(()=>{
                const getUso = (keywords) => {
                  for(const kw of keywords){
                    const idx = headers.findIndex(h => {
                      const hn = norm(h);
                      return hn.includes(norm(kw)) && !hn.includes("clave");
                    });
                    if(idx>=0 && row[idx]!==undefined && row[idx]!=="") return String(row[idx]).trim();
                  }
                  return "";
                };
                const u1 = getUso(["uso_1","* uso_1"]) || getUso(["uso de suelo"]);
                const u2 = getUso(["uso_2"]);
                const u3 = getUso(["uso_3"]);
                const cleanUso=(v)=>v&&v.trim()&&v.trim().toUpperCase()!=='N/A'&&v.trim()!=='-'?v.trim():'';
                return [u1,u2,u3].map(cleanUso).filter(Boolean);
              })(),
              sup_m2:sup, precio_m2:pm2, precio_total:total,
              status:String(getVal(row,"Status")||"Disponible"),
              entrega:String(getVal(row,"Fecha Entrega")||""),
              cos:parseFloat(getVal(row,"COS"))||0,
              cus:parseFloat(getVal(row,"CUS"))||0,
              lat:(()=>{
                // Columna BJ (índice 61) = Latitud — confirmado en Excel v8.5
                const raw61 = row[61];
                const raw62 = row[62]; // usar para validar que no son fechas
                // Intenta por nombre de columna primero (exacto)
                let v = null;

                onClick={async()=>{setGeneratingReport(true);try{const merged=results.map(r=>{const d=r.data||{};return{...r,nombre:d.nombre||r.nombre||r.id,empresa:d.empresa||"",ciudad:d.ciudad||"",estado:d.estado||"",desarrollo:d.desarrollo||"",uso:d.uso||"",usos_todos:d.usos_todos||[],sup_m2:d.sup_m2||0,precio_m2:d.precio_m2||0,precio_total:d.precio_total||0,cos:d.cos||0,cus:d.cus||0,niveles:d.niveles||"",viv_max:d.viv_max||0,agua:d.agua||"",luz:d.luz||"",drenaje:d.drenaje||"",acceso:d.acceso||"",entrega:d.entrega||"",fortaleza:d.fortaleza||"",atributos:d.atributos||"",comprador:d.comprador||"",presupuesto_min:d.presupuesto_min||0,presupuesto_max:d.presupuesto_max||0,sup_min:d.sup_min||0,sup_max:d.sup_max||0,temperatura:d.temperatura||"",asesor:d.asesor||"",notas:d.notas||""};});if(isClientMode)await generarMatchClienteLotes(subject,merged);else await generarMatchLoteClientes(subject,merged);}catch(e){alert("Error: "+e.message);}finally{setGeneratingReport(false);}}}>

                    <Tag label={r.match_label} color={scoreColor(r.score)} bg={r.score>=80?B.greenL:r.score>=60?"#fff8e7":B.blueL}/>
                    {isClientMode&&(item.usos_todos&&item.usos_todos.length>0?item.usos_todos:[item.uso].filter(Boolean)).map(u=><Tag key={u} label={u} color={B.navy} bg={B.blueL}/>)}
                    {isClientMode&&<Tag label={item.ciudad} color={B.navy} bg={B.grey1}/>}

                      updateCRM(item.id,{prospectos,pipeline:crm.pipeline==="Disponible"?"Prospecto":crm.pipeline,lastContact:new Date().toISOString().slice(0,10)});

                  }} style={{padding:"7px 14px",background:"#22c55e",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>📌 Asignar a CRM</button>}
                  {isClientMode&&<button onClick={()=>{setSelectedLot(item);setView("matchLot");}} style={{padding:"7px 14px",background:B.navy,color:B.gold,border:"none",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>🎯 Ver otros clientes</button>}
                  {!isClientMode&&<button onClick={()=>{setSelectedClient(item);setView("matchClient");}} style={{padding:"7px 14px",background:B.gold,color:B.navy,border:"none",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>🎯 Ver lotes</button>}

        {filtered.length===0&&<div style={{textAlign:"center",padding:40,color:B.grey3}}><div style={{fontSize:36,marginBottom:10}}>🔍</div><div style={{fontSize:15,fontWeight:600}}>Sin resultados con estos filtros</div></div>}

  };

  // ─── VIEW QUICK SEARCH ────────────────────────────────────────────
  const ViewQuickSearch = () => {
    // Estado LOCAL para los inputs — evita que el cursor salte al re-renderizar
    const [modoSearch, setModoSearch] = [searchModo, setSearchModo];
    const [ciudadCli, setCiudadCli] = [searchCiudad, setSearchCiudad];
    const [desarrolloCli, setDesarrolloCli] = [searchDesarrollo, setSearchDesarrollo];
    const [localUso, setLocalUso] = useState(quickSearchCriteria.uso||"");
    const [localSupMin, setLocalSupMin] = useState(quickSearchCriteria.sup_min||"");
    const [localSupMax, setLocalSupMax] = useState(quickSearchCriteria.sup_max||"");
    const [localPrecioM2, setLocalPrecioM2] = useState(quickSearchCriteria.precio_m2_max||"");
    const [localCiudad, setLocalCiudad] = useState(quickSearchCriteria.ciudad||"");
    const [localDesarrollo, setLocalDesarrollo] = useState(quickSearchCriteria.desarrollo||"");

    const inputStyle = (val) => ({
      width:"100%", padding:"11px 14px",
      border:`2px solid ${val?B.gold:B.grey1}`,
      borderRadius:9, fontSize:14, outline:"none",
      fontFamily:"'DM Sans',sans-serif",
      transition:"border-color 0.2s",
    });

    const limpiarTodo = () => {
      setLocalUso(""); setLocalSupMin(""); setLocalSupMax("");
      setLocalPrecioM2(""); setLocalCiudad(""); setLocalDesarrollo("");
      setQuickSearchCriteria({ciudad:"",desarrollo:"",uso:"",sup_min:"",sup_max:"",presupuesto_max:"",precio_m2_max:""});
      setQuickSearchResults([]); setQuickSearchDone(false);
    };

    const buscar = () => {
      // Sincronizar estado local → criterios globales y buscar
      const criterios = {
        uso: localUso, sup_min: localSupMin, sup_max: localSupMax,
        precio_m2_max: localPrecioM2, ciudad: localCiudad,
        desarrollo: localDesarrollo, presupuesto_max: ""
      };
      setQuickSearchCriteria(criterios);
      // Buscar directamente con los valores locales (no esperar setState)
      const results = srcInv.filter(lote => {
        if(localCiudad && lote.ciudad!==localCiudad) return false;
        if(localDesarrollo && lote.desarrollo!==localDesarrollo) return false;
        if(localUso){const uArr=lote.usos_todos&&lote.usos_todos.length>0?lote.usos_todos:[lote.uso];if(!uArr.includes(localUso)) return false;}
        if(localSupMin && lote.sup_m2<parseFloat(localSupMin)) return false;
        if(localSupMax && lote.sup_m2>parseFloat(localSupMax)) return false;
        if(localPrecioM2 && lote.precio_m2>parseFloat(localPrecioM2)) return false;
        return true;
      });
      setQuickSearchResults(results);
      setQuickSearchDone(true);
    };

    const hayFiltros = localUso||localSupMin||localSupMax||localPrecioM2||localCiudad||localDesarrollo;

    const desarrollosDisp = (()=>{
      const src = localCiudad ? srcInv.filter(l=>l.ciudad===localCiudad) : srcInv;
      return [...new Set(src.map(l=>l.desarrollo).filter(Boolean))].sort();
    })();

    const usosTodos = (()=>{
      const todos=[];
      srcInv.forEach(l=>{
        const arr=l.usos_todos&&l.usos_todos.length>0?l.usos_todos:[l.uso].filter(Boolean);
        arr.forEach(u=>{if(u&&!todos.includes(u))todos.push(u);});
      });
      return todos.sort();
    })();

    // ── MODO CLIENTES POR DESARROLLO ────────────────────────────────
    const [lotePickerId, setLotePickerId] = useState(null); // clienteId que tiene abierto el picker
    const [loteElegido, setLoteElegido] = useState({}); // {clienteId: lotId}
    const [agregados, setAgregados] = useState(new Set()); // clienteIds ya agregados

    const cliSrc2 = clients.length>0?clients:DEMO_CLIENTS;
    const ciudadesInv = [...new Set(srcInv.map(l=>l.ciudad).filter(Boolean))].sort();
    const desarrollosDeCiudad = ciudadCli
      ? [...new Set(srcInv.filter(l=>l.ciudad===ciudadCli).map(l=>l.desarrollo).filter(Boolean))].sort()
      : [...new Set(srcInv.map(l=>l.desarrollo).filter(Boolean))].sort();

    const lotesDelDesarrollo = desarrolloCli
      ? srcInv.filter(l=>l.desarrollo===desarrolloCli)
      : (ciudadCli ? srcInv.filter(l=>l.ciudad===ciudadCli) : []);

    // Clientes que coinciden con el desarrollo seleccionado
    const clientesMatch = (()=>{
      if(!desarrolloCli&&!ciudadCli) return [];
      const tiposDesarrollo = new Set(lotesDelDesarrollo.flatMap(l=>l.usos_todos&&l.usos_todos.length>0?l.usos_todos:[l.uso||""]));
      const precioMinDev = lotesDelDesarrollo.reduce((min,l)=>Math.min(min,l.precio_total||Infinity),Infinity);
      const precioMaxDev = lotesDelDesarrollo.reduce((max,l)=>Math.max(max,l.precio_total||0),0);
      // Ciudad/estado del desarrollo para match geográfico
      const devCiudad = (ciudadCli||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
      const devEstado = lotesDelDesarrollo[0]?.estado||"";
      // Si el usuario eligió ciudad explícitamente, exigir match geográfico
      // Si no hay ciudad seleccionada, no filtrar por geo (match por uso/presupuesto)
      const requireGeo = ciudadCli.trim() !== "";
      const normStr = s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");

      return cliSrc2.map(cli=>{
        let score=0;
        const ciudadesCliente = (cli.ciudad_interes||[]).map(c=>normStr(c));
        
        if(requireGeo){
          const geoMatch = ciudadesCliente.length===0
            ? false // sin datos geográficos del cliente → no aplica
            : ciudadesCliente.some(c=>
                c.includes(devCiudad)||devCiudad.includes(c)||
                (devEstado&&normStr(devEstado).split(" ").some(w=>w.length>3&&c.includes(w)))
              );
          if(!geoMatch) return null;
          score+=50;
        }
        // Match por uso de interés
        const usosInteres = cli.uso_interes||[];
        if(usosInteres.some(u=>tiposDesarrollo.has(u))) score+=30;
        // Match por presupuesto
        if((cli.presupuesto_max||0)>=precioMinDev) score+=15;
        // Temperatura
        if(cli.temperatura==="Caliente"||cli.temperatura?.includes("Caliente")) score+=15;
        else if(cli.temperatura==="Tibio"||cli.temperatura?.includes("Tibio")) score+=5;
        return {...cli,_score:score};
      })
      .filter(Boolean)
      .sort((a,b)=>b._score-a._score);
    })();

    const agregarAlKanban=(cli)=>{
      const lotId=loteElegido[cli.id||cli.nombre];
      if(!lotId){toast("⚠ Selecciona un lote de entrada");return;}
      const lot=srcInv.find(l=>l.id===lotId);
      if(!lot){toast("⚠ Lote no encontrado");return;}
      // Leer directo de localStorage para no depender del estado React
      const crmActual=loadCRM();
      const crm=crmActual[lotId]||{pipeline:"Disponible",interacciones:[],prospectos:[]};
      const yaExiste=(crm.prospectos||[]).some(p=>p.nombre===cli.nombre);
      if(yaExiste){toast("⚠ "+cli.nombre+" ya está en ese lote");return;}
      const nuevoProsp={nombre:cli.nombre,empresa:cli.empresa||"",temperatura:cli.temperatura||"",pipeline:"Prospecto",asesor:cli.asesor||"",nota:"Agregado desde búsqueda",fechaCreacion:new Date().toISOString().slice(0,10),actividades:[]};
      const prospectos=[...(crm.prospectos||[]),nuevoProsp];
      const newEntry={...crm,prospectos,lastContact:new Date().toISOString().slice(0,10)};
      const newCRM={...crmActual,[lotId]:newEntry};
      // Guardar solo en localStorage — sin setCrmData para NO disparar re-render del App
      saveCRM(newCRM);
      // Actualizar solo estado local del componente
      setAgregados(prev=>{const s=new Set(prev);s.add(cli.id||cli.nombre);return s;});
      setLotePickerId(null);
      toast("✅ "+cli.nombre+" agregado · ve al Kanban para verlo");
    };

    const tempOrd={"Caliente":0,"Tibio":1,"Frío":2,"Frio":2};
    const tCol2=(t)=>t==="Caliente"?B.red:t==="Tibio"?B.gold:t==="Frío"||t==="Frio"?"#3B82F6":B.grey3;

    return (
      <div style={s.page}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24}}>
          <button style={s.btn("ghost")} onClick={()=>setView("home")}>← Inicio</button>
          {hayFiltros&&modoSearch==="lotes"&&<button style={s.btn("ghost")} onClick={limpiarTodo}>🔄 Limpiar filtros</button>}
        </div>

        {/* ── TABS ── */}
        <div style={{display:"flex",gap:0,marginBottom:24,background:B.white,borderRadius:12,padding:4,border:"1px solid "+B.grey1,boxShadow:"0 2px 8px rgba(0,43,73,0.06)"}}>
          {[["lotes","🔍 Buscar Lotes","Encuentra lotes por criterios técnicos"],["clientes","👥 Clientes por Desarrollo","¿Quién puede estar interesado en un desarrollo específico?"]].map(([m,l,sub])=>(
            <button key={m} onClick={()=>setModoSearch(m)} style={{flex:1,padding:"10px 16px",borderRadius:9,border:"none",cursor:"pointer",fontFamily:"'DM Sans',sans-serif",background:modoSearch===m?B.navy:"transparent",color:modoSearch===m?"#fff":B.grey3,transition:"all 0.15s",textAlign:"left"}}>
              <div style={{fontSize:13,fontWeight:700}}>{l}</div>
              <div style={{fontSize:10,opacity:0.75,marginTop:1}}>{sub}</div>
            </button>
          ))}
        </div>

        {/* ══ MODO LOTES (existente, intacto) ══ */}
        {modoSearch==="lotes"&&(<>
        <div style={s.sectionTitle}>🔍 Búsqueda Rápida de Macrolotes</div>
        <div style={{...s.sectionSub,marginBottom:20}}>Encuentra el lote ideal sin registrar al cliente — filtra por cualquier combinación</div>
        <div style={{background:B.white,padding:28,borderRadius:16,boxShadow:"0 4px 14px rgba(0,43,73,0.08)",marginBottom:24,border:`1px solid ${B.grey1}`}}>
          <div style={{fontSize:13,fontWeight:700,color:B.navy,marginBottom:18}}>¿Qué necesita tu cliente?</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(240px,1fr))",gap:16,marginBottom:20}}>
            <div>
              <label style={{display:"block",color:B.navy,fontSize:13,marginBottom:6,fontWeight:600}}>1. Uso de Suelo {localUso&&<span style={{color:B.green}}>✓</span>}</label>
              <select value={localUso} onChange={e=>setLocalUso(e.target.value)} style={inputStyle(localUso)}>
                <option value="">— Selecciona uso de suelo —</option>
                {usosTodos.map(u=><option key={u} value={u}>{u}</option>)}
              </select>
            </div>
            <div>
              <label style={{display:"block",color:B.navy,fontSize:13,marginBottom:6,fontWeight:600}}>2. Superficie Mínima (m²) {localSupMin&&<span style={{color:B.green}}>✓</span>}</label>
              <input
                type="text"
                inputMode="numeric"
                value={localSupMin}
                onChange={e=>setLocalSupMin(e.target.value.replace(/[^0-9.]/g,""))}
                placeholder="Ej: 5000"
                style={inputStyle(localSupMin)}

      <div style={s.page}>

        </div>

          <input style={{...s.input,width:180}} placeholder="🔍 Buscar nombre / empresa" value={fSearch} onChange={e=>setFSearch(e.target.value)}/>

            {["Todos","Caliente","Tibio","Frío","Inactivo"].map(t=><option key={t}>{t}</option>)}
          </select>
          <select style={s.select} value={fStatus} onChange={e=>setFStatus(e.target.value)}>
            {["Todos",...new Set(cliSrc.map(c=>c.status).filter(Boolean))].map(t=><option key={t}>{t}</option>)}

          <div style={{marginLeft:"auto",fontSize:12,color:B.grey3}}>{filtered.length} clientes</div>
        </div>
        {filtered.map(c=>(

  // ─── VIEW DASHBOARD ───────────────────────────────────────────────

  // ─── VIEW CRM ─────────────────────────────────────────────────────

  const ViewCRM = () => {
    const srcInvCRM = inventory.length>0 ? inventory : SAMPLE_INVENTORY;
    const cliSrcCRM = clients.length>0 ? clients : DEMO_CLIENTS;

    // ── STATE ──────────────────────────────────────────────────────

    const [showInterModal, setShowInterModal] = React.useState(false);

    const [noteText, setNoteText] = React.useState("");
